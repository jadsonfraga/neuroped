<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeuroPed EDJ v3.1</title>
  <meta name="description" content="Ferramenta educacional de apoio à decisão clínica em neuropediatria. Dados locais, sem transmissão a servidor.">
  <meta name="theme-color" content="#1a6b65">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.svg">
  <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg">
  <style>
    :root {
      --cream: #faf8f4;
      --gold: #b8963e;
      --teal: #1a6b65;
      --burgundy: #8b2e3b;
      --plum: #4a2d6b;
      --dark: #2d2926;
      --paper: #fffdf9;
      --muted: #6f6963;
      --line: rgba(45, 41, 38, .16);
      --soft-teal: rgba(26, 107, 101, .10);
      --soft-gold: rgba(184, 150, 62, .16);
      --soft-burgundy: rgba(139, 46, 59, .10);
      --shadow: 0 18px 45px rgba(45, 41, 38, .10);
      font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--cream); color: var(--dark); font-size: clamp(16px, 2vw, 18px); }
    body { margin: 0; min-height: 100vh; background:
      radial-gradient(circle at top left, rgba(184,150,62,.16), transparent 30rem),
      radial-gradient(circle at bottom right, rgba(26,107,101,.12), transparent 32rem),
      var(--cream); }
    button, input, textarea, select { font: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible {
      outline: 2px solid var(--gold); outline-offset: 3px;
    }
    .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; z-index: 20; background: rgba(250,248,244,.95);
      backdrop-filter: blur(14px); border-bottom: 1px solid var(--line);
    }
    .topbar-inner { max-width: 1220px; margin: 0 auto; padding: .9rem 1rem; display: flex; gap: 1rem; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: .75rem; min-width: 0; }
    .brand-mark { width: 46px; height: 46px; border-radius: 16px; display: grid; place-items: center; background: var(--teal); border: 2px solid var(--gold); color: white; font-weight: 800; letter-spacing: .03em; }
    .brand h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; color: var(--teal); font-size: clamp(1.1rem, 3vw, 1.55rem); line-height: 1.05; }
    .brand p { margin: .12rem 0 0; color: var(--muted); font-size: .78rem; }
    .tabs { max-width: 1220px; margin: 0 auto; padding: 0 1rem .85rem; display: flex; gap: .45rem; overflow-x: auto; }
    .tab-btn, .soft-btn, .primary-btn, .danger-btn {
      border: 1px solid var(--line); background: var(--paper); color: var(--dark); border-radius: 999px; padding: .65rem .95rem; cursor: pointer; transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }
    .tab-btn[aria-selected="true"] { background: var(--teal); color: white; border-color: var(--teal); box-shadow: 0 8px 24px rgba(26,107,101,.22); }
    .primary-btn { background: var(--teal); color: white; border-color: var(--teal); font-weight: 700; }
    .danger-btn { background: var(--burgundy); color: white; border-color: var(--burgundy); font-weight: 700; }
    .soft-btn { background: var(--soft-teal); border-color: rgba(26,107,101,.22); }
    .tab-btn:hover, .soft-btn:hover, .primary-btn:hover, .danger-btn:hover { transform: translateY(-1px); }
    main { width: 100%; max-width: 1220px; margin: 0 auto; padding: 1.25rem 1rem 2rem; flex: 1; }
    .grid { display: grid; gap: 1rem; }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .card {
      background: var(--paper); border: 2px solid var(--gold); border-radius: 22px; padding: 1px; box-shadow: var(--shadow);
    }
    .card-inner { border: 1px solid var(--teal); border-radius: 19px; padding: 1.05rem; min-height: 100%; }
    .flat-card { background: rgba(255,253,249,.76); border: 1px solid var(--line); border-radius: 18px; padding: 1rem; }
    h2, h3 { font-family: Georgia, "Times New Roman", serif; color: var(--teal); margin: 0 0 .75rem; }
    h2 { font-size: clamp(1.35rem, 3vw, 2rem); }
    h3 { font-size: 1.15rem; }
    p { line-height: 1.55; }
    .muted { color: var(--muted); }
    .tiny { font-size: .78rem; }
    .section-title { display: flex; justify-content: space-between; align-items: center; gap: .75rem; margin-bottom: .8rem; }
    label { display: grid; gap: .35rem; color: var(--dark); font-weight: 700; font-size: .88rem; }
    input, textarea, select {
      width: 100%; border: 1px solid var(--line); border-radius: 14px; padding: .75rem .82rem; background: white; color: var(--dark);
    }
    textarea { min-height: 104px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
    .form-row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .list { display: grid; gap: .75rem; }
    .patient-item { display: grid; grid-template-columns: 1fr auto; gap: .75rem; align-items: center; background: white; border: 1px solid var(--line); border-radius: 16px; padding: .85rem; }
    .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: .18rem .55rem; font-size: .75rem; background: var(--soft-gold); border: 1px solid rgba(184,150,62,.25); color: var(--dark); }
    .badge.warn { background: var(--soft-burgundy); border-color: rgba(139,46,59,.25); color: var(--burgundy); }
    .badge.ok { background: var(--soft-teal); border-color: rgba(26,107,101,.25); color: var(--teal); }
    .notice {
      position: fixed; right: 1rem; bottom: 1rem; z-index: 40; max-width: 420px; background: var(--dark); color: white;
      border-radius: 16px; padding: .85rem 1rem; box-shadow: var(--shadow); display: none;
    }
    .notice.show { display: block; }
    .auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
    .auth-card { width: min(720px, 100%); }
    .privacy-box { max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 16px; padding: .85rem; background: white; }
    .footer { border-top: 1px solid var(--line); padding: 1rem; text-align: center; color: var(--muted); font-size: .78rem; }
    .subtabs { display: flex; gap: .45rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .subtab { border: 1px solid var(--line); border-radius: 999px; padding: .45rem .75rem; background: white; cursor: pointer; }
    .subtab[aria-selected="true"] { background: var(--gold); color: white; border-color: var(--gold); }
    .chart { width: 100%; min-height: 150px; background: white; border: 1px solid var(--line); border-radius: 16px; padding: .5rem; }
    .progress { height: 16px; background: white; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: var(--teal); width: 0; }
    .report-page { display: none; }
    .fatal { position: fixed; inset: 0; z-index: 100; display: none; place-items: center; background: rgba(250,248,244,.96); padding: 1rem; }
    .fatal.show { display: grid; }
    .watermark { position: absolute; right: 1.1rem; top: 1rem; opacity: .22; pointer-events: none; }
    .relative { position: relative; overflow: hidden; }
    @media (max-width: 760px) {
      .grid.two, .grid.three, .form-row, .form-row.three { grid-template-columns: 1fr; }
      .topbar-inner { align-items: flex-start; }
      .patient-item { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; scroll-behavior: auto !important; }
    }
    @media print {
      body { background: white; }
      .topbar, .tabs, .footer, .no-print, .notice, .fatal { display: none !important; }
      main { max-width: none; padding: 0; }
      .screen-only { display: none !important; }
      .report-page { display: block; color: #111; font-family: Arial, sans-serif; }
      @page { size: A4; margin: 18mm; }
      .print-sheet { page-break-after: always; min-height: 240mm; border: 2pt solid #b8963e; border-radius: 18px; padding: 14mm; position: relative; }
      .print-sheet:before { content: ""; position: absolute; inset: 5mm; border: 1pt solid #1a6b65; border-radius: 14px; pointer-events: none; }
      .print-head { border-bottom: 3px solid #1a6b65; padding-bottom: 8px; margin-bottom: 14px; }
      .print-head h1 { color: #1a6b65; margin: 0; font-family: Georgia, serif; }
      .print-foot { position: absolute; bottom: 8mm; left: 14mm; right: 14mm; border-top: 1px solid #b8963e; padding-top: 5px; font-size: 10px; color: #333; }
      .print-box { border: 1px solid #ddd; border-radius: 10px; padding: 10px; margin: 8px 0; }
      .print-hash { font-family: monospace; word-break: break-all; font-size: 10px; }
    }
  </style>
</head>
<body>
  <div id="fatal" class="fatal">
    <div class="card"><div class="card-inner">
      <h2>Falha de execução controlada</h2>
      <p>O aplicativo encontrou uma inconsistência local. Recarregue a página. Os dados criptografados permanecem no dispositivo.</p>
      <button class="primary-btn" onclick="location.reload()" aria-label="Recarregar aplicativo">Recarregar</button>
    </div></div>
  </div>
  <div id="app" class="app-shell"></div>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>
<script>
(function(){
"use strict";

var STORAGE_KEY = "neuroped_edj_v3";
var SCHEMA_VERSION = "3.1.0";
var PBKDF2_ITERATIONS = 100000;
var currentKey = null;
var currentPin = "";
var db = null;
var selectedPatientId = null;
var currentTab = "pacientes";
var patientSubTab = "geral";
var lockState = { failures: 0, lockUntil: 0 };

window.onerror = function(){ showFatal(); return true; };
window.onunhandledrejection = function(event){ if(event && event.preventDefault){ event.preventDefault(); } showFatal(); };

function showFatal(){ var el = document.getElementById("fatal"); if(el){ el.classList.add("show"); } }
function $(id){ return document.getElementById(id); }
function uid(){ return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(value){ return String(value == null ? "" : value).replace(/[&<>"']/g, function(ch){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]; }); }
function bytesToBase64(bytes){ var s = ""; bytes.forEach(function(b){ s += String.fromCharCode(b); }); return btoa(s); }
function base64ToBytes(value){ var bin = atob(value || ""); var out = new Uint8Array(bin.length); for(var i=0;i<bin.length;i++){ out[i]=bin.charCodeAt(i); } return out; }
function randomBytes(n){ var b = new Uint8Array(n); crypto.getRandomValues(b); return b; }
function notify(msg){ var n=$("notice"); if(!n){ return; } n.textContent = msg; n.classList.add("show"); setTimeout(function(){ n.classList.remove("show"); }, 3600); }
function fmtDate(value){ if(!value){ return "Não informado"; } var p = String(value).split("-"); return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : value; }
function ageYears(dob){ if(!dob){ return null; } var d = new Date(dob + "T00:00:00"); if(isNaN(d.getTime())){ return null; } var now = new Date(); var y = now.getFullYear() - d.getFullYear(); var m = now.getMonth() - d.getMonth(); if(m < 0 || (m === 0 && now.getDate() < d.getDate())){ y--; } return y; }
function daysSince(date){ if(!date){ return 99999; } var d = new Date(date + "T00:00:00"); if(isNaN(d.getTime())){ return 99999; } return Math.floor((Date.now() - d.getTime()) / 86400000); }

async function deriveKey(pin, saltBytes){
  var enc = new TextEncoder();
  var material = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: saltBytes, iterations: PBKDF2_ITERATIONS, hash: "SHA-256" }, material, { name: "AES-GCM", length: 256 }, false, ["encrypt","decrypt"]);
}
async function encryptObject(obj, pin, saltBytes){
  var iv = randomBytes(12);
  var key = await deriveKey(pin, saltBytes);
  var encoded = new TextEncoder().encode(JSON.stringify(obj));
  var ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, encoded);
  currentKey = key;
  return { schema_version: SCHEMA_VERSION, salt: bytesToBase64(saltBytes), iv: bytesToBase64(iv), ciphertext: bytesToBase64(new Uint8Array(ciphertext)) };
}
async function decryptEnvelope(envelope, pin){
  var saltBytes = base64ToBytes(envelope.salt);
  var iv = base64ToBytes(envelope.iv);
  var key = await deriveKey(pin, saltBytes);
  var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, base64ToBytes(envelope.ciphertext));
  currentKey = key;
  currentPin = pin;
  return JSON.parse(new TextDecoder().decode(plain));
}
async function saveDb(){
  if(!currentPin || !db){ return; }
  db.schema_version = SCHEMA_VERSION;
  db.updated_at = new Date().toISOString();
  var envelope = await encryptObject(db, currentPin, base64ToBytes(getEnvelope().salt));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(envelope));
}
function getEnvelope(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch(e) { return null; }
}
function defaultDb(){
  return {
    schema_version: SCHEMA_VERSION,
    created_at: new Date().toISOString(),
    updated_at: new Date().toISOString(),
    settings: { privacyAccepted: true, firstLoginComplete: true },
    patients: [],
    audit: []
  };
}
function migrateStorage(oldPayload){
  var payload = oldPayload && typeof oldPayload === "object" ? oldPayload : {};
  payload.schema_version = SCHEMA_VERSION;
  payload.settings = payload.settings || { privacyAccepted: true, firstLoginComplete: true };
  payload.patients = Array.isArray(payload.patients) ? payload.patients : [];
  payload.audit = Array.isArray(payload.audit) ? payload.audit : [];
  return payload;
}
function validatePin(pin){
  if(!/^\d{4,}$/.test(pin)){ return "O PIN precisa ter no mínimo 4 dígitos."; }
  if(["0000","1111","2222","3333","4444","5555","6666","7777","8888","9999","1234","4321"].indexOf(pin) >= 0){ return "Escolha um PIN menos previsível."; }
  var asc = true, desc = true, rep = true;
  for(var i=1;i<pin.length;i++){
    asc = asc && Number(pin[i]) === Number(pin[i-1]) + 1;
    desc = desc && Number(pin[i]) === Number(pin[i-1]) - 1;
    rep = rep && pin[i] === pin[0];
  }
  if(asc || desc || rep){ return "PIN sequencial ou repetido não é aceito."; }
  return "";
}

function renderAuth(){
  var hasEnvelope = !!getEnvelope();
  $("app").innerHTML = '<div class="auth-wrap"><div class="card auth-card"><div class="card-inner relative">' + mascotSvg("brain", "watermark") +
    '<div class="brand" style="margin-bottom:1rem"><div class="brand-mark">EDJ</div><div><h1>NeuroPed EDJ v3.1</h1><p>Ferramenta educacional de apoio à decisão clínica em neuropediatria</p></div></div>' +
    '<div class="privacy-box"><h3>Privacidade e LGPD</h3><p>Os dados ficam apenas neste dispositivo, criptografados em repouso por AES-GCM com chave derivada do PIN por PBKDF2. Não há transmissão a servidor, telemetria ou analytics. O profissional é o controlador dos dados. Backup, guarda do PIN e restauração são responsabilidade do usuário.</p><p>Use esta ferramenta como apoio educacional e organizacional. A decisão clínica final é do médico responsável.</p></div>' +
    '<form id="authForm" class="grid" style="margin-top:1rem">' +
    (!hasEnvelope ? '<label><span>Aceite explícito</span><select id="privacyAccept" aria-label="Aceite da política de privacidade"><option value="">Selecione</option><option value="sim">Li e aceito a política de privacidade</option></select></label>' : '') +
    '<label><span>' + (hasEnvelope ? 'PIN do profissional' : 'Criar PIN do profissional') + '</span><input id="pin" inputmode="numeric" autocomplete="current-password" type="password" aria-label="PIN do profissional" placeholder="Digite o PIN"></label>' +
    (!hasEnvelope ? '<label><span>Confirmar PIN</span><input id="pin2" inputmode="numeric" autocomplete="new-password" type="password" aria-label="Confirmar PIN" placeholder="Repita o PIN"></label>' : '') +
    '<button class="primary-btn" type="submit" aria-label="Entrar no NeuroPed EDJ">' + (hasEnvelope ? 'Entrar' : 'Ativar ambiente seguro') + '</button>' +
    '<p class="tiny muted">Dr. Jadson Fraga Araújo Júnior — Neuropediatria — CRM-PE 25227 — RQE 17756</p>' +
    '</form></div></div></div>';
  $("authForm").onsubmit = async function(ev){
    ev.preventDefault();
    var now = Date.now();
    if(lockState.lockUntil && now < lockState.lockUntil){ notify("Acesso temporariamente bloqueado. Aguarde alguns minutos."); return; }
    var pin = $("pin").value.trim();
    var weak = validatePin(pin);
    if(weak){ notify(weak); return; }
    try {
      if(!hasEnvelope){
        if($("privacyAccept").value !== "sim"){ notify("O aceite da política de privacidade é obrigatório."); return; }
        if(pin !== $("pin2").value.trim()){ notify("A confirmação do PIN não confere."); return; }
        db = defaultDb();
        currentPin = pin;
        var envelope = await encryptObject(db, pin, randomBytes(16));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(envelope));
        renderApp();
      } else {
        db = migrateStorage(await decryptEnvelope(getEnvelope(), pin));
        lockState.failures = 0;
        renderApp();
      }
    } catch(e) {
      lockState.failures += 1;
      if(lockState.failures >= 5){ lockState.lockUntil = Date.now() + 300000; notify("Cinco falhas consecutivas. Acesso bloqueado por 5 minutos."); }
      else { notify("PIN incorreto ou base local incompatível."); }
    }
  };
}

function renderApp(){
  if(!db){ renderAuth(); return; }
  var tabs = [
    ["pacientes","Pacientes"],["cadastrar","Cadastrar"],["paciente","Paciente"],["alertas","Alertas"],["relatorios","Relatórios"],["config","Config"]
  ];
  $("app").innerHTML = '<div class="topbar no-print"><div class="topbar-inner"><div class="brand"><div class="brand-mark">EDJ</div><div><h1>NeuroPed EDJ</h1><p>Dr. Jadson Fraga Araújo Júnior · CRM-PE 25227 · RQE 17756</p></div></div><button class="soft-btn" id="lockBtn" aria-label="Bloquear aplicativo">Bloquear</button></div><nav class="tabs" role="tablist">' +
    tabs.map(function(t){ return '<button class="tab-btn" role="tab" aria-selected="' + (currentTab===t[0]) + '" data-tab="' + t[0] + '" aria-label="Abrir área ' + t[1] + '">' + t[1] + '</button>'; }).join("") +
    '</nav></div><main id="main"></main><footer class="footer">Ferramenta educacional de apoio à decisão clínica. Sugestão educacional. A decisão clínica final é do médico responsável. Rua Raimundo Lacerda, 001 — São José, Petrolina/PE — CEP 56302-470 · (87) 9 9109-7371 · Fraga Serviços Médicos LTDA</footer>';
  Array.prototype.forEach.call(document.querySelectorAll("[data-tab]"), function(btn){ btn.onclick = function(){ currentTab = btn.getAttribute("data-tab"); renderApp(); }; });
  $("lockBtn").onclick = function(){ currentKey=null; currentPin=""; db=null; selectedPatientId=null; renderAuth(); };
  if(currentTab === "pacientes"){ renderPatients(); }
  if(currentTab === "cadastrar"){ renderCadastro(); }
  if(currentTab === "paciente"){ renderPatientDetail(); }
  if(currentTab === "alertas"){ renderAlerts(); }
  if(currentTab === "relatorios"){ renderReports(); }
  if(currentTab === "config"){ renderConfig(); }
}

function renderPatients(page){
  page = page || 1;
  var main = $("main");
  var query = sessionStorage.getItem("np_search") || "";
  var level = sessionStorage.getItem("np_level") || "";
  var patients = db.patients.slice().sort(function(a,b){ return (a.name || "").localeCompare(b.name || ""); });
  patients = patients.filter(function(p){
    var hay = [p.name,p.dob,p.cid10,p.cid11].join(" ").toLowerCase();
    return (!query || hay.indexOf(query.toLowerCase()) >= 0) && (!level || p.dsmLevel === level);
  });
  var totalPages = Math.max(1, Math.ceil(patients.length / 20));
  page = Math.min(page, totalPages);
  var visible = patients.slice((page-1)*20, page*20);
  main.innerHTML = '<section class="card"><div class="card-inner relative">' + mascotSvg("neuron","watermark") +
    '<div class="section-title"><div><h2>Pacientes</h2><p class="muted">Busca, filtros e navegação para ficha clínica criptografada.</p></div><button class="primary-btn" id="newPatientBtn" aria-label="Cadastrar novo paciente">Novo cadastro</button></div>' +
    '<div class="form-row three"><label>Busca por nome, data ou CID<input id="searchPatients" value="' + escapeHtml(query) + '" aria-label="Buscar pacientes"></label><label>Nível DSM-5<select id="levelFilter" aria-label="Filtrar por nível DSM"><option value="">Todos</option><option value="N1">N1</option><option value="N2">N2</option><option value="N3">N3</option></select></label><label>Registros<span class="flat-card">' + patients.length + ' paciente(s)</span></label></div>' +
    '<div class="list" style="margin-top:1rem">' + (visible.length ? visible.map(patientRow).join("") : '<div class="flat-card">Nenhum paciente localizado.</div>') + '</div>' +
    '<div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem"><button class="soft-btn" id="prevPage" aria-label="Página anterior">Anterior</button><span class="badge">Página ' + page + ' de ' + totalPages + '</span><button class="soft-btn" id="nextPage" aria-label="Próxima página">Próxima</button></div>' +
    '</div></section>';
  $("levelFilter").value = level;
  $("newPatientBtn").onclick = function(){ selectedPatientId = null; currentTab = "cadastrar"; renderApp(); };
  $("searchPatients").oninput = function(){ sessionStorage.setItem("np_search", this.value); renderPatients(1); };
  $("levelFilter").onchange = function(){ sessionStorage.setItem("np_level", this.value); renderPatients(1); };
  $("prevPage").onclick = function(){ renderPatients(Math.max(1, page-1)); };
  $("nextPage").onclick = function(){ renderPatients(Math.min(totalPages, page+1)); };
  bindPatientButtons();
}
function patientRow(p){
  return '<div class="patient-item"><div><strong>' + escapeHtml(p.name) + '</strong><p class="tiny muted">Nascimento: ' + fmtDate(p.dob) + ' · CID-10: ' + escapeHtml(p.cid10 || "-") + ' · CID-11: ' + escapeHtml(p.cid11 || "-") + '</p><span class="badge ok">' + escapeHtml(p.dsmLevel || "Sem nível DSM") + '</span></div><div style="display:flex;gap:.45rem;flex-wrap:wrap"><button class="soft-btn" data-open="' + p.id + '" aria-label="Abrir ficha de ' + escapeHtml(p.name) + '">Abrir</button><button class="soft-btn" data-edit="' + p.id + '" aria-label="Editar ' + escapeHtml(p.name) + '">Editar</button><button class="danger-btn" data-del="' + p.id + '" aria-label="Excluir ' + escapeHtml(p.name) + '">Excluir</button></div></div>';
}
function bindPatientButtons(){

function getPatient(id){ return db.patients.find(function(p){ return p.id === id; }); }
function selectedPatient(){ return getPatient(selectedPatientId) || db.patients[0] || null; }
function addDaysISO(days){ var d = new Date(); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }

function therapyCeiling(p){
  if(!p.dsmLevel || !p.dob){ return null; }
  var y = ageYears(p.dob);
  if(y === null){ return null; }
  var months = Math.max(0, Math.floor((Date.now() - new Date(p.dob + "T00:00:00").getTime()) / 2629800000));
  var table;
  if(months >= 12 && months <= 36){ table = {N1:20,N2:25,N3:30}; }
  else if(y >= 3 && y <= 5){ table = {N1:20,N2:35,N3:40}; }
  else if(y >= 6 && y <= 11){ table = {N1:12,N2:25,N3:35}; }
  else if(y >= 12 && y <= 17){ table = {N1:6,N2:15,N3:25}; }
  else if(y >= 18){ table = {N1:4,N2:10,N3:15}; }
  else { return null; }
  return table[p.dsmLevel] == null ? null : table[p.dsmLevel];
}

function scaleChart(items){
  if(!items.length){ return '<div class="chart tiny muted">Sem registros.</div>'; }
  items = items.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
  var scores = items.map(function(i){ return Number(i.score); });
  var max = Math.max.apply(null, scores.concat([1]));
  var min = Math.min.apply(null, scores.concat([0]));
  var range = Math.max(1, max-min);
  var pts = items.map(function(it, idx){ var x = 20 + idx * (260 / Math.max(1, items.length-1)); var y = 120 - ((Number(it.score)-min)/range)*90; return [x,y]; });
  var circles = pts.map(function(pt, idx){ return '<circle cx="' + pt[0] + '" cy="' + pt[1] + '" r="4"><title>' + fmtDate(items[idx].date) + ': ' + items[idx].score + '</title></circle>'; }).join("");
  var line = pts.map(function(p){ return p[0]+","+p[1]; }).join(" ");
  return '<svg class="chart" viewBox="0 0 320 150" role="img" aria-label="Gráfico longitudinal"><line x1="20" y1="130" x2="300" y2="130" stroke="#ddd"/><line x1="20" y1="20" x2="20" y2="130" stroke="#ddd"/><polyline points="' + line + '" fill="none" stroke="#1a6b65" stroke-width="3"/>' + circles + '</svg>';
}

function alertList(patients){
  var alerts = [];
  patients.forEach(function(p){
    var limit = p.dsmLevel === "N1" ? 180 : p.dsmLevel === "N2" ? 120 : p.dsmLevel === "N3" ? 90 : null;
    if(limit && daysSince(p.lastVisit) > limit){ alerts.push({urg: 1, patient:p.name, text:"Retorno vencido: " + daysSince(p.lastVisit) + " dias sem reavaliação. Limite " + limit + " dias."}); }
    if(p.exceptionExpiresAt && daysSince(p.exceptionCreatedAt) > 90){ alerts.push({urg: 2, patient:p.name, text:"Excepcionalidade terapêutica acima de 90 dias."}); }
    var latestScale = (p.scales || []).slice().sort(function(a,b){ return b.date.localeCompare(a.date); })[0];
    if(daysSince(latestScale && latestScale.date) > 180){ alerts.push({urg: 3, patient:p.name, text:"Escala sem atualização por mais de 180 dias."}); }
  });
  alerts.sort(function(a,b){ return a.urg-b.urg; });
  if(!alerts.length){ return '<div class="flat-card"><span class="badge ok">Sem alertas ativos</span></div>'; }
  return '<div class="list">' + alerts.map(function(a){ return '<div class="flat-card"><span class="badge warn">Urgência ' + a.urg + '</span><strong> ' + escapeHtml(a.patient) + '</strong><p>' + escapeHtml(a.text) + '</p></div>'; }).join("") + '</div>';
}

async function sha256Text(text){
  var hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(hash)).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
}
async function buildReport(p){
  if(!p){ $("reportPreview").innerHTML = "<p>Nenhum paciente cadastrado.</p>"; return; }
  var payload = JSON.stringify(p);
  var hash = await sha256Text(payload);
  var html = '<article class="print-sheet"><div class="print-head"><h1>NeuroPed EDJ — Relatório Neuropediátrico</h1><p>Dr. Jadson Fraga Araújo Júnior · Neuropediatria · CRM-PE 25227 · RQE 17756</p></div>' +

    '<div class="print-box"><strong>Resumo clínico:</strong><p>' + escapeHtml(p.anamnesis || "Não informado.") + '</p></div>' +
    '<div class="print-box"><strong>Plano terapêutico:</strong><p>' + escapeHtml(p.therapyPlan || "Não informado.") + '</p><p>Carga semanal: ' + escapeHtml(p.therapyHours || 0) + 'h.</p></div>' +
    '<div class="print-box"><strong>Escalas:</strong><p>' + ((p.scales||[]).length ? (p.scales||[]).map(function(s){ return escapeHtml(s.name) + " em " + fmtDate(s.date) + ": " + escapeHtml(s.score); }).join("<br>") : "Sem registros.") + '</p></div>' +
    '<div class="print-box"><strong>Validação documental:</strong><p class="print-hash">SHA-256: ' + hash + '</p>' + pseudoQr(hash) + '</div>' +
    '<div class="print-foot">Rua Raimundo Lacerda, 001 — São José, Petrolina/PE — CEP 56302-470 · Telefone: (87) 9 9109-7371 · Fraga Serviços Médicos LTDA</div></article>';
  $("printArea").innerHTML = html;
  $("reportPreview").innerHTML = '<div class="flat-card"><h3>Prévia documental</h3><p><strong>' + escapeHtml(p.name) + '</strong></p><p class="tiny">SHA-256: ' + hash + '</p><button class="soft-btn" onclick="window.print()">Imprimir agora</button></div>';
}
function pseudoQr(hash){
  var cells = "";
  for(var i=0;i<81;i++){
    var v = parseInt(hash[i % hash.length],16);
    if((v + i) % 3 === 0){ cells += '<rect x="' + ((i%9)*6) + '" y="' + (Math.floor(i/9)*6) + '" width="6" height="6" fill="#2d2926"/>'; }
  }
  return '<svg width="62" height="62" viewBox="0 0 54 54" aria-label="Código visual derivado do hash">' + cells + '</svg>';
}
