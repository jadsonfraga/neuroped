/* ---------- 4. MOVIMENTO PREMIUM ---------- */
@media (prefers-reduced-motion: no-preference){
  /* easing unificado nos elementos interativos (só muda a curva, não o efeito) */
  a,button,[role="button"],.transition,[class*="transition-"]{
    transition-timing-function: var(--np-ease);
  }
  /* mascote: entrada com leve mola + flutuação idle */
  .mascote{
    animation: mascoteEntrada .6s var(--np-spring) forwards;
    will-change: transform;
  }
  /* animação de troca de rota (disparada por premium-motion.js) */
  @keyframes npPageIn{
    from{ opacity:0; transform: translateY(10px); }
    to{   opacity:1; transform: none; }
  }
}

/* ---------- 5. ACABAMENTOS (selection, foco, scroll, accent) ---------- */
:root{ accent-color: hsl(var(--primary)); }
html{ scroll-behavior: smooth; }
::selection{ background: hsl(243 75% 59% / .22); }
:focus-visible{
  outline: 2px solid hsl(var(--ring));
  outline-offset: 2px;
  border-radius: 4px;
}
/* scrollbar discreta e premium (WebKit) */
*{ scrollbar-width: thin; scrollbar-color: hsl(var(--muted-foreground) / .35) transparent; }
::-webkit-scrollbar{ width: 10px; height: 10px; }
::-webkit-scrollbar-thumb{
  background: hsl(var(--muted-foreground) / .3);
  border: 3px solid transparent;
  border-radius: 999px;
  background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover{ background: hsl(var(--muted-foreground) / .5); background-clip: content-box; }

/* ============================================================
   13. EDITORIAL CLÍNICO DINÂMICO — dinamismo discreto (vence as anteriores)
   Substitui o antigo "modo vibrante": menos saturação, sem glow neon
   permanente, aurora contida (~45% mais suave) restrita ao dashboard.
   ============================================================ */
/* primária funcional (índigo como acento, não dominante) */
:root{ --primary: 244 78% 60%; --ring: 244 78% 60%; }
.dark{ --primary: 246 80% 66%; --ring: 246 80% 66%; }

/* aurora ambiente contida — apenas no shell/dashboard da SPA */
.min-h-screen.bg-background{
  background-image:
    radial-gradient(1100px 640px at 8% -8%,  hsl(243 80% 58% / .22), transparent 60%),
    radial-gradient(1000px 660px at 102% 2%, hsl(266 74% 58% / .18), transparent 56%),
    radial-gradient(1200px 820px at 50% 118%, hsl(206 86% 56% / .12), transparent 62%) !important;
}

/* cards: profundidade elegante em camadas, sem glow colorido */
.card-premium{
  filter: none;
  box-shadow:
    0 0 0 1px hsl(0 0% 100% / .07) inset,
    0 16px 44px -22px rgba(16,14,55,.7) !important;
}
@media (hover: hover) and (pointer: fine){
  .card-premium:hover{
    filter: none;
    box-shadow:
      0 0 0 1px hsl(0 0% 100% / .11) inset,
      0 26px 60px -22px rgba(16,14,55,.82) !important;
  }
}

/* herói e selo: brilho discreto, sem halo neon */
h1.font-black.tracking-wider,
.text-gradient-animated{ filter: drop-shadow(0 2px 14px hsl(245 60% 55% / .28)); }

/* botões primários: halo de marca sóbrio */
button.bg-primary, a.bg-primary, [role="button"].bg-primary{
  box-shadow:
    0 0 0 1px hsl(0 0% 100% / .12) inset,
    0 8px 22px -10px hsl(244 70% 52% / .42) !important;
}

/* mascotes (só nas áreas lúdicas): sombra neutra e discreta */
.np-mascot{ filter: drop-shadow(0 4px 10px rgba(45,41,38,.12)) !important; }

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(reg => {
            // procura atualização do SW a cada carga e periodicamente
            reg.update();
            setInterval(() => reg.update(), 60000);
          }).catch(() => {});
          // quando um novo SW assume o controle, recarrega 1x para servir os arquivos novos
          let reloaded = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloaded) return; reloaded = true;
            window.location.reload();
          });
        });
      }
    </script>
