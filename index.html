<style>
:root{--cream:#faf8f4;--gold:#b8963e;--teal:#1a6b65;--burgundy:#8b2e3b;--plum:#4a2d6b;--dark:#2d2926;--paper:#fffdf9;--muted:#6f6963;--line:rgba(45,41,38,.18);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html{font-size:clamp(16px,2vw,18px);background:var(--cream);color:var(--dark)}body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,rgba(184,150,62,.18),transparent 28rem),var(--cream)}button,input,textarea,select{font:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.top{position:sticky;top:0;z-index:5;background:rgba(250,248,244,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.wrap{max-width:1180px;margin:auto;padding:1rem}.brand{display:flex;gap:.8rem;align-items:center}.mark{width:48px;height:48px;border-radius:17px;background:var(--teal);border:2px solid var(--gold);color:#fff;display:grid;place-items:center;font-weight:800}.brand h1{font-family:Georgia,serif;color:var(--teal);margin:0;font-size:1.5rem}.brand p{margin:.1rem 0;color:var(--muted);font-size:.82rem}.tabs{display:flex;gap:.45rem;overflow:auto;padding:.6rem 0}.tabs button,.btn{border:1px solid var(--line);border-radius:999px;padding:.62rem .9rem;background:var(--paper);cursor:pointer}.tabs button[aria-selected=true],.primary{background:var(--teal)!important;color:white!important;border-color:var(--teal)!important}.danger{background:var(--burgundy)!important;color:white!important;border-color:var(--burgundy)!important}main{max-width:1180px;margin:auto;padding:1rem}.card{background:var(--paper);border:2px solid var(--gold);border-radius:22px;padding:1px;box-shadow:0 16px 44px rgba(45,41,38,.1)}.in{border:1px solid var(--teal);border-radius:19px;padding:1rem}.grid{display:grid;gap:1rem}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.box{border:1px solid var(--line);border-radius:16px;background:#fff;padding:.85rem}label{display:grid;gap:.35rem;font-weight:700;font-size:.9rem}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:.72rem;background:white;color:var(--dark)}textarea{min-height:95px}.muted{color:var(--muted)}.tiny{font-size:.78rem}.badge{display:inline-block;border-radius:999px;padding:.2rem .55rem;background:rgba(184,150,62,.16);font-size:.75rem}.warn{color:var(--burgundy);background:rgba(139,46,59,.1)}.ok{color:var(--teal);background:rgba(26,107,101,.1)}h2,h3{font-family:Georgia,serif;color:var(--teal);margin:.2rem 0 .8rem}.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}.notice{position:fixed;right:1rem;bottom:1rem;max-width:390px;background:var(--dark);color:white;border-radius:14px;padding:.8rem 1rem;display:none}.notice.show{display:block}.auth{min-height:100vh;display:grid;place-items:center;padding:1rem}.footer{text-align:center;border-top:1px solid var(--line);padding:1rem;color:var(--muted);font-size:.78rem}.report{display:none}.progress{height:15px;border:1px solid var(--line);border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--teal);width:0}@media(max-width:760px){.two,.three{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media print{.top,.footer,.screen,.notice{display:none!important}main{padding:0}.report{display:block}.sheet{min-height:260mm;border:2pt solid #b8963e;border-radius:18px;padding:14mm;position:relative}.sheet:before{content:"";position:absolute;inset:5mm;border:1pt solid #1a6b65;border-radius:14px}.sheet>*{position:relative}.foot{position:absolute;left:14mm;right:14mm;bottom:8mm;border-top:1px solid #b8963e;padding-top:5px;font-size:10px}.hash{font-family:monospace;word-break:break-all;font-size:10px}@page{size:A4;margin:18mm}}
</style>

<body><div id="app"></div><div id="notice" class="notice" role="status" aria-live="polite"></div>
<script>
(()=>{"use strict";const KEY="neuroped_edj_v3",VER="3.1.0",ITER=100000;let pin="",db=null,tab="pacientes",sel=null,sub="geral";const $=id=>document.getElementById(id),enc=new TextEncoder(),dec=new TextDecoder();function note(t){let n=$("notice");n.textContent=t;n.classList.add("show");setTimeout(()=>n.classList.remove("show"),3200)}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}function b64(b){let s="";new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return btoa(s)}function ub64(s){let x=atob(s||""),a=new Uint8Array(x.length);for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a}function rnd(n){let a=new Uint8Array(n);crypto.getRandomValues(a);return a}async function key(p,s){let m=await crypto.subtle.importKey("raw",enc.encode(p),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:s,iterations:ITER,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}async function crypt(o,p,s){let iv=rnd(12),k=await key(p,s),ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,enc.encode(JSON.stringify(o)));return{schema_version:VER,salt:b64(s),iv:b64(iv),ciphertext:b64(ct)}}async function open(env,p){let k=await key(p,ub64(env.salt)),pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(env.iv)},k,ub64(env.ciphertext));pin=p;return migrate(JSON.parse(dec.decode(pt)))}function env(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch{return null}}function fresh(){return{schema_version:VER,created_at:new Date().toISOString(),patients:[],settings:{privacy:true}}}function migrate(x){x=x&&typeof x==="object"?x:{};x.schema_version=VER;x.patients=Array.isArray(x.patients)?x.patients:[];x.settings=x.settings||{privacy:true};return x}async function save(){localStorage.setItem(KEY,JSON.stringify(await crypt(db,pin,ub64(env().salt))))}function validPin(p){if(!/^\d{4,}$/.test(p))return"PIN mínimo de 4 dígitos.";if(["0000","1111","2222","3333","4444","5555","6666","7777","8888","9999","1234","4321"].includes(p))return"PIN previsível não aceito.";let a=1,d=1,r=1;for(let i=1;i<p.length;i++){a&=+p[i]===+p[i-1]+1;d&=+p[i]===+p[i-1]-1;r&=p[i]===p[0]}return a||d||r?"PIN sequencial ou repetido não aceito.":""}function date(v){if(!v)return"Não informado";let p=String(v).split("-");return p.length==3?p[2]+"/"+p[1]+"/"+p[0]:v}function years(d){if(!d)return null;let x=new Date(d+"T00:00:00"),n=new Date(),y=n.getFullYear()-x.getFullYear();if(n.getMonth()<x.getMonth()||n.getMonth()==x.getMonth()&&n.getDate()<x.getDate())y--;return y}function days(d){if(!d)return 99999;return Math.floor((Date.now()-new Date(d+"T00:00:00").getTime())/86400000)}function ceiling(p){let y=years(p.dob),m=Math.floor((Date.now()-new Date((p.dob||"")+"T00:00:00").getTime())/26298e5);if(!p.dsm||y==null)return null;let t=m>=12&&m<=36?{N1:20,N2:25,N3:30}:y<=5?{N1:20,N2:35,N3:40}:y<=11?{N1:12,N2:25,N3:35}:y<=17?{N1:6,N2:15,N3:25}:{N1:4,N2:10,N3:15};return t[p.dsm]??null}function id(){return"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function auth(){let has=!!env();$("app").innerHTML=`<div class="auth"><section class="card" style="max-width:760px;width:100%"><div class="in"><div class="brand"><div class="mark">EDJ</div><div><h1>NeuroPed EDJ v3.1</h1><p>Ferramenta educacional de apoio à decisão clínica em neuropediatria</p></div></div><div class="box" style="margin:1rem 0"><h3>Privacidade e LGPD</h3><p>Os dados ficam apenas neste dispositivo, criptografados em repouso por AES-GCM, com chave derivada do PIN por PBKDF2. Não há transmissão a servidor, telemetria ou analytics. O profissional é o controlador dos dados.</p></div><form id="f" class="grid">${has?"":`<label>Aceite explícito<select id="ok" aria-label="Aceite da política"><option value="">Selecione</option><option value="s">Li e aceito</option></select></label>`}<label>${has?"PIN do profissional":"Criar PIN"}<input id="p" type="password" inputmode="numeric" aria-label="PIN do profissional"></label>${has?"":`<label>Confirmar PIN<input id="p2" type="password" inputmode="numeric" aria-label="Confirmar PIN"></label>`}<button class="btn primary">${has?"Entrar":"Ativar ambiente seguro"}</button><p class="tiny muted">Dr. Jadson Fraga Araújo Júnior — Neuropediatria — CRM-PE 25227 — RQE 17756</p></form></div></section></div>`;$("f").onsubmit=async e=>{e.preventDefault();let p=$("p").value.trim(),v=validPin(p);if(v)return note(v);try{if(has){db=await open(env(),p);app()}else{if($("ok").value!=="s")return note("Aceite obrigatório.");if(p!==$("p2").value.trim())return note("PIN não confere.");pin=p;db=fresh();localStorage.setItem(KEY,JSON.stringify(await crypt(db,p,rnd(16))));app()}}catch{note("PIN incorreto ou base incompatível.")}}}function shell(){let tabs=["pacientes","cadastrar","paciente","alertas","relatorios","config"];return `<div class="top"><div class="wrap"><div class="brand"><div class="mark">EDJ</div><div><h1>NeuroPed EDJ</h1><p>Dr. Jadson Fraga Araújo Júnior · CRM-PE 25227 · RQE 17756</p></div></div><nav class="tabs" role="tablist">${tabs.map(t=>`<button aria-selected="${tab===t}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}<button class="btn" id="lock">Bloquear</button></nav></div></div><main id="main"></main><footer class="footer">Ferramenta educacional de apoio à decisão clínica. Sugestão educacional. A decisão clínica final é do médico responsável. Rua Raimundo Lacerda, 001 — São José, Petrolina/PE — CEP 56302-470 · (87) 9 9109-7371 · Fraga Serviços Médicos LTDA</footer>`}function app(){if(!db)return auth();$("app").innerHTML=shell();document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;app()});$("lock").onclick=()=>{db=null;pin="";sel=null;auth()};({pacientes,cadastrar,paciente,alertas,relatorios,config})[tab]()}function pacienteById(x){return db.patients.find(p=>p.id===x)}function pacientes(){let q=sessionStorage.q||"",lev=sessionStorage.lev||"",ps=db.patients.filter(p=>(!q||[p.name,p.dob,p.cid10,p.cid11].join(" ").toLowerCase().includes(q.toLowerCase()))&&(!lev||p.dsm===lev));$("main").innerHTML=`<section class="card"><div class="in"><div class="row" style="justify-content:space-between"><div><h2>Pacientes</h2><p class="muted">Busca, filtros e navegação para ficha clínica criptografada.</p></div><button class="btn primary" id="new">Novo cadastro</button></div><div class="grid three"><label>Busca<input id="q" value="${esc(q)}" aria-label="Buscar por nome data ou CID"></label><label>Nível DSM<select id="lev"><option value="">Todos</option><option>N1</option><option>N2</option><option>N3</option></select></label><div class="box"><span class="badge">${ps.length} paciente(s)</span></div></div><div class="grid" style="margin-top:1rem">${ps.length?ps.map(p=>`<div class="box"><div class="row" style="justify-content:space-between"><div><b>${esc(p.name)}</b><p class="tiny muted">Nascimento: ${date(p.dob)} · CID-10: ${esc(p.cid10||"-")} · ${esc(p.dsm||"Sem nível")}</p></div><div class="row"><button class="btn" data-open="${p.id}">Abrir</button><button class="btn" data-edit="${p.id}">Editar</button><button class="btn danger" data-del="${p.id}">Excluir</button></div></div></div>`).join(""):`<div class="box">Nenhum paciente cadastrado.</div>`}</div></div></section>`;$("lev").value=lev;$("new").onclick=()=>{sel=null;tab="cadastrar";app()};$("q").oninput=e=>{sessionStorage.q=e.target.value;pacientes()};$("lev").onchange=e=>{sessionStorage.lev=e.target.value;pacientes()};document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{sel=b.dataset.open;tab="paciente";app()});document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{sel=b.dataset.edit;tab="cadastrar";app()});document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{let p=pacienteById(b.dataset.del);if(confirm("Excluir "+p.name+"?")){db.patients=db.patients.filter(x=>x.id!==p.id);await save();pacientes()}})}function cadastrar(){let p=sel?pacienteById(sel):{};p=p||{};$("main").innerHTML=`<section class="card"><div class="in"><h2>${p.id?"Editar":"Cadastrar"} paciente</h2><form id="pf" class="grid"><div class="grid two"><label>Nome completo<input id="name" required value="${esc(p.name)}"></label><label>Data de nascimento<input id="dob" type="date" required value="${esc(p.dob)}"></label></div><div class="grid three"><label>Sexo<select id="sex"><option></option><option>Feminino</option><option>Masculino</option><option>Outro</option></select></label><label>CID-10<input id="cid10" value="${esc(p.cid10)}"></label><label>CID-11<input id="cid11" value="${esc(p.cid11)}"></label></div><div class="grid three"><label>Nível DSM<select id="dsm"><option></option><option>N1</option><option>N2</option><option>N3</option></select></label><label>Último retorno<input id="last" type="date" value="${esc(p.last)}"></label><label>Horas semanais<input id="hours" type="number" min="0" step="1" value="${esc(p.hours||0)}"></label></div><label>Comorbidades<textarea id="com">${esc(p.com)}</textarea></label><label>Anamnese<textarea id="ana">${esc(p.ana)}</textarea></label><div class="grid two"><label>Contexto familiar<textarea id="fam">${esc(p.fam)}</textarea></label><label>Contexto escolar<textarea id="school">${esc(p.school)}</textarea></label></div><label>Plano terapêutico inicial<textarea id="plan">${esc(p.plan)}</textarea></label><label>Justificativa de excepcionalidade se ultrapassar teto<textarea id="just">${esc(p.just)}</textarea></label><button class="btn primary">Salvar paciente</button></form></div></section>`;["sex","dsm"].forEach(x=>{if(p[x])$(x).value=p[x]});$("pf").onsubmit=async e=>{e.preventDefault();let x={id:p.id||id(),name:$("name").value.trim(),dob:$("dob").value,sex:$("sex").value,cid10:$("cid10").value.trim(),cid11:$("cid11").value.trim(),dsm:$("dsm").value,last:$("last").value,hours:+$("hours").value||0,com:$("com").value,ana:$("ana").value,fam:$("fam").value,school:$("school").value,plan:$("plan").value,just:$("just").value,rx:p.rx||[],scales:p.scales||[],mon:p.mon||[]};let c=ceiling(x);if(c!==null&&x.hours>c&&x.just.length<200)return note("Justificativa mínima de 200 caracteres para ultrapassar o teto.");if(x.hours>c&&c!==null){x.exAt=new Date().toISOString().slice(0,10)}let i=db.patients.findIndex(a=>a.id===x.id);i>=0?db.patients[i]=x:db.patients.push(x);sel=x.id;await save();note("Paciente salvo em base criptografada.");tab="paciente";app()}}function paciente(){let p=sel?pacienteById(sel):db.patients[0];if(!p){$("main").innerHTML=`<section class="card"><div class="in"><h2>Paciente</h2><p>Nenhum cadastro.</p></div></section>`;return}sel=p.id;let subs=["geral","prescricoes","escalas","monitoramento"];$("main").innerHTML=`<section class="card"><div class="in"><div class="row" style="justify-content:space-between"><div><h2>${esc(p.name)}</h2><p class="muted">${date(p.dob)} · ${esc(p.cid10||"CID-10 não informado")} · ${esc(p.dsm||"Sem nível DSM")}</p></div><button class="btn" id="edit">Editar</button></div><div class="row">${subs.map(s=>`<button class="btn ${sub===s?"primary":""}" data-sub="${s}">${s}</button>`).join("")}</div><div id="panel" style="margin-top:1rem"></div></div></section>`;$("edit").onclick=()=>{tab="cadastrar";app()};document.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{sub=b.dataset.sub;paciente()});if(sub==="geral")geral(p);if(sub==="prescricoes")rx(p);if(sub==="escalas")scales(p);if(sub==="monitoramento")monitor(p)}function geral(p){let c=ceiling(p);$("panel").innerHTML=`<div class="grid two"><div class="box"><h3>Anamnese</h3><p>${esc(p.ana||"Não informado.")}</p></div><div class="box"><h3>Contextos</h3><p><b>Família:</b> ${esc(p.fam||"Não informado.")}</p><p><b>Escola:</b> ${esc(p.school||"Não informado.")}</p></div><div class="box"><h3>Plano</h3><p>${esc(p.plan||"Não informado.")}</p><span class="badge">${p.hours||0}h/semana</span> ${c!==null?`<span class="badge ok">Teto ${c}h</span>`:""}</div><div class="box"><h3>Comorbidades</h3><p>${esc(p.com||"Não informado.")}</p></div></div>`}function rx(p){p.rx=p.rx||[];$("panel").innerHTML=`<div class="grid two"><form id="rf" class="box grid"><h3>Prescrição educacional</h3>${["substancia","dose","posologia","via","indicacao","monitoramento","evento adverso esperado","plano de retirada"].map(x=>`<label>${x}<input id="r_${x.split(" ")[0]}"></label>`).join("")}<button class="btn primary">Registrar</button><p class="tiny muted">Sugestão educacional. A decisão clínica final é do médico responsável.</p></form><div class="box"><h3>Registros</h3>${p.rx.length?p.rx.map(r=>`<div class="box"><b>${esc(r.substancia)}</b><p>${esc(r.dose)} · ${esc(r.posologia)} · ${esc(r.via)}</p></div>`).join(""):"Nenhum registro."}</div></div>`;$("rf").onsubmit=async e=>{e.preventDefault();let r={substancia:$("r_substancia").value,dose:$("r_dose").value,posologia:$("r_posologia").value,via:$("r_via").value,indicacao:$("r_indicacao").value,monitoramento:$("r_monitoramento").value};if(!r.substancia||!r.dose)return note("Substância e dose são obrigatórias.");p.rx.push(r);await save();paciente()}}function scales(p){p.scales=p.scales||[];let ns=["VB-MAPP","Vineland-3","ADOS-2","ABLLS-R","Mullen","CARS-2"];$("panel").innerHTML=`<div class="grid two"><form id="sf" class="box grid"><h3>Escalas longitudinais</h3><label>Escala<select id="sn">${ns.map(n=>`<option>${n}</option>`)}</select></label><label>Data<input id="sd" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Escore<input id="ss" type="number" step="0.1"></label><label>Observação<textarea id="so"></textarea></label><button class="btn primary">Registrar</button><p class="tiny muted">Sem reprodução de itens protegidos; apenas metadados, escores e interpretação clínica.</p></form><div class="box"><h3>Gráfico SVG</h3>${chart(p.scales)}</div></div>`;$("sf").onsubmit=async e=>{e.preventDefault();let s={name:$("sn").value,date:$("sd").value,score:+$("ss").value,note:$("so").value};if(!s.date||isNaN(s.score))return note("Data e escore obrigatórios.");p.scales.push(s);await save();paciente()}}function chart(items){if(!items.length)return"Sem registros.";let pts=items.slice(-12).map((x,i)=>[20+i*24,120-(x.score||0)]).map(p=>p[0]+","+Math.max(20,Math.min(125,p[1]))).join(" ");return`<svg viewBox="0 0 320 150" width="100%" height="160" role="img" aria-label="Gráfico longitudinal"><line x1="20" y1="130" x2="300" y2="130" stroke="#ddd"/><polyline points="${pts}" fill="none" stroke="#1a6b65" stroke-width="3"/></svg>`}function monitor(p){p.mon=p.mon||[];$("panel").innerHTML=`<div class="grid two"><form id="mf" class="box grid"><h3>Evolução</h3><label>Data<input id="md" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Descrição<textarea id="mt"></textarea></label><button class="btn primary">Registrar</button></form><div class="box"><h3>Alertas</h3>${alertHtml([p])}<h3>Histórico</h3>${p.mon.map(m=>`<div class="box"><b>${date(m.date)}</b><p>${esc(m.text)}</p></div>`).join("")||"Sem evolução."}</div></div>`;$("mf").onsubmit=async e=>{e.preventDefault();p.mon.push({date:$("md").value,text:$("mt").value});p.last=$("md").value;await save();paciente()}}function alertHtml(ps){let a=[];ps.forEach(p=>{let l=p.dsm==="N1"?180:p.dsm==="N2"?120:p.dsm==="N3"?90:null;if(l&&days(p.last)>l)a.push(`${esc(p.name)}: retorno vencido acima de ${l} dias.`);let last=(p.scales||[]).sort((x,y)=>String(y.date).localeCompare(String(x.date)))[0];if(days(last&&last.date)>180)a.push(`${esc(p.name)}: escala sem atualização há mais de 180 dias.`);if(p.exAt&&days(p.exAt)>90)a.push(`${esc(p.name)}: excepcionalidade acima de 90 dias.`)});return a.length?a.map(x=>`<div class="box warn">${x}</div>`).join(""):`<span class="badge ok">Sem alertas ativos</span>`}function alertas(){$("main").innerHTML=`<section class="card"><div class="in"><h2>Alertas</h2>${alertHtml(db.patients)}</div></section>`}async function sha(t){let h=await crypto.subtle.digest("SHA-256",enc.encode(t));return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join("")}async function relatorios(){let p=sel?pacienteById(sel):db.patients[0];$("main").innerHTML=`<section class="card screen"><div class="in"><h2>Relatórios</h2>${db.patients.length?`<label>Paciente<select id="rp">${db.patients.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`)}</select></label><div id="prev" class="box" style="margin-top:1rem"></div><button class="btn primary" onclick="window.print()">Imprimir/PDF</button>`:"Nenhum paciente."}</div></section><section id="print" class="report"></section>`;if(!p)return;$("rp").value=p.id;$("rp").onchange=()=>{sel=$("rp").value;relatorios()};let h=await sha(JSON.stringify(p));$("prev").innerHTML=`<b>${esc(p.name)}</b><p class="tiny">SHA-256: ${h}</p>`;$("print").innerHTML=`<article class="sheet"><h1>NeuroPed EDJ — Relatório Neuropediátrico</h1><p>Dr. Jadson Fraga Araújo Júnior · Neuropediatria · CRM-PE 25227 · RQE 17756</p><div class="box"><b>Paciente:</b> ${esc(p.name)}<br><b>Nascimento:</b> ${date(p.dob)}<br><b>CID-10:</b> ${esc(p.cid10||"-")} · <b>CID-11:</b> ${esc(p.cid11||"-")}</div><div class="box"><b>Resumo clínico:</b><p>${esc(p.ana||"Não informado.")}</p></div><div class="box"><b>Plano terapêutico:</b><p>${esc(p.plan||"Não informado.")}</p></div><div class="box"><b>Validação documental:</b><p class="hash">SHA-256: ${h}</p></div><div class="foot">Rua Raimundo Lacerda, 001 — São José, Petrolina/PE — CEP 56302-470 · (87) 9 9109-7371 · Fraga Serviços Médicos LTDA</div></article>`}function config(){$("main").innerHTML=`<section class="grid two"><div class="card"><div class="in"><h2>Config</h2><div class="grid"><button class="btn" id="bk">Exportar backup JSON</button><label>Restaurar backup<input type="file" id="rs" accept="application/json"></label><button class="btn" id="cp">Trocar PIN</button><button class="btn danger" id="wipe">Apagar todos os dados</button><div><p class="tiny muted">Uso de armazenamento</p><div class="progress"><span id="bar"></span></div><p id="st" class="tiny muted"></p></div></div></div></div><div class="card"><div class="in"><h2>Documentação</h2><div class="grid"><div class="box"><h3>Sobre</h3><p>NeuroPed EDJ v3.1 é uma ferramenta educacional de apoio à decisão clínica em neuropediatria.</p></div><div class="box"><h3>Como usar</h3><p>Cadastre pacientes, registre escalas, acompanhe alertas e gere relatórios imprimíveis.</p></div><div class="box"><h3>Política de Privacidade e Termos</h3><p>Dados permanecem no dispositivo, criptografados, sem transmissão a servidor.</p></div><div class="box"><h3>Base científica</h3><p>Sandbank M et al. BMJ 2023. Reichow B et al. Cochrane Database Syst Rev 2018. Hyman SL et al. Pediatrics 2020. Hirota T, King BH. JAMA 2023.</p></div></div></div></div></section>`;$("bk").onclick=()=>{let a=document.createElement("a"),blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});a.href=URL.createObjectURL(blob);a.download="neuroped-edj-backup.json";a.click()};$("rs").onchange=e=>{let f=e.target.files[0],r=new FileReader();r.onload=async()=>{try{db=migrate(JSON.parse(r.result));await save();note("Backup restaurado.");app()}catch{note("Backup inválido.")}};if(f)r.readAsText(f)};$("cp").onclick=async()=>{let p=prompt("Novo PIN:");if(!p)return;let v=validPin(p);if(v)return note(v);pin=p;localStorage.setItem(KEY,JSON.stringify(await crypt(db,p,rnd(16))));note("PIN alterado.")};$("wipe").onclick=()=>{if(prompt("Digite APAGAR para excluir:")==="APAGAR"){localStorage.removeItem(KEY);db=null;auth()}};if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(e=>{let pct=e.quota?Math.round(e.usage/e.quota*100):0;$("bar").style.width=pct+"%";$("st").textContent=pct+"% utilizado."}).catch(()=>{})}window.onerror=()=>{note("Falha controlada. Recarregue a página.");return true};window.onunhandledrejection=e=>{e.preventDefault();note("Falha controlada. Recarregue a página.")};if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));auth()})();
</script></body></html>
