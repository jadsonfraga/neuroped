</head><body class="np-skin np-stage"><main class="wrap"><section class="card"><h1>Verificar documento</h1><p class="muted">Conferência local de código/hash emitido pelo NeuroPed. Este recurso não é assinatura digital ICP-Brasil, não substitui certificado A1/A3 e não valida documento em servidor central.</p><label>Código de conferência</label><input id="code" placeholder="Ex.: NP-20260508-ABC123"><label>Hash parcial</label><input id="hash" placeholder="Hash parcial, se disponível"><button class="btn" onclick="check()">Verificar neste dispositivo</button><a class="btn" href="./index.html">Central</a><pre id="out">Informe ou leia um QR Code gerado pelo NeuroPed.</pre></section></main><script>function q(k){return new URLSearchParams(location.search).get(k)||''}function check(){const code=document.getElementById('code').value.trim();const hash=document.getElementById('hash').value.trim();let list=[];try{list=JSON.parse(localStorage.getItem('np_document_verifications_v1')||'[]')}catch(e){}const found=list.find(x=>x.code===code||String(x.hash||'').startsWith(hash));const out=document.getElementById('out');if(found){out.textContent='Documento encontrado neste dispositivo.\n\nCódigo: '+found.code+'\nTipo: '+found.type+'\nCriado em: '+new Date(found.created).toLocaleString('pt-BR')+'\nHash: '+found.hash+'\n\nA conferência é local. Para validação jurídica, usar assinatura digital adequada.'}else{out.textContent='Código não encontrado neste dispositivo.\n\nIsso pode acontecer se o documento foi gerado em outro aparelho ou se o histórico local foi apagado. Compare o código/hash com o documento original e confirme com o emissor.'}}document.getElementById('code').value=q('code');document.getElementById('hash').value=q('hash');if(q('code')||q('hash'))check();</script><script src="./app-polish-mobile.js" defer></script>
