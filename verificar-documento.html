<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e0e22"><title>Verificar documento — NeuroPed</title>
<meta name="description" content="Verifique a autenticidade de um documento NeuroPed pelo código/QR. Conferência de integridade do conteúdo emitido."><style>body{margin:0;background:#0a0a16;color:#ECEAFF;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:860px;margin:auto;padding:24px}.card{background:#14132a;border:1px solid rgba(169,164,255,.16);border-radius:30px;padding:24px;box-shadow:0 18px 54px rgba(4,3,18,.6)}h1{font:760 clamp(34px,6vw,62px)/.94 Georgia,serif;color:#f2dca6;margin:0 0 8px}.muted{color:#b6b2e6;line-height:1.6}.ok{border-color:#bbf7d0;background:rgba(124,118,210,.08)}.warn{border-color:rgba(124,118,210,.08);background:rgba(124,118,210,.08)}.btn{display:inline-flex;text-decoration:none;border:0;border-radius:14px;background:#6d6af5;color:#fff;font-weight:950;padding:12px 14px;margin:4px;cursor:pointer}input{width:100%;border:1px solid rgba(169,164,255,.16);border-radius:16px;background:rgba(124,118,210,.08);padding:13px;font-size:16px}pre{white-space:pre-wrap;background:#ECEAFF;color:#0a0a16;border-radius:18px;padding:14px}</style><link rel="stylesheet" href="./app-polish-mobile.css">
</head><body><main class="wrap"><section class="card"><h1>Verificar documento</h1><p class="muted">Conferência local de código/hash emitido pelo NeuroPed. Este recurso não é assinatura digital ICP-Brasil, não substitui certificado A1/A3 e não valida documento em servidor central.</p><label>Código de conferência</label><input id="code" placeholder="Ex.: NP-20260508-ABC123"><label>Hash parcial</label><input id="hash" placeholder="Hash parcial, se disponível"><button class="btn" onclick="check()">Verificar neste dispositivo</button><a class="btn" href="./central-atalhos.html">Central</a><pre id="out">Informe ou leia um QR Code gerado pelo NeuroPed.</pre></section></main><script>function q(k){return new URLSearchParams(location.search).get(k)||''}function check(){const code=document.getElementById('code').value.trim();const hash=document.getElementById('hash').value.trim();let list=[];try{list=JSON.parse(localStorage.getItem('np_document_verifications_v1')||'[]')}catch(e){}const found=list.find(x=>x.code===code||String(x.hash||'').startsWith(hash));const out=document.getElementById('out');if(found){out.textContent='Documento encontrado neste dispositivo.\n\nCódigo: '+found.code+'\nTipo: '+found.type+'\nCriado em: '+new Date(found.created).toLocaleString('pt-BR')+'\nHash: '+found.hash+'\n\nA conferência é local. Para validação jurídica, usar assinatura digital adequada.'}else{out.textContent='Código não encontrado neste dispositivo.\n\nIsso pode acontecer se o documento foi gerado em outro aparelho ou se o histórico local foi apagado. Compare o código/hash com o documento original e confirme com o emissor.'}}document.getElementById('code').value=q('code');document.getElementById('hash').value=q('hash');if(q('code')||q('hash'))check();</script><script src="./app-polish-mobile.js" defer></script>
</body></html>
