name: OBS131 baseline and fixed media proof
on:
  push:
    branches: [fix/obs10-integridade-midia-v131]
    paths: [.github/workflows/obs131-integrate.yml]
permissions:
  contents: read
jobs:
  reproduce-and-fix:
    if: github.ref == 'refs/heads/fix/obs10-integridade-midia-v131'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/obs10-integridade-midia-v131
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply checksum-verified eight-path source patch
        run: |
          python3 - <<'PY'
          import base64,bz2,hashlib,pathlib,re
          patch=bz2.decompress(base64.b64decode(pathlib.Path('.github/obs131.patch.b64').read_text(),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='e8c46dc96cd0e2cafd07f0b1154b56253e2054d69096b50fa7c7ccb6e60afd51'
          expected={'client/src/features/obs10/AudioPreflight.tsx','client/src/features/obs10/EvidencePanel.tsx','client/src/features/obs10/evidence.ts','client/src/features/obs10/useLocalRecorder.ts','client/src/pages/pre-consulta-obs10.tsx','tests/e2e/obs10-media-regressions.mjs','tests/unit/obs10-media-regressions.test.ts','docs/audits/obs10-media-regressions.md'}
          pairs=re.findall(r'^diff --git a/(\S+) b/(\S+)$',patch.decode(),re.M)
          assert len(pairs)==len(expected) and {a for a,b in pairs}==expected and all(a==b for a,b in pairs)
          pathlib.Path('/tmp/obs131.patch').write_bytes(patch)
          PY
          git apply --check /tmp/obs131.patch
          git apply /tmp/obs131.patch
          git diff --check
          git add client/src/features/obs10/AudioPreflight.tsx client/src/features/obs10/EvidencePanel.tsx client/src/features/obs10/evidence.ts client/src/features/obs10/useLocalRecorder.ts client/src/pages/pre-consulta-obs10.tsx tests/e2e/obs10-media-regressions.mjs tests/unit/obs10-media-regressions.test.ts docs/audits/obs10-media-regressions.md
          git rm .github/obs131.patch.b64
          git -c user.name='NeuroPed Automation' -c user.email='actions@users.noreply.github.com' commit -m 'fix(obs10): cancel hidden capture and keep evidence bound to the selected clip'
          git push origin HEAD:fix/obs10-integridade-midia-v131
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the pinned unfixed media sources as a negative control
        env:
          VITE_OPEN_ACCESS: 'false'
        run: |
          git restore --source=f4e5ebc46f88cbd977a9764eea68fb2289bdf62f -- client/src/features/obs10/AudioPreflight.tsx client/src/features/obs10/EvidencePanel.tsx client/src/features/obs10/evidence.ts client/src/features/obs10/useLocalRecorder.ts client/src/pages/pre-consulta-obs10.tsx
          npm run build:client
      - name: Require all five specific failures on the baseline, not arbitrary test failures
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {spawnSync} from 'node:child_process';
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs';
          mkdirSync('/tmp/obs131-baseline',{recursive:true});
          const unit=spawnSync('node',['--import','tsx','tests/unit/obs10-media-regressions.test.ts'],{encoding:'utf8'});
          assert.equal(unit.status,1); assert.match(unit.stderr,/00:60\.0/);
          writeFileSync('/tmp/obs131-baseline/unit-failure.txt',unit.stdout+unit.stderr);
          const browser=spawnSync('node',['tests/e2e/obs10-media-regressions.mjs'],{encoding:'utf8',env:{...process.env,OBS10_MEDIA_ARTIFACT_DIR:'/tmp/obs131-baseline'}});
          writeFileSync('/tmp/obs131-baseline/browser.log',browser.stdout+browser.stderr);
          assert.equal(browser.status,1);
          const report=JSON.parse(readFileSync('/tmp/obs131-baseline/result.json','utf8'));
          const expected={'late-camera-after-hide':'permission delivered after hiding','late-audio-after-hide':'test microphone must not begin','unexpected-recorder-stop':'waitForFunction','cross-clip-clears-old-player':'opening another clip'};
          assert.equal(report.results.length,4); assert.deepEqual(report.errors,[]); assert.deepEqual(report.writes,[]);
          for(const r of report.results){ assert.equal(r.passed,false,r.name); assert.ok(expected[r.name] && r.error.includes(expected[r.name]),JSON.stringify(r)); }
          console.log('Negative control reproduced five specific defects; no unexpected JS/network failures.');
          JS
      - name: Restore fixed product sources and require type and contract checks
        run: |
          git restore --source=HEAD -- client/src/features/obs10/AudioPreflight.tsx client/src/features/obs10/EvidencePanel.tsx client/src/features/obs10/evidence.ts client/src/features/obs10/useLocalRecorder.ts client/src/pages/pre-consulta-obs10.tsx
          npm run check
          npx eslint client/src/features/obs10/*.{ts,tsx} client/src/pages/pre-consulta-obs10.tsx tests/unit/obs10*.test.ts --max-warnings=0
          node --import tsx tests/unit/obs10.test.ts
          node --import tsx tests/unit/obs10-practical.test.ts
          node --import tsx tests/unit/obs10-review.test.ts
          node --import tsx tests/unit/obs10-evidence.test.ts
          node --import tsx tests/unit/obs10-media-regressions.test.ts
      - name: Build fixed product
        env:
          VITE_OPEN_ACCESS: 'false'
        run: npm run build:client
      - name: Require the same browser regression tests to pass on fixed sources
        env:
          OBS10_MEDIA_ARTIFACT_DIR: /tmp/obs131-fixed
        run: node tests/e2e/obs10-media-regressions.mjs
      - name: Preserve synthetic before-and-after evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: obs131-before-after
          path: |
            /tmp/obs131-baseline
            /tmp/obs131-fixed
          retention-days: 7
          if-no-files-found: ignore
