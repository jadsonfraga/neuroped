name: Provision D1 backend

# Provisiona o backend em nuvem do NeuroPed na Cloudflare:
#  1. Cria (idempotente) o banco D1 "neuroped-db" e o KV "RATE_LIMIT_KV"
#  2. Aplica o schema db/schema.d1.sql no D1 remoto
#  3. Configura os bindings D1/KV no PROJETO Cloudflare Pages via API
#     (para Pages, bindings nao vem do wrangler.toml -- tem que ser no projeto)
#  4. Faz o deploy para o Cloudflare Pages, agora com o backend ativo
#
# Rode em Actions -> "Provision D1 backend" -> Run workflow.
# Requer os secrets: CLOUDFLARE_API_TOKEN (D1 + Workers KV + Pages) e
# CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:

concurrency:
  group: provision-d1
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER: "npx --yes wrangler@3"
  D1_NAME: "neuroped-db"
  KV_NAME: "RATE_LIMIT_KV"
  PAGES_PROJECT: "neuroped"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      # ── 1. D1: cria se não existir e resolve o database_id ────────────────
      - name: Criar banco D1 (idempotente)
        run: $WRANGLER d1 create "$D1_NAME" || echo "D1 '$D1_NAME' provavelmente já existe — seguindo."

      - name: Resolver database_id do D1
        id: d1
        run: |
          set -euo pipefail
          ID="$($WRANGLER d1 list --json | jq -r --arg n "$D1_NAME" '.[] | select(.name==$n) | .uuid' | head -n1)"
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "::error::Não foi possível resolver o database_id do D1 '$D1_NAME'. Verifique as permissões do CLOUDFLARE_API_TOKEN (D1)."
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "D1 $D1_NAME -> $ID"

      - name: Aplicar schema no D1 (reconstrói tabelas)
        run: $WRANGLER d1 execute "$D1_NAME" --remote --file=./db/schema.d1.sql --yes

      - name: Semear dados demo (fictícios, is_demo=1)
        continue-on-error: true
        run: $WRANGLER d1 execute "$D1_NAME" --remote --file=./db/seed.d1.sql --yes

      # ── 2. KV: cria se não existir e resolve o id (best-effort) ───────────
      - name: Criar namespace KV (idempotente, opcional)
        continue-on-error: true
        run: $WRANGLER kv namespace create "$KV_NAME" || echo "KV '$KV_NAME' provavelmente já existe — seguindo."

      - name: Resolver id do KV (opcional)
        id: kv
        continue-on-error: true
        run: |
          set -euo pipefail
          ID="$($WRANGLER kv namespace list | jq -r --arg n "$KV_NAME" '.[] | select(.title==$n or (.title|endswith($n))) | .id' | head -n1)"
          echo "id=${ID:-}" >> "$GITHUB_OUTPUT"
          echo "KV $KV_NAME -> ${ID:-<nao resolvido>}"

      # ── 3. Configura os bindings no PROJETO Pages (Cloudflare API) ────────
      # Para Pages, os bindings D1/KV NAO vem do wrangler.toml; precisam estar
      # no projeto (deployment_configs.production/preview). Faz GET + merge para
      # nao apagar outras configs, depois PATCH.
      - name: Configurar bindings D1/KV no projeto Pages
        env:
          D1_ID: ${{ steps.d1.outputs.id }}
          KV_ID: ${{ steps.kv.outputs.id }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}"
          CUR="$(curl -sS "$API" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          echo "$CUR" | jq -e '.success == true' >/dev/null || { echo "::error::GET do projeto Pages falhou:"; echo "$CUR" | jq '.errors'; exit 1; }
          BODY="$(echo "$CUR" | jq \
            --arg d1 "$D1_ID" --arg kv "${KV_ID:-}" --arg kvname "$KV_NAME" '
              (.result.deployment_configs // {}) as $dc
              | { deployment_configs: (
                    $dc
                    | .production.d1_databases.DB = {"id":$d1}
                    | .preview.d1_databases.DB = {"id":$d1}
                    | if $kv != "" then
                        .production.kv_namespaces[$kvname] = {"namespace_id":$kv}
                        | .preview.kv_namespaces[$kvname] = {"namespace_id":$kv}
                      else . end
                  ) }')"
          RESP="$(curl -sS -X PATCH "$API" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$BODY")"
          echo "$RESP" | jq '{success, errors}'
          echo "$RESP" | jq -e '.success == true' >/dev/null || { echo "::error::PATCH dos bindings no projeto Pages falhou."; exit 1; }
          echo "Bindings D1/KV configurados no projeto Pages '$PAGES_PROJECT'."

      # ── 4. Build + deploy já com o backend ativo ──────────────────────────
      - name: Build do frontend
        env:
          NODE_ENV: production
        run: npm run build:client

      - name: Deploy para Cloudflare Pages
        run: $WRANGLER pages deploy dist/public --project-name "$PAGES_PROJECT" --branch main

      - name: Smoke test do backend (/api/health)
        run: |
          echo "Aguardando propagação..."
          sleep 25
          OUT="$(curl -fsSL "https://${PAGES_PROJECT}.pages.dev/api/health?t=$GITHUB_RUN_ID" || true)"
          echo "$OUT"
          echo "$OUT" | grep -q '"database":"ok"' \
            && echo "✅ Backend conectado ao D1 (database: ok)." \
            || echo "::warning::database ainda não está 'ok' — pode levar alguns minutos para propagar; re-cheque /api/health."
