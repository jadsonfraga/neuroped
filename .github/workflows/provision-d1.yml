name: Provision D1 backend

# Provisiona o backend em nuvem do NeuroPed na Cloudflare:
#  1. Cria (idempotente) o banco D1 "neuroped-db" e o KV "RATE_LIMIT_KV"
#  2. Aplica o schema db/schema.sql no D1 remoto
#  3. Grava os bindings (IDs) no wrangler.toml e faz commit na main
#  4. Faz o deploy para o Cloudflare Pages já com o backend ativo
#
# Rode UMA vez em Actions → "Provision D1 backend" → Run workflow.
# Requer os secrets: CLOUDFLARE_API_TOKEN (com permissões D1 + Workers KV +
# Pages) e CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:

concurrency:
  group: provision-d1
  cancel-in-progress: false

permissions:
  contents: write

env:
  WRANGLER: "npx --yes wrangler@3"
  D1_NAME: "neuroped-db"
  KV_NAME: "RATE_LIMIT_KV"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      # ── 1. D1: cria se não existir e resolve o database_id ────────────────
      - name: Criar banco D1 (idempotente)
        run: $WRANGLER d1 create "$D1_NAME" || echo "D1 '$D1_NAME' provavelmente já existe — seguindo."

      - name: Resolver database_id do D1
        id: d1
        run: |
          set -euo pipefail
          ID="$($WRANGLER d1 list --json | jq -r --arg n "$D1_NAME" '.[] | select(.name==$n) | .uuid' | head -n1)"
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "::error::Não foi possível resolver o database_id do D1 '$D1_NAME'. Verifique as permissões do CLOUDFLARE_API_TOKEN (D1)."
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "D1 $D1_NAME → $ID"

      - name: Aplicar schema no D1 (idempotente)
        run: $WRANGLER d1 execute "$D1_NAME" --remote --file=./db/schema.sql --yes

      # ── 2. KV: cria se não existir e resolve o id (best-effort) ───────────
      - name: Criar namespace KV (idempotente, opcional)
        continue-on-error: true
        run: $WRANGLER kv namespace create "$KV_NAME" || echo "KV '$KV_NAME' provavelmente já existe — seguindo."

      - name: Resolver id do KV (opcional)
        id: kv
        continue-on-error: true
        run: |
          set -euo pipefail
          ID="$($WRANGLER kv namespace list | jq -r --arg n "$KV_NAME" '.[] | select(.title==$n or (.title|endswith($n))) | .id' | head -n1)"
          echo "id=${ID:-}" >> "$GITHUB_OUTPUT"
          echo "KV $KV_NAME → ${ID:-<não resolvido>}"

      # ── 3. Grava os bindings no wrangler.toml e commita na main ───────────
      - name: Escrever bindings no wrangler.toml
        env:
          D1_ID: ${{ steps.d1.outputs.id }}
          KV_ID: ${{ steps.kv.outputs.id }}
        run: |
          set -euo pipefail
          # Remove qualquer bloco de bindings antigo (idempotência) a partir do marcador
          if grep -q ">>> D1_BINDING_PLACEHOLDER <<<" wrangler.toml; then
            sed -i '/>>> D1_BINDING_PLACEHOLDER <<</q' wrangler.toml
          fi
          {
            echo ""
            echo "[[d1_databases]]"
            echo "binding = \"DB\""
            echo "database_name = \"$D1_NAME\""
            echo "database_id = \"$D1_ID\""
            if [ -n "${KV_ID:-}" ]; then
              echo ""
              echo "[[kv_namespaces]]"
              echo "binding = \"$KV_NAME\""
              echo "id = \"$KV_ID\""
            fi
          } >> wrangler.toml
          echo "----- wrangler.toml -----"
          cat wrangler.toml

      - name: Commit dos bindings na main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- wrangler.toml; then
            echo "wrangler.toml sem mudanças — bindings já estavam aplicados."
          else
            git add wrangler.toml
            git commit -m "chore(backend): grava bindings D1/KV no wrangler.toml (provisionamento)"
            git push origin HEAD:main || echo "::warning::push para main bloqueado (branch protection). Os bindings estão no deploy desta execução; aplique-os manualmente se necessário."
          fi

      # ── 4. Build + deploy já com o backend ativo ──────────────────────────
      - name: Build do frontend
        env:
          NODE_ENV: production
          VITE_PIN_HASH: ${{ secrets.VITE_PIN_HASH }}
        run: npm run build:client

      - name: Deploy para Cloudflare Pages (com bindings)
        run: $WRANGLER pages deploy dist/public --project-name neuroped --branch main

      - name: Smoke test do backend (/api/health)
        run: |
          echo "Aguardando propagação..."
          sleep 20
          curl -fsSL https://neuroped.pages.dev/api/health || echo "::warning::/api/health não respondeu 2xx ainda — pode levar alguns minutos para propagar."
