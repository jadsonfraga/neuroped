name: Provision D1 backend

# Provisiona o backend em nuvem do NeuroPed na Cloudflare:
#  1. Cria (idempotente) o banco D1 "neuroped-db" e o KV "RATE_LIMIT_KV"
#  2. Aplica schema idempotente + migrações aditivas no D1 remoto
#  3. Configura os bindings D1/KV no PROJETO Cloudflare Pages via API
#     (para Pages, bindings nao vem do wrangler.toml -- tem que ser no projeto)
#  4. Faz o deploy para o Cloudflare Pages, agora com o backend ativo
#
# Rode em Actions -> "Provision D1 backend" -> Run workflow.
# Requer os secrets: CLOUDFLARE_API_TOKEN (D1 + Workers KV + Pages) e
# CLOUDFLARE_ACCOUNT_ID, NEUROPED_JWT_SECRET, ADMIN_EMAIL e
# ADMIN_INITIAL_PASSWORD. Sem autenticação completa, nada é publicado.

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER: "npx --yes wrangler@3"
  D1_NAME: "neuroped-db"
  KV_NAME: "RATE_LIMIT_KV"
  PAGES_PROJECT: "neuroped"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  JWT_SECRET: ${{ secrets.NEUROPED_JWT_SECRET }}
  ADMIN_MAIL: ${{ secrets.ADMIN_EMAIL }}
  ADMIN_PW: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
  ADMIN_NM: ${{ secrets.ADMIN_NAME }}

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar branch principal
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Provisionamento e deploy permitidos somente a partir de main."
            exit 1
          fi

      - name: Checkout da main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Validar secrets obrigatórios antes de provisionar
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID JWT_SECRET ADMIN_MAIL ADMIN_PW; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::Secret obrigatório ausente: $name"
              exit 1
            fi
          done
          [ "${#JWT_SECRET}" -ge 32 ] || { echo "::error::NEUROPED_JWT_SECRET deve ter ao menos 32 caracteres"; exit 1; }
          [ "${#ADMIN_PW}" -ge 12 ] || { echo "::error::ADMIN_INITIAL_PASSWORD deve ter ao menos 12 caracteres"; exit 1; }
          case "$ADMIN_MAIL" in *@*) ;; *) echo "::error::ADMIN_EMAIL inválido"; exit 1;; esac
          echo "Secrets obrigatórios presentes (valores não exibidos)."

      - name: Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Instalar Chromium para os testes E2E
        run: npx playwright install --with-deps chromium

      - name: Auditar grafo completo de dependências
        run: npm audit --audit-level=high

      - name: Executar catraca técnica completa antes de qualquer mutação
        run: npm run verify

      # ── 1. D1: cria se não existir e resolve o database_id ────────────────
      - name: Criar banco D1 (idempotente)
        run: $WRANGLER d1 create "$D1_NAME" || echo "D1 '$D1_NAME' provavelmente já existe — seguindo."

      - name: Resolver database_id do D1
        id: d1
        run: |
          set -euo pipefail
          ID="$($WRANGLER d1 list --json | jq -r --arg n "$D1_NAME" '.[] | select(.name==$n) | .uuid' | head -n1)"
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "::error::Não foi possível resolver o database_id do D1 '$D1_NAME'. Verifique as permissões do CLOUDFLARE_API_TOKEN (D1)."
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "D1 $D1_NAME -> $ID"

      - name: Aplicar schema idempotente no D1
        run: $WRANGLER d1 execute "$D1_NAME" --remote --file=./db/schema.d1.sql --yes

      - name: Aplicar migrações aditivas de auth, ownership e sessões
        run: |
          set -euo pipefail
          add_column() {
            local definition="$1"
            local output
            if output="$($WRANGLER d1 execute "$D1_NAME" --remote --yes \
              --command "ALTER TABLE users ADD COLUMN ${definition};" 2>&1)"; then
              echo "users.${definition%% *}: adicionada"
            elif echo "$output" | grep -qi "duplicate column"; then
              echo "users.${definition%% *}: já existe"
            else
              echo "$output"
              return 1
            fi
          }
          add_column "password_hash TEXT"
          add_column "must_change_password INTEGER NOT NULL DEFAULT 0"
          add_column "failed_login_attempts INTEGER NOT NULL DEFAULT 0"
          add_column "locked_until DATETIME"
          add_column "last_login_at DATETIME"

          owner_output=""
          if owner_output="$($WRANGLER d1 execute "$D1_NAME" --remote --yes \
            --command "ALTER TABLE patients_demo ADD COLUMN owner_user_id TEXT;" 2>&1)"; then
            echo "patients_demo.owner_user_id: adicionada"
          elif echo "$owner_output" | grep -qi "duplicate column"; then
            echo "patients_demo.owner_user_id: já existe"
          else
            echo "$owner_output"
            exit 1
          fi
          $WRANGLER d1 execute "$D1_NAME" --remote --yes \
            --command "CREATE INDEX IF NOT EXISTS idx_patients_demo_owner ON patients_demo(owner_user_id);"

          cols="$($WRANGLER d1 execute "$D1_NAME" --remote \
            --command "SELECT name FROM pragma_table_info('patients_demo');")"
          echo "$cols"
          echo "$cols" | grep -q "owner_user_id" || {
            echo "::error::coluna patients_demo.owner_user_id ausente"
            exit 1
          }

          $WRANGLER d1 execute "$D1_NAME" --remote --yes \
            --file=./db/migrations/0003_refresh_sessions.sql
          session_table="$($WRANGLER d1 execute "$D1_NAME" --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='auth_refresh_sessions';")"
          echo "$session_table"
          echo "$session_table" | grep -q "auth_refresh_sessions" || {
            echo "::error::tabela auth_refresh_sessions ausente"
            exit 1
          }

          $WRANGLER d1 execute "$D1_NAME" --remote --yes \
            --file=./db/migrations/0004_consents.sql
          $WRANGLER d1 execute "$D1_NAME" --remote --yes \
            --file=./db/migrations/0011_clinical_memory.sql
          consent_columns="$($WRANGLER d1 execute "$D1_NAME" --remote \
            --command "SELECT name FROM pragma_table_info('consents');")"
          echo "$consent_columns"
          for column in batch_id user_id consent_type accepted_at; do
            echo "$consent_columns" | grep -q "$column" || {
              echo "::error::coluna consents.$column ausente"
              exit 1
            }
          done
          consent_index="$($WRANGLER d1 execute "$D1_NAME" --remote \
            --command "SELECT name FROM sqlite_master WHERE type='index' AND name='idx_consents_user_accepted';")"
          echo "$consent_index" | grep -q "idx_consents_user_accepted" || {
            echo "::error::índice de ownership dos consentimentos ausente"
            exit 1
          }
          memory_table="$($WRANGLER d1 execute "$D1_NAME" --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='clinical_memory_notes_demo';")"
          echo "$memory_table"
          echo "$memory_table" | grep -q "clinical_memory_notes_demo" || {
            echo "::error::tabela clinical_memory_notes_demo ausente"
            exit 1
          }
          memory_index="$($WRANGLER d1 execute "$D1_NAME" --remote \
            --command "SELECT name FROM sqlite_master WHERE type='index' AND name='idx_clinical_memory_patient_updated';")"
          echo "$memory_index"
          echo "$memory_index" | grep -q "idx_clinical_memory_patient_updated" || {
            echo "::error::índice da memória clínica ausente"
            exit 1
          }

      - name: Semear dados demo sem substituir registros existentes
        run: $WRANGLER d1 execute "$D1_NAME" --remote --file=./db/seed.d1.sql --yes

      # ── 2. KV: cria se não existir e resolve o id (best-effort) ───────────
      - name: Criar namespace KV (idempotente, opcional)
        continue-on-error: true
        run: $WRANGLER kv namespace create "$KV_NAME" || echo "KV '$KV_NAME' provavelmente já existe — seguindo."

      - name: Resolver id do KV (opcional)
        id: kv
        continue-on-error: true
        run: |
          set -euo pipefail
          ID="$($WRANGLER kv namespace list | jq -r --arg n "$KV_NAME" '.[] | select(.title==$n or (.title|endswith($n))) | .id' | head -n1)"
          echo "id=${ID:-}" >> "$GITHUB_OUTPUT"
          echo "KV $KV_NAME -> ${ID:-<nao resolvido>}"

      # ── 3. Configura os bindings no PROJETO Pages (Cloudflare API) ────────
      # Para Pages, os bindings D1/KV NAO vem do wrangler.toml; precisam estar
      # no projeto (deployment_configs.production/preview). Faz GET + merge para
      # nao apagar outras configs, depois PATCH.
      - name: Configurar bindings D1/KV no projeto Pages
        env:
          D1_ID: ${{ steps.d1.outputs.id }}
          KV_ID: ${{ steps.kv.outputs.id }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}"
          CUR="$(curl -sS "$API" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          echo "$CUR" | jq -e '.success == true' >/dev/null || { echo "::error::GET do projeto Pages falhou:"; echo "$CUR" | jq '.errors'; exit 1; }
          BODY="$(echo "$CUR" | jq \
            --arg d1 "$D1_ID" --arg kv "${KV_ID:-}" --arg kvname "$KV_NAME" '
              (.result.deployment_configs // {}) as $dc
              | { deployment_configs: (
                    $dc
                    | .production.d1_databases.DB = {"id":$d1}
                    | .preview.d1_databases.DB = {"id":$d1}
                    | if $kv != "" then
                        .production.kv_namespaces[$kvname] = {"namespace_id":$kv}
                        | .preview.kv_namespaces[$kvname] = {"namespace_id":$kv}
                      else . end
                  ) }')"
          RESP="$(curl -sS -X PATCH "$API" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$BODY")"
          echo "$RESP" | jq '{success, errors}'
          echo "$RESP" | jq -e '.success == true' >/dev/null || { echo "::error::PATCH dos bindings no projeto Pages falhou."; exit 1; }
          echo "Bindings D1/KV configurados no projeto Pages '$PAGES_PROJECT'."

      - name: Configurar autenticação nominal no projeto Pages
        run: |
          set -euo pipefail
          put_required() {
            [ -n "$2" ] || { echo "::error::$1 ausente"; exit 1; }
            printf '%s' "$2" | $WRANGLER pages secret put "$1" --project-name "$PAGES_PROJECT" >/dev/null
            echo "secret $1: definido"
          }
          put_required NEUROPED_JWT_SECRET "$JWT_SECRET"
          put_required ADMIN_EMAIL "$ADMIN_MAIL"
          put_required ADMIN_INITIAL_PASSWORD "$ADMIN_PW"
          if [ -n "$ADMIN_NM" ]; then
            printf '%s' "$ADMIN_NM" | $WRANGLER pages secret put ADMIN_NAME --project-name "$PAGES_PROJECT" >/dev/null
            echo "secret opcional ADMIN_NAME: definido"
          fi

      # ── 4. Build + deploy já com o backend ativo ──────────────────────────
      - name: Build do frontend
        env:
          NODE_ENV: production
        run: npm run build:client

      - name: Deploy para Cloudflare Pages
        run: $WRANGLER pages deploy dist/public --project-name "$PAGES_PROJECT" --branch main

      - name: Smoke test do backend (/api/health)
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 18); do
            if curl -fsSL "https://${PAGES_PROJECT}.pages.dev/api/health?run=${GITHUB_RUN_ID}&try=$i" \
                 -o /tmp/provision-health.json 2>/dev/null \
               && jq -e '.database == "ok" and .authentication.required == true and .authentication.configured == true' \
                    /tmp/provision-health.json >/dev/null; then
              ok=1
              break
            fi
            sleep 10
          done
          cat /tmp/provision-health.json 2>/dev/null || true
          [ "$ok" -eq 1 ] || { echo "::error::D1/auth não ficaram prontos após o provisionamento"; exit 1; }
          echo "✅ Backend conectado ao D1 com autenticação configurada."

      - name: Verificar login nominal após provisionamento
        run: |
          set -euo pipefail
          BASE="https://${PAGES_PROJECT}.pages.dev"
          payload=$(jq -nc --arg email "$ADMIN_MAIL" --arg password "$ADMIN_PW" '{email:$email,password:$password}')
          response=$(curl -fsSL -X POST "$BASE/api/auth/login" \
            -H "Content-Type: application/json" --data "$payload")
          token=$(printf '%s' "$response" | jq -r '.accessToken // empty')
          [ -n "$token" ] || { echo "::error::login não retornou accessToken"; exit 1; }
          code=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/api/auth/me" \
            -H "Authorization: Bearer $token")
          [ "$code" = "200" ] || { echo "::error::/api/auth/me retornou HTTP $code"; exit 1; }
          echo "✅ AUTH E2E OK — conta administrativa e sessão nominal operantes."
