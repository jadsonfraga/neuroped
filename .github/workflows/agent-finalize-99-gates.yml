name: Agent finalize real visual 9.9 gates

on:
  push:
    branches:
      - agent/visual-9-9-final-proof
    paths:
      - ".github/workflows/agent-finalize-99-gates.yml"

permissions:
  contents: write

concurrency:
  group: agent-visual-9-9-final-proof
  cancel-in-progress: false

jobs:
  finalize-gates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current main-based branch
        uses: actions/checkout@v7
        with:
          ref: agent/visual-9-9-final-proof
          fetch-depth: 0

      - name: Align the static contract with the shared helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/unit/flow-os-navigation-static.test.mjs")
          text = path.read_text(encoding="utf-8")
          before = '''assert.match(
            floatingHelp,
            /dispatchEvent\\(new Event\\(OPEN_TOUR_EVENT\\)\\)/,
            "a ajuda única deve abrir o tour por evento explícito",
          );'''
          after = '''assert.match(
            floatingHelp,
            /dispatchEvent\\(new Event\\(eventName\\)\\)/,
            "o helper de assistência deve despachar o evento recebido explicitamente",
          );
          assert.match(
            floatingHelp,
            /openAuxiliarySurface\\(OPEN_TOUR_EVENT\\)/,
            "a ajuda única deve abrir o tour pelo helper compartilhado",
          );
          assert.match(
            floatingHelp,
            /openAuxiliarySurface\\(OPEN_PREFERENCES_EVENT\\)/,
            "a ajuda única deve abrir preferências pelo helper compartilhado",
          );'''
          count = text.count(before)
          if count != 1:
              raise SystemExit(f"expected one shared-helper contract, found {count}")
          path.write_text(text.replace(before, after, 1), encoding="utf-8")
          PY

      - name: Install dependencies and real Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run focused static and browser proof
        run: |
          set -euo pipefail
          git diff --check
          node tests/unit/visual-reset-static.test.mjs
          node tests/unit/premium-polish-10-static.test.mjs
          node tests/unit/flow-os-navigation-static.test.mjs
          node tests/unit/assistance-surface-static.test.mjs
          npm run check
          npm run lint
          npm run build:client
          node tests/e2e/scroll-continuity.mjs
          node scripts/audit-assistance-states.mjs

      - name: Commit only the validated final correction
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-finalize-99-gates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/flow-os-navigation-static.test.mjs \
                  .github/workflows/agent-finalize-99-gates.yml
          git commit -m "test: certify deterministic visual assistance gates"
          git push origin HEAD:agent/visual-9-9-final-proof

# rerun: serialize focus handoff before opening the next assistance surface
