name: PR Check

on:
  pull_request:
    branches:
      - main
      - feat/auditoria-total-ui-backend-memoria
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited

permissions:
  contents: read

concurrency:
  group: neuroped-pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Build & Lint
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.collision.outputs.pr_number }}
      contract_status: ${{ steps.collision_contract.outcome }}
      collision_status: ${{ steps.collision.outcome }}
      typecheck_status: ${{ steps.typecheck.outcome }}
      build_status: ${{ steps.build.outcome }}
      lint_status: ${{ steps.lint.outcome }}
      functions_build_status: ${{ steps.functions_build.outcome }}
      access_status: ${{ steps.access.outcome }}
      conecta_status: ${{ steps.conecta.outcome }}
      clinical_core_status: ${{ steps.clinical_core.outcome }}
      operations_status: ${{ steps.operations.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Validar contrato estático da trava de colisões
        id: collision_contract
        run: node tests/unit/pr-collision-guard.test.mjs
        continue-on-error: true

      - name: Validar base atual e colisões críticas entre PRs
        id: collision
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const payloadPr = context.payload.pull_request;

            if (!payloadPr?.number) {
              core.setFailed("Evento sem pull_request; gate fechado por segurança.");
              return;
            }

            // Consulta o estado atual; não confia em payload potencialmente antigo.
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: payloadPr.number,
            });
            core.setOutput("pr_number", String(pr.number));

            if (pr.state !== "open") {
              core.setFailed(`O PR #${pr.number} não está aberto; validação cancelada.`);
              return;
            }

            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${pr.base.ref}...${pr.head.sha}`,
              per_page: 1,
            });
            const behindBy = Number(comparison.data.behind_by ?? 0);

            const filePaths = (file) =>
              [...new Set([file.filename, file.previous_filename].filter(Boolean))];

            const currentFiles = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: pr.number, per_page: 100 },
            );
            // Inclui o caminho antigo de arquivos renomeados.
            const currentPaths = new Set(currentFiles.flatMap(filePaths));

            const openPulls = await github.paginate(
              github.rest.pulls.list,
              {
                owner,
                repo,
                state: "open",
                base: pr.base.ref,
                sort: "updated",
                direction: "desc",
                per_page: 100,
              },
            );

            const exactCritical = new Set([
              "package.json",
              "package-lock.json",
              "client/src/App.tsx",
              "client/src/main.tsx",
              "client/src/pages/home.tsx",
              "vite.config.ts",
              "wrangler.toml",
              "vercel.json",
            ]);
            const criticalPrefixes = [
              ".github/workflows/",
              "server/",
              "functions/",
              "shared/",
              "db/migrations/",
              "migrations/",
              "client/src/pages/",
              "client/src/components/",
              "client/src/contexts/",
              "client/src/security/",
              "client/src/lib/auth",
            ];
            const isCritical = (path) =>
              exactCritical.has(path) ||
              criticalPrefixes.some((prefix) => path.startsWith(prefix));

            const collisions = [];
            for (const other of openPulls) {
              if (other.number === pr.number || other.draft) continue;
              const otherFiles = await github.paginate(
                github.rest.pulls.listFiles,
                { owner, repo, pull_number: other.number, per_page: 100 },
              );
              const critical = [
                ...new Set(
                  otherFiles
                    .flatMap(filePaths)
                    .filter((path) => currentPaths.has(path) && isCritical(path)),
                ),
              ];
              if (critical.length > 0) {
                collisions.push({
                  number: other.number,
                  title: other.title,
                  files: critical,
                });
              }
            }

            core.setOutput("behind_by", String(behindBy));
            core.setOutput("collision_count", String(collisions.length));

            core.summary
              .addHeading("NeuroPED — gate obrigatório de integração")
              .addTable([
                [
                  { data: "Indicador", header: true },
                  { data: "Resultado", header: true },
                ],
                ["PR", `#${pr.number} — ${pr.title}`],
                ["Estado", pr.draft ? "Draft" : "Pronto para revisão"],
                ["Commits atrás da base", String(behindBy)],
                ["Colisões críticas com PRs não-draft", String(collisions.length)],
              ]);

            for (const item of collisions) {
              core.summary.addRaw(
                `- PR #${item.number} — ${item.title}: ${item.files.map((file) => `\`${file}\``).join(", ")}\n`,
              );
            }
            await core.summary.write();

            if (pr.draft) {
              if (behindBy > 0 || collisions.length > 0) {
                core.notice(
                  "Base antiga ou colisões registradas; o PR permanece protegido por estar em draft.",
                );
              }
              return;
            }

            const blockers = [];
            if (behindBy > 0) {
              blockers.push(
                `Branch ${behindBy} commit(s) atrás de ${pr.base.ref}; atualize a base e repita os gates.`,
              );
            }
            if (collisions.length > 0) {
              blockers.push(
                `Colisão crítica: ${collisions
                  .map((item) => `#${item.number} [${item.files.join(", ")}]`)
                  .join(" | ")}. Deixe um PR em draft, defina a ordem e reconcilie após o primeiro merge.`,
              );
            }
            if (blockers.length > 0) {
              core.setFailed(blockers.join("\n"));
            }

      - name: Verificar tipos TypeScript
        id: typecheck
        run: npm run check
        continue-on-error: true

      - name: Build completo
        id: build
        env:
          NODE_ENV: production
        run: npm run build
        continue-on-error: true

      - name: Lint
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: Validar bundle das Cloudflare Functions
        id: functions_build
        # tsc/build:client não pegam módulos Node inexistentes no runtime Workers
        # (ex.: import { randomBytes } from "crypto") — só o bundler do wrangler
        # (esbuild, sem nodejs_compat) resolve isso, e antes disso só quebrava
        # no deploy real em produção. Este passo reproduz esse bundle no PR.
        run: npx wrangler@4 pages functions build functions --outdir=/tmp/pages-functions-check
        continue-on-error: true

      - name: Validar política de acesso fail-closed
        id: access
        run: npm run validate:public && npm run audit:access && node --import tsx tests/unit/route-guard-policy.test.ts
        continue-on-error: true

      - name: Validar NeuroPed Conecta nativo
        id: conecta
        run: |
          node --import tsx tests/unit/conecta-engine.test.ts
          node tests/unit/conecta-integration-static.test.mjs
          node scripts/guards/audit-navigation-routes.mjs
        continue-on-error: true

      - name: Validar Clinical Core longitudinal
        id: clinical_core
        run: |
          node --import tsx tests/unit/clinical-core-contract.test.ts
          node tests/unit/clinical-core-integration-static.test.mjs
          node tests/unit/patient-cockpit-static.test.mjs
        continue-on-error: true

      - name: Validar Operational Suite
        id: operations
        run: |
          npm run test:operations
          node scripts/guards/audit-navigation-routes.mjs
        continue-on-error: true

      - name: Falhar se qualquer verificação crítica quebrou
        if: always()
        run: |
          if [ "${{ steps.collision_contract.outcome }}" != "success" ] || \
             [ "${{ steps.collision.outcome }}" != "success" ] || \
             [ "${{ steps.typecheck.outcome }}" != "success" ] || \
             [ "${{ steps.build.outcome }}" != "success" ] || \
             [ "${{ steps.lint.outcome }}" != "success" ] || \
             [ "${{ steps.functions_build.outcome }}" != "success" ] || \
             [ "${{ steps.conecta.outcome }}" != "success" ] || \
             [ "${{ steps.clinical_core.outcome }}" != "success" ] || \
             [ "${{ steps.operations.outcome }}" != "success" ] || \
             [ "${{ steps.access.outcome }}" != "success" ]; then
            echo "Uma ou mais verificações críticas falharam."
            exit 1
          fi

  report:
    name: PR Report
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Comentar resultado no PR
        uses: actions/github-script@v9
        with:
          script: |
            const contractStatus = '${{ needs.validate.outputs.contract_status }}' === 'success';
            const buildStatus = '${{ needs.validate.outputs.build_status }}' === 'success';
            const typecheckStatus = '${{ needs.validate.outputs.typecheck_status }}' === 'success';
            const lintStatus = '${{ needs.validate.outputs.lint_status }}' === 'success';
            const functionsBuildStatus = '${{ needs.validate.outputs.functions_build_status }}' === 'success';
            const accessStatus = '${{ needs.validate.outputs.access_status }}' === 'success';
            const conectaStatus = '${{ needs.validate.outputs.conecta_status }}' === 'success';
            const clinicalCoreStatus = '${{ needs.validate.outputs.clinical_core_status }}' === 'success';
            const operationsStatus = '${{ needs.validate.outputs.operations_status }}' === 'success';
            const collisionStatus = '${{ needs.validate.outputs.collision_status }}' === 'success';
            const ready = buildStatus && typecheckStatus && lintStatus && functionsBuildStatus && accessStatus && conectaStatus && clinicalCoreStatus && operationsStatus && collisionStatus && contractStatus;

            const prNumber = Number(
              '${{ needs.validate.outputs.pr_number || github.event.pull_request.number }}',
            );
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed("Não foi possível identificar o PR para publicar o resultado.");
              return;
            }

            const icon = (ok) => ok ? '✅' : '❌';
            const label = (ok) => ok ? 'passou' : 'falhou';

            const marker = '<!-- neuroped-pr-check -->';
            const body = `${marker}
            ## NeuroPed — Verificação de PR

            | Etapa | Status |
            |-------|--------|
            | ${icon(contractStatus)} Contrato da trava de colisões | ${label(contractStatus)} |
            | ${icon(collisionStatus)} Base atual + colisões entre PRs | ${label(collisionStatus)} |
            | ${icon(typecheckStatus)} TypeScript | ${label(typecheckStatus)} |
            | ${icon(buildStatus)} Build | ${label(buildStatus)} |
            | ${icon(lintStatus)} Lint | ${label(lintStatus)} |
            | ${icon(functionsBuildStatus)} Bundle Cloudflare Functions | ${label(functionsBuildStatus)} |
            | ${icon(accessStatus)} Acesso fail-closed | ${label(accessStatus)} |
            | ${icon(conectaStatus)} NeuroPed Conecta | ${label(conectaStatus)} |
            | ${icon(clinicalCoreStatus)} Clinical Core + Cockpit | ${label(clinicalCoreStatus)} |
            | ${icon(operationsStatus)} Agenda + Booking | ${label(operationsStatus)} |

            ${ready
              ? '> ✅ **Build bem-sucedido.** Este PR está pronto para revisão.'
              : '> ❌ **Há gates pendentes.** Corrija contrato/colisões/base, TypeScript, build, lint, bundle das Functions, acesso, Conecta, Clinical Core e Operational Suite antes de solicitar revisão.'}

            *Rodou no HEAD do PR \`${{ github.event.pull_request.head.sha }}\`*`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
