name: PR Check

on:
  pull_request:
    branches:
      - main
      - feat/auditoria-total-ui-backend-memoria

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  merge-governance:
    runs-on: ubuntu-latest
    name: Merge limpo + issues vinculadas

    steps:
      - name: Exigir PR mergeável e issue fechável
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request?.number;
            if (!pull_number) {
              core.info('Sem pull_request no contexto; nada a validar.');
              return;
            }

            let pr;
            for (let attempt = 1; attempt <= 8; attempt += 1) {
              const response = await github.rest.pulls.get({ owner, repo, pull_number });
              pr = response.data;
              core.info(`Tentativa ${attempt}: mergeable=${pr.mergeable}; mergeable_state=${pr.mergeable_state}`);
              if (pr.mergeable !== null && pr.mergeable_state !== 'unknown') break;
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }

            const blockedStates = new Set(['dirty', 'unknown']);
            if (pr.mergeable !== true || blockedStates.has(pr.mergeable_state)) {
              core.setFailed(`Merge não está limpo. Estado atual: mergeable=${pr.mergeable}, mergeable_state=${pr.mergeable_state}. Atualize a branch e resolva conflitos antes do merge.`);
              return;
            }

            const body = pr.body || '';
            const closingKeyword = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+(?:[\w.-]+\/[\w.-]+)?#(\d+)\b/gi;
            const issueNumbers = [...new Set([...body.matchAll(closingKeyword)].map((match) => Number(match[1])))];
            if (issueNumbers.length === 0) {
              core.setFailed('Inclua no corpo do PR uma palavra-chave de fechamento, como `Closes #123`, `Fixes #123` ou `Resolves #123`, para garantir fechamento automático da issue no merge.');
              return;
            }

            const invalid = [];
            for (const issue_number of issueNumbers) {
              try {
                const issue = await github.rest.issues.get({ owner, repo, issue_number });
                if (issue.data.pull_request) {
                  invalid.push(`#${issue_number} é um PR, não uma issue`);
                } else if (issue.data.state !== 'open') {
                  core.info(`#${issue_number} já está ${issue.data.state}; a referência de fechamento permanece auditável.`);
                }
              } catch (error) {
                invalid.push(`#${issue_number} não foi encontrada ou não está acessível (${error.status || error.message})`);
              }
            }

            if (invalid.length > 0) {
              core.setFailed(`Issues inválidas para fechamento automático: ${invalid.join('; ')}`);
              return;
            }

            await core.summary
              .addHeading('Governança de merge')
              .addRaw(`✅ Merge limpo confirmado: \`${pr.mergeable_state}\`.\n`)
              .addRaw(`✅ Issues vinculadas por palavra-chave de fechamento: ${issueNumbers.map((n) => `#${n}`).join(', ')}.\n`)
              .write();

  validate:
    needs: merge-governance
    runs-on: ubuntu-latest
    name: Build & Lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos TypeScript
        id: typecheck
        run: npm run check
        continue-on-error: true

      - name: Build completo
        id: build
        env:
          NODE_ENV: production
          VITE_PIN_HASH: ${{ secrets.VITE_PIN_HASH || 'placeholder_for_pr_build' }}
        run: npm run build
        continue-on-error: true

      - name: Lint (se script existir)
        id: lint
        run: |
          if npm run lint --if-present; then
            echo "lint_status=passed" >> $GITHUB_OUTPUT
          else
            echo "lint_status=failed" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Comentar resultado no PR
        uses: actions/github-script@v7
        with:
          script: |
            const buildStatus = '${{ steps.build.outcome }}' === 'success';
            const typecheckStatus = '${{ steps.typecheck.outcome }}' === 'success';
            const lintStatus = '${{ steps.lint.outputs.lint_status }}' !== 'failed';

            const icon = (ok) => ok ? '✅' : '❌';
            const label = (ok) => ok ? 'passou' : 'falhou';

            const body = `## NeuroPed — Verificação de PR

            | Etapa | Status |
            |-------|--------|
            | ${icon(typecheckStatus)} TypeScript | ${label(typecheckStatus)} |
            | ${icon(buildStatus)} Build | ${label(buildStatus)} |
            | ${icon(lintStatus)} Lint | ${label(lintStatus)} |

            ${buildStatus
              ? '> ✅ **Build bem-sucedido.** Este PR está pronto para revisão.'
              : '> ❌ **Build falhou.** Corrija os erros antes de solicitar revisão.'}

            *Rodou em commit \`${{ github.sha }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Falhar se build quebrou
        if: steps.build.outcome == 'failure'
        run: exit 1
