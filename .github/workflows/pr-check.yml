name: PR Check

on:
  pull_request:
    branches:
      - main
      - feat/auditoria-total-ui-backend-memoria

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Build & Lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos TypeScript
        id: typecheck
        run: npm run check
        continue-on-error: true

      - name: Build completo
        id: build
        env:
          NODE_ENV: production
        run: npm run build
        continue-on-error: true

      - name: Lint (se script existir)
        id: lint
        run: |
          if npm run lint --if-present; then
            echo "lint_status=passed" >> $GITHUB_OUTPUT
          else
            echo "lint_status=failed" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Comentar resultado no PR
        uses: actions/github-script@v7
        with:
          script: |
            const buildStatus = '${{ steps.build.outcome }}' === 'success';
            const typecheckStatus = '${{ steps.typecheck.outcome }}' === 'success';
            const lintStatus = '${{ steps.lint.outputs.lint_status }}' !== 'failed';

            const icon = (ok) => ok ? '✅' : '❌';
            const label = (ok) => ok ? 'passou' : 'falhou';

            const body = `## NeuroPed — Verificação de PR

            | Etapa | Status |
            |-------|--------|
            | ${icon(typecheckStatus)} TypeScript | ${label(typecheckStatus)} |
            | ${icon(buildStatus)} Build | ${label(buildStatus)} |
            | ${icon(lintStatus)} Lint | ${label(lintStatus)} |

            ${buildStatus
              ? '> ✅ **Build bem-sucedido.** Este PR está pronto para revisão.'
              : '> ❌ **Build falhou.** Corrija os erros antes de solicitar revisão.'}

            *Rodou em commit \`${{ github.sha }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Falhar se build quebrou
        if: steps.build.outcome == 'failure'
        run: exit 1
