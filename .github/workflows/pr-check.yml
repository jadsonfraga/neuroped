name: PR Check

on:
  pull_request:
    branches:
      - main
      - feat/auditoria-total-ui-backend-memoria

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  merge-governance:
    runs-on: ubuntu-latest
    name: Merge limpo + issues vinculadas

    steps:
      - name: Exigir PR mergeÃ¡vel e issue fechÃ¡vel
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request?.number;
            if (!pull_number) {
              core.info('Sem pull_request no contexto; nada a validar.');
              return;
            }

            let pr;
            for (let attempt = 1; attempt <= 8; attempt += 1) {
              const response = await github.rest.pulls.get({ owner, repo, pull_number });
              pr = response.data;
              core.info(`Tentativa ${attempt}: mergeable=${pr.mergeable}; mergeable_state=${pr.mergeable_state}`);
              if (pr.mergeable !== null && pr.mergeable_state !== 'unknown') break;
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }

            const blockedStates = new Set(['dirty', 'unknown']);
            if (pr.mergeable !== true || blockedStates.has(pr.mergeable_state)) {
              core.setFailed(`Merge nÃ£o estÃ¡ limpo. Estado atual: mergeable=${pr.mergeable}, mergeable_state=${pr.mergeable_state}. Atualize a branch e resolva conflitos antes do merge.`);
              return;
            }

            const body = pr.body || '';
            const closingKeyword = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+(?:[\w.-]+\/[\w.-]+)?#(\d+)\b/gi;
            const issueNumbers = [...new Set([...body.matchAll(closingKeyword)].map((match) => Number(match[1])))];
            if (issueNumbers.length === 0) {
              core.setFailed('Inclua no corpo do PR uma palavra-chave de fechamento, como `Closes #123`, `Fixes #123` ou `Resolves #123`, para garantir fechamento automÃ¡tico da issue no merge.');
              return;
            }

            const invalid = [];
            for (const issue_number of issueNumbers) {
              try {
                const issue = await github.rest.issues.get({ owner, repo, issue_number });
                if (issue.data.pull_request) {
                  invalid.push(`#${issue_number} Ã© um PR, nÃ£o uma issue`);
                } else if (issue.data.state !== 'open') {
                  core.info(`#${issue_number} jÃ¡ estÃ¡ ${issue.data.state}; a referÃªncia de fechamento permanece auditÃ¡vel.`);
                }
              } catch (error) {
                invalid.push(`#${issue_number} nÃ£o foi encontrada ou nÃ£o estÃ¡ acessÃ­vel (${error.status || error.message})`);
              }
            }

            if (invalid.length > 0) {
              core.setFailed(`Issues invÃ¡lidas para fechamento automÃ¡tico: ${invalid.join('; ')}`);
              return;
            }

            await core.summary
              .addHeading('GovernanÃ§a de merge')
              .addRaw(`âœ… Merge limpo confirmado: \`${pr.mergeable_state}\`.\n`)
              .addRaw(`âœ… Issues vinculadas por palavra-chave de fechamento: ${issueNumbers.map((n) => `#${n}`).join(', ')}.\n`)
              .write();

  validate:
    needs: merge-governance
    runs-on: ubuntu-latest
    name: Build, clinical guards & lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependÃªncias
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Verificar tipos TypeScript
        id: typecheck
        run: npm run check
        continue-on-error: true

      - name: Validar catÃ¡logo clÃ­nico
        id: catalog
        run: npm run validate:catalog
        continue-on-error: true

      - name: Auditar polÃ­tica de acesso
        id: access
        run: npm run audit:access
        continue-on-error: true

      - name: Auditar navegaÃ§Ã£o
        id: navigation
        run: npm run audit:navigation
        continue-on-error: true

      - name: Auditar Filtro PR260
        id: filter
        run: npm run audit:filter
        continue-on-error: true

      - name: Testes clÃ­nicos
        id: clinical
        run: npm run test:clinical
        continue-on-error: true

      - name: Auditar contrato de cores das escalas
        id: color
        run: npm run audit:color
        continue-on-error: true

      - name: Testes unitarios
        id: unit
        run: npm run test:unit
        continue-on-error: true

      - name: Build completo
        id: build
        env:
          NODE_ENV: production
          VITE_PIN_HASH: ${{ secrets.VITE_PIN_HASH || 'placeholder_for_pr_build' }}
        run: npm run build
        continue-on-error: true

      - name: Lint informativo
        id: lint
        run: |
          if npm run lint --if-present; then
            echo "lint_status=passed" >> $GITHUB_OUTPUT
          else
            echo "lint_status=failed" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Comentar resultado no PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = {
              typecheck: '${{ steps.typecheck.outcome }}' === 'success',
              catalog: '${{ steps.catalog.outcome }}' === 'success',
              access: '${{ steps.access.outcome }}' === 'success',
              navigation: '${{ steps.navigation.outcome }}' === 'success',
              filter: '${{ steps.filter.outcome }}' === 'success',
              clinical: '${{ steps.clinical.outcome }}' === 'success',
              color: '${{ steps.color.outcome }}' === 'success',
              unit: '${{ steps.unit.outcome }}' === 'success',
              build: '${{ steps.build.outcome }}' === 'success',
              lint: '${{ steps.lint.outputs.lint_status }}' !== 'failed',
            };

            const icon = (ok) => ok ? 'âœ…' : 'âŒ';
            const label = (ok) => ok ? 'passou' : 'falhou';
            const requiredOk = status.typecheck && status.catalog && status.access && status.navigation && status.filter && status.color && status.clinical && status.unit && status.build;

            const body = `## NeuroPed â€” VerificaÃ§Ã£o de PR

            | Etapa | Status |
            |-------|--------|
            | ${icon(status.typecheck)} TypeScript | ${label(status.typecheck)} |
            | ${icon(status.catalog)} CatÃ¡logo clÃ­nico | ${label(status.catalog)} |
            | ${icon(status.access)} PolÃ­tica de acesso | ${label(status.access)} |
            | ${icon(status.navigation)} NavegaÃ§Ã£o | ${label(status.navigation)} |
            | ${icon(status.filter)} Filtro PR260 | ${label(status.filter)} |
            | ${icon(status.color)} Contrato de cores | ${label(status.color)} |
            | ${icon(status.clinical)} Testes clÃ­nicos | ${label(status.clinical)} |
            | ${icon(status.unit)} Testes unitarios | ${label(status.unit)} |
            | ${icon(status.build)} Build | ${label(status.build)} |
            | ${icon(status.lint)} Lint informativo | ${label(status.lint)} |

            ${requiredOk
              ? '> âœ… **Checks obrigatÃ³rios aprovados.** Este PR estÃ¡ pronto para revisÃ£o tÃ©cnica.'
              : '> âŒ **Check obrigatÃ³rio falhou.** Corrija antes de mergear.'}

            *Rodou em commit \`${{ github.sha }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Falhar se check obrigatÃ³rio quebrou
        if: >-
          steps.typecheck.outcome == 'failure' ||
          steps.catalog.outcome == 'failure' ||
          steps.access.outcome == 'failure' ||
          steps.navigation.outcome == 'failure' ||
          steps.filter.outcome == 'failure' ||
          steps.clinical.outcome == 'failure' ||
          steps.color.outcome == 'failure' ||
          steps.unit.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        run: exit 1
