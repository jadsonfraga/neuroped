name: NeuroPed Operational Suite D1 migration

on:
  push:
    branches:
      - main
    paths:
      - "db/migrations/0007_operational_suite.sql"
      - "functions/api/operations/**"
      - "functions/api/public-booking.ts"
      - "shared/operations.ts"
      - ".github/workflows/operations-d1-migration.yml"

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-operations-d1:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar branch de produção
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Migração operacional permitida somente a partir de main."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Auditar dependências
        run: npm audit --audit-level=high

      - name: Validar contrato operacional antes da migração
        run: |
          node --import tsx tests/unit/operations-contract.test.ts
          node tests/unit/operations-integration-static.test.mjs

      - name: Validar credenciais Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID ausente"; exit 1; }

      - name: Aplicar migração 0007 da Operational Suite
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote --yes \
            --file=./db/migrations/0007_operational_suite.sql

      - name: Verificar schema operacional no D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('booking_provider_profiles','booking_services','booking_availability_rules','booking_blocks','appointments','appointment_slot_locks','waitlist_entries','appointment_reviews','notification_outbox') ORDER BY name;" \
            > /tmp/operations-tables.txt 2>&1
          cat /tmp/operations-tables.txt
          for table in \
            booking_provider_profiles \
            booking_services \
            booking_availability_rules \
            booking_blocks \
            appointments \
            appointment_slot_locks \
            waitlist_entries \
            appointment_reviews \
            notification_outbox; do
            grep -q "$table" /tmp/operations-tables.txt || {
              echo "::error::Tabela operacional ausente: $table"
              exit 1
            }
          done

          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='index' AND name IN ('ux_appointments_occupied_slot','idx_appointments_provider_time','idx_appointment_slot_locks_appointment','idx_waitlist_provider_status','idx_notification_outbox_provider_status') ORDER BY name;" \
            > /tmp/operations-indexes.txt 2>&1
          cat /tmp/operations-indexes.txt
          for idx in \
            ux_appointments_occupied_slot \
            idx_appointments_provider_time \
            idx_appointment_slot_locks_appointment \
            idx_waitlist_provider_status \
            idx_notification_outbox_provider_status; do
            grep -q "$idx" /tmp/operations-indexes.txt || {
              echo "::error::Índice operacional ausente: $idx"
              exit 1
            }
          done

          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='appointments';" \
            > /tmp/appointments-schema.txt 2>&1
          cat /tmp/appointments-schema.txt
          grep -q "guardian_name_encrypted" /tmp/appointments-schema.txt
          grep -q "booking_token_hash" /tmp/appointments-schema.txt

          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='appointment_slot_locks';" \
            > /tmp/slot-locks-schema.txt 2>&1
          cat /tmp/slot-locks-schema.txt
          grep -Eq "PRIMARY KEY[[:space:]]*\([[:space:]]*provider_user_id[[:space:]]*,[[:space:]]*slot_key[[:space:]]*\)" /tmp/slot-locks-schema.txt || {
            echo "::error::Trava física de sobreposição ausente em appointment_slot_locks"
            exit 1
          }
          echo "✅ Operational Suite D1: migração 0007, criptografia e locks temporais confirmados."
