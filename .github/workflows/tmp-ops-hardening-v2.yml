name: Temporary Operational Suite hardening v2

on:
  push:
    branches:
      - feat/operational-suite-v1
    paths:
      - ".github/workflows/tmp-ops-hardening-v2.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/operational-suite-v1
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Aplicar hardening
        run: python3 scripts/tmp_ops_hardening_v2.py

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Executar gates específicos
        run: |
          set -euo pipefail
          npm run test:operations
          npm run validate:public
          npm run audit:navigation
          npm run check
          npm run lint
          npm run build:client

      - name: Publicar somente código e testes aprovados
        run: |
          set -euo pipefail
          # O GITHUB_TOKEN deste runner não possui workflows:write. Mantemos os
          # workflows idênticos ao HEAD remoto e publicamos somente código/testes.
          git checkout -- .github/workflows/operations-d1-migration.yml
          git checkout -- .github/workflows/tmp-ops-hardening.yml || true
          git checkout -- .github/workflows/tmp-ops-hardening-v2.yml
          rm -f scripts/tmp_ops_hardening.py scripts/tmp_ops_hardening_v2.py
          git config user.name "NeuroPed CI"
          git config user.email "actions@users.noreply.github.com"
          git add shared/operations.ts db/migrations/0007_operational_suite.sql functions/api/operations/_core.ts functions/api/operations/index.ts functions/api/public-booking.ts client/src/App.tsx client/src/pages/agendar.tsx functions/api/_middleware.ts tests/unit/operations-contract.test.ts tests/unit/operations-integration-static.test.mjs scripts/tmp_ops_hardening.py scripts/tmp_ops_hardening_v2.py
          git commit -m "fix(ops): endurecer concorrência, tokens e remarcação"
          git push origin HEAD:feat/operational-suite-v1

# retry: publica sem alterar workflows pelo token do runner
