name: Temporary Operational Suite hardening v2

on:
  push:
    branches:
      - feat/operational-suite-v1
    paths:
      - ".github/workflows/tmp-ops-hardening-v2.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/operational-suite-v1
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Aplicar hardening
        run: python3 scripts/tmp_ops_hardening_v2.py

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Executar gates específicos
        run: |
          set -euo pipefail
          npm run test:operations
          npm run validate:public
          npm run audit:navigation
          npm run check
          npm run lint
          npm run build:client

      - name: Commitar somente com gates verdes
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-ops-hardening.yml .github/workflows/tmp-ops-hardening-v2.yml
          rm -f scripts/tmp_ops_hardening.py scripts/tmp_ops_hardening_v2.py
          git config user.name "NeuroPed CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(ops): endurecer concorrência, tokens e remarcação"
          git push origin HEAD:feat/operational-suite-v1
