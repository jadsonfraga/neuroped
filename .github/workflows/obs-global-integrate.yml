name: OBS-10 international showcase integration
on:
  push:
    branches: [feat/obs10-international-pilot-kit]
    paths: ['.github/workflows/obs-global-integrate.yml']
permissions:
  contents: read
jobs:
  integrate-and-prove:
    if: github.ref == 'refs/heads/feat/obs10-international-pilot-kit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/obs10-international-pilot-kit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Verify and integrate source-only editorial package
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          parts = sorted(pathlib.Path('.github/obs-global-transfer').glob('*.b64'))
          assert [p.name for p in parts] == ['000.b64','001.b64','002.b64']
          raw = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert len(raw) == 76306
          assert hashlib.sha256(raw).hexdigest() == 'f76b0602a0ae91359e37966962146452e7378fb8f2b6bb5846f498074d0b3cbd'
          files = json.loads(raw)
          allowed = {
            'scripts/obs10-global/content.mjs', 'scripts/obs10-global/render.mjs',
            'client/public/obs10-global/site.css', 'client/public/obs10-global/site.js',
            'client/public/obs10-global/icon.svg', 'tests/unit/obs10-global.test.mjs',
            'tests/e2e/obs10-global.mjs', 'docs/features/obs10-global.md',
          }
          assert isinstance(files, dict) and set(files) == allowed
          for name, content in files.items():
            p = pathlib.Path(name)
            assert not p.exists() and isinstance(content, str) and len(content.encode()) < 50000
            p.parent.mkdir(parents=True, exist_ok=True)
            p.write_text(content, encoding='utf-8')
          expected = {
            'vercel.json':'03f63080f8ad4d122031aa260bb9c935a9aa7c2a',
            'client/public/sw.js':'84a4206782647c2ced8e2a180bd1efe810dedad5',
            'client/src/pages/pre-consulta-obs10.tsx':'9d9b191fc5a21dc00bf6ce88b405c0fa9583fdb1',
          }
          for name, sha in expected.items():
            assert subprocess.check_output(['git','hash-object',name],text=True).strip() == sha, name
          p=pathlib.Path('vercel.json'); data=json.loads(p.read_text())
          assert data['rewrites'] == [{'source':'/((?!api/).*)','destination':'/index.html'}]
          data['rewrites'][0]['source']='/((?!api/|obs10-global(?:/|$)).*)'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          p=pathlib.Path('client/public/sw.js'); text=p.read_text(); anchor='  // A Nesplora é um microsite estático autônomo'
          assert text.count(anchor)==1
          text=text.replace(anchor,'  // Apresentação pública independente: nunca substituir por shell clínico/offline.\n  if (url.pathname === "/obs10-global" || url.pathname.startsWith("/obs10-global/")) return;\n\n'+anchor)
          p.write_text(text)
          p=pathlib.Path('client/src/pages/pre-consulta-obs10.tsx'); text=p.read_text(); anchor='<footer className="obs10-footer obs10-no-print">'
          assert text.count(anchor)==1 and 'const running' in text
          link='{!running && <p><a href="/obs10-global/" target="_blank" rel="noopener noreferrer">Apresentação internacional · Português / English / Español</a> · Explore fora da coleta.</p>}'
          p.write_text(text.replace(anchor,anchor+link))
          print('8 new source files + 3 exact scoped integration patches; no clinical data or backend changes.')
          PY
          node scripts/obs10-global/render.mjs
          git diff --check
          git add scripts/obs10-global client/public/obs10-global tests/unit/obs10-global.test.mjs tests/e2e/obs10-global.mjs docs/features/obs10-global.md vercel.json client/public/sw.js client/src/pages/pre-consulta-obs10.tsx
          git rm -r .github/obs-global-transfer
          git -c user.name='NeuroPed Automation' -c user.email='actions@users.noreply.github.com' commit -m 'feat(obs10): trilingual public showcase, fictional walkthrough and partner pilot kit'
          git push origin HEAD:feat/obs10-international-pilot-kit
          git rev-parse HEAD
      - run: npm ci
      - name: Determinism, public-data boundaries and types
        run: |
          node scripts/obs10-global/render.mjs --check
          node tests/unit/obs10-global.test.mjs
          node tests/unit/browser-audit-chromium-resolution.test.mjs
          npm run check
          npx eslint client/src/pages/pre-consulta-obs10.tsx --max-warnings=0
          npm run audit:design
      - name: Build existing application and static files without access bypass
        env:
          VITE_OPEN_ACCESS: 'false'
        run: npm run build:client
      - run: npx playwright install --with-deps chromium
      - name: Real static site in three languages, desktop and mobile
        env:
          OBS_GLOBAL_ARTIFACT_DIR: /tmp/obs10-global
        run: node tests/e2e/obs10-global.mjs
      - name: Preserve fictional screenshots and verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: obs10-global-verification
          path: /tmp/obs10-global
          if-no-files-found: ignore
          retention-days: 7
