name: Aplicar qualidade ideal compatível com teto absoluto

on:
  push:
    branches:
      - agent/podium-hard-cap-100-2026-07-17

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/podium-hard-cap-100-2026-07-17
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Aplicar patch
        run: node scripts/apply-ideal-cap-quality.mjs
      - name: Commitar teste
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/clinical/test-filter-ideal-choice.mjs
          git commit -m 'test: não penaliza qualidade impossível sob teto absoluto'
          git push origin HEAD:agent/podium-hard-cap-100-2026-07-17
