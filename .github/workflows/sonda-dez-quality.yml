name: Sonda Dez quality
on:
  push:
    branches: [fix/sonda-dez-quality-20260922]
permissions:
  contents: read
jobs:
  audit-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:sonda
      - name: Prepare locked dependencies for isolated review
        run: tar -czf /tmp/sonda-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: sonda-dependencies-${{ github.sha }}
          path: /tmp/sonda-dependencies.tar.gz
          retention-days: 1
          if-no-files-found: error
