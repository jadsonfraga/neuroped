name: Sonda Dez quality
on:
  push:
    branches: [fix/sonda-dez-quality-20260922]
permissions:
  contents: read
jobs:
  audit-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare tracked source for isolated review
        run: |
          mkdir -p /tmp/sonda-review
          git archive --format=tar HEAD > /tmp/sonda-review/source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: sonda-review-${{ github.sha }}
          path: /tmp/sonda-review/source.tar
          retention-days: 1
          if-no-files-found: error
