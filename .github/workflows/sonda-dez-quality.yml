name: Sonda Dez isolated quality import
on:
  push:
    branches: [fix/sonda-dez-quality-20260922]
    paths: ['scripts/sonda-quality-import.ready']
permissions:
  contents: write
jobs:
  reviewed-import:
    if: github.repository == 'jadsonfraga/neuroped' && github.ref == 'refs/heads/fix/sonda-dez-quality-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact reviewed payload and every base file before applying
        shell: python
        run: |
          import base64, gzip, hashlib, json
          from pathlib import Path
          expected = 'ae4bd6b5a50138150c175c57e4fce1b6a60035a7259081d6bbf0002a43433d84'
          assert Path('scripts/sonda-quality-import.ready').read_text().strip() == expected
          encoded = ''.join(Path(f'scripts/sonda-quality-import-{i}.b64').read_text().strip() for i in range(3))
          data = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == expected
          allowed = {'client/src/components/sonda-dez/SondaDezDailyCore.tsx','client/src/components/sonda-dez/SondaDigitalActivity.tsx','client/src/components/sonda-dez/SondaDigitalGuided.tsx','client/src/data/sondaDezDigital.ts','client/src/hooks/useSondaExitGuard.ts','client/src/lib/sondaDezQuality.ts','client/src/lib/sondaDezSession.ts','client/src/pages/testes-diretos.tsx','docs/audits/sonda-dez-quality-20260922.md','package.json','tests/e2e/sonda-dez-digital.mjs','tests/unit/sonda-dez-digital.test.ts','tests/unit/sonda-dez-quality.test.ts'}
          entries = json.loads(data)
          assert {e['path'] for e in entries} == allowed and len(entries) == len(allowed)
          results = {}
          for entry in entries:
              path = Path(entry['path'])
              assert path.is_file() if entry['base'] else not path.exists()
              text = path.read_text() if entry['base'] else ''
              if entry['base']: assert hashlib.sha256(text.encode()).hexdigest() == entry['base'], str(path)
              last = len(text)
              for start, end, replacement in sorted(entry['edits'], reverse=True):
                  assert 0 <= start <= end <= last
                  text = text[:start] + replacement + text[end:]
                  last = start
              assert hashlib.sha256(text.encode()).hexdigest() == entry['sha'], str(path)
              results[path] = text
          for path, text in results.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text)
          Path('/tmp/sonda-reviewed-paths').write_text('\n'.join(sorted(allowed)) + '\n')
      - run: npm ci
      - run: npm run test:sonda
      - run: npm run check
      - run: npx eslint client/src/hooks/useSondaExitGuard.ts client/src/lib/sondaDez*.ts client/src/pages/testes-diretos.tsx client/src/components/sonda-dez/*.tsx tests/unit/sonda-dez-quality.test.ts --max-warnings=0
      - run: npm run build:client
      - name: Commit reviewed application only, never main or generated build metadata
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/sonda-dez-quality-20260922
          while IFS= read -r path; do git add -- "$path"; done < /tmp/sonda-reviewed-paths
          git rm -- scripts/sonda-quality-import.ready scripts/sonda-quality-import-0.b64 scripts/sonda-quality-import-1.b64 scripts/sonda-quality-import-2.b64
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(sonda): reliable records, factual handoff and safer guided application (#921)'
          git push origin HEAD:refs/heads/fix/sonda-dez-quality-20260922
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:sonda
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonda-quality-browser-${{ github.sha }}
          path: /tmp/sonda-e2e/
          retention-days: 7
          if-no-files-found: warn
