name: Agent reorder daily review guards

on:
  push:
    branches:
      - agent/fix-daily-inventory-pr-permission
    paths:
      - ".github/workflows/agent-reorder-daily-review-guards.yml"

permissions:
  contents: write

jobs:
  build-tested-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v7
        with:
          ref: agent/fix-daily-inventory-pr-permission
          fetch-depth: 0

      - name: Generate and validate patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/agent/reorder-daily-review-guards.py
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/daily-authorial-inventory.yml")'
          node tests/unit/workflow-governance.test.mjs
          node tests/unit/loose-ends-regression.test.mjs
          git diff --check
          cp .github/workflows/daily-authorial-inventory.yml .github/agent/daily-authorial-inventory.yml.generated
          git checkout -- .github/workflows/daily-authorial-inventory.yml

      - name: Commit tested generated source and contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/agent/daily-authorial-inventory.yml.generated \
            tests/unit/workflow-governance.test.mjs
          git commit -m "test(ci): prioritize main idempotency before orphan branch"
          git push origin HEAD:agent/fix-daily-inventory-pr-permission
