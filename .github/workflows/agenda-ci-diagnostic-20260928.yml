name: Agenda CI browser diagnosis (local fixtures only)
on:
  push:
    branches: [diagnose/agenda-live-20260928]
    paths: [.github/workflows/agenda-ci-diagnostic-20260928.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: '998cc774043bb90002755bf47a9e973a2dfce67a'
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run build:client
        env:
          NODE_ENV: production
          VITE_AUTH_MODE: remote
          VITE_API_URL: ''
      - name: Compare pending-route and committed-route tests using only localhost synthetic fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json
          out=Path('artifacts/local-caa-diagnostic');out.mkdir(parents=True,exist_ok=True)
          p=Path('tests/e2e/live-browser-persistence-block.mjs')
          s=p.read_text()
          s=s.replace('import assert from "node:assert/strict";', 'import assert from "node:assert/strict";\nimport { mkdirSync, writeFileSync } from "node:fs";')
          # Simulate latency of the lazy family route in the existing local HTTP
          # fixture, never in production or a user's browser. All asserts stay.
          s=s.replace('        res.end(body);', '        if (/\\/assets\\/familia-/.test(pathname)) setTimeout(() => res.end(body), 1200);\n        else res.end(body);')
          target='await page.getByText("Nenhum cartão encontrado neste filtro.", { exact: true }).waitFor();'
          assert s.count(target)==2
          for label in ['after_reload','after_route_exit']:
              replacement='''console.log("CAA_STAGE_LABEL");
          await page.getByText("Nenhum cartão encontrado neste filtro.", { exact: true }).waitFor().catch(async error => {
            mkdirSync('artifacts/local-caa-diagnostic', {recursive:true});
            writeFileSync('artifacts/local-caa-diagnostic/LABEL.json', JSON.stringify(await page.evaluate(() => ({hash:location.hash,input:document.querySelector('#caa-search')?.value,syntheticCards:[...document.querySelectorAll('.np-scale-item')].filter(x=>x.textContent.includes('Mensagem sintética CAA E2E')).length,headings:[...document.querySelectorAll('h1')].map(x=>x.textContent)}))));
            throw error;
          });'''.replace('LABEL',label)
              s=s.replace(target,replacement,1)
          s=s.replace('error.message);','error.stack);')
          p.write_text(s)
          original=subprocess.run(['node',str(p)],capture_output=True,text=True,timeout=100)
          (out/'original.log').write_text(original.stdout+original.stderr)
          anchor='await page.getByRole("heading", { name: "Vou Falar!", exact: true }).waitFor({ state: "hidden" });'
          assert s.count(anchor)==1
          s=s.replace(anchor, anchor+'\n  await page.getByRole("heading", { name: "Bem-vindo(a) ao NeuroPed", exact: true }).waitFor();\n  await page.getByRole("heading", { name: "Vou Falar!", exact: true }).waitFor({ state: "detached" });')
          p.write_text(s)
          outcomes=[]
          for n in range(2):
              fixed=subprocess.run(['node',str(p)],capture_output=True,text=True,timeout=100)
              (out/f'committed-route-{n}.log').write_text(fixed.stdout+fixed.stderr)
              outcomes.append(fixed.returncode)
          report={'sourceCommit':'998cc774043bb90002755bf47a9e973a2dfce67a','syntheticLocalServerOnly':True,'familyChunkDelayMs':1200,'originalExitCode':original.returncode,'committedRouteExitCodes':outcomes,'applicationCodeChanged':False,'assertionsRemoved':False}
          (out/'comparison.json').write_text(json.dumps(report,indent=2)); print(json.dumps(report))
          if any(outcomes): raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-caa-diagnostic-${{ github.run_id }}
          path: artifacts/local-caa-diagnostic/
          retention-days: 3
          if-no-files-found: error
