name: Purge retired ICP Pages secrets

on:
  push:
    branches:
      - security/purge-retired-icp-pages-secrets

permissions:
  contents: read

jobs:
  purge-retired-icp-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Listar e remover apenas secrets ICP aposentados
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          before="$(mktemp)"
          after="$(mktemp)"

          npx wrangler@4 pages secret list --project-name neuroped > "$before"

          purge_if_present() {
            key="$1"
            if grep -Fq "$key" "$before"; then
              echo "Removendo secret aposentado: $key"
              printf 'y\n' | npx wrangler@4 pages secret delete "$key" --project-name neuroped >/dev/null
            else
              echo "Secret aposentado já ausente: $key"
            fi
          }

          purge_if_present CERT_P12_B64
          purge_if_present CERT_P12_PASSWORD

          npx wrangler@4 pages secret list --project-name neuroped > "$after"
          if grep -Eq 'CERT_P12_B64|CERT_P12_PASSWORD' "$after"; then
            echo "::error::Secret ICP aposentado ainda presente no Cloudflare Pages."
            exit 1
          fi

          echo "✓ Secrets ICP aposentados ausentes do Cloudflare Pages."
