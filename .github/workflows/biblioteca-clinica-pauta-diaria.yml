name: Biblioteca Clínica — pauta editorial diária

on:
  schedule:
    # 08:00 em Petrolina/Recife (UTC-3), sem horário de verão.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: biblioteca-clinica-pauta-diaria
  cancel-in-progress: false

jobs:
  pauta:
    runs-on: ubuntu-latest
    steps:
      - name: Propor tópico com revisão humana obrigatória
        uses: actions/github-script@v7
        with:
          script: |
            // Rotação determinística de pautas. Não sintetiza nem publica conteúdo
            // clínico automaticamente; somente cria uma solicitação editorial.
            const topics = [
              "TDAH: avaliação diagnóstica sem atalhos",
              "TEA: comunicação social, repetição e diferenciais",
              "Dislexia: da suspeita escolar à investigação",
              "Transtorno do desenvolvimento da linguagem",
              "Epilepsia: distinguir crises de eventos paroxísticos",
              "Altas habilidades e dupla excepcionalidade",
              "Deficiência intelectual e comportamento adaptativo",
              "Sono infantil e impacto sobre o neurodesenvolvimento",
              "Funções executivas: conceito, testes e limites",
              "EEG em neuropediatria: quando solicitar e como interpretar",
            ];
            const iso = new Date().toISOString().slice(0, 10);
            const start = Date.parse("2026-10-29T00:00:00Z");
            const offset = Math.max(0, Math.floor((Date.parse(iso + "T00:00:00Z") - start) / 86400000));
            const topic = topics[offset % topics.length];
            const title = `[Biblioteca Clínica][${iso}] Pauta: ${topic}`;
            const q = `repo:${context.repo.owner}/${context.repo.repo} in:title "${title}"`;
            const search = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
            if (search.data.items.some(item => item.title === title)) {
              core.info("Pauta da data já existe, sem duplicar.");
              return;
            }
            const body = [
              "## Rascunho editorial — não publicar automaticamente",
              `Tema: **${topic}**`,
              `Data da pauta: **${iso}**`,
              "",
              "### Exigências para elaborar o capítulo",
              "- [ ] Pesquisa científica rastreável, distinguindo fonte consultada de fonte indisponível; Consensus apenas quando executado com sucesso.",
              "- [ ] Síntese por pergunta clínica, conceitos essenciais e armadilhas.",
              "- [ ] Diagramas autorais, mapa mental responsivo e casos 100% fictícios.",
              "- [ ] Referências com DOI/URL e limites dos estudos; não inventar resultados.",
              "- [ ] Texto didático em português brasileiro e QA de acessibilidade.",
              "- [ ] Revisão clínica e aceite explícito do médico autor.",
              "- [ ] PR pequeno, testes verdes, merge e deploy só após os gates.",
              "",
              "**Regra:** gerar uma pauta por dia não equivale a um capítulo publicado por dia. Nenhum conteúdo clínico é promovido sem revisão humana.",
            ].join("\n");
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
