name: Temporary state safety fix

on:
  push:
    branches:
      - fix/conecta-recepcao-state-safety

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/conecta-recepcao-state-safety
          fetch-depth: 0

      - name: Aplicar correções e regressões
        run: |
          python3 - <<'PY'
          from pathlib import Path

          conecta_path = Path('client/src/pages/conecta.tsx')
          conecta = conecta_path.read_text()
          anchor = '''  useEffect(() => {
            setBackendMode(remoteSession ? "remote" : "local");
          }, [remoteSession]);

          useEffect(() => {
            let cancelled = false;
'''
          replacement = '''  useEffect(() => {
            setBackendMode(remoteSession ? "remote" : "local");
          }, [remoteSession]);

          useEffect(() => {
            // Estado transitório é estritamente escopado ao paciente e ao modo de acesso.
            // Ao trocar de criança/sessão, nunca mantenha contagem, confirmação ou insight anterior.
            setEvents([]);
            setSavedEvent(null);
            setSelectedInsight(null);
            setRegisterOpen(false);
            setTimelineFilter("all");
            setStorageError(null);
          }, [patientId, remoteSession]);

          useEffect(() => {
            let cancelled = false;
'''
          if anchor not in conecta:
              raise SystemExit('anchor Conecta não encontrado')
          conecta_path.write_text(conecta.replace(anchor, replacement, 1))

          recepcao_path = Path('client/src/pages/recepcao.tsx')
          recepcao = recepcao_path.read_text()
          old = '''  async function updateStatus(record: PreConsultaRecord, status: PreConsultaStatus) {
            const updated = items.map((item) => item.id === record.id ? { ...item, status } : item);
            setStorageError("");
            setItems(updated);
            const stored = await savePreConsultas(updated);
            if (!stored) {
              setStorageError("Não foi possível salvar a mudança de status neste dispositivo. Verifique o espaço ou as permissões de armazenamento e tente novamente.");
              return;
            }
            setSelected((current) => current?.id === record.id ? { ...record, status } : current);
          }
'''
          new = '''  async function updateStatus(record: PreConsultaRecord, status: PreConsultaStatus) {
            const updated = items.map((item) => item.id === record.id ? { ...item, status } : item);
            setStorageError("");
            const stored = await savePreConsultas(updated);
            if (!stored) {
              setStorageError("Não foi possível salvar a mudança de status neste dispositivo. Verifique o espaço ou as permissões de armazenamento e tente novamente.");
              return;
            }
            // Só publica o novo status na UI depois de a persistência confirmar sucesso.
            setItems(updated);
            setSelected((current) => current?.id === record.id ? { ...record, status } : current);
          }
'''
          if old not in recepcao:
              raise SystemExit('anchor Recepção não encontrado')
          recepcao_path.write_text(recepcao.replace(old, new, 1))

          test_path = Path('tests/unit/conecta-integration-static.test.mjs')
          test = test_path.read_text()
          test_anchor = '''assert.match(page, /persistentSecure(Get|Set)/, "modo local deve usar armazenamento persistente cifrado");
'''
          test_insert = '''assert.match(page, /persistentSecure(Get|Set)/, "modo local deve usar armazenamento persistente cifrado");
assert.match(
  page,
  /setEvents\(\[\]\);[\s\S]{0,260}setSavedEvent\(null\);[\s\S]{0,180}setSelectedInsight\(null\);[\s\S]{0,180}setRegisterOpen\(false\);[\s\S]{0,220}\[patientId, remoteSession\]/,
  "troca de paciente ou sessão deve limpar todo estado transitório antes de recarregar a jornada",
);
'''
          if test_anchor not in test:
              raise SystemExit('anchor teste Conecta não encontrado')
          test_path.write_text(test.replace(test_anchor, test_insert, 1))

          quick_path = Path('tests/unit/quick-wins-static.test.mjs')
          quick = quick_path.read_text()
          quick_anchor = '''const report = read("client/src/components/ClinicalReport.tsx");
'''
          quick_insert = '''const recepcao = read("client/src/pages/recepcao.tsx");
assert.match(
  recepcao,
  /const stored = await savePreConsultas\(updated\);[\s\S]{0,360}if \(!stored\)[\s\S]{0,360}setItems\(updated\);/,
  "recepção só pode refletir status depois de persistência bem-sucedida",
);
assert.doesNotMatch(
  recepcao,
  /setItems\(updated\);[\s\S]{0,180}const stored = await savePreConsultas\(updated\);/,
  "falha de persistência não pode deixar status fantasma na recepção",
);

const report = read("client/src/components/ClinicalReport.tsx");
'''
          if quick_anchor not in quick:
              raise SystemExit('anchor quick-wins não encontrado')
          quick_path.write_text(quick.replace(quick_anchor, quick_insert, 1))
          PY

          rm .github/workflows/tmp-state-safety-fix.yml
          git config user.name "NeuroPed CI"
          git config user.email "actions@users.noreply.github.com"
          git add client/src/pages/conecta.tsx client/src/pages/recepcao.tsx tests/unit/conecta-integration-static.test.mjs tests/unit/quick-wins-static.test.mjs .github/workflows/tmp-state-safety-fix.yml
          git commit -m "fix: isolar estado por paciente e tornar recepção atômica"
          git push origin HEAD:fix/conecta-recepcao-state-safety
