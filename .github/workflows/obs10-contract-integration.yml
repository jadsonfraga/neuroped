name: OBS-10 targeted contract integration
on:
  push:
    branches: [feat/obs10-preconsulta-faixa-etaria]
    paths: ['.github/workflows/obs10-contract-integration.yml']
permissions:
  contents: read
jobs:
  apply-scoped-diff:
    if: github.ref == 'refs/heads/feat/obs10-preconsulta-faixa-etaria'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/obs10-preconsulta-faixa-etaria
      - name: Align independent contract and consume existing design tokens
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const testPath = 'tests/unit/route-guard-policy.test.ts';
          let test = readFileSync(testPath, 'utf8');
          const anchor = '(path === "/recepcao" || path === "/testes-diretos") && userRole === "operator"';
          if (test.split(anchor).length !== 2) throw new Error('Operator expectation anchor changed; review required');
          test = test.replace(anchor, '(path === "/recepcao" || path === "/testes-diretos" || path === "/avaliacao-pre-consulta-faixa-etaria") && userRole === "operator"');
          const sensitive = 'const REQUIRED_SENSITIVE_ROUTES = [';
          if (test.split(sensitive).length !== 2) throw new Error('Sensitive inventory anchor changed');
          test = test.replace(sensitive, sensitive + '\n  "/avaliacao-pre-consulta-faixa-etaria",');
          test += '\n// OBS-10 is an exact operator exception, never a public or descendant route.\nfor (const path of ["/avaliacao-pre-consulta-faixa-etaria/interno", "/avaliacao-pre-consulta-faixa-etaria-extra"]) {\n  assert.equal(decideRouteAccess({ path, accessMode: "remote", isAuthenticated: true, isLoading: false, userRole: "operator" }), "forbidden");\n}\n';
          writeFileSync(testPath, test);
          const cssPath = 'client/src/features/obs10/obs10.css';
          let css = readFileSync(cssPath, 'utf8');
          const start = css.indexOf('.obs10{--o-ink:');
          const end = css.indexOf(';color:var(--o-ink)', start);
          if (start < 0 || end < 0) throw new Error('OBS-10 token declaration anchor missing');
          const tokens = '.obs10{--o-ink:hsl(var(--foreground));--o-muted:hsl(var(--muted-foreground));--o-paper:hsl(var(--card));--o-bg:hsl(var(--background));--o-line:hsl(var(--border));--o-lilac:color-mix(in srgb,hsl(var(--chart-2)) 11%,hsl(var(--card)));--o-mint:hsl(var(--secondary));--o-primary:hsl(var(--primary));--o-cream:color-mix(in srgb,hsl(var(--chart-4)) 14%,hsl(var(--card)));--o-danger:hsl(var(--destructive));--o-danger-bg:color-mix(in srgb,hsl(var(--destructive)) 6%,hsl(var(--card)))';
          css = css.slice(0, start) + tokens + css.slice(end);
          css = css.replace(/\.dark \.obs10,\[data-theme="dark"\] \.obs10\{[^}]+\}/, '.dark .obs10,[data-theme="dark"] .obs10{--o-danger:color-mix(in srgb,hsl(var(--destructive)) 60%,hsl(var(--foreground)));--o-lilac:color-mix(in srgb,hsl(var(--chart-2)) 18%,hsl(var(--card)));--o-danger-bg:color-mix(in srgb,hsl(var(--destructive)) 12%,hsl(var(--card)))}');
          const replacements = {
            '#242c4220': 'hsl(var(--foreground)/.12)',
            '#28314b0a': 'hsl(var(--foreground)/.04)',
            '#342a6010': 'hsl(var(--foreground)/.06)',
            '#28314b06': 'hsl(var(--foreground)/.025)',
            '#29304816': 'hsl(var(--foreground)/.09)',
            '#202232': 'hsl(var(--primary-foreground))',
            '#101625': 'hsl(var(--foreground))',
            '#0005': 'hsl(var(--foreground)/.33)',
            '#111': 'CanvasText',
            '#fff': 'Canvas',
          };
          for (const [from, to] of Object.entries(replacements)) css = css.replaceAll(from, to);
          css = css.replace('/* Scoped visual system: no global overrides, external fonts, trackers or motion dependency. */', '/* Scoped visual system built from the existing NeuroPed semantic tokens. No global overrides or external assets. */');
          if (/#[0-9a-fA-F]{3,8}\b/.test(css)) throw new Error('An unreviewed raw color remains');
          writeFileSync(cssPath, css);
          console.log('Exact operator exception plus descendant-denial tests; shared color tokens. No baseline or guard was weakened.');
          NODE
          git diff --check
          git add tests/unit/route-guard-policy.test.ts client/src/features/obs10/obs10.css
          git -c user.name='NeuroPed Automation' -c user.email='actions@users.noreply.github.com' commit -m 'fix(obs10): align exact operator permission tests and shared design tokens'
          git push origin HEAD:feat/obs10-preconsulta-faixa-etaria
