name: Aplicar catraca dura do pódio

on:
  push:
    branches:
      - agent/podium-hard-cap-100-2026-07-17

permissions:
  contents: write

concurrency:
  group: podium-hard-cap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/podium-hard-cap-100-2026-07-17
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Aplicar catraca dura
        run: node scripts/apply-podium-hard-cap.mjs
      - name: Commitar implementação
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/data/filterPodium.ts tests/clinical/test-filter-podium.mjs
          git commit -m 'fix: torna absoluto o limite de 100 perguntas do pódio'
          git push origin HEAD:agent/podium-hard-cap-100-2026-07-17
