name: Notification email delivery D1

on:
  pull_request:
    branches: [main]
    paths:
      - "db/migrations/0031_notification_email_delivery.sql"
      - "functions/api/operations/_notificationDelivery.ts"
      - "tests/unit/operations-notification-email.test.ts"
      - ".github/workflows/notification-email-d1.yml"
  push:
    branches: [main]
    paths:
      - "db/migrations/0031_notification_email_delivery.sql"
      - "functions/api/operations/_notificationDelivery.ts"
      - "tests/unit/operations-notification-email.test.ts"
      - ".github/workflows/notification-email-d1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Inclui a ref: execução de pull_request (só valida) não pode ocupar o
  # único slot pendente e cancelar a migração pendente do main.
  group: d1-notification-email-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-notification-email:
    name: Validate notification email delivery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false
      - name: Envio por e-mail da caixa de saída — enviado, falha e não configurado
        run: node --import tsx tests/unit/operations-notification-email.test.ts
      - name: Bootstrap do schema com todas as migrações
        run: node tests/unit/schema-bootstrap-contract.test.mjs
      - name: TypeScript
        run: npm run check

  migrate-notification-email:
    name: Apply notification email delivery to D1
    needs: validate-notification-email
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55 # inclui até 45 min de espera na fila D1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID ausente"; exit 1; }
      # Fila das escritas D1 sem pending slot: ver scripts/ci/wait-d1-writers.mjs.
      - name: Aguardar fila de escritas D1 (migration)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: migration
        run: node scripts/ci/wait-d1-writers.mjs

      - name: Preflight — verificar se a 0031 já está aplicada
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT COUNT(*) AS colunas FROM pragma_table_info('notification_outbox') WHERE name IN ('attempts', 'last_attempt_at', 'last_error');" \
            > /tmp/notification-email-preflight.txt 2>&1
          cat /tmp/notification-email-preflight.txt
          if grep -qE '(colunas[^0-9]*3[^0-9]|"colunas":\s*3)' /tmp/notification-email-preflight.txt; then
            echo "aplicada=true" >> "$GITHUB_OUTPUT"
            echo "0031 já aplicada."
          elif grep -qE '(colunas[^0-9]*0[^0-9]|"colunas":\s*0)' /tmp/notification-email-preflight.txt; then
            echo "aplicada=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::0031 parcialmente aplicada ou preflight ilegível; intervenção manual necessária."
            exit 1
          fi
      - name: Apply migration 0031
        if: steps.preflight.outputs.aplicada == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote --yes \
            --file=./db/migrations/0031_notification_email_delivery.sql
      - name: Verify column shape without reading clinic data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT COUNT(*) AS colunas FROM pragma_table_info('notification_outbox') WHERE name IN ('attempts', 'last_attempt_at', 'last_error');" \
            > /tmp/notification-email-verify.txt 2>&1
          cat /tmp/notification-email-verify.txt
          if ! grep -qE '(colunas[^0-9]*3[^0-9]|"colunas":\s*3)' /tmp/notification-email-verify.txt; then
            echo "::error::notification_outbox sem as três colunas esperadas após a 0031."
            exit 1
          fi
          echo "0031 verificada: notification_outbox com attempts, last_attempt_at e last_error."
