name: One-shot metadata honesty

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-metadata-honesty.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v7
        with:
          ref: agent/scales-lovable-quality-deep
          fetch-depth: 0

      - name: Make metadata-only label strictly honest
        run: |
          python - <<'PY'
          from pathlib import Path

          engine_path = Path("client/src/data/advancedFilterLogic.ts")
          engine = engine_path.read_text(encoding="utf-8")
          old = 'return "Ficha técnica e registro observacional complementar disponíveis; itens oficiais podem depender de autorização.";'
          new = 'return "Ficha técnica disponível; itens oficiais, aplicação e escore podem depender de autorização.";'
          if old in engine:
              engine = engine.replace(old, new, 1)
              engine_path.write_text(engine, encoding="utf-8")
          elif new not in engine:
              raise SystemExit("rótulo metadata_only não encontrado")

          audit_path = Path("scripts/guards/audit-scale-experience.mjs")
          audit = audit_path.read_text(encoding="utf-8")
          old_check = '''check(
            !/PIN master/i.test(advancedFilter) &&
              advancedFilter.includes("registro observacional complementar"),
            "motor compartilhado reintroduziu cópia de PIN ou perdeu a descrição aberta do registro complementar",
          );'''
          new_check = '''check(
            !/PIN master/i.test(advancedFilter) &&
              advancedFilter.includes(
                "Ficha técnica disponível; itens oficiais, aplicação e escore podem depender de autorização.",
              ) &&
              !advancedFilter.includes(
                "Ficha técnica e registro observacional complementar disponíveis",
              ),
            "motor compartilhado reintroduziu PIN ou prometeu recurso inexistente em fichas de metadados",
          );'''
          if old_check in audit:
              audit = audit.replace(old_check, new_check, 1)
              audit_path.write_text(audit, encoding="utf-8")
          elif new_check not in audit:
              raise SystemExit("check metadata_only não encontrado")
          PY

      - name: Commit correction
        run: |
          if git diff --quiet; then
            echo "Migração já aplicada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/data/advancedFilterLogic.ts scripts/guards/audit-scale-experience.mjs
          git commit -m "fix(escalas): tornar rótulo de ficha estritamente honesto"
          git push origin HEAD:agent/scales-lovable-quality-deep
