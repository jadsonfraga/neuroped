name: Agenda provisioning reconciliation (read-only)
on:
  push:
    branches: [diagnose/agenda-live-20260928]
    paths: [.github/workflows/agenda-apply-reconcile-20260928.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify actual persisted configuration without API impersonation or clinical rows
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          RESERVED_E2E_EMAIL: ${{ secrets.NEUROPED_E2E_EMAIL }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync,mkdirSync,writeFileSync} from 'node:fs';
          const report={run:process.env.GITHUB_RUN_ID,checkedAt:new Date().toISOString(),readOnly:true,
            provisioningCommit:'b97ebcfcada5e68caa256a912a52822bb6e4b1c3',provisioningRun:'36452196137',
            authenticatedAgendaRoundtripVerified:false};
          const database=/database_id\s*=\s*"([a-f0-9-]+)"/.exec(readFileSync('wrangler.toml','utf8'))?.[1];
          const account=process.env.CF_ACCOUNT, token=process.env.CF_TOKEN;
          let stage='configuration';
          async function cf(path,body) {
            const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}${path}`,{
              method:body?'POST':'GET',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
              body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(25000)});
            const data=await r.json().catch(()=>null);
            assert.ok(r.ok && data?.success===true,'PROVIDER_READ_FAILED');
            return data.result;
          }
          async function q(sql,params=[]) {
            assert.ok(/^SELECT\s/i.test(sql)&&!sql.includes(';'),'READ_ONLY_REQUIRED');
            const result=await cf(`/d1/database/${database}/query`,{sql,params});
            assert.ok(result?.length===1 && result[0].success===true,'READ_RESULT_INVALID');
            return result[0].results;
          }
          try {
            assert.equal(process.env.GITHUB_REPOSITORY,'jadsonfraga/neuroped');
            assert.ok(database&&account&&token&&process.env.OWNER_EMAIL&&process.env.RESERVED_E2E_EMAIL);
            const project=await cf('/pages/projects/neuroped');
            assert.equal(project.deployment_configs.production.d1_databases.DB.id,database,'BINDING_MISMATCH');
            report.canonicalBindingVerified=true;
            stage='owner_lookup';
            const ownerEmail=process.env.OWNER_EMAIL.trim().toLowerCase();
            const e2eEmail=process.env.RESERVED_E2E_EMAIL.trim().toLowerCase();
            assert.notEqual(ownerEmail,e2eEmail);
            const users=await q('SELECT id,role,is_active FROM users WHERE lower(email)=?',[ownerEmail]);
            assert.equal(users.length,1);assert.equal(users[0].role,'admin');assert.equal(users[0].is_active,1);
            const uid=users[0].id;
            const suffix=createHash('sha256').update(`neuroped:institutional:${uid}`).digest('hex').slice(0,24);
            const cid=`institutional-${suffix}`,aid=`institutional-agenda-v1-${suffix}`;
            stage='persisted_postconditions';
            const counts=(await q(`SELECT
              (SELECT COUNT(*) FROM clinics WHERE id=? AND created_by_user_id=? AND status='active' AND name='NeuroPed SDG' AND timezone='America/Recife') AS institutional_clinics,
              (SELECT COUNT(*) FROM clinic_memberships WHERE user_id=? AND active=1) AS active_owner_memberships,
              (SELECT COUNT(*) FROM clinic_memberships WHERE user_id=? AND clinic_id=? AND role='owner' AND active=1) AS exact_owner_memberships,
              (SELECT COUNT(*) FROM billing_customers WHERE clinic_id=?) AS clinic_customers,
              (SELECT COUNT(*) FROM billing_customers WHERE clinic_id=? AND provider='none' AND status='active' AND provider_customer_id IS NULL AND trial_ends_at IS NULL) AS internal_nonbillable_customers,
              (SELECT COUNT(*) FROM billing_subscriptions bs JOIN billing_customers bc ON bc.id=bs.customer_id WHERE bc.clinic_id=?) AS retained_subscriptions,
              (SELECT COUNT(*) FROM saas_audit_log WHERE id=? AND clinic_id=? AND actor_user_id=? AND action='institutional_internal_access_granted' AND json_extract(metadata_json,'$.version')=2) AS exact_setup_receipts,
              (SELECT COUNT(*) FROM tenant_lifecycle WHERE clinic_id=?) AS lifecycle_records`,
              [cid,uid,uid,uid,cid,cid,cid,cid,aid,cid,uid,cid]))[0];
            const expected={institutional_clinics:1,active_owner_memberships:1,exact_owner_memberships:1,
              clinic_customers:1,internal_nonbillable_customers:1,retained_subscriptions:0,exact_setup_receipts:1,lifecycle_records:1};
            assert.deepEqual(counts,expected,'PERSISTED_CONFIGURATION_NOT_PROVEN');
            report.persisted=counts;
            stage='reserved_account';
            const reserved=await q(`SELECT u.role,u.is_active,
              (SELECT COUNT(*) FROM clinic_memberships cm WHERE cm.user_id=u.id AND cm.active=1) AS active_memberships
              FROM users u WHERE lower(u.email)=?`,[e2eEmail]);
            assert.equal(reserved.length,1);assert.equal(reserved[0].role,'reader');assert.equal(reserved[0].active_memberships,0);
            report.reservedE2ERemainsReaderWithoutMembership=true;
            report.status='persisted_configuration_verified';
            stage='public_release_metadata';
            report.published={};
            for(const [label,origin] of [['cloudflare','https://neuroped.pages.dev'],['vercel','https://superneuroped.vercel.app']]) {
              try {
                const r=await fetch(`${origin}/deploy-check.json?agenda-readback=${process.env.GITHUB_RUN_ID}`,{cache:'no-store',signal:AbortSignal.timeout(15000)});
                const value=await r.json();
                report.published[label]={httpStatus:r.status,commit:/^[a-f0-9]{40}$/.test(value.commit||'')?value.commit:null,
                  runId:/^\d+$/.test(String(value.run_id||''))?String(value.run_id):null};
              } catch {report.published[label]={readSucceeded:false};}
            }
          } catch(error) {
            report.status='blocked';report.failedStage=stage;
            report.code=/^[A-Z0-9_]{1,90}$/.test(error?.message||'')?error.message:'POSTCONDITION_ASSERTION_FAILED';
            process.exitCode=1;
          } finally {
            report.finishedAt=new Date().toISOString();
            mkdirSync('artifacts/agenda-reconcile',{recursive:true});
            writeFileSync('artifacts/agenda-reconcile/receipt.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agenda-reconcile-${{ github.run_id }}
          path: artifacts/agenda-reconcile/receipt.json
          retention-days: 7
          if-no-files-found: error
