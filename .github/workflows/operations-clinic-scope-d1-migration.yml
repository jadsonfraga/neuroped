name: NeuroPed Operations Clinic Scope D1 migration

on:
  push:
    branches:
      - main
    paths:
      - "db/migrations/0029_operations_clinic_scope.sql"
      - "functions/api/operations/**"
      - "functions/api/public-booking.ts"
      - "tests/unit/operations-tenant-isolation.test.ts"
      - "tests/unit/operations-clinic-scope-rerunnable.test.mjs"
      - ".github/workflows/operations-clinic-scope-d1-migration.yml"

# Grupo próprio por workflow: migração D1 não disputa o único slot pendente
# do deploy Cloudflare. A ordem entre escritas D1 é garantida pela fila em
# scripts/ci/wait-d1-writers.mjs.
concurrency:
  group: d1-migration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  migrate-operations-clinic-scope-d1:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar branch de produção
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Migração de escopo de clínica na agenda permitida somente a partir de main."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Auditar dependências
        run: node scripts/guards/audit-high-critical.mjs

      - name: Validar isolamento de tenant da agenda antes da migração
        run: node --import tsx tests/unit/operations-tenant-isolation.test.ts

      - name: Validar que a 0029 é reexecutável antes de tocar o D1
        run: node tests/unit/operations-clinic-scope-rerunnable.test.mjs

      - name: Validar credenciais Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID ausente"; exit 1; }

      # Fila das escritas D1 sem pending slot: ver scripts/ci/wait-d1-writers.mjs.
      - name: Aguardar fila de escritas D1 (migration)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: migration
        run: node scripts/ci/wait-d1-writers.mjs

      # SQLite/D1 não tem ADD COLUMN IF NOT EXISTS: aplicar o arquivo inteiro de
      # novo falhava com "duplicate column name: clinic_id" (produção já tem a
      # coluna desde 26/09). Mesmo padrão reexecutável do hardening 0013 em
      # saas-billing-d1-migration.yml: cada ALTER só roda se pragma_table_info
      # não mostrar a coluna; o restante do arquivo (backfill guardado por
      # WHERE clinic_id IS NULL + CREATE INDEX IF NOT EXISTS) é aplicado a partir
      # do marcador "-- Backfill: clinic_id". Banco novo termina com o mesmo schema.
      - name: Aplicar migração 0029 de forma reexecutável (clinic_id na agenda/operações)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          column_exists() {
            table="$1"
            column="$2"
            npx wrangler@4 d1 execute neuroped-db --remote \
              --command "SELECT name FROM pragma_table_info('$table') WHERE name='$column';" \
              2>&1 | grep -q "$column"
          }

          add_column() {
            table="$1"
            column="$2"
            definition="$3"
            if column_exists "$table" "$column"; then
              echo "✓ $table.$column já existe"
            else
              npx wrangler@4 d1 execute neuroped-db --remote --yes \
                --command "ALTER TABLE $table ADD COLUMN $column $definition;"
            fi
            column_exists "$table" "$column" || {
              echo "::error::Falha ao garantir $table.$column"
              exit 1
            }
          }

          add_column booking_services clinic_id "TEXT"
          add_column booking_availability_rules clinic_id "TEXT"
          add_column booking_blocks clinic_id "TEXT"
          add_column appointments clinic_id "TEXT"
          add_column waitlist_entries clinic_id "TEXT"
          add_column appointment_reviews clinic_id "TEXT"
          add_column notification_outbox clinic_id "TEXT"
          add_column operations_audit_log clinic_id "TEXT"

          awk 'BEGIN {emit=0} /^-- Backfill: clinic_id/ {emit=1} emit {print}' \
            db/migrations/0029_operations_clinic_scope.sql > /tmp/0029-post-alter.sql
          test -s /tmp/0029-post-alter.sql
          if grep -qi "ALTER TABLE" /tmp/0029-post-alter.sql; then
            echo "::error::0029 pós-ALTER contém ALTER TABLE; não é reexecutável"
            exit 1
          fi
          npx wrangler@4 d1 execute neuroped-db --remote --yes --file=/tmp/0029-post-alter.sql

      - name: Verificar coluna clinic_id e reportar backfill pendente
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for table in \
            booking_services booking_availability_rules booking_blocks appointments \
            waitlist_entries appointment_reviews notification_outbox operations_audit_log; do
            npx wrangler@4 d1 execute neuroped-db --remote \
              --command "SELECT name FROM pragma_table_info('$table');" > /tmp/cols-$table.txt 2>&1
            cat /tmp/cols-$table.txt
            grep -q "clinic_id" /tmp/cols-$table.txt || {
              echo "::error::Coluna clinic_id ausente em $table após a migração 0029"
              exit 1
            }
          done

          # Visível no log, não bloqueia o deploy: linhas com clinic_id NULL
          # precisam de atribuição manual auditada (owner com 0 ou 2+
          # memberships ativas no momento do backfill) — nunca heurística
          # automática. Ver docs/audits/SAAS_TENANCY_AUDIT_2026-09-26.md (OPS-01).
          # A contagem sai no log e como anotação (legíveis pela API/CLI), não
          # só no resumo do job. Só números agregados; nenhuma linha de paciente.
          {
            echo "### Linhas ainda sem clinic_id (atribuição manual auditada pendente)"
            echo ""
            echo "| Tabela | Sem clinic_id |"
            echo "| --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
          total=0
          for table in \
            booking_services booking_availability_rules booking_blocks appointments \
            waitlist_entries appointment_reviews notification_outbox operations_audit_log; do
            if npx wrangler@4 d1 execute neuroped-db --remote --json \
                 --command "SELECT COUNT(*) AS sem_clinica FROM $table WHERE clinic_id IS NULL;" \
                 > /tmp/null-$table.json 2>/tmp/null-$table.err \
               && count=$(jq -er '.[0].results[0].sem_clinica' /tmp/null-$table.json); then
              total=$((total + count))
            else
              count="erro na consulta"
              cat /tmp/null-$table.err || true
            fi
            echo "sem clinic_id: $table = $count"
            echo "| $table | $count |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "sem clinic_id: total = $total"
          echo "| **total** | **$total** |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$total" -gt 0 ]; then
            echo "::warning::$total linha(s) da agenda sem clinic_id aguardam atribuição manual auditada (OPS-01)."
          fi

          echo "✅ Operations Clinic Scope D1: clinic_id presente nas 8 tabelas da agenda; backfill pendente reportado no log e no resumo do job."
