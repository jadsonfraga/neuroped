name: Temporary dependency lock refresh

on:
  push:
    branches:
      - fix/dependency-audit-20260901

permissions:
  contents: write

concurrency:
  group: dependency-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Configure Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Refresh vulnerable transitive dependencies
        run: npm audit fix --package-lock-only

      - name: Reinstall exactly from refreshed lockfile
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Prove high-severity audit is clean
        run: npm audit --audit-level=high

      - name: Commit lockfile update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária no lockfile."
            exit 0
          fi
          git commit -m "fix(deps): atualizar dependências vulneráveis do build"
          git push origin HEAD:fix/dependency-audit-20260901
