name: Agent fix 9.9 audit gates

on:
  push:
    branches:
      - agent/visual-9-9-gates-green
    paths:
      - ".github/workflows/agent-fix-99-gates.yml"

permissions:
  contents: write

jobs:
  fix-stale-gates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/visual-9-9-gates-green
          fetch-depth: 0

      - name: Align static and browser contracts with the compact shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, before: str, after: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              file.write_text(text.replace(before, after, 1), encoding="utf-8")

          replace_once(
              "tests/unit/flow-os-navigation-static.test.mjs",
              '''assert.match(
            floatingHelp,
            /dispatchEvent\\(new Event\\(OPEN_TOUR_EVENT\\)\\)/,
            "a ajuda única deve abrir o tour por evento explícito",
          );''',
              '''assert.match(
            floatingHelp,
            /dispatchEvent\\(new Event\\(eventName\\)\\)/,
            "o helper de assistência deve despachar o evento recebido explicitamente",
          );
          assert.match(
            floatingHelp,
            /openAuxiliarySurface\\(OPEN_TOUR_EVENT\\)/,
            "a ajuda única deve abrir o tour pelo helper compartilhado",
          );
          assert.match(
            floatingHelp,
            /openAuxiliarySurface\\(OPEN_PREFERENCES_EVENT\\)/,
            "a ajuda única deve abrir preferências pelo helper compartilhado",
          );''',
          )

          replace_once(
              "tests/e2e/scroll-continuity.mjs",
              '''    const trigger = page.getByTestId("button-command-palette");
              await trigger.waitFor({ state: "visible", timeout: 5000 });
              await trigger.click();''',
              '''    const compactTrigger = page.getByTestId("button-command-palette-mobile");
              const desktopTrigger = page.getByTestId("button-command-palette");
              const trigger = (await compactTrigger.isVisible())
                ? compactTrigger
                : desktopTrigger;
              await trigger.waitFor({ state: "visible", timeout: 5000 });
              await trigger.click();''',
          )
          PY

      - name: Validate focused contract
        run: |
          npm ci
          git diff --check
          node tests/unit/flow-os-navigation-static.test.mjs

      - name: Commit deterministic audit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/flow-os-navigation-static.test.mjs tests/e2e/scroll-continuity.mjs
          git commit -m "test: make visual 9.9 gates deterministic"
          git push origin HEAD:agent/visual-9-9-gates-green
