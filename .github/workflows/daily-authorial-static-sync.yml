name: Sincronizar inventário diário em produção

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Commit que originou a sincronização; vazio publica o main atual"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: neuroped-daily-authorial-static-sync
  cancel-in-progress: false

jobs:
  cloudflare:
    name: Publicar frontend e funções no Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: false

    steps:
      - name: Checkout do main atual
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Definir commit efetivamente publicado
        id: revision
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          if [ -n "${EXPECTED_COMMIT:-}" ] && [ "$EXPECTED_COMMIT" != "$actual" ]; then
            echo "::notice::O main avançou de $EXPECTED_COMMIT para $actual; será publicada a revisão mais recente."
          fi

      - name: Validar credenciais de publicação
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID ausente"; exit 1; }

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Auditar grafo completo de dependências
        run: npm audit --audit-level=high

      - name: Executar catraca técnica completa de release
        run: npm run verify

      - name: Criar sentinela do Cloudflare
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          mkdir -p client/public
          cat > client/public/deploy-check.json <<EOF
          {
            "app": "NeuroPed",
            "provider": "cloudflare-pages",
            "status": "deployed",
            "branch": "main",
            "commit": "${DEPLOY_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "source": "daily-authorial-static-sync",
            "deployed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Compilar frontend
        env:
          NODE_ENV: production
          VITE_AUTH_MODE: remote
          VITE_API_URL: ""
          VITE_ZONE: full
          VITE_ALLOWED_HOSTS: ""
        run: VITE_PIN_HASH= npm run build:client

      - name: Auditar artefato compilado
        run: |
          npm run test:bundle-audit
          npm run audit:bundle
          npm run audit:built-pin
          test -f dist/public/index.html
          test -f dist/public/deploy-check.json

      - name: Publicar no Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy dist/public --project-name neuroped --branch main

      - name: Confirmar revisão pública e backend saudável
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          sentinel="https://neuroped.pages.dev/deploy-check.json"
          health="https://neuroped.pages.dev/api/health"
          for attempt in $(seq 1 18); do
            cache="run=${GITHUB_RUN_ID}&attempt=$attempt"
            if curl -fsSL "$sentinel?$cache" -o /tmp/cloudflare-daily-check.json \
              && jq -e --arg sha "$DEPLOY_SHA" \
                '.provider == "cloudflare-pages" and .status == "deployed" and .commit == $sha' \
                /tmp/cloudflare-daily-check.json >/dev/null \
              && curl -fsSL "$health?$cache" -o /tmp/cloudflare-daily-health.json \
              && jq -e \
                '.database == "ok" and .authentication.required == true and .authentication.configured == true' \
                /tmp/cloudflare-daily-health.json >/dev/null; then
              echo "Cloudflare confirma $DEPLOY_SHA."
              exit 0
            fi
            sleep 10
          done
          cat /tmp/cloudflare-daily-check.json 2>/dev/null || true
          cat /tmp/cloudflare-daily-health.json 2>/dev/null || true
          echo "::error::Cloudflare não confirmou a revisão diária esperada."
          exit 1

  vercel:
    name: Publicar espelho no Vercel
    needs: cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: vercel-production
      cancel-in-progress: false

    steps:
      - name: Checkout do main atual
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Definir commit efetivamente publicado
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validar credenciais do Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::VERCEL_TOKEN ausente"; exit 1; }
          [ -n "$VERCEL_ORG_ID" ] || { echo "::error::VERCEL_ORG_ID ausente"; exit 1; }

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Auditar grafo completo de dependências
        run: npm audit --audit-level=high

      - name: Executar catraca técnica completa de release
        run: npm run verify

      - name: Confirmar Cloudflare no mesmo commit
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl -fsSL "https://neuroped.pages.dev/deploy-check.json?run=${GITHUB_RUN_ID}&attempt=$attempt" \
              -o /tmp/cloudflare-before-vercel.json \
              && jq -e --arg sha "$DEPLOY_SHA" \
                '.provider == "cloudflare-pages" and .commit == $sha' \
                /tmp/cloudflare-before-vercel.json >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::O backend canônico não confirma o commit; Vercel bloqueado."
          exit 1

      - name: Criar sentinela do Vercel
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          mkdir -p client/public
          cat > client/public/deploy-check.json <<EOF
          {
            "app": "NeuroPed",
            "provider": "vercel",
            "status": "deployed",
            "branch": "main",
            "commit": "${DEPLOY_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "source": "daily-authorial-static-sync",
            "deployed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Compilar frontend para o espelho
        env:
          NODE_ENV: production
          VITE_AUTH_MODE: remote
          VITE_API_URL: https://neuroped.pages.dev
          VITE_ZONE: full
          VITE_ALLOWED_HOSTS: ""
        run: VITE_PIN_HASH= npm run build:client

      - name: Auditar artefato compilado
        run: |
          npm run test:bundle-audit
          npm run audit:bundle
          npm run audit:built-pin
          test -f dist/public/index.html
          test -f dist/public/deploy-check.json

      - name: Instalar Vercel CLI
        run: npm install --global vercel@56.4.1

      - name: Publicar projeto oficial
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          token="$VERCEL_TOKEN"
          unset VERCEL_TOKEN
          export VERCEL_PROJECT_ID="prj_8gsXbaQoOZHgbhjnqiMPR9A5jg5b"
          rm -rf .vercel
          vercel pull --yes --environment=production --token="$token"
          VITE_AUTH_MODE=remote \
          VITE_API_URL=https://neuroped.pages.dev \
          VITE_PIN_HASH= \
          VITE_ZONE=full \
          VITE_ALLOWED_HOSTS= \
          VERCEL_GIT_COMMIT_SHA="$DEPLOY_SHA" \
          VERCEL_GIT_COMMIT_REF=main \
            vercel build --prod --token="$token"
          npm run audit:built-pin
          vercel deploy --prebuilt --prod --token="$token"

      - name: Confirmar revisão pública no Vercel
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          url="https://superneuroped.vercel.app/deploy-check.json"
          for attempt in $(seq 1 18); do
            if curl -fsSL "$url?run=${GITHUB_RUN_ID}&attempt=$attempt" -o /tmp/vercel-daily-check.json \
              && jq -e --arg sha "$DEPLOY_SHA" \
                '.provider == "vercel" and .status == "deployed" and .commit == $sha' \
                /tmp/vercel-daily-check.json >/dev/null; then
              echo "Vercel confirma $DEPLOY_SHA."
              exit 0
            fi
            sleep 10
          done
          cat /tmp/vercel-daily-check.json 2>/dev/null || true
          echo "::error::Vercel não confirmou a revisão diária esperada."
          exit 1

  report-failure:
    name: Registrar falha de sincronização
    needs: [cloudflare, vercel]
    if: always() && (needs.cloudflare.result == 'failure' || needs.vercel.result == 'failure')
    runs-on: ubuntu-latest

    steps:
      - name: Criar ou atualizar incidente interno
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="[automação] Sincronização diária de produção — falha persistente"
          body="A sincronização estática do inventário diário não foi confirmada em Cloudflare e/ou Vercel. Execução: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Uma nova verificação automática poderá encerrar este incidente."
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

  close-recovered-incident:
    name: Encerrar falha recuperada
    needs: [cloudflare, vercel]
    if: needs.cloudflare.result == 'success' && needs.vercel.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Fechar incidente anterior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="[automação] Sincronização diária de produção — falha persistente"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" \
              --body "Cloudflare e Vercel foram confirmados na execução ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Incidente encerrado automaticamente."
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason completed
          fi
