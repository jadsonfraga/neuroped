name: Aplicar correções da auditoria IPN-TDAH-FE

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-verify-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply audited patch
        run: python3 scripts/apply-audit-fix-ipn-tdah-6h.py

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run check

      - name: Existing IPN-TDAH filter regression
        run: node --import tsx tests/clinical/test-ipn-tdah-fe-filter.mjs

      - name: New safety and optional-field regression
        run: node --import tsx tests/clinical/test-ipn-tdah-fe-safety-filter.mjs

      - name: Safety metadata
        run: npm run validate:safety

      - name: Open access anti-regression
        run: npm run guard:open-access

      - name: Production client build
        run: npm run build:client

      - name: Commit verified non-workflow corrections
        shell: bash
        run: |
          set -euo pipefail
          git restore .github/workflows/scale-pdf-contract.yml
          git config user.name "NeuroPed Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            client/src/components/GenericScale.tsx \
            client/src/data/interactiveScaleItemsIpnTdahFeAnamnesis.ts \
            client/src/data/interactiveScaleItemsIpnTdahFeDifferentials.ts \
            client/src/data/interactiveScaleItemsIpnTdahFeSynthesis.ts \
            tests/clinical/test-ipn-tdah-fe-safety-filter.mjs
          git diff --cached --check
          git commit -m "fix(escalas): fechar sentinelas e campos opcionais do IPN-TDAH/FE"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
