name: OBS13 pinned source workspace
on:
  push:
    branches: [feat/obs10-evidencia-piloto-v13]
    paths: [.github/workflows/obs13-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8898762d4220b209da1c770bc246c389b7ae7b2d
          persist-credentials: false
      - run: |
          git archive --format=tar HEAD -o /tmp/obs13-source.tar
          git rev-parse HEAD > /tmp/obs13-source-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: obs13-source
          path: |
            /tmp/obs13-source.tar
            /tmp/obs13-source-sha.txt
          retention-days: 1
