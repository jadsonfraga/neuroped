name: Apply cert retirement 410 hotfix

on:
  push:
    branches:
      - fix/cert-retired-410

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/cert-retired-410

      - name: Apply source and test patch
        run: node scripts/apply-cert-retired-410-hotfix.mjs

      - name: Verify anchors
        run: |
          grep -F '"/api/cert"' functions/api/_middleware.ts
          grep -F 'retiredCertificateThroughMiddleware' tests/unit/cloudflare-auth-middleware.test.ts

      - name: Commit hotfix
        run: |
          if git diff --quiet -- functions/api/_middleware.ts tests/unit/cloudflare-auth-middleware.test.ts; then
            echo 'Hotfix já aplicado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/api/_middleware.ts tests/unit/cloudflare-auth-middleware.test.ts
          git commit -m 'fix(security): mantém /api/cert público e aposentado com 410'
          git push origin HEAD:fix/cert-retired-410
