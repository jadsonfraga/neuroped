name: One-shot filter and PDF hotfix

on:
  push:
    branches:
      - fix/filter-state-pdf-fidelity-20260821

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/filter-state-pdf-fidelity-20260821
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Apply focused source patch
        run: node scripts/apply-filter-pdf-hotfix.mjs

      - name: Filter session regression
        run: node --import tsx tests/unit/filter-preferences.test.ts

      - name: Scale response and PDF regression
        run: node --import tsx tests/clinical/test-scale-response-delivery.mjs

      - name: Type check
        run: npm run check

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit verified hotfix and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-filter-pdf-hotfix.yml scripts/apply-filter-pdf-hotfix.mjs
          git add client/src/pages/filtro-engine.tsx \
                  client/src/lib/scaleResponseReport.ts \
                  client/src/components/ClinicalReport.tsx \
                  client/src/components/SaveToPatient.tsx \
                  tests/clinical/test-scale-response-delivery.mjs
          git config user.name "neuroped-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: preserve filter state and parent PDF fidelity"
          git push origin HEAD:fix/filter-state-pdf-fidelity-20260821
