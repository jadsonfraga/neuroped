name: audit-mp90

on:
  schedule:
    - cron: "21 5 * * 1"   # segunda 05h21 UTC
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save chrome-launcher@1 lighthouse@12
      - name: Aguarda Pages
        run: sleep 60
      - name: Lighthouse audit (≥90 WS4)
        run: node scripts/audit-lighthouse.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report.json
          retention-days: 30

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save puppeteer@22 @axe-core/puppeteer@4
      - run: sleep 60
      - run: node scripts/audit-a11y.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-report
          path: a11y-report.json
          retention-days: 30
