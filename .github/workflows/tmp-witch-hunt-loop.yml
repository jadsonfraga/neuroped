name: Temporary witch hunt loop

on:
  push:
    branches:
      - fix/witch-hunt-loop-20260810
    paths:
      - ".github/workflows/tmp-witch-hunt-loop.yml"
      - "scripts/tmp_witch_hunt_fix_round1.py"

permissions:
  contents: write

jobs:
  round1:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/witch-hunt-loop-20260810
          fetch-depth: 0
      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Apply proven bug fixes
        run: |
          python3 scripts/tmp_witch_hunt_fix_round1.py
          sed -i 's/seguir para/seguimos para/' tests/unit/witch-hunt-regressions.test.mjs
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Targeted regressions
        run: |
          set -euo pipefail
          node --import tsx tests/unit/audit-log-contract.test.ts
          node tests/unit/witch-hunt-regressions.test.mjs
          npm run test:operations
          npm run test:no-fake-clinical-write
      - name: Full permanent release gate
        run: npm run verify:release
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit only approved permanent changes
        run: |
          set -euo pipefail
          git config user.name "NeuroPed Audit Bot"
          git config user.email "neuroped-audit@users.noreply.github.com"
          git add \
            functions/api/audit-log.ts \
            functions/api/conecta/[id].ts \
            server/routes/conecta.ts \
            functions/api/operations/_access.ts \
            functions/api/operations/index.ts \
            tests/unit/audit-log-contract.test.ts \
            tests/unit/witch-hunt-regressions.test.mjs \
            package.json
          git diff --cached --check
          git commit -m "fix(audit): fechar fail-open e corridas remanescentes"
          git push origin HEAD:fix/witch-hunt-loop-20260810
