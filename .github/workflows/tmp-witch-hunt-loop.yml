name: Temporary witch hunt loop

on:
  push:
    branches:
      - fix/witch-hunt-loop-20260810
    paths:
      - ".github/workflows/tmp-witch-hunt-loop.yml"
      - "scripts/tmp_witch_hunt_fix_round3.py"

permissions:
  contents: write

jobs:
  round3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/witch-hunt-loop-20260810
          fetch-depth: 0
      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Apply scale and date fixes
        run: python3 scripts/tmp_witch_hunt_fix_round3.py
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Targeted regressions
        run: |
          set -euo pipefail
          node --import tsx tests/unit/audit-log-contract.test.ts
          node tests/unit/witch-hunt-regressions.test.mjs
          npm run test:operations
      - name: Repeat static witch-hunt scan
        run: python3 scripts/tmp_witch_hunt_scan.py
      - name: Full permanent release gate
        run: npm run verify:release
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit only approved permanent changes
        run: |
          set -euo pipefail
          git config user.name "NeuroPed Audit Bot"
          git config user.email "neuroped-audit@users.noreply.github.com"
          git add \
            functions/api/audit-log.ts \
            functions/api/operations/index.ts \
            tests/unit/audit-log-contract.test.ts \
            tests/unit/witch-hunt-regressions.test.mjs
          git diff --cached --check
          git commit -m "fix(audit): corrigir métricas truncadas e limite temporal"
          git push origin HEAD:fix/witch-hunt-loop-20260810
