name: Temporary P0 security test

on:
  push:
    branches:
      - fix/close-p0-security-20260811

permissions:
  contents: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Restore validation ordering in patient PATCH
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('functions/api/patients/[id].ts')
          s = p.read_text()
          old = '''  if (!env.DB) return errorResponse("Persistência indisponível. Nenhum paciente foi atualizado.", "DB_REQUIRED", 503);\n  const user = getContextUser(context); if (!user) return authorizationError("Não autenticado.", "UNAUTHENTICATED", 401);\n  if (!canWriteClinicalData(user)) return authorizationError("Perfil sem permissão para atualizar pacientes.", "FORBIDDEN", 403);\n\n  let parsed: unknown; try { parsed = await request.json(); } catch { return errorResponse("Corpo da requisição inválido ou não é JSON.", "INVALID_JSON", 400); }\n  if (!isPlainObject(parsed)) return errorResponse("Corpo deve ser um objeto JSON.", "INVALID_JSON", 400);\n  const normalized = normalizePatientWrite(parsed, { requireName: false });\n  if (!normalized.ok) return errorResponse(normalized.message, "VALIDATION_ERROR", 400);\n  const entries = Object.entries(normalized.values) as Array<[PatientWriteField, string | null]>;\n  if (!entries.length) return errorResponse("Nenhum campo válido para atualizar.", "NO_UPDATES", 400);\n\n  try {'''
          new = '''  let parsed: unknown; try { parsed = await request.json(); } catch { return errorResponse("Corpo da requisição inválido ou não é JSON.", "INVALID_JSON", 400); }\n  if (!isPlainObject(parsed)) return errorResponse("Corpo deve ser um objeto JSON.", "INVALID_JSON", 400);\n  const normalized = normalizePatientWrite(parsed, { requireName: false });\n  if (!normalized.ok) return errorResponse(normalized.message, "VALIDATION_ERROR", 400);\n  const entries = Object.entries(normalized.values) as Array<[PatientWriteField, string | null]>;\n  if (!entries.length) return errorResponse("Nenhum campo válido para atualizar.", "NO_UPDATES", 400);\n  if (!env.DB) return errorResponse("Persistência indisponível. Nenhum paciente foi atualizado.", "DB_REQUIRED", 503);\n  const user = getContextUser(context); if (!user) return authorizationError("Não autenticado.", "UNAUTHENTICATED", 401);\n  if (!canWriteClinicalData(user)) return authorizationError("Perfil sem permissão para atualizar pacientes.", "FORBIDDEN", 403);\n\n  try {'''
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif new not in s:
              raise SystemExit('patient PATCH validation anchor missing')
          PY
      - name: Commit validation fix when needed
        run: |
          if git diff --quiet -- 'functions/api/patients/[id].ts'; then
            echo "Validation ordering already fixed."
          else
            git config user.name "neuroped-security-bot"
            git config user.email "actions@users.noreply.github.com"
            git add 'functions/api/patients/[id].ts'
            git commit -m "fix(api): validar PATCH clínico antes de exigir storage"
            git push origin HEAD:fix/close-p0-security-20260811
          fi
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: TypeScript
        run: npm run check
      - name: Full lint
        run: npm run lint
      - name: Targeted encryption contracts
        run: |
          node --import tsx tests/unit/clinical-encryption-contract.test.ts
          node tests/unit/clinical-encryption-static.test.mjs
          node tests/unit/clinical-encryption-release-static.test.mjs
      - name: Existing release security contracts
        run: |
          npm run test:quick-wins
          npm run test:operations
      - name: Inspect Cloudflare encryption state without exposing values
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]
          npx wrangler@4 pages secret list --project-name neuroped > /tmp/pages-secrets.txt
          echo "Cloudflare Pages secret presence:"
          for name in CLINICAL_DATA_KEY CLINICAL_ENCRYPTION_STRICT OPERATIONAL_DATA_KEY OPERATIONAL_DATA_KEY_PREVIOUS CERT_P12_B64 CERT_P12_PASSWORD; do
            if grep -q "\b${name}\b" /tmp/pages-secrets.txt; then
              echo "  ${name}=present"
            else
              echo "  ${name}=absent"
            fi
          done
          echo "D1 encryption state:"
          if npx wrangler@4 d1 execute neuroped-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name='clinical_encryption_state';" > /tmp/state-table.txt 2>&1 \
            && grep -q "clinical_encryption_state" /tmp/state-table.txt; then
            npx wrangler@4 d1 execute neuroped-db --remote --command "SELECT envelope_version, key_id, phase, backup_sha256 IS NOT NULL AS has_backup, rollback_verified_at IS NOT NULL AS rollback_verified FROM clinical_encryption_state WHERE id=1;"
          else
            echo "  clinical_encryption_state=absent"
          fi
          npx wrangler@4 pages secret delete --help | head -20
      - name: Inspect retired GitHub secret presence without exposing values
        if: always()
        env:
          OLD_CERT_B64: ${{ secrets.CERT_P12_B64 }}
          OLD_CERT_PW: ${{ secrets.CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$OLD_CERT_B64" ] && echo "CERT_P12_B64=present" || echo "CERT_P12_B64=absent"
          [ -n "$OLD_CERT_PW" ] && echo "CERT_P12_PASSWORD=present" || echo "CERT_P12_PASSWORD=absent"
