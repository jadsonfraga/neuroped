name: Temporary P0 security test

on:
  push:
    branches:
      - fix/close-p0-security-20260811

permissions:
  contents: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Restore manifest exactly from main and add only P0 tests
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:package.json > package.json
          git show origin/main:package-lock.json > package-lock.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const prefix = [
            'node --import tsx tests/unit/clinical-encryption-contract.test.ts',
            'node tests/unit/clinical-encryption-static.test.mjs',
            'node tests/unit/clinical-encryption-release-static.test.mjs',
          ].join(' && ') + ' && ';
          if (!pkg.scripts['test:quick-wins'].startsWith(prefix)) {
            pkg.scripts['test:quick-wins'] = prefix + pkg.scripts['test:quick-wins'];
          }
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
      - name: Commit minimal manifest correction when needed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Manifest already minimal."
          else
            git config user.name "neuroped-security-bot"
            git config user.email "actions@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix(security): restaurar manifesto e conectar apenas gates P0"
            git push origin HEAD:fix/close-p0-security-20260811
          fi
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: TypeScript
        run: npm run check
      - name: Full lint
        run: npm run lint
      - name: Targeted encryption contracts
        run: |
          node --import tsx tests/unit/clinical-encryption-contract.test.ts
          node tests/unit/clinical-encryption-static.test.mjs
          node tests/unit/clinical-encryption-release-static.test.mjs
      - name: Existing release security contracts
        run: |
          npm run test:quick-wins
          npm run test:operations
      - name: Inspect Cloudflare encryption state without exposing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]
          npx wrangler@4 pages secret list --project-name neuroped > /tmp/pages-secrets.txt
          echo "Cloudflare Pages secret presence:"
          for name in CLINICAL_DATA_KEY CLINICAL_ENCRYPTION_STRICT OPERATIONAL_DATA_KEY OPERATIONAL_DATA_KEY_PREVIOUS CERT_P12_B64 CERT_P12_PASSWORD; do
            if grep -q "\b${name}\b" /tmp/pages-secrets.txt; then
              echo "  ${name}=present"
            else
              echo "  ${name}=absent"
            fi
          done
          echo "D1 encryption state:"
          if npx wrangler@4 d1 execute neuroped-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name='clinical_encryption_state';" > /tmp/state-table.txt 2>&1 \
            && grep -q "clinical_encryption_state" /tmp/state-table.txt; then
            npx wrangler@4 d1 execute neuroped-db --remote --command "SELECT envelope_version, key_id, phase, backup_sha256 IS NOT NULL AS has_backup, rollback_verified_at IS NOT NULL AS rollback_verified FROM clinical_encryption_state WHERE id=1;"
          else
            echo "  clinical_encryption_state=absent"
          fi
          npx wrangler@4 pages secret delete --help | head -20
      - name: Inspect retired GitHub secret presence without exposing values
        env:
          OLD_CERT_B64: ${{ secrets.CERT_P12_B64 }}
          OLD_CERT_PW: ${{ secrets.CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$OLD_CERT_B64" ] && echo "CERT_P12_B64=present" || echo "CERT_P12_B64=absent"
          [ -n "$OLD_CERT_PW" ] && echo "CERT_P12_PASSWORD=present" || echo "CERT_P12_PASSWORD=absent"
