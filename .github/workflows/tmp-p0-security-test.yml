name: Temporary P0 security test

on:
  push:
    branches:
      - fix/close-p0-security-20260811

permissions:
  contents: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: TypeScript
        run: npm run check
      - name: Full lint
        run: npm run lint
      - name: Targeted encryption contracts
        run: |
          node --import tsx tests/unit/clinical-encryption-contract.test.ts
          node tests/unit/clinical-encryption-static.test.mjs
          node tests/unit/clinical-encryption-release-static.test.mjs
      - name: Diagnose release contracts without hiding the first failure
        run: |
          set +e
          status=success
          failed=""
          node --input-type=module <<'NODE' > /tmp/quick-wins-commands.txt
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const command of pkg.scripts['test:quick-wins'].split(' && ')) console.log(command);
          NODE
          while IFS= read -r command; do
            echo "RUN $command"
            bash -lc "$command"
            code=$?
            if [ "$code" -ne 0 ]; then
              status=failure
              failed="$command"
              break
            fi
          done < /tmp/quick-wins-commands.txt
          if [ "$status" = success ]; then
            npm run test:operations
            code=$?
            if [ "$code" -ne 0 ]; then
              status=failure
              failed="npm run test:operations"
            fi
          fi
          printf 'status=%s\nfailed_command=%s\nhead_sha=%s\n' "$status" "$failed" "$GITHUB_SHA" > tmp-p0-diagnostic.txt
          exit 0
      - name: Record non-secret infrastructure state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OLD_CERT_B64: ${{ secrets.CERT_P12_B64 }}
          OLD_CERT_PW: ${{ secrets.CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          : > tmp-p0-infra-state.txt
          echo "head_sha=$GITHUB_SHA" >> tmp-p0-infra-state.txt
          [ -n "$OLD_CERT_B64" ] && echo "github_CERT_P12_B64=present" >> tmp-p0-infra-state.txt || echo "github_CERT_P12_B64=absent" >> tmp-p0-infra-state.txt
          [ -n "$OLD_CERT_PW" ] && echo "github_CERT_P12_PASSWORD=present" >> tmp-p0-infra-state.txt || echo "github_CERT_P12_PASSWORD=absent" >> tmp-p0-infra-state.txt
          npx wrangler@4 pages secret list --project-name neuroped > /tmp/pages-secrets.txt
          for name in CLINICAL_DATA_KEY CLINICAL_ENCRYPTION_STRICT OPERATIONAL_DATA_KEY OPERATIONAL_DATA_KEY_PREVIOUS CERT_P12_B64 CERT_P12_PASSWORD; do
            if grep -Eq "(^|[^A-Za-z0-9_])${name}([^A-Za-z0-9_]|$)" /tmp/pages-secrets.txt; then
              echo "cloudflare_${name}=present" >> tmp-p0-infra-state.txt
            else
              echo "cloudflare_${name}=absent" >> tmp-p0-infra-state.txt
            fi
          done
          if npx wrangler@4 d1 execute neuroped-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name='clinical_encryption_state';" > /tmp/state-table.txt 2>&1 \
            && grep -q "clinical_encryption_state" /tmp/state-table.txt; then
            echo "d1_clinical_encryption_state=present" >> tmp-p0-infra-state.txt
            npx wrangler@4 d1 execute neuroped-db --remote --json --command "SELECT envelope_version,key_id,phase,backup_sha256 IS NOT NULL AS has_backup,rollback_verified_at IS NOT NULL AS rollback_verified FROM clinical_encryption_state WHERE id=1;" \
              | jq -r '.[0].results[0] // {} | "d1_phase=\(.phase // "none")\nd1_has_backup=\((.has_backup // 0) != 0)\nd1_rollback_verified=\((.rollback_verified // 0) != 0)"' \
              >> tmp-p0-infra-state.txt
          else
            echo "d1_clinical_encryption_state=absent" >> tmp-p0-infra-state.txt
            echo "d1_phase=none" >> tmp-p0-infra-state.txt
          fi
      - name: Commit diagnostic state
        run: |
          git config user.name "neuroped-security-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tmp-p0-diagnostic.txt tmp-p0-infra-state.txt
          git commit -m "chore(security): registrar diagnóstico P0 temporário"
          git push origin HEAD:fix/close-p0-security-20260811
      - name: Enforce diagnosed release contracts
        run: grep -qx 'status=success' tmp-p0-diagnostic.txt
