name: Remote scale response D1

on:
  pull_request:
    branches:
      - main
    paths:
      - "db/migrations/0021_remote_scale_response.sql"
      - "shared/remoteScaleCatalog.ts"
      - "functions/api/scale/_shared.ts"
      - "functions/api/public-scale.ts"
      - "functions/api/live/scale-invitations/index.ts"
      - "tests/unit/remote-scale-response.test.ts"
      - "tests/unit/saas-remote-scale-static.test.mjs"
      - "scripts/guards/check-remote-scale-clinical-truth.mjs"
      - ".github/workflows/remote-scale-response-d1.yml"
  push:
    branches:
      - main
    paths:
      - "db/migrations/0021_remote_scale_response.sql"
      - "shared/remoteScaleCatalog.ts"
      - "functions/api/scale/_shared.ts"
      - "functions/api/public-scale.ts"
      - "functions/api/live/scale-invitations/index.ts"
      - "tests/unit/remote-scale-response.test.ts"
      - "tests/unit/saas-remote-scale-static.test.mjs"
      - "scripts/guards/check-remote-scale-clinical-truth.mjs"
      - ".github/workflows/remote-scale-response-d1.yml"
  workflow_dispatch:

permissions:
  contents: read

# Grupo próprio: as migrações D1 são idempotentes e não podem ser canceladas
# pela corrida do grupo compartilhado cloudflare-pages.
concurrency:
  group: d1-remote-scale-response
  cancel-in-progress: false

jobs:
  validate-remote-scale-response:
    name: Validate remote scale response flow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Security boundary regression
        run: node tests/unit/saas-remote-scale-static.test.mjs

      - name: Adversarial remote scale response regression
        run: node --import tsx tests/unit/remote-scale-response.test.ts

      - name: Clinical truth of the remote descriptors
        run: npm run audit:remote-scale-truth

      - name: TypeScript
        run: npm run check

  migrate-remote-scale-response:
    name: Apply remote scale response schema to D1
    needs: validate-remote-scale-response
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID ausente"; exit 1; }

      - name: Apply migration 0021
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote --yes \
            --file=./db/migrations/0021_remote_scale_response.sql

      - name: Verify tables without exposing answers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('live_scale_invitations','live_scale_responses') ORDER BY name;" \
            > /tmp/scale-tables.txt 2>&1
          cat /tmp/scale-tables.txt
          grep -q "live_scale_invitations" /tmp/scale-tables.txt
          grep -q "live_scale_responses" /tmp/scale-tables.txt

          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='trigger' AND name='trg_live_scale_response_matches_invitation';" \
            > /tmp/scale-trigger.txt 2>&1
          cat /tmp/scale-trigger.txt
          grep -q "trg_live_scale_response_matches_invitation" /tmp/scale-trigger.txt

          echo "✅ Schema de resposta remota de escalas instalado sem consultar conteúdo de respostas."
