name: Apply Sonda Dez daily route

on:
  push:
    branches:
      - feat/sonda-dez-stimuli-daily-20260906
    paths:
      - ".github/workflows/sonda-stimuli-route-apply.yml"

permissions:
  contents: write

jobs:
  patch-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/sonda-dez-stimuli-daily-20260906
      - name: Point Sonda route to daily wrapper
        shell: python
        run: |
          from pathlib import Path
          path = Path("client/src/App.tsx")
          text = path.read_text(encoding="utf-8")
          old = 'const TestesDiretosPage = lazy(() => import("@/pages/testes-diretos"));'
          new = 'const TestesDiretosPage = lazy(() => import("@/pages/sonda-dez-daily"));'
          if old not in text:
              raise SystemExit("canonical Sonda import not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Remove one-shot workflow
        run: git rm .github/workflows/sonda-stimuli-route-apply.yml
      - name: Commit route patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/App.tsx
          git commit -m "feat(sonda): ativar banco visual na rota canônica"
          git push origin HEAD:feat/sonda-dez-stimuli-daily-20260906
