name: Temporary Operational Suite hardening

on:
  push:
    branches:
      - feat/operational-suite-v1
    paths:
      - ".github/workflows/tmp-ops-hardening.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/operational-suite-v1
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Aplicar patch de hardening
        run: python3 scripts/tmp_ops_hardening.py

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Executar gates de hardening
        run: |
          set -euo pipefail
          npm run test:operations
          npm run validate:public
          npm run audit:navigation
          npm run check
          npm run lint
          npm run build:client

      - name: Commitar somente após gates verdes
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-ops-hardening.yml scripts/tmp_ops_hardening.py
          git config user.name "NeuroPed CI"
          git config user.email "actions@users.noreply.github.com"
          git add db/migrations/0007_operational_suite.sql functions/api/operations/_core.ts functions/api/operations/index.ts functions/api/public-booking.ts client/src/App.tsx functions/api/_middleware.ts tests/unit/operations-contract.test.ts tests/unit/operations-integration-static.test.mjs .github/workflows/operations-d1-migration.yml .github/workflows/tmp-ops-hardening.yml scripts/tmp_ops_hardening.py
          git commit -m "fix(ops): impedir sobreposição concorrente e agenda órfã"
          git push origin HEAD:feat/operational-suite-v1
