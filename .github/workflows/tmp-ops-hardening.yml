name: Temporary Operational Suite hardening

on:
  push:
    branches:
      - feat/operational-suite-v1
    paths:
      - ".github/workflows/tmp-ops-hardening.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/operational-suite-v1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Aplicar hardening de agenda
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor ausente em {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # 1) Lock físico por buckets de 5 min para impedir sobreposição concorrente.
          migration = Path('db/migrations/0007_operational_suite.sql')
          text = migration.read_text()
          anchor = '''CREATE UNIQUE INDEX IF NOT EXISTS ux_appointments_occupied_slot
            ON appointments(provider_user_id, starts_at_local)
            WHERE status IN ('requested','confirmed','checked_in','in_care');

          CREATE TABLE IF NOT EXISTS waitlist_entries ('''
          block = '''CREATE UNIQUE INDEX IF NOT EXISTS ux_appointments_occupied_slot
            ON appointments(provider_user_id, starts_at_local)
            WHERE status IN ('requested','confirmed','checked_in','in_care');

          CREATE TABLE IF NOT EXISTS appointment_slot_locks (
            provider_user_id TEXT NOT NULL REFERENCES users(id) ON DELETE CASCADE,
            slot_key TEXT NOT NULL,
            appointment_id TEXT NOT NULL REFERENCES appointments(id) ON DELETE CASCADE,
            PRIMARY KEY (provider_user_id, slot_key)
          );
          CREATE INDEX IF NOT EXISTS idx_appointment_slot_locks_appointment
            ON appointment_slot_locks(appointment_id);

          CREATE TABLE IF NOT EXISTS waitlist_entries ('''
          if anchor not in text:
              raise SystemExit('anchor migration locks ausente')
          migration.write_text(text.replace(anchor, block, 1))

          core = Path('functions/api/operations/_core.ts')
          text = core.read_text()
          schema_anchor = '''  `CREATE UNIQUE INDEX IF NOT EXISTS ux_appointments_occupied_slot ON appointments(provider_user_id, starts_at_local) WHERE status IN ('requested','confirmed','checked_in','in_care')`,
          `CREATE TABLE IF NOT EXISTS waitlist_entries ('''
          schema_block = '''  `CREATE UNIQUE INDEX IF NOT EXISTS ux_appointments_occupied_slot ON appointments(provider_user_id, starts_at_local) WHERE status IN ('requested','confirmed','checked_in','in_care')`,
          `CREATE TABLE IF NOT EXISTS appointment_slot_locks (
            provider_user_id TEXT NOT NULL REFERENCES users(id) ON DELETE CASCADE,
            slot_key TEXT NOT NULL,
            appointment_id TEXT NOT NULL REFERENCES appointments(id) ON DELETE CASCADE,
            PRIMARY KEY (provider_user_id, slot_key)
          )`,
          `CREATE INDEX IF NOT EXISTS idx_appointment_slot_locks_appointment ON appointment_slot_locks(appointment_id)`,
          `CREATE TABLE IF NOT EXISTS waitlist_entries ('''
          if schema_anchor not in text:
              raise SystemExit('anchor core schema locks ausente')
          text = text.replace(schema_anchor, schema_block, 1)
          helper_anchor = '''export function overlapsLocal(
          '''
          helper = '''export function appointmentSlotKeys(
            startsAtLocal: string,
            endsAtLocal: string,
            stepMinutes = 5,
          ): string[] {
            if (!isValidLocalDateTime(startsAtLocal) || !isValidLocalDateTime(endsAtLocal) || endsAtLocal <= startsAtLocal) {
              throw new Error("INVALID_APPOINTMENT_INTERVAL");
            }
            if (!Number.isInteger(stepMinutes) || stepMinutes < 1 || stepMinutes > 60) {
              throw new Error("INVALID_SLOT_LOCK_STEP");
            }
            const keys: string[] = [];
            let cursor = startsAtLocal;
            for (let guard = 0; cursor < endsAtLocal && guard < 576; guard += 1) {
              keys.push(cursor);
              cursor = addMinutesLocal(cursor, stepMinutes);
            }
            if (cursor < endsAtLocal) throw new Error("APPOINTMENT_INTERVAL_TOO_LARGE");
            return keys;
          }

          export function slotLockStatements(
            db: D1Database,
            providerUserId: string,
            appointmentId: string,
            startsAtLocal: string,
            endsAtLocal: string,
          ): D1PreparedStatement[] {
            return appointmentSlotKeys(startsAtLocal, endsAtLocal).map((slotKey) =>
              db.prepare(
                `INSERT INTO appointment_slot_locks (provider_user_id, slot_key, appointment_id)
                 VALUES (?, ?, ?)`,
              ).bind(providerUserId, slotKey, appointmentId),
            );
          }

          export function releaseSlotLocksStatement(
            db: D1Database,
            appointmentId: string,
          ): D1PreparedStatement {
            return db.prepare(`DELETE FROM appointment_slot_locks WHERE appointment_id = ?`).bind(appointmentId);
          }

          export function overlapsLocal(
          '''
          if helper_anchor not in text:
              raise SystemExit('anchor core helper ausente')
          core.write_text(text.replace(helper_anchor, helper, 1))

          # 2) Profissional/admin somente: operador sem vínculo explícito não ganha agenda própria.
          rep(
              'client/src/App.tsx',
              '<RouteGuard roles={["admin", "professional", "operator"]}>\n                <AgendaPage />',
              '<RouteGuard roles={["admin", "professional"]}>\n                <AgendaPage />',
          )
          middleware = Path('functions/api/_middleware.ts')
          m = middleware.read_text()
          m = m.replace(
              '''  // Operadores podem executar somente ações operacionais; /api/operations
            // revalida a permissão ação a ação e não concede escrita clínica.
            const isOperationalOperatorWrite =
              path === "/api/operations" && method === "POST" && user.role === "operator";
            if (
              ["POST", "PATCH", "PUT", "DELETE"].includes(method) &&
              !isOwnConsentWrite &&
              !isOperationalOperatorWrite &&
              !canWriteClinicalData(user)
            ) {''',
              '''  if (
              ["POST", "PATCH", "PUT", "DELETE"].includes(method) &&
              !isOwnConsentWrite &&
              !canWriteClinicalData(user)
            ) {''',
          )
          middleware.write_text(m)
          rep(
              'functions/api/operations/index.ts',
              '''function canOperate(role: string): boolean {
            return canConfigure(role) || role === "operator";
          }
''',
              '''function canOperate(role: string): boolean {
            return canConfigure(role);
          }
''',
          )

          # 3) Inserts/updates críticos passam a reservar/liberar locks na mesma batch D1.
          ops = Path('functions/api/operations/index.ts')
          text = ops.read_text()
          text = text.replace(
              '''  serviceToApi,
            sha256,
''',
              '''  releaseSlotLocksStatement,
            serviceToApi,
            sha256,
            slotLockStatements,
''',
              1,
          )
          old_manual = '''      await env.DB.prepare(
            `INSERT INTO appointments
              (id, provider_user_id, service_id, patient_id, starts_at_local, ends_at_local, timezone,
               status, source, booking_token_hash, guardian_name_encrypted, guardian_email_encrypted,
               guardian_phone_encrypted, patient_name_encrypted, amount_cents, payment_status, created_at, updated_at)
             VALUES (?, ?, ?, ?, ?, ?, ?, 'confirmed', 'professional', ?, ?, ?, ?, ?, ?, 'pending', ?, ?)`,
          ).bind(
            `apt-${crypto.randomUUID()}`, user.id, service.id, cleanOptionalText(body.patientId, 100), starts, endsAtLocal,
            profile.timezone, await sha256(token), await encryptText(env, cleanOptionalText(body.guardianName, 120)),
            await encryptText(env, cleanOptionalText(body.guardianEmail, 180)), await encryptText(env, cleanOptionalText(body.guardianPhone, 40)),
            await encryptText(env, cleanOptionalText(body.patientName, 120)), service.price_cents, now, now,
          ).run();'''
          new_manual = '''      const appointmentId = `apt-${crypto.randomUUID()}`;
          const insertAppointment = env.DB.prepare(
            `INSERT INTO appointments
              (id, provider_user_id, service_id, patient_id, starts_at_local, ends_at_local, timezone,
               status, source, booking_token_hash, guardian_name_encrypted, guardian_email_encrypted,
               guardian_phone_encrypted, patient_name_encrypted, amount_cents, payment_status, created_at, updated_at)
             VALUES (?, ?, ?, ?, ?, ?, ?, 'confirmed', 'professional', ?, ?, ?, ?, ?, ?, 'pending', ?, ?)`,
          ).bind(
            appointmentId, user.id, service.id, cleanOptionalText(body.patientId, 100), starts, endsAtLocal,
            profile.timezone, await sha256(token), await encryptText(env, cleanOptionalText(body.guardianName, 120)),
            await encryptText(env, cleanOptionalText(body.guardianEmail, 180)), await encryptText(env, cleanOptionalText(body.guardianPhone, 40)),
            await encryptText(env, cleanOptionalText(body.patientName, 120)), service.price_cents, now, now,
          );
          await env.DB.batch([
            insertAppointment,
            ...slotLockStatements(env.DB, user.id, appointmentId, starts, endsAtLocal),
          ]);'''
          if old_manual not in text:
              raise SystemExit('anchor manual appointment ausente')
          text = text.replace(old_manual, new_manual, 1)
          old_status = '''      await env.DB.prepare(
            `UPDATE appointments SET status = ?, checked_in_at = ?, completed_at = ?, cancelled_at = ?, updated_at = ?
              WHERE id = ? AND provider_user_id = ?`,
          ).bind(status, checkedInAt, completedAt, cancelledAt, now, id, user.id).run();'''
          new_status = '''      const updateStatus = env.DB.prepare(
            `UPDATE appointments SET status = ?, checked_in_at = ?, completed_at = ?, cancelled_at = ?, updated_at = ?
              WHERE id = ? AND provider_user_id = ?`,
          ).bind(status, checkedInAt, completedAt, cancelledAt, now, id, user.id);
          const releasesSchedule = ["cancelled", "no_show", "completed"].includes(status);
          await env.DB.batch(
            releasesSchedule
              ? [updateStatus, releaseSlotLocksStatement(env.DB, id)]
              : [updateStatus],
          );'''
          if old_status not in text:
              raise SystemExit('anchor status appointment ausente')
          ops.write_text(text.replace(old_status, new_status, 1))

          public = Path('functions/api/public-booking.ts')
          text = public.read_text()
          text = text.replace(
              '''  randomAccessToken,
            serviceToApi,
            sha256,
''',
              '''  randomAccessToken,
            releaseSlotLocksStatement,
            serviceToApi,
            sha256,
            slotLockStatements,
''',
              1,
          )
          old_book = '''        await env.DB.prepare(
              `INSERT INTO appointments
                (id, provider_user_id, service_id, starts_at_local, ends_at_local, timezone,
                 status, source, booking_token_hash, guardian_name_encrypted, guardian_email_encrypted,
                 guardian_phone_encrypted, patient_name_encrypted, amount_cents, payment_status, created_at, updated_at)
               VALUES (?, ?, ?, ?, ?, ?, 'requested', 'public', ?, ?, ?, ?, ?, ?, 'pending', ?, ?)`,
            ).bind(
              appointmentId,
              provider.user_id,
              service.id,
              chosen.startsAtLocal,
              chosen.endsAtLocal,
              provider.timezone,
              await sha256(token),
              await encryptText(env, guardianName),
              await encryptText(env, guardianEmail || null),
              await encryptText(env, guardianPhone || null),
              await encryptText(env, patientName),
              service.price_cents,
              now,
              now,
            ).run();'''
          new_book = '''        const insertAppointment = env.DB.prepare(
              `INSERT INTO appointments
                (id, provider_user_id, service_id, starts_at_local, ends_at_local, timezone,
                 status, source, booking_token_hash, guardian_name_encrypted, guardian_email_encrypted,
                 guardian_phone_encrypted, patient_name_encrypted, amount_cents, payment_status, created_at, updated_at)
               VALUES (?, ?, ?, ?, ?, ?, 'requested', 'public', ?, ?, ?, ?, ?, ?, 'pending', ?, ?)`,
            ).bind(
              appointmentId,
              provider.user_id,
              service.id,
              chosen.startsAtLocal,
              chosen.endsAtLocal,
              provider.timezone,
              await sha256(token),
              await encryptText(env, guardianName),
              await encryptText(env, guardianEmail || null),
              await encryptText(env, guardianPhone || null),
              await encryptText(env, patientName),
              service.price_cents,
              now,
              now,
            );
            await env.DB.batch([
              insertAppointment,
              ...slotLockStatements(env.DB, provider.user_id, appointmentId, chosen.startsAtLocal, chosen.endsAtLocal),
            ]);'''
          if old_book not in text:
              raise SystemExit('anchor public book ausente')
          text = text.replace(old_book, new_book, 1)
          old_cancel = '''      await env.DB.prepare(
            `UPDATE appointments SET status = 'cancelled', cancelled_at = ?, cancel_reason = ?, updated_at = ? WHERE id = ?`,
          ).bind(now, reason, now, appointment.id).run();'''
          new_cancel = '''      await env.DB.batch([
            env.DB.prepare(
              `UPDATE appointments SET status = 'cancelled', cancelled_at = ?, cancel_reason = ?, updated_at = ? WHERE id = ?`,
            ).bind(now, reason, now, appointment.id),
            releaseSlotLocksStatement(env.DB, appointment.id),
          ]);'''
          if old_cancel not in text:
              raise SystemExit('anchor public cancel ausente')
          text = text.replace(old_cancel, new_cancel, 1)
          old_reschedule = '''        await env.DB.prepare(
              `UPDATE appointments SET starts_at_local = ?, ends_at_local = ?, status = 'requested', updated_at = ? WHERE id = ?`,
            ).bind(chosen.startsAtLocal, chosen.endsAtLocal, now, appointment.id).run();'''
          new_reschedule = '''        const updateAppointment = env.DB.prepare(
              `UPDATE appointments SET starts_at_local = ?, ends_at_local = ?, status = 'requested', updated_at = ? WHERE id = ?`,
            ).bind(chosen.startsAtLocal, chosen.endsAtLocal, now, appointment.id);
            await env.DB.batch([
              releaseSlotLocksStatement(env.DB, appointment.id),
              updateAppointment,
              ...slotLockStatements(env.DB, appointment.provider_user_id, appointment.id, chosen.startsAtLocal, chosen.endsAtLocal),
            ]);'''
          if old_reschedule not in text:
              raise SystemExit('anchor public reschedule ausente')
          public.write_text(text.replace(old_reschedule, new_reschedule, 1))

          # 4) Testes e migração verificam a nova trava física.
          test = Path('tests/unit/operations-contract.test.ts')
          t = test.read_text()
          t = t.replace(
              '''  addMinutesLocal,
            appointmentStatuses,
''',
              '''  addMinutesLocal,
            appointmentSlotKeys,
            appointmentStatuses,
''',
              1,
          )
          t = t.replace(
              '''assert.equal(occupiesSchedule("completed"), false);
          assert.match(formatMoneyBRL(50000), /500/);''',
              '''assert.equal(occupiesSchedule("completed"), false);
          assert.deepEqual(appointmentSlotKeys("2026-08-10T08:00", "2026-08-10T08:20"), [
            "2026-08-10T08:00",
            "2026-08-10T08:05",
            "2026-08-10T08:10",
            "2026-08-10T08:15",
          ]);
          assert.match(formatMoneyBRL(50000), /500/);''',
              1,
          )
          test.write_text(t)

          static = Path('tests/unit/operations-integration-static.test.mjs')
          s = static.read_text()
          s = s.replace('  "appointments",\n', '  "appointments",\n  "appointment_slot_locks",\n', 1)
          s = s.replace(
              'assert.match(migration, /ux_appointments_occupied_slot/);\n',
              'assert.match(migration, /ux_appointments_occupied_slot/);\nassert.match(migration, /PRIMARY KEY \(provider_user_id, slot_key\)/);\nassert.match(core, /slotLockStatements/);\nassert.match(core, /releaseSlotLocksStatement/);\nassert.match(professional, /env\.DB\.batch/);\nassert.match(publicBooking, /env\.DB\.batch/);\nassert.doesNotMatch(professional, /role === "operator"/);\nassert.doesNotMatch(app, /roles=\{\["admin", "professional", "operator"\]\}[\s\S]{0,120}<AgendaPage/);\n',
              1,
          )
          static.write_text(s)

          workflow = Path('.github/workflows/operations-d1-migration.yml')
          w = workflow.read_text()
          w = w.replace(
              "'booking_blocks','appointments','waitlist_entries'",
              "'booking_blocks','appointments','appointment_slot_locks','waitlist_entries'",
              1,
          )
          w = w.replace(
              '''            appointments \\
            waitlist_entries \\
''',
              '''            appointments \\
            appointment_slot_locks \\
            waitlist_entries \\
''',
              1,
          )
          w = w.replace(
              "'ux_appointments_occupied_slot','idx_appointments_provider_time','idx_waitlist_provider_status'",
              "'ux_appointments_occupied_slot','idx_appointments_provider_time','idx_appointment_slot_locks_appointment','idx_waitlist_provider_status'",
              1,
          )
          w = w.replace(
              '''            idx_appointments_provider_time \\
            idx_waitlist_provider_status \\
''',
              '''            idx_appointments_provider_time \\
            idx_appointment_slot_locks_appointment \\
            idx_waitlist_provider_status \\
''',
              1,
          )
          workflow.write_text(w)
          PY

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Executar gates de hardening
        run: |
          set -euo pipefail
          npm run test:operations
          npm run validate:public
          npm run audit:navigation
          npm run check
          npm run lint
          npm run build:client

      - name: Commitar somente após gates verdes
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-ops-hardening.yml
          git config user.name "NeuroPed CI"
          git config user.email "actions@users.noreply.github.com"
          git add db/migrations/0007_operational_suite.sql functions/api/operations/_core.ts functions/api/operations/index.ts functions/api/public-booking.ts client/src/App.tsx functions/api/_middleware.ts tests/unit/operations-contract.test.ts tests/unit/operations-integration-static.test.mjs .github/workflows/operations-d1-migration.yml .github/workflows/tmp-ops-hardening.yml
          git commit -m "fix(ops): impedir sobreposição concorrente e agenda órfã"
          git push origin HEAD:feat/operational-suite-v1
