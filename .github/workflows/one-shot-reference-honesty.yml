name: One-shot reference honesty

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/agent/scales-lovable-quality-deep'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v7
        with:
          ref: agent/scales-lovable-quality-deep
          fetch-depth: 0

      - name: Distinguish reference page from official application
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path("client/src/pages/generic-scale.tsx")
          page = page_path.read_text(encoding="utf-8")

          old_vars = '''  const implementationStatus = getImplementationStatus(scale);
          const applicationMode = getApplicationMode(scale);'''
          new_vars = '''  const implementationStatus = getImplementationStatus(scale);
          const officialRoute = scaleRoute(scale);
          const genericRoute = `/generic-scale/${scale.id}`;
          const hasSeparateOfficialApplication =
            implementationStatus === "complete" && officialRoute !== genericRoute;
          const applicationMode = getApplicationMode(scale);'''
          if old_vars in page:
              page = page.replace(old_vars, new_vars, 1)
          elif new_vars not in page:
              raise SystemExit("bloco de variáveis da ficha não encontrado")

          old_banner = '''      <div
            className={`rounded-2xl border p-4 text-sm leading-relaxed ${
              implementationStatus === "complete"
                ? "border-emerald-300/60 bg-emerald-50/70 text-emerald-900 dark:border-emerald-800/50 dark:bg-emerald-950/20 dark:text-emerald-100"
                : "border-amber-300/60 bg-amber-50/70 text-amber-900 dark:border-amber-800/50 dark:bg-amber-950/20 dark:text-amber-100"
            }`}
            role="note"
            data-testid="scale-implementation-status"
          >
            <strong>
              {implementationStatus === "complete"
                ? "Aplicação disponível: "
                : "Ficha de referência: "}
            </strong>
            {getImplementationLabel(implementationStatus)}
            {implementationStatus !== "complete" &&
              " Esta tela não reproduz itens oficiais nem calcula escore."}
          </div>'''
          new_banner = '''      <div
            className={`rounded-2xl border p-4 text-sm leading-relaxed ${
              hasSeparateOfficialApplication
                ? "border-emerald-300/60 bg-emerald-50/70 text-emerald-900 dark:border-emerald-800/50 dark:bg-emerald-950/20 dark:text-emerald-100"
                : "border-amber-300/60 bg-amber-50/70 text-amber-900 dark:border-amber-800/50 dark:bg-amber-950/20 dark:text-amber-100"
            }`}
            role="note"
            data-testid="scale-implementation-status"
          >
            <strong>Ficha de referência: </strong>
            {hasSeparateOfficialApplication
              ? "A aplicação completa existe em uma rota própria. Esta página organiza metadados e um registro observacional complementar."
              : getImplementationLabel(implementationStatus)}
            {" Esta tela não reproduz itens oficiais nem calcula escore."}
            {hasSeparateOfficialApplication && (
              <Link
                href={officialRoute}
                className="mt-3 flex min-h-10 w-fit items-center gap-1.5 rounded-xl border border-current/20 bg-background/70 px-3 py-2 text-xs font-bold text-current transition hover:bg-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
              >
                Abrir aplicação oficial
                <ExternalLink className="h-3.5 w-3.5" aria-hidden="true" />
              </Link>
            )}
          </div>'''
          if old_banner in page:
              page = page.replace(old_banner, new_banner, 1)
          elif new_banner not in page:
              raise SystemExit("banner de implementação não encontrado")
          page_path.write_text(page, encoding="utf-8")

          audit_path = Path("scripts/guards/audit-scale-experience.mjs")
          audit = audit_path.read_text(encoding="utf-8")
          marker = '''check(
            !/PIN master|verifyMasterPin|getMasterPinLockSeconds|isMasterPinUnlocked|type=["']password["']/i.test(
              genericPage,
            ),
            "página genérica reintroduziu UI de PIN/senha",
          );'''
          addition = marker + '''
          check(
            genericPage.includes("<strong>Ficha de referência: </strong>") &&
              !genericPage.includes("Aplicação disponível: ") &&
              genericPage.includes("hasSeparateOfficialApplication"),
            "ficha genérica voltou a se apresentar como aplicação preenchível",
          );'''
          if marker in audit and "ficha genérica voltou a se apresentar" not in audit:
              audit = audit.replace(marker, addition, 1)
          elif "ficha genérica voltou a se apresentar" not in audit:
              raise SystemExit("ponto de inserção da auditoria não encontrado")
          audit_path.write_text(audit, encoding="utf-8")
          PY

      - name: Commit correction
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/generic-scale.tsx scripts/guards/audit-scale-experience.mjs
          git commit -m "fix(escalas): separar ficha de referência da aplicação oficial"
          git push origin HEAD:agent/scales-lovable-quality-deep
