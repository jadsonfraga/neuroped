name: Deploy NeuroPed Conecta Vercel

on:
  push:
    branches:
      - deploy/neuroped-conecta-vercel
    paths:
      - "vercel-conecta/**"
      - ".github/workflows/deploy-neuroped-conecta-vercel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neuroped-conecta-vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_URL: https://neuroped-conecta.lovable.app
      PUBLIC_URL: https://neuroped-conecta.vercel.app
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validar configuração
        run: |
          set -euo pipefail
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::VERCEL_TOKEN ausente"; exit 1; }
          [ -n "$VERCEL_ORG_ID" ] || { echo "::error::VERCEL_ORG_ID ausente"; exit 1; }
          test -f vercel-conecta/vercel.json

      - name: Aguardar origem estável do NeuroPed Conecta
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsSL --max-time 20 "$SOURCE_URL/" -o /tmp/source.html \
              && grep -qi "NeuroPed Conecta" /tmp/source.html; then
              echo "Origem Lovable pronta."
              exit 0
            fi
            echo "Aguardando publicação Lovable ($i/36)..."
            sleep 10
          done
          echo "::error::A origem $SOURCE_URL não ficou pronta a tempo."
          exit 1

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Instalar Vercel CLI
        run: npm install --global vercel@56.4.1

      - name: Criar/vincular projeto Vercel e publicar
        id: deploy
        run: |
          set -euo pipefail
          token="$VERCEL_TOKEN"
          unset VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID

          cd vercel-conecta
          rm -rf .vercel
          vercel link --yes --project neuroped-conecta --token="$token"
          test -f .vercel/project.json

          deployment_url="$(vercel deploy --prod --yes --token="$token")"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Deployment imutável: $deployment_url"
          echo "Alias público: $PUBLIC_URL"

      - name: Validar app no alias público
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            root_code=$(curl -sS -L --max-time 20 -o /tmp/vercel-root.html -w "%{http_code}" "$PUBLIC_URL/" || true)
            app_code=$(curl -sS -L --max-time 20 -o /tmp/vercel-app.html -w "%{http_code}" "$PUBLIC_URL/app" || true)

            if [ "$root_code" = "200" ] \
              && [ "$app_code" = "200" ] \
              && grep -qi "NeuroPed Conecta" /tmp/vercel-root.html; then
              echo "Vercel confirmado: $PUBLIC_URL"
              echo "Root HTTP $root_code · /app HTTP $app_code"
              exit 0
            fi

            echo "Aguardando alias público ($i/24): root=$root_code app=$app_code"
            if [ "$i" -eq 1 ] || [ "$i" -eq 12 ] || [ "$i" -eq 24 ]; then
              head -c 300 /tmp/vercel-root.html 2>/dev/null | tr '\n' ' ' || true
              echo
            fi
            sleep 5
          done

          echo "::error::O alias público não confirmou o NeuroPed Conecta."
          exit 1

      - name: Resumo
        if: always()
        run: |
          echo "## NeuroPed Conecta — Vercel" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Alias público: $PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Origem: $SOURCE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: ${{ steps.deploy.outputs.deployment_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Publicação técnica para demonstração/staging; não liberar dados clínicos reais antes da auditoria final de segurança/LGPD." >> "$GITHUB_STEP_SUMMARY"
