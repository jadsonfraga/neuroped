name: Deploy NeuroPed Conecta Vercel

on:
  push:
    branches:
      - deploy/neuroped-conecta-vercel
    paths:
      - "vercel-conecta/**"
      - "scripts/guards/audit-neuroped-conecta-standalone.mjs"
      - "tests/e2e/neuroped-conecta-vercel-smoke.cjs"
      - ".github/workflows/deploy-neuroped-conecta-vercel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neuroped-conecta-vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_URL: https://neuroped-conecta.lovable.app
      PUBLIC_URL: https://neuroped-conecta.vercel.app
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validar configuração e contratos locais
        run: |
          set -euo pipefail
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::VERCEL_TOKEN ausente"; exit 1; }
          [ -n "$VERCEL_ORG_ID" ] || { echo "::error::VERCEL_ORG_ID ausente"; exit 1; }
          node --check vercel-conecta/api/proxy.mjs
          node --check vercel-conecta/np-preload.js
          node --check vercel-conecta/np-enhance.js
          node --check vercel-conecta/insights.js
          node scripts/guards/audit-neuroped-conecta-standalone.mjs

      - name: Aguardar origem estável do NeuroPed Conecta
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsSL --max-time 20 "$SOURCE_URL/" -o /tmp/source.html \
              && grep -qi "NeuroPed Conecta" /tmp/source.html; then
              echo "Origem Lovable pronta."
              exit 0
            fi
            echo "Aguardando publicação Lovable ($i/36)..."
            sleep 10
          done
          echo "::error::A origem $SOURCE_URL não ficou pronta a tempo."
          exit 1

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Instalar Vercel CLI
        run: npm install --global vercel@56.4.1

      - name: Criar/vincular projeto Vercel e publicar
        id: deploy
        run: |
          set -euo pipefail
          token="$VERCEL_TOKEN"
          unset VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID

          cd vercel-conecta
          rm -rf .vercel
          vercel link --yes --project neuroped-conecta --token="$token"
          test -f .vercel/project.json

          deployment_url="$(vercel deploy --prod --yes --token="$token")"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Deployment imutável: $deployment_url"
          echo "Alias público: $PUBLIC_URL"

      - name: Validar superfícies públicas
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            root_code=$(curl -sS -L --max-time 20 -o /tmp/vercel-root.html -w "%{http_code}" "$PUBLIC_URL/" || true)
            app_code=$(curl -sS -L --max-time 20 -o /tmp/vercel-app.html -w "%{http_code}" "$PUBLIC_URL/app" || true)
            insight_code=$(curl -sS -L --max-time 20 -o /tmp/vercel-insights.html -w "%{http_code}" "$PUBLIC_URL/insights" || true)
            css_code=$(curl -sS -L --max-time 20 -o /tmp/vercel-css -w "%{http_code}" "$PUBLIC_URL/np-enhance.css" || true)
            logo_code=$(curl -sS -L --max-time 20 -o /tmp/vercel-logo -w "%{http_code}" "$PUBLIC_URL/brand-logo.jpeg" || true)

            if [ "$root_code" = "200" ] \
              && [ "$app_code" = "200" ] \
              && [ "$insight_code" = "200" ] \
              && [ "$css_code" = "200" ] \
              && [ "$logo_code" = "200" ] \
              && grep -qi "NeuroPed Conecta" /tmp/vercel-root.html \
              && grep -qi "Insights que mostram o caminho" /tmp/vercel-insights.html \
              && grep -q "np-insight-card" /tmp/vercel-css \
              && [ "$(wc -c < /tmp/vercel-logo)" -gt 10000 ]; then
              echo "Vercel confirmado: $PUBLIC_URL"
              echo "root=$root_code app=$app_code insights=$insight_code css=$css_code logo=$logo_code"
              exit 0
            fi

            echo "Aguardando alias público ($i/24): root=$root_code app=$app_code insights=$insight_code css=$css_code logo=$logo_code"
            sleep 5
          done

          echo "::error::O alias público não confirmou todas as superfícies do NeuroPed Conecta."
          exit 1

      - name: Instalar navegador de QA
        run: |
          set -euo pipefail
          mkdir -p /tmp/neuroped-conecta-qa
          cd /tmp/neuroped-conecta-qa
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium

      - name: Smoke browser anti-regressão
        env:
          NODE_PATH: /tmp/neuroped-conecta-qa/node_modules
          NEUROPED_CONECTA_URL: https://neuroped-conecta.vercel.app
        run: node tests/e2e/neuroped-conecta-vercel-smoke.cjs

      - name: Resumo
        if: always()
        run: |
          echo "## NeuroPed Conecta — Vercel" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Alias público: $PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Origem funcional preservada: $SOURCE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: ${{ steps.deploy.outputs.deployment_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch standalone: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Camada premium + Insights + proteção DEMO/LIVE promovidos somente após contratos locais, smoke HTTP e browser QA." >> "$GITHUB_STEP_SUMMARY"
