name: SaaS commercial canonical guard

# Sem filtro de paths: auth, tenant, rotas e dependências indiretas também contam.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: commercial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commercial-contract:
    name: Commercial SKU and boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false
      - name: Canonical commercial regression
        run: node --import tsx tests/unit/saas-commercial-canonical.test.ts
      - name: Canonical terms binding
        run: node --import tsx tests/unit/saas-commercial-terms.test.ts
      - name: Licensed materials, gate and seats
        run: node --import tsx tests/unit/saas-commercial-materials.test.ts
      - name: Persisted drift and atomic seat integration
        run: node --import tsx tests/unit/saas-commercial-integrity.test.ts
      - name: Fail-closed client context and confirmation
        run: node --import tsx tests/unit/saas-commercial-scope.test.ts
      - name: Adversarial review regressions
        run: node --import tsx tests/unit/saas-commercial-review.test.ts
      - name: Install Chromium for commercial journeys
        run: npx playwright install --with-deps chromium
      - name: Commercial export browser journeys
        run: node scripts/test-commercial-workspace-browser.mjs
      - name: Public plans contract
        run: node tests/unit/planos-page-contract.test.mjs
      - name: TypeScript
        run: npm run check
