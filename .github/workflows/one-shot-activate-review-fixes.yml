name: One-shot activate review fixes

on:
  push:
    branches:
      - agent/scales-lovable-quality-deep
    paths:
      - .github/workflows/one-shot-activate-review-fixes.yml

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/scales-lovable-quality-deep
          fetch-depth: 0
      - name: Activate branch-only corrective workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/one-shot-review-fixes.yml')
          text = path.read_text()
          old = '''on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/one-shot-review-fixes.yml
'''
          new = '''on:
  push:
    branches:
      - agent/scales-lovable-quality-deep
    paths:
      - .github/workflows/one-shot-review-fixes.yml
'''
          if old not in text:
              raise SystemExit('gatilho esperado não encontrado')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/one-shot-activate-review-fixes.yml').unlink()
          PY
      - name: Commit activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): executar correção segura em branch"
          git push origin HEAD:agent/scales-lovable-quality-deep
