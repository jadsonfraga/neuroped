name: Temporary retired ICP secret probe

on:
  push:
    branches:
      - fix/p0-clinical-crypto-20260811
    paths:
      - ".github/workflows/tmp-p0-retired-secrets-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CERT_P12_B64: ${{ secrets.CERT_P12_B64 }}
      CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
    steps:
      - name: Report presence only — never values
        run: |
          set -euo pipefail
          for name in CERT_P12_B64 CERT_P12_PASSWORD; do
            if [ -n "${!name:-}" ]; then
              echo "$name=PRESENT"
            else
              echo "$name=ABSENT"
            fi
          done
