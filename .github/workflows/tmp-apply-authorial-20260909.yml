name: Temporary authorial patch runner

on:
  push:
    branches: [tmp-authorial-patch-runner-20260909]
    paths:
      - '.automation/authorial-20260909.patch.gz.b64'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .automation/authorial-20260909.patch.gz.b64 | gzip -d > /tmp/authorial.patch
          git apply --index /tmp/authorial.patch
          git rm .automation/authorial-20260909.patch.gz.b64
          git rm .github/workflows/tmp-apply-authorial-20260909.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(escalas): integrar autorais recentes e refinar filtro clinico'
          git push origin HEAD:tmp-authorial-patch-runner-20260909
