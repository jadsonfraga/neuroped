name: Agent fix assistance handoff

on:
  push:
    branches:
      - agent/visual-9-9-gates-green
    paths:
      - ".github/workflows/agent-fix-assistance-handoff.yml"

permissions:
  contents: write

jobs:
  fix-assistance-handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/visual-9-9-gates-green
          fetch-depth: 0

      - name: Apply deterministic assistance patch
        run: |
          python3 .github/agent/apply-assistance-direct.py
          python3 .github/agent/patch-floating-help-contract.py
          python3 .github/agent/patch-tour-handoff-timing.py
          python3 .github/agent/patch-welcome-tour-eager.py

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate contracts and browser states
        run: |
          git diff --check
          node tests/unit/flow-os-navigation-static.test.mjs
          node tests/unit/assistance-surface-static.test.mjs
          npm run check
          npm run build:client
          node scripts/audit-assistance-states.mjs

      - name: Commit validated product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/App.tsx client/src/components/FloatingHelp.tsx client/src/components/WelcomeTour.tsx scripts/audit-assistance-states.mjs tests/unit/assistance-surface-static.test.mjs tests/unit/flow-os-navigation-static.test.mjs
          git commit -m "fix: serialize assistance surfaces"
          git push origin HEAD:agent/visual-9-9-gates-green
