name: Agent fix assistance handoff

on:
  push:
    branches:
      - agent/visual-9-9-gates-green
    paths:
      - ".github/workflows/agent-fix-assistance-handoff.yml"

permissions:
  contents: write

jobs:
  fix-assistance-handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/visual-9-9-gates-green
          fetch-depth: 0

      - name: Make assistance handoff deterministic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub_once(path: str, pattern: str, replacement: str, flags: int = 0) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              file.write_text(updated, encoding="utf-8")

          sub_once(
              "client/src/App.tsx",
              r'import \{ FloatingHelp \} from "@/components/FloatingHelp";\n',
              'import { FloatingHelp } from "@/components/FloatingHelp";\nimport { PreferencesPanel } from "@/components/PreferencesPanel";\nimport { WelcomeTour } from "@/components/WelcomeTour";\n',
          )
          sub_once(
              "client/src/App.tsx",
              r'const PreferencesPanel = lazy\(\(\) =>\n\s*import\("@/components/PreferencesPanel"\)\.then\(\(\{ PreferencesPanel \}\) => \(\{\n\s*default: PreferencesPanel,\n\s*\}\)\),\n\);\n\n',
              '',
          )
          sub_once(
              "client/src/App.tsx",
              r'const WelcomeTour = lazy\(\(\) =>\n\s*import\("@/components/WelcomeTour"\)\.then\(\(mod\) => \(\{\n\s*default: mod\.WelcomeTour,\n\s*\}\)\),\n\);\n',
              '',
          )
          sub_once(
              "client/src/App.tsx",
              r'\s*\{auxiliarySurfacesVisible && \(\n\s*<Suspense fallback=\{null\}>\n\s*<WelcomeTour />\n\s*</Suspense>\n\s*\)\}\n',
              '\n',
          )
          sub_once(
              "client/src/App.tsx",
              r'\s*<InstallPrompt />\n\s*<Suspense fallback=\{null\}>\n\s*<PreferencesPanel />\n\s*</Suspense>\n\s*<FloatingHelp />',
              '''
                    <InstallPrompt />
                    <PreferencesPanel />
                    <WelcomeTour />
                    <FloatingHelp />''',
          )

          sub_once(
              "client/src/components/FloatingHelp.tsx",
              r'  function openAuxiliarySurface\(eventName: string\) \{\n\s*setOpen\(false\);\n\s*window\.requestAnimationFrame\(\(\) => \{\n\s*window\.dispatchEvent\(new Event\(eventName\)\);\n\s*\}\);\n\s*\}',
              '''  function openAuxiliarySurface(eventName: string) {
            setOpen(false);
            // Aguarda a animação de saída do Dialog antes de montar a próxima
            // superfície. Assim só existe um modal e um dono de foco por vez.
            window.setTimeout(() => {
              window.dispatchEvent(new Event(eventName));
            }, 220);
          }''',
          )

          sub_once(
              "scripts/audit-assistance-states.mjs",
              r'      const visible = \(element\) => \{\n\s*if \(!\(element instanceof HTMLElement\)\) return false;\n\s*const style = getComputedStyle\(element\);\n\s*const box = element\.getBoundingClientRect\(\);\n\s*return style\.display !== "none"\n\s*&& style\.visibility !== "hidden"\n\s*&& Number\(style\.opacity\) !== 0\n\s*&& box\.width > 0\n\s*&& box\.height > 0;\n\s*\};',
              '''      const visible = (element) => {
            if (!(element instanceof HTMLElement)) return false;
            if (
              element.closest('[hidden], [inert], [aria-hidden="true"], [data-state="closed"]')
            ) return false;
            const style = getComputedStyle(element);
            const box = element.getBoundingClientRect();
            return style.display !== "none"
              && style.visibility !== "hidden"
              && Number(style.opacity) !== 0
              && box.width > 0
              && box.height > 0
              && box.right > 0
              && box.bottom > 0
              && box.left < innerWidth
              && box.top < innerHeight;
          };''',
          )

          sub_once(
              "tests/unit/assistance-surface-static.test.mjs",
              r'assert\.match\(\n  app,\n  /<PreferencesPanel \\/>/,\n  "o receptor de preferências deve permanecer montado no aplicativo",\n\);',
              '''assert.match(
            app,
            /<PreferencesPanel \/>[\s\S]*<WelcomeTour \/>[\s\S]*<FloatingHelp \/>/,
            "ajuda, preferências e tour devem compartilhar o mesmo host auxiliar",
          );
          assert.doesNotMatch(
            app,
            /<PrivateGate>[\s\S]*<WelcomeTour \/>[\s\S]*<\/PrivateGate>/,
            "o tour não pode depender do ciclo de vida do gate clínico",
          );''',
          )
          PY

      - name: Install dependencies and real Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate assistance contracts
        run: |
          git diff --check
          node tests/unit/flow-os-navigation-static.test.mjs
          node tests/unit/assistance-surface-static.test.mjs
          npm run check
          npm run build:client
          node scripts/audit-assistance-states.mjs

      - name: Commit assistance fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/App.tsx client/src/components/FloatingHelp.tsx scripts/audit-assistance-states.mjs tests/unit/assistance-surface-static.test.mjs
          git commit -m "fix: serialize assistance surfaces"
          git push origin HEAD:agent/visual-9-9-gates-green
