name: DrJadsoneye Navigation

on:
  pull_request:
    branches: [main]
    paths:
      - "client/src/components/DrJadsoneyeShortcut.tsx"
      - "client/src/components/Layout.tsx"
      - "client/src/security/**"
      - "client/src/data/legacyInstrumentRoutes.ts"
      - "tests/unit/drjadsoneye-shortcut.test.mjs"
      - "tests/unit/route-guard-policy.test.ts"
      - ".github/workflows/drjadsoneye-navigation.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "client/src/components/DrJadsoneyeShortcut.tsx"
      - "client/src/components/Layout.tsx"
      - "client/src/security/**"
      - "client/src/data/legacyInstrumentRoutes.ts"
      - "tests/unit/drjadsoneye-shortcut.test.mjs"
      - "tests/unit/route-guard-policy.test.ts"
      - ".github/workflows/drjadsoneye-navigation.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drjadsoneye-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation:
    name: DrJadsoneye shortcut contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Render and verify the external shortcut
        run: node --test tests/unit/drjadsoneye-shortcut.test.mjs
      - name: Preserve existing fail-closed navigation access
        run: node --import tsx tests/unit/route-guard-policy.test.ts
      - name: Published destination HTTP smoke
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const source = readFileSync('client/src/components/DrJadsoneyeShortcut.tsx', 'utf8');
          const match = source.match(/export const DRJADSONEYE_URL = "([^"]+)"/);
          assert.ok(match, 'The public application URL must be explicit');
          assert.equal(match[1], 'https://drjadsoneye.lovable.app');
          const response = await fetch(match[1], {
            redirect: 'follow',
            signal: AbortSignal.timeout(20000),
          });
          const result = {
            requestedUrl: match[1],
            finalUrl: response.url,
            status: response.status,
            contentType: response.headers.get('content-type'),
          };
          console.log(JSON.stringify(result));
          assert.ok(response.ok, 'The published destination must respond successfully');
          assert.equal(new URL(response.url).origin, 'https://drjadsoneye.lovable.app');
          assert.match(result.contentType ?? '', /text\/html/i);
          assert.ok((await response.text()).trim().length > 0, 'The response must not be empty');
          // HTTP availability only: this does not validate camera use or clinical accuracy.
          NODE
