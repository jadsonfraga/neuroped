# Gate de testes — roda em todo PR e push (exceto main, que já roda no deploy).
# Trava regressões ANTES do merge: estático, smoke, motor pré-consulta,
# testes clínicos V3.2+V4 (100%) e scorecard 7→9 (5/5 alvo).
name: Tests — pre-merge gate

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sem marcadores de conflito de merge
        run: node scripts/check-no-conflicts.mjs
      - name: Versão única (package.json = sw.js)
        run: node scripts/check-version.mjs
      - name: Contraste WCAG AA (tokens)
        run: node scripts/check-contrast.mjs --strict
      - name: Contrato de tema (cascata tokens→palette-v2)
        run: node scripts/check-theme.mjs --strict
      - name: Anti-sprawl de estilos (inventário congelado)
        run: node scripts/check-styles.mjs --strict
      - name: Static checks (test-static)
        run: node scripts/test-static.mjs
      - name: Smoke E2E
        run: node scripts/smoke.mjs
      - name: Motor de pré-consulta (gate + ranking)
        run: node scripts/test-preconsulta-engine.mjs
      - name: Testes clínicos V3.2+V4 — exige 100%
        run: node tests/run-clinical-tests.mjs
      - name: Scorecard 7→9 — 5/5 métricas no alvo
        run: node scripts/audit-report.mjs --strict
