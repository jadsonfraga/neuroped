name: Verify Legacy Manual

# Workflow legado preservado apenas para execução manual.
# A catraca canônica de push/PR agora é `.github/workflows/verify.yml`.
# Deploys seguem protegidos por `.github/workflows/deploy.yml` e `.github/workflows/deploy-cloudflare.yml`.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-legacy:
    runs-on: ubuntu-latest
    name: verify completo manual
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Instalar Chromium para os testes E2E
        run: npx playwright install --with-deps chromium

      - name: Verify manual completo
        run: npm run verify
