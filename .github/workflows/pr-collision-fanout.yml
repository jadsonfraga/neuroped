name: NeuroPED PR Collision Quarantine

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: neuroped-pr-quarantine-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  quarantine:
    name: Quarentena de base e colisões
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Segurança: usa somente a definição protegida da main. Não há checkout,
      # build, import ou execução de conteúdo vindo de pull requests.
      - name: Colocar em draft PRs desatualizados ou concorrentes
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseRef = "main";
            const marker = "<!-- neuroped-collision-quarantine -->";

            const filePaths = (file) =>
              [...new Set([file.filename, file.previous_filename].filter(Boolean))];

            const exactCritical = new Set([
              "package.json",
              "package-lock.json",
              "client/src/App.tsx",
              "client/src/main.tsx",
              "client/src/pages/home.tsx",
              "vite.config.ts",
              "wrangler.toml",
              "vercel.json",
            ]);
            const criticalPrefixes = [
              ".github/workflows/",
              "server/",
              "functions/",
              "shared/",
              "db/migrations/",
              "migrations/",
              "client/src/pages/",
              "client/src/components/",
              "client/src/contexts/",
              "client/src/security/",
              "client/src/lib/auth",
            ];
            const isCritical = (path) =>
              exactCritical.has(path) ||
              criticalPrefixes.some((prefix) => path.startsWith(prefix));

            async function freshPull(number) {
              const { data } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: number,
              });
              return data;
            }

            async function behindBy(pull) {
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${pull.base.ref}...${pull.head.sha}`,
                per_page: 1,
              });
              return Number(comparison.data.behind_by ?? 0);
            }

            async function pullPaths(number) {
              const files = await github.paginate(
                github.rest.pulls.listFiles,
                { owner, repo, pull_number: number, per_page: 100 },
              );
              return new Set(files.flatMap(filePaths));
            }

            async function quarantinePull(pull, reasons) {
              const current = await freshPull(pull.number);
              if (current.state !== "open" || current.draft) {
                return { number: current.number, changed: false, alreadySafe: true };
              }

              await github.graphql(
                `mutation ConvertToDraft($pullRequestId: ID!) {
                  convertPullRequestToDraft(
                    input: { pullRequestId: $pullRequestId }
                  ) {
                    pullRequest {
                      id
                      number
                      isDraft
                    }
                  }
                }`,
                { pullRequestId: current.node_id },
              );

              const body = `${marker}
            ## 🔒 Quarentena automática de integração

            Este PR foi convertido para **draft** porque a integração segura exige uma nova reconciliação.

            ${reasons.map((reason) => `- ${reason}`).join("\n")}

            Para voltar a **Ready for review**:
            1. incorpore a \`main\` atual;
            2. reconcilie os arquivos críticos indicados;
            3. execute novamente todos os checks;
            4. só então marque o PR como pronto para revisão.

            Nenhum commit foi removido, nenhuma branch foi apagada e nenhum deploy foi executado.`;

              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: current.number,
                  per_page: 100,
                },
              );
              const previous = comments.find(
                (comment) =>
                  comment.user?.type === "Bot" &&
                  comment.body?.includes(marker),
              );

              if (previous) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: previous.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: current.number,
                  body,
                });
              }

              return { number: current.number, changed: true, alreadySafe: false };
            }

            const quarantined = [];
            const safe = [];
            const failures = [];

            if (context.eventName === "push") {
              // Quando a main avança, qualquer PR não-draft que fique atrás
              // volta a draft. Isso força atualização real da branch e novos
              // checks associados ao SHA correto do PR — sem status lateral.
              const openPulls = await github.paginate(
                github.rest.pulls.list,
                {
                  owner,
                  repo,
                  state: "open",
                  base: baseRef,
                  sort: "updated",
                  direction: "desc",
                  per_page: 100,
                },
              );

              for (const listed of openPulls) {
                if (listed.draft) continue;
                try {
                  const pull = await freshPull(listed.number);
                  const behind = await behindBy(pull);
                  if (behind <= 0) {
                    safe.push(pull.number);
                    continue;
                  }
                  const result = await quarantinePull(pull, [
                    `A branch está ${behind} commit(s) atrás da \`${baseRef}\` após a atualização ${context.sha.slice(0, 12)}.`,
                  ]);
                  if (result.changed) quarantined.push(result.number);
                } catch (error) {
                  failures.push({
                    number: listed.number,
                    message: error?.message ?? String(error),
                  });
                }
              }
            } else {
              const payloadPr = context.payload.pull_request;
              if (!payloadPr?.number) {
                core.setFailed("Evento pull_request_target sem número de PR.");
                return;
              }

              try {
                const pull = await freshPull(payloadPr.number);
                if (pull.state !== "open" || pull.draft) {
                  safe.push(pull.number);
                } else {
                  const reasons = [];
                  const behind = await behindBy(pull);
                  if (behind > 0) {
                    reasons.push(
                      `A branch está ${behind} commit(s) atrás da \`${pull.base.ref}\`.`,
                    );
                  }

                  const currentPaths = await pullPaths(pull.number);
                  const peers = await github.paginate(
                    github.rest.pulls.list,
                    {
                      owner,
                      repo,
                      state: "open",
                      base: pull.base.ref,
                      sort: "updated",
                      direction: "desc",
                      per_page: 100,
                    },
                  );

                  for (const peer of peers) {
                    if (
                      peer.number === pull.number ||
                      peer.draft ||
                      peer.state !== "open"
                    ) {
                      continue;
                    }
                    const peerPaths = await pullPaths(peer.number);
                    const sharedCritical = [
                      ...new Set(
                        [...peerPaths].filter(
                          (path) => currentPaths.has(path) && isCritical(path),
                        ),
                      ),
                    ];
                    if (sharedCritical.length > 0) {
                      reasons.push(
                        `Colisão crítica com o PR #${peer.number}: ${sharedCritical
                          .map((path) => `\`${path}\``)
                          .join(", ")}.`,
                      );
                    }
                  }

                  if (reasons.length > 0) {
                    const result = await quarantinePull(pull, reasons);
                    if (result.changed) quarantined.push(result.number);
                  } else {
                    safe.push(pull.number);
                  }
                }
              } catch (error) {
                failures.push({
                  number: payloadPr.number,
                  message: error?.message ?? String(error),
                });
              }
            }

            core.summary
              .addHeading("NeuroPED — quarentena antirregressão")
              .addTable([
                [
                  { data: "Indicador", header: true },
                  { data: "Resultado", header: true },
                ],
                ["Evento", context.eventName],
                ["PRs convertidos para draft", String(quarantined.length)],
                ["PRs já seguros", String(safe.length)],
                ["Falhas inesperadas", String(failures.length)],
              ]);

            if (quarantined.length > 0) {
              core.summary.addRaw(
                `\nQuarentena aplicada: ${quarantined.map((number) => `#${number}`).join(", ")}.\n`,
              );
            }
            if (failures.length > 0) {
              core.summary.addHeading("Falhas", 2);
              for (const failure of failures) {
                core.summary.addRaw(
                  `- PR #${failure.number}: ${failure.message}\n`,
                );
              }
            }
            await core.summary.write();

            if (failures.length > 0) {
              core.setFailed(
                `Não foi possível colocar ${failures.length} PR(s) em quarentena.`,
              );
            }
