name: NeuroPed SaaS Solo Trial Seats

on:
  push:
    branches:
      - main
    paths:
      - "db/migrations/0038_neuroped_solo_default_seat.sql"
      - "functions/api/billing/**"
      - "tests/unit/saas-billing*.test.ts"
      - ".github/workflows/saas-billing-trial-seats.yml"
  workflow_dispatch:

# Grupo próprio por workflow: migração D1 não disputa o único slot pendente
# do deploy Cloudflare. A ordem entre escritas D1 é garantida pela fila em
# scripts/ci/wait-d1-writers.mjs.
concurrency:
  group: d1-migration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  migrate-trial-seats:
    runs-on: ubuntu-latest
    timeout-minutes: 80 # inclui até 45 min de espera na fila D1
    steps:
      - name: Confirmar branch de produção
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "::error::Migração de billing permitida somente a partir de main."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Catraca de billing antes do D1 remoto
        run: |
          set -euo pipefail
          npm run check
          npm run lint
          node --import tsx tests/unit/saas-billing-contract.test.ts
          node --import tsx tests/unit/saas-billing-provider.test.ts

      - name: Validar credenciais Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID ausente"; exit 1; }

      # Fila das escritas D1 sem pending slot: ver scripts/ci/wait-d1-writers.mjs.
      - name: Aguardar fila de escritas D1 (migration)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: migration
        run: node scripts/ci/wait-d1-writers.mjs

      - name: Aplicar default Solo 0038 para novos trials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote --yes \
            --file=./db/migrations/0038_neuroped_solo_default_seat.sql

      - name: Verificar contrato físico do trial
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='trigger' AND name='trg_clinic_create_billing_trial';" \
            > /tmp/trial-trigger.txt 2>&1
          cat /tmp/trial-trigger.txt
          grep -q "trg_clinic_create_billing_trial" /tmp/trial-trigger.txt || {
            echo "::error::Trigger de criação do trial ausente."
            exit 1
          }

          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT CASE WHEN instr(replace(replace(replace(sql, char(10), ''), char(13), ''), ' ', ''), '''saas-professional'',1,''trial''') > 0 THEN 'SOLO_TRIGGER_OK' ELSE 'SOLO_TRIGGER_INVALID' END AS status FROM sqlite_master WHERE type='trigger' AND name='trg_clinic_create_billing_trial';" \
            > /tmp/solo-trigger.txt 2>&1
          cat /tmp/solo-trigger.txt
          grep -q "SOLO_TRIGGER_OK" /tmp/solo-trigger.txt || {
            echo "::error::Trigger de novos trials não usa um assento Solo."
            exit 1
          }

          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT CASE WHEN COUNT(*) = 0 THEN 'SOLO_TRIAL_POLICY_OK' ELSE 'SOLO_TRIAL_POLICY_VIOLATION' END AS status FROM billing_subscriptions bs JOIN billing_customers bc ON bc.id = bs.customer_id WHERE bs.status = 'trial' AND COALESCE(bs.seats, 0) < (SELECT COUNT(*) FROM clinic_memberships cm WHERE cm.clinic_id = bc.clinic_id AND cm.active = 1);" \
            > /tmp/solo-trial-policy.txt 2>&1
          cat /tmp/solo-trial-policy.txt
          grep -q "SOLO_TRIAL_POLICY_OK" /tmp/solo-trial-policy.txt || {
            echo "::error::Há trial com menos assentos que membros ativos."
            exit 1
          }
          echo "✅ Default Solo e preservação de capacidade comprovados no D1 remoto."
