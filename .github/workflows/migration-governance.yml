name: Migration governance

on:
  pull_request:
    branches: [main]
    paths:
      - "db/migrations/**"
      - ".github/workflows/migration-governance.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: migration-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Migration governance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enforce immutable monotonic migrations and detect open-PR collisions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          base = os.environ.get("BASE_SHA", "").strip()
          head = os.environ.get("HEAD_SHA", "").strip()
          migration_pattern = re.compile(r"^db/migrations/(\d{4})_[^/]+\.sql$")
          errors = []

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).splitlines()

          def ensure_commit(sha):
              if not sha:
                  return
              try:
                  subprocess.check_call(
                      ["git", "cat-file", "-e", f"{sha}^{{commit}}"],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  subprocess.check_call(["git", "fetch", "--no-tags", "origin", sha])

          # Legado: a main já possui prefixo 0008 duplicado. Não reescrevemos
          # história. O gate é incremental: migrações existentes são imutáveis,
          # e qualquer nova migração deve usar prefixo estritamente posterior.
          if base and head:
              ensure_commit(base)
              ensure_commit(head)
              changes = git("diff", "--name-status", base, head, "--", "db/migrations")
              added = []

              for line in changes:
                  parts = line.split("\t")
                  status = parts[0]
                  paths = parts[1:]

                  if status == "A" and len(paths) == 1:
                      path = paths[0]
                      if not path.endswith(".sql"):
                          continue
                      match = migration_pattern.match(path)
                      if not match:
                          errors.append(f"{path}: nova migration deve seguir NNNN_nome.sql")
                          continue
                      added.append((path, match.group(1)))
                      continue

                  if any(path.endswith(".sql") for path in paths):
                      errors.append(
                          f"{' -> '.join(paths)}: migrations existentes são imutáveis (status {status})"
                      )

              base_paths = git("ls-tree", "-r", "--name-only", base, "--", "db/migrations")
              base_prefixes = {}
              for path in base_paths:
                  match = migration_pattern.match(path)
                  if match:
                      base_prefixes.setdefault(match.group(1), []).append(path)

              max_base = max((int(prefix) for prefix in base_prefixes), default=0)
              seen_in_pr = {}
              for path, prefix in added:
                  if prefix in base_prefixes:
                      errors.append(
                          f"{path}: prefixo {prefix} já existe na base: "
                          + ", ".join(base_prefixes[prefix])
                      )
                  if int(prefix) <= max_base:
                      errors.append(
                          f"{path}: prefixo {prefix} deve ser maior que o maior prefixo da base ({max_base:04d})"
                      )
                  if prefix in seen_in_pr:
                      errors.append(
                          f"{path}: prefixo {prefix} duplicado no mesmo PR ({seen_in_pr[prefix]})"
                      )
                  else:
                      seen_in_pr[prefix] = path

          def api(path):
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "neuroped-migration-governance",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          # Detecta o caso que o diff isolado de cada PR não vê: dois PRs abertos
          # escolhendo simultaneamente o mesmo próximo prefixo (ex.: duas 0019).
          try:
              pulls = []
              page = 1
              while True:
                  batch = api(f"/repos/{repo}/pulls?state=open&per_page=100&page={page}")
                  pulls.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1

              ownership = {}
              for pull in pulls:
                  number = pull["number"]
                  file_page = 1
                  while True:
                      files = api(
                          f"/repos/{repo}/pulls/{number}/files?per_page=100&page={file_page}"
                      )
                      for item in files:
                          if item.get("status") != "added":
                              continue
                          path = item["filename"]
                          match = migration_pattern.match(path)
                          if match:
                              ownership.setdefault(match.group(1), []).append((number, path))
                      if len(files) < 100:
                          break
                      file_page += 1

              for prefix, entries in ownership.items():
                  pull_numbers = sorted({number for number, _ in entries})
                  if len(pull_numbers) > 1:
                      detail = ", ".join(f"#{number} ({path})" for number, path in entries)
                      errors.append(f"prefixo {prefix} concorre entre PRs abertos: {detail}")
          except Exception as exc:
              errors.append(f"não foi possível auditar PRs abertos via GitHub API: {exc}")

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              print(f"\nMigration governance: {len(errors)} problema(s).")
              sys.exit(1)

          print(
              "Migration governance: OK — migrations novas são monotônicas/imutáveis "
              "e não há colisão de prefixos entre PRs abertos."
          )
          PY
