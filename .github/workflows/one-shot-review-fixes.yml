name: One-shot safe regression fixes

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/one-shot-review-fixes.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/scales-lovable-quality-deep
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply focused regression fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Gate de licença ANTES de qualquer runner e relacionados com idade compatível.
          path = Path('client/src/pages/generic-scale.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''  const scale = allScales.find((s) => s.id === scaleId);

  const runnerDef = getInteractiveRunnerScale(scaleId);
  if (runnerDef) {
    return (
      <div className="mx-auto max-w-3xl p-3 sm:p-5">
        <InteractiveScaleRunner def={runnerDef} />
      </div>
    );
  }

  if (!scale) {'''
          new = '''  const scale = allScales.find((s) => s.id === scaleId);

  if (!scale) {'''
          if old not in text:
              raise SystemExit('bloco inicial da ficha não encontrado')
          text = text.replace(old, new, 1)

          marker = '''  const itemDef = getInteractiveItemScale(scaleId);
  if (itemDef) {'''
          gated = '''  const licenseRequiresAuthorization = [
    "comercial",
    "restrita",
    "contato_autor",
  ].includes(scale.licencaUso ?? "");

  const runnerDef = !licenseRequiresAuthorization
    ? getInteractiveRunnerScale(scaleId)
    : undefined;
  if (runnerDef) {
    return (
      <div className="mx-auto max-w-3xl p-3 sm:p-5">
        <InteractiveScaleRunner def={runnerDef} />
      </div>
    );
  }

  const itemDef = !licenseRequiresAuthorization
    ? getInteractiveItemScale(scaleId)
    : undefined;
  if (itemDef) {'''
          if marker not in text:
              raise SystemExit('bloco itemDef não encontrado')
          text = text.replace(marker, gated, 1)

          separate = '''  const hasSeparateOfficialApplication =
    implementationStatus === "complete" && officialRoute !== genericRoute;'''
          enhanced = separate + '''
  const canOfferOfficialApplication =
    hasSeparateOfficialApplication && !licenseRequiresAuthorization;'''
          if enhanced not in text:
              if separate not in text:
                  raise SystemExit('bloco de aplicação separada não encontrado')
              text = text.replace(separate, enhanced, 1)

          text = text.replace('''          hasSeparateOfficialApplication
            ? "border-emerald-300/60''', '''          canOfferOfficialApplication
            ? "border-emerald-300/60''', 1)
          text = text.replace('''        {hasSeparateOfficialApplication
          ? "A aplicação completa existe em uma rota própria. Esta página organiza metadados e um registro observacional complementar."
          : getImplementationLabel(implementationStatus)}''', '''        {canOfferOfficialApplication
          ? "A aplicação completa existe em uma rota própria. Esta página organiza metadados e um registro observacional complementar."
          : hasSeparateOfficialApplication && licenseRequiresAuthorization
            ? "Existe uma implementação separada, mas esta ficha não oferece acesso porque a licença requer autorização documentada."
            : getImplementationLabel(implementationStatus)}''', 1)
          text = text.replace('{hasSeparateOfficialApplication && (', '{canOfferOfficialApplication && (', 1)

          text = text.replace('''      return { candidate, score };
    })
    .filter(({ score }) => score >= 10)''', '''      return { candidate, score, ageOverlap };
    })
    .filter(({ score, ageOverlap }) => ageOverlap && score >= 10)''', 1)
          path.write_text(text, encoding='utf-8')

          # 2) Guard de rotas: aceita catch-all apenas para IDs canônicos existentes.
          path = Path('scripts/guards/audit-filter-fillable.mjs')
          text = path.read_text(encoding='utf-8')
          anchor = '''const registeredRoutes = new Set(
  [...appSource.matchAll(/<Route\\s+path="([^\"]+)"/g)].map(
    (match) => match[1],
  ),
);
'''
          helper = anchor + '''const hasRegisteredRecommendationRoute = (route) => {
  if (registeredRoutes.has(route)) return true;
  const match = route.match(/^\\/generic-scale\\/([^/?#]+)$/);
  return Boolean(
    match &&
      registeredRoutes.has("/generic-scale/:id") &&
      allScaleIds.has(match[1]),
  );
};
'''
          if 'const hasRegisteredRecommendationRoute' not in text:
              if anchor not in text:
                  raise SystemExit('registro de rotas não encontrado')
              text = text.replace(anchor, helper, 1)
          text = text.replace('registeredRoutes.has(item.route),', 'hasRegisteredRecommendationRoute(item.route),', 1)
          path.write_text(text, encoding='utf-8')

          # 3) Contratos específicos de licença, ordem do gate, idade e rota dinâmica.
          path = Path('scripts/guards/audit-scale-experience.mjs')
          text = path.read_text(encoding='utf-8')
          insertion = '''
check(
  genericPage.indexOf("licenseRequiresAuthorization") <
    genericPage.indexOf("getInteractiveRunnerScale(scaleId)") &&
    genericPage.includes("!licenseRequiresAuthorization") &&
    genericPage.includes("ageOverlap && score >= 10") &&
    genericPage.includes("{canOfferOfficialApplication && ("),
  "ficha genérica perdeu gate de licença antecipado, sobreposição etária ou CTA seguro",
);
'''
          if 'ficha genérica perdeu gate de licença antecipado' not in text:
              pos = text.rfind('if (violations.length')
              if pos < 0:
                  raise SystemExit('final da auditoria de escalas não encontrado')
              text = text[:pos] + insertion + '\n' + text[pos:]
          path.write_text(text, encoding='utf-8')

          # O workflow é transitório e não deve permanecer no diff final.
          Path('.github/workflows/one-shot-review-fixes.yml').unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify focused and release contracts
        run: |
          npm run audit:filter-fillable
          npm run audit:scale-experience
          npm run check
          npm run lint
          npm run build
          npm run verify:release

      - name: Commit only after all validations pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/generic-scale.tsx scripts/guards/audit-filter-fillable.mjs scripts/guards/audit-scale-experience.mjs .github/workflows/one-shot-review-fixes.yml
          git commit -m "fix(escalas): bloquear regressões de licença, idade e rotas"
          git push origin HEAD:agent/scales-lovable-quality-deep
