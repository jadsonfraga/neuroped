name: One-shot final safety fixes

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/one-shot-review-fixes.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/scales-lovable-quality-deep
          fetch-depth: 0
      - name: Patch regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          guard = Path('scripts/guards/audit-filter-fillable.mjs')
          s = guard.read_text()
          anchor = '''const registeredRoutes = new Set(
  [...appSource.matchAll(/<Route\\s+path="([^\"]+)"/g)].map(
    (match) => match[1],
  ),
);
'''
          addition = anchor + '''const isRegisteredRecommendationRoute = (route) => {
  if (registeredRoutes.has(route)) return true;
  const match = route.match(/^\\/generic-scale\\/([^/]+)$/);
  return Boolean(match && registeredRoutes.has("/generic-scale/:id") && allScaleIds.has(match[1]));
};
check(isRegisteredRecommendationRoute("/generic-scale/abc"), "rota dinâmica canônica não reconhecida");
check(!isRegisteredRecommendationRoute("/generic-scale/__missing__"), "rota dinâmica aceitou ID inexistente");
'''
          if 'isRegisteredRecommendationRoute' not in s:
              s = s.replace(anchor, addition, 1)
          s = s.replace('registeredRoutes.has(item.route)', 'isRegisteredRecommendationRoute(item.route)')
          guard.write_text(s)

          page = Path('client/src/pages/generic-scale.tsx')
          s = page.read_text()
          scale_line = '  const scale = allScales.find((s) => s.id === scaleId);\n'
          gate = '''  const licenseRequiresAuthorization = Boolean(
    scale && ["comercial", "restrita", "contato_autor"].includes(scale.licencaUso ?? ""),
  );
'''
          if 'const licenseRequiresAuthorization = Boolean(' not in s:
              s = s.replace(scale_line, scale_line + gate, 1)
          s = s.replace('  if (runnerDef) {', '  if (runnerDef && !licenseRequiresAuthorization) {', 1)
          s = s.replace('  if (itemDef) {', '  if (itemDef && !licenseRequiresAuthorization) {', 1)
          sep = '''  const hasSeparateOfficialApplication =
    implementationStatus === "complete" && officialRoute !== genericRoute;
'''
          if 'const canOfferOfficialApplication =' not in s:
              s = s.replace(sep, sep + '''  const canOfferOfficialApplication =
    hasSeparateOfficialApplication && !licenseRequiresAuthorization;
''', 1)
          s = s.replace('          hasSeparateOfficialApplication\n            ?', '          canOfferOfficialApplication\n            ?', 1)
          s = s.replace('        {hasSeparateOfficialApplication\n          ? "A aplicação completa existe em uma rota própria. Esta página organiza metadados e um registro observacional complementar."\n          : getImplementationLabel(implementationStatus)}', '        {canOfferOfficialApplication\n          ? "A aplicação completa existe em uma rota própria. Esta página organiza metadados e um registro observacional complementar."\n          : hasSeparateOfficialApplication && licenseRequiresAuthorization\n            ? "Existe uma implementação separada, mas esta ficha não oferece acesso porque a licença requer autorização documentada."\n            : getImplementationLabel(implementationStatus)}', 1)
          s = s.replace('        {hasSeparateOfficialApplication && (', '        {canOfferOfficialApplication && (', 1)
          s = s.replace('      return { candidate, score };', '      return { candidate, score, ageOverlap };', 1)
          s = s.replace('.filter(({ score }) => score >= 10)', '.filter(({ score, ageOverlap }) => ageOverlap && score >= 10)', 1)
          page.write_text(s)

          audit = Path('scripts/guards/audit-scale-experience.mjs')
          s = audit.read_text()
          s = s.replace('''  check(
    recommendation.route ===
      (canonical.appRoute || `/generic-scale/${canonical.id}`),
    `${recommendation.id}: rota diverge do catálogo`,
  );''', '''  const protectedLicense = ["comercial", "restrita", "contato_autor"].includes(canonical.licencaUso);
  const expectedRoute = protectedLicense ? `/generic-scale/${canonical.id}` : canonical.appRoute || `/generic-scale/${canonical.id}`;
  check(recommendation.route === expectedRoute, `${recommendation.id}: rota diverge da política canônica/licença`);
  if (recommendation.id === "abc-pais") check(recommendation.route === "/generic-scale/abc", "ABC comercial voltou a promover aplicação");''', 1)
          marker = '  "ficha genérica voltou a se apresentar como aplicação preenchível",\n);'
          if 'ficha genérica voltou a executar aplicação licenciada' not in s:
              s = s.replace(marker, marker + '''
check(
  genericPage.includes("licenseRequiresAuthorization") &&
    genericPage.includes("if (runnerDef && !licenseRequiresAuthorization)") &&
    genericPage.includes("if (itemDef && !licenseRequiresAuthorization)") &&
    genericPage.includes("canOfferOfficialApplication"),
  "ficha genérica voltou a executar aplicação licenciada",
);
check(
  genericPage.includes(".filter(({ score, ageOverlap }) => ageOverlap && score >= 10)"),
  "relacionados voltaram a ignorar sobreposição etária",
);''', 1)
          runner_marker = '  "runner interativo perdeu padrão visual ou navegação para pendência",\n);'
          if 'runner interativo perdeu navegação real de radiogroup' not in s:
              s = s.replace(runner_marker, runner_marker + '''
check(
  runnerPage.includes("RadioGroup") && runnerPage.includes("RadioGroupItem") && runnerPage.includes("onValueChange") && !runnerPage.includes('role="radio"'),
  "runner interativo perdeu navegação real de radiogroup",
);''', 1)
          audit.write_text(s)

          for p in ['.github/workflows/one-shot-activate-review-fixes.yml', '.github/workflows/one-shot-review-fixes.yml']:
              Path(p).unlink(missing_ok=True)
          PY
      - name: Verify
        run: |
          npm ci
          npm run audit:filter-fillable
          npm run audit:scale-experience
          npm run check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(escalas): fechar regressões de licença, idade e rotas"
          git push origin HEAD:agent/scales-lovable-quality-deep
