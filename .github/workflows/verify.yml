name: Verify NeuroPed

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-neuroped-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, catalog, access, identity, assets, clinical tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      # Gate técnico determinístico. `validate:safety` permanece no `npm run
      # verify` e exige homologação clínica explícita para instrumentos ainda
      # não congelados; não é mascarado nem reclassificado pelo CI.
      - name: Run hard release verification gate
        run: npm run verify:release

      - name: Build application
        run: npm run build

      - name: Audit real initial JavaScript payload
        run: npm run test:bundle-audit && npm run audit:bundle
