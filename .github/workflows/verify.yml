name: Verify NeuroPed

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-neuroped-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, catalog, access, identity, assets, clinical tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: TypeScript check
        run: npm run check

      - name: Validate clinical catalog
        run: npm run validate:catalog

      - name: Audit access policy
        run: npm run audit:access

      - name: Audit institutional identity
        run: npm run audit:identity

      - name: Audit navigation routes
        run: npm run audit:navigation

      - name: Auditar Filtro PR260
        run: npm run audit:filter

      - name: Audit visual assets
        run: npm run audit:assets

      - name: Run clinical tests
        run: npm run test:clinical

      - name: Build application
        run: npm run build
