name: Verify NeuroPed

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-neuroped-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, catalog, access, identity, assets, clinical tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      # O gate abaixo precisa provar comportamento em DOM real. O download é
      # explícito e restrito ao Chromium para manter o CI reproduzível e evitar
      # que ausência de browser seja convertida silenciosamente em lint estático.
      - name: Install Chromium for mandatory browser smoke
        run: npx playwright install --with-deps chromium

      - name: Audit full dependency graph
        run: npm audit --audit-level=high

      # Gate técnico determinístico. `validate:safety` permanece no `npm run
      # verify` e exige homologação clínica explícita para instrumentos ainda
      # não congelados; não é mascarado nem reclassificado pelo CI.
      - name: Run hard release verification gate
        run: npm run verify

      - name: Build application
        run: npm run build

      # Smoke real e obrigatório: abre uma escala publicada no build, responde
      # os itens em Chromium e exige resultado + relatório clínico + ação de
      # vínculo. Qualquer falha de browser ou DOM reprova o workflow.
      - name: Run mandatory Chromium clinical smoke
        env:
          E2E_ROUTE: gad7
        run: npm run test:e2e:scales

      - name: Audit real initial JavaScript payload
        run: npm run test:bundle-audit && npm run audit:bundle
