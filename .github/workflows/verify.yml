name: Verify NeuroPed

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-neuroped-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, catalog, clinical tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: TypeScript check
        run: npm run check

      - name: Validate clinical catalog
        run: npm run validate:catalog

      - name: Run clinical tests
        run: npm run test:clinical

      - name: Build application
        run: npm run build

      - name: Record verification summary
        if: always()
        run: |
          echo "## Verify NeuroPed" >> "$GITHUB_STEP_SUMMARY"
          echo "- TypeScript: npm run check" >> "$GITHUB_STEP_SUMMARY"
          echo "- Catalog: npm run validate:catalog" >> "$GITHUB_STEP_SUMMARY"
          echo "- Clinical tests: npm run test:clinical" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: npm run build" >> "$GITHUB_STEP_SUMMARY"
