name: Verify NeuroPed

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-neuroped-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Catraca completa e build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Executar catraca canônica completa
        run: npm run verify

      - name: Build application
        run: npm run build

      - name: Auditar carga inicial do bundle de produção
        run: npm run audit:bundle
