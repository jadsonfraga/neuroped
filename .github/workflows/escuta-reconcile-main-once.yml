name: Escuta reconcile current main once
on:
  push:
    branches: [feat/escuta-clinica-integrada-20260905]
    paths: ['.github/workflows/escuta-reconcile-main-once.yml']
permissions:
  contents: write
concurrency:
  group: escuta-reconcile-current-main
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Merge current main preserving both sides
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff origin/main
          merge_code=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ "$merge_code" -ne 0 ]; then
            [ "$conflicts" = 'client/src/data/navigation.ts' ] || {
              echo "::error::Conflitos inesperados: $conflicts"
              exit 1
            }
          fi
          if [ -n "$conflicts" ]; then
            git checkout --theirs client/src/data/navigation.ts
            node <<'NODE'
          const fs = require('node:fs');
          const path = 'client/src/data/navigation.ts';
          let s = fs.readFileSync(path, 'utf8');
          const escuta = '  { href: "/escuta-clinica", label: "Escuta Clínica", icon: Waves, description: "Áudio e anamnese estruturada" },\n';
          if (!s.includes('href: "/escuta-clinica"')) {
            const anchor = '  { href: "/conecta", label: "NeuroPed Conecta", icon: Activity, tone: "connection", description: "Portais e conexões" },\n';
            if (!s.includes(anchor)) throw new Error('Âncora canônica do Conecta não encontrada; abortando sem adivinhar.');
            s = s.replace(anchor, escuta + anchor);
          }
          fs.writeFileSync(path, s);
          NODE
            git add client/src/data/navigation.ts
          fi
          git rm .github/workflows/escuta-reconcile-main-once.yml
          test -z "$(git diff --name-only --diff-filter=U)"
          grep -q 'href: "/escuta-clinica"' client/src/data/navigation.ts
          grep -q 'tone: "connection"' client/src/data/navigation.ts
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - name: Commit and push reconciliation
        run: |
          set -euo pipefail
          git commit -m 'merge(main): reconcile Escuta Clínica with current NeuroPed navigation'
          git push origin HEAD:feat/escuta-clinica-integrada-20260905
