name: Auditoria de Segurança

on:
  schedule:
    # Toda segunda-feira às 08:00 BRT (11:00 UTC)
    - cron: "0 11 * * 1"

  # Permite rodar manualmente
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    name: npm audit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Rodar auditoria de segurança
        id: audit
        run: |
          npm audit --audit-level=high --json > audit-report.json 2>&1 || true
          CRITICAL=$(cat audit-report.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          meta = data.get('metadata', {})
          vulns = meta.get('vulnerabilities', {})
          print(vulns.get('critical', 0) + vulns.get('high', 0))
          " 2>/dev/null || echo "0")
          echo "critical_count=$CRITICAL" >> $GITHUB_OUTPUT
          cat audit-report.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          meta = data.get('metadata', {})
          vulns = meta.get('vulnerabilities', {})
          print('Críticas:', vulns.get('critical', 0))
          print('Altas:', vulns.get('high', 0))
          print('Moderadas:', vulns.get('moderate', 0))
          print('Baixas:', vulns.get('low', 0))
          " 2>/dev/null || npm audit --audit-level=moderate || true

      - name: Abrir issue se houver vulnerabilidades críticas
        if: steps.audit.outputs.critical_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const count = '${{ steps.audit.outputs.critical_count }}';
            const date = new Date().toLocaleDateString('pt-BR');

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔒 Vulnerabilidades críticas detectadas — ${date}`,
              body: `## Auditoria de Segurança Automática

              **${count}** vulnerabilidade(s) de severidade alta ou crítica foram encontradas.

              ### Ação Necessária

              Execute localmente para ver os detalhes:
              \`\`\`bash
              npm audit
              npm audit fix
              \`\`\`

              Para atualizar dependências com breaking changes:
              \`\`\`bash
              npm audit fix --force
              \`\`\`

              *Auditoria automática rodada em ${date}*`,
              labels: ['security', 'dependencies']
            });
