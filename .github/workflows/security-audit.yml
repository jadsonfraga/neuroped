name: Auditoria de Segurança

on:
  schedule:
    # Toda segunda-feira às 08:00 BRT (11:00 UTC)
    - cron: "0 11 * * 1"

  # Permite rodar manualmente
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    name: npm audit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Rodar auditoria de segurança
        id: audit
        run: |
          npm audit --audit-level=high --json > audit-report.json 2> audit-stderr.log || true
          cat audit-stderr.log >&2
          CRITICAL=$(node -e "
          const data = JSON.parse(require('fs').readFileSync('audit-report.json', 'utf8'));
          const vulns = data.metadata?.vulnerabilities ?? {};
          process.stdout.write(String((vulns.critical ?? 0) + (vulns.high ?? 0)));
          ")
          echo "critical_count=$CRITICAL" >> $GITHUB_OUTPUT
          node -e "
          const data = JSON.parse(require('fs').readFileSync('audit-report.json', 'utf8'));
          const vulns = data.metadata?.vulnerabilities ?? {};
          console.log('Críticas:', vulns.critical ?? 0);
          console.log('Altas:', vulns.high ?? 0);
          console.log('Moderadas:', vulns.moderate ?? 0);
          console.log('Baixas:', vulns.low ?? 0);
          "

      - name: Sincronizar issue de vulnerabilidades altas ou críticas
        if: steps.audit.outputs.critical_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const count = '${{ steps.audit.outputs.critical_count }}';
            const date = new Date().toLocaleDateString('pt-BR');
            const title = '🔒 Vulnerabilidades altas ou críticas em dependências';
            const body = `## Auditoria de Segurança Automática

            **${count}** vulnerabilidade(s) de severidade alta ou crítica foram encontradas.

            ### Ação necessária

            Revise a cadeia afetada e faça uma atualização direcionada, preservando compatibilidade:

            \`\`\`bash
            npm audit
            npm audit --omit=dev
            \`\`\`

            Evite \`npm audit fix --force\` sem revisão, pois ele pode introduzir breaking changes.

            *Última auditoria automática: ${date}*`;

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.find((issue) =>
              !issue.pull_request &&
              (issue.title === title || issue.title.startsWith('🔒 Vulnerabilidades críticas detectadas'))
            );

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
              });
              core.notice(`Issue de segurança #${existing.number} atualizada; nenhuma duplicata criada.`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security', 'dependencies'],
              });
              core.notice(`Issue de segurança #${created.number} criada.`);
            }

      - name: Fechar alertas resolvidos
        if: steps.audit.outputs.critical_count == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const alerts = openIssues.filter((issue) =>
              !issue.pull_request &&
              (issue.title === '🔒 Vulnerabilidades altas ou críticas em dependências' ||
                issue.title.startsWith('🔒 Vulnerabilidades críticas detectadas'))
            );
            for (const issue of alerts) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Auditoria automática atual: nenhuma vulnerabilidade alta ou crítica. Encerrando o alerta.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
            core.notice(`${alerts.length} alerta(s) de segurança resolvido(s) e encerrado(s).`);
