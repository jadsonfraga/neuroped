name: Diagnosticar catraca de 100 perguntas

on:
  push:
    branches:
      - agent/podium-hard-cap-100-2026-07-17

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/podium-hard-cap-100-2026-07-17
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Executar testes isolados e registrar relatório
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          : > diagnostics/podium-cap.txt
          for spec in podium practical-filter ideal-choice; do
            echo "===== $spec =====" >> diagnostics/podium-cap.txt
            npm run "test:$spec" > "/tmp/$spec.log" 2>&1
            code=$?
            echo "exit=$code" >> diagnostics/podium-cap.txt
            tail -120 "/tmp/$spec.log" >> diagnostics/podium-cap.txt
            echo >> diagnostics/podium-cap.txt
          done
      - name: Commitar relatório diagnóstico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/podium-cap.txt
          git commit -m 'chore: registra diagnóstico da catraca de 100 perguntas'
          git push origin HEAD:agent/podium-hard-cap-100-2026-07-17
