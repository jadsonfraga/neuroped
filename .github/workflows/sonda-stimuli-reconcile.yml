name: Reconcile Sonda visual bank

on:
  push:
    branches:
      - feat/sonda-dez-stimuli-daily-20260906
    paths:
      - ".github/workflows/sonda-stimuli-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/sonda-dez-stimuli-daily-20260906
      - name: Reconcile internal page ownership and infant stimulus
        shell: python
        run: |
          from pathlib import Path

          inventory = Path("scripts/guards/audit-inventory.mjs")
          text = inventory.read_text(encoding="utf-8")
          marker = '''const intentionalPageReplacements = new Map([\n'''
          insert = '''const intentionalPageReplacements = new Map([\n  [\n    "testes-diretos",\n    {\n      replacementRoute: "/testes-diretos",\n      reason: "núcleo clínico interno preservado; a rota canônica é composta pelo wrapper sonda-dez-daily",\n    },\n  ],\n'''
          if marker not in text:
              raise SystemExit("inventory marker not found")
          inventory.write_text(text.replace(marker, insert, 1), encoding="utf-8")

          page = Path("client/src/pages/sonda-dez-daily.tsx")
          source = page.read_text(encoding="utf-8")
          source = source.replace('''  | "objects"\n''', '''  | "objects"\n  | "objectsBaby"\n''', 1)
          source = source.replace('''    subtitle: "Bola · carrinho · bebê",\n    instruction: "Use apenas como apoio se o objeto físico não puder ser apresentado.",\n    kind: "objects",\n''', '''    subtitle: "Bola · carrinho · bebê",\n    instruction: "Priorize os objetos físicos; esta tela é apoio visual de contingência.",\n    kind: "objectsBaby",\n''', 1)
          anchor = '''function VectorScene({ kind }: { kind: StimulusKind }) {\n  if (kind === "objects") {\n'''
          baby = '''function VectorScene({ kind }: { kind: StimulusKind }) {\n  if (kind === "objectsBaby") {\n    return (\n      <div className="grid w-full max-w-4xl grid-cols-3 gap-5">\n        <div className="flex aspect-square items-center justify-center rounded-[30px] border-4 border-slate-200 bg-white">\n          <svg viewBox="0 0 160 160" className="h-4/5 w-4/5" aria-label="bola">\n            <circle cx="80" cy="80" r="55" fill="#f8fafc" stroke="#0f172a" strokeWidth="8" />\n            <path d="M80 25 110 52 99 91 61 91 50 52Z" fill="#0f172a" />\n            <path d="M50 52 25 72M110 52 135 72M61 91 46 130M99 91 114 130" stroke="#0f172a" strokeWidth="7" />\n          </svg>\n        </div>\n        <div className="flex aspect-square items-center justify-center rounded-[30px] border-4 border-slate-200 bg-white">\n          <svg viewBox="0 0 180 140" className="h-4/5 w-4/5" aria-label="carrinho">\n            <rect x="25" y="55" width="125" height="45" rx="14" fill="#2563eb" />\n            <path d="M55 55 75 25h45l22 30" fill="#93c5fd" stroke="#1e3a8a" strokeWidth="6" />\n            <circle cx="58" cy="108" r="16" fill="#0f172a" /><circle cx="126" cy="108" r="16" fill="#0f172a" />\n          </svg>\n        </div>\n        <div className="flex aspect-square items-center justify-center rounded-[30px] border-4 border-slate-200 bg-white">\n          <svg viewBox="0 0 180 180" className="h-4/5 w-4/5" aria-label="bebê">\n            <circle cx="90" cy="55" r="38" fill="#f5cfae" stroke="#7c2d12" strokeWidth="5" />\n            <path d="M62 45 Q90 18 118 45" fill="none" stroke="#7c2d12" strokeWidth="8" strokeLinecap="round" />\n            <circle cx="77" cy="55" r="4" fill="#0f172a" /><circle cx="103" cy="55" r="4" fill="#0f172a" />\n            <path d="M78 70 Q90 80 102 70" fill="none" stroke="#9a3412" strokeWidth="4" strokeLinecap="round" />\n            <path d="M48 158 Q48 96 90 92 Q132 96 132 158Z" fill="#fbbf24" stroke="#92400e" strokeWidth="5" />\n            <path d="M58 116 30 140M122 116 150 140" stroke="#f5cfae" strokeWidth="14" strokeLinecap="round" />\n          </svg>\n        </div>\n      </div>\n    );\n  }\n\n  if (kind === "objects") {\n'''
          if anchor not in source:
              raise SystemExit("VectorScene anchor not found")
          source = source.replace(anchor, baby, 1)
          source = source.replace('''["objects", "concepts", "story", "social", "blocks"]''', '''["objects", "objectsBaby", "concepts", "story", "social", "blocks"]''', 1)
          page.write_text(source, encoding="utf-8")
      - name: Remove one-shot workflow
        run: git rm .github/workflows/sonda-stimuli-reconcile.yml
      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/sonda-dez-daily.tsx scripts/guards/audit-inventory.mjs
          git commit -m "fix(sonda): reconciliar inventário e apoio visual infantil"
          git push origin HEAD:feat/sonda-dez-stimuli-daily-20260906
