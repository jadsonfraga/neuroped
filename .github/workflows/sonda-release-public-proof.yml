name: Sonda public release evidence
on:
  push:
    branches: [ops/sonda-release-public-proof-20260922]
    paths: ['.github/workflows/sonda-release-public-proof.yml']
permissions:
  contents: read
jobs:
  public-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify exact merged SHA on both public origins and canonical core health
        shell: python
        run: |
          import json
          import pathlib
          import subprocess
          import tempfile
          import time
          from datetime import datetime, timezone
          EXPECTED = 'a256d754091705f2077b945b06cea468b5874452'
          ORIGINS = {'cloudflare': 'https://neuroped.pages.dev', 'vercel': 'https://superneuroped.vercel.app'}
          def read_public(url):
              with tempfile.TemporaryDirectory() as directory:
                  target = pathlib.Path(directory) / 'response'
                  completed = subprocess.run(['curl', '--silent', '--show-error', '--max-time', '20', '--fail', '--output', str(target), url], capture_output=True, text=True)
                  if completed.returncode: return None
                  try: value = json.loads(target.read_text(encoding='utf-8'))
                  except (ValueError, OSError): return None
                  return value if isinstance(value, dict) else None
          proof = {'expected_commit': EXPECTED, 'providers': {}}
          for attempt in range(30):
              for provider, origin in ORIGINS.items():
                  if provider in proof['providers']: continue
                  value = read_public(origin + '/deploy-check.json?release=' + EXPECTED + '&attempt=' + str(attempt))
                  if value and value.get('commit') == EXPECTED:
                      proof['providers'][provider] = {'origin': origin, 'commit': value['commit'], 'http_status': 200, 'checked_at': datetime.now(timezone.utc).isoformat()}
                      print('VERIFIED_RELEASE=' + json.dumps(proof['providers'][provider], sort_keys=True), flush=True)
              if len(proof['providers']) == len(ORIGINS): break
              if attempt in [0, 9, 19]: print('PENDING_PROVIDERS=' + json.dumps([p for p in ORIGINS if p not in proof['providers']]), flush=True)
              time.sleep(20)
          assert len(proof['providers']) == 2, 'Both public providers must serve the exact merged SHA'
          health = read_public(ORIGINS['cloudflare'] + '/api/health?release=' + EXPECTED)
          assert health and health.get('status') == 'ok' and health.get('database') == 'ok', 'Canonical core health must be OK'
          assert health.get('authentication', {}).get('required') is True, 'Authentication must remain required'
          assert health.get('authentication', {}).get('configured') is True, 'Authentication must remain configured'
          assert health.get('readiness', {}).get('coreReady') is True, 'Core readiness must be explicit'
          proof['health'] = {'status': health['status'], 'database': health['database'], 'authentication': health['authentication'], 'core_ready': health['readiness']['coreReady'], 'other_readiness_blockers': health['readiness'].get('blockers', [])}
          proof['completed_at'] = datetime.now(timezone.utc).isoformat()
          pathlib.Path('/tmp/sonda-public-release-proof.json').write_text(json.dumps(proof, indent=2) + '\n', encoding='utf-8')
          print('PUBLIC_RELEASE_PROOF=' + json.dumps(proof, sort_keys=True), flush=True)
      - name: Preserve metadata-only release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonda-public-release-a256d754
          path: /tmp/sonda-public-release-proof.json
          retention-days: 14
          if-no-files-found: error
