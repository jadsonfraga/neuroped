name: Sonda public release evidence
on:
  push:
    branches: [ops/sonda-release-public-proof-20260922]
    paths: ['.github/workflows/sonda-release-public-proof.yml']
permissions:
  contents: read
jobs:
  public-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public release identity using each canonical provider contract
        shell: python
        run: |
          import json, pathlib, subprocess, tempfile
          from datetime import datetime, timezone
          EXPECTED = 'a256d754091705f2077b945b06cea468b5874452'
          ORIGINS = {'cloudflare': 'https://neuroped.pages.dev', 'vercel': 'https://superneuroped.vercel.app'}
          def read_public(url):
              with tempfile.TemporaryDirectory() as directory:
                  target = pathlib.Path(directory) / 'response'
                  completed = subprocess.run(['curl', '--silent', '--show-error', '--max-time', '30', '--fail', '--output', str(target), url], capture_output=True, text=True)
                  assert completed.returncode == 0, 'Public HTTP request failed'
                  value = json.loads(target.read_text(encoding='utf-8'))
                  assert isinstance(value, dict), 'Public JSON object required'
                  return value
          proof = {'expected_full_commit': EXPECTED, 'providers': {}, 'source_deployment_runs': {'cloudflare': 35763772322, 'vercel': 35763772259}}
          for provider, origin in ORIGINS.items():
              value = read_public(origin + '/deploy-check.json?ts=' + str(int(datetime.now(timezone.utc).timestamp())))
              commit = value.get('commit')
              print('PUBLIC_SENTINEL=' + json.dumps({'provider': provider, 'reported_commit': commit, 'artifact_provider': value.get('provider'), 'status': value.get('status')}, sort_keys=True), flush=True)
              expected_provider = 'cloudflare-pages' if provider == 'cloudflare' else 'vercel'
              assert value.get('app') == 'NeuroPed' and value.get('provider') == expected_provider
              # The existing Vercel build emits 12 characters. Preserve the reported
              # value and require the canonical deployed/provider contract too.
              if provider == 'vercel':
                  assert commit in [EXPECTED, EXPECTED[:12]] and value.get('status') == 'deployed'
              else:
                  assert commit == EXPECTED
              proof['providers'][provider] = {'origin': origin, 'reported_commit': commit, 'http_status': 200, 'checked_at': datetime.now(timezone.utc).isoformat()}
          health = read_public(ORIGINS['cloudflare'] + '/api/health')
          assert health.get('status') == 'ok' and health.get('database') == 'ok', 'Core health must be OK'
          assert health.get('authentication', {}).get('required') is True
          assert health.get('authentication', {}).get('configured') is True
          assert health.get('readiness', {}).get('coreReady') is True
          proof['health'] = {'status': health['status'], 'database': health['database'], 'authentication': health['authentication'], 'core_ready': health['readiness']['coreReady'], 'other_readiness_blockers': health['readiness'].get('blockers', [])}
          proof['completed_at'] = datetime.now(timezone.utc).isoformat()
          pathlib.Path('/tmp/sonda-public-release-proof.json').write_text(json.dumps(proof, indent=2) + '\n', encoding='utf-8')
          print('PUBLIC_RELEASE_PROOF=' + json.dumps(proof, sort_keys=True), flush=True)
      - name: Preserve metadata-only release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonda-public-release-a256d754
          path: /tmp/sonda-public-release-proof.json
          retention-days: 14
          if-no-files-found: error
