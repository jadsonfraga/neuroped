name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Evita deploys concorrentes do Pages. cancel-in-progress: true faz o commit
# mais novo cancelar um deploy anterior ainda em andamento — o último main é o
# que deve ir ao ar. Evita o erro "deployment in progress" quando pushes/merges
# chegam próximos (ex.: um PR mesclado logo antes de outro deploy).
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  status-pending:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publicar estado pendente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="pending" \
            -f context="NeuroPed / GitHub Pages" \
            -f description="Build e deploy do mirror em execução." \
            -f target_url="$target_url"

  build:
    needs: status-pending
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Catraca técnica completa de release
        run: npm run verify

      - name: Criar sentinela de deploy
        run: |
          mkdir -p client/public
          cat > client/public/deploy-check.json <<EOF
          {
            "app": "NeuroPed",
            "provider": "github-pages",
            "branch": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "deployed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat client/public/deploy-check.json

      - name: Validar verificador do PIN local
        env:
          REQUIRE_LOCAL_PIN: "1"
          VITE_PIN_HASH: ${{ secrets.VITE_PIN_HASH }}
        run: node scripts/verify-local-pin-env.mjs

      - name: Compilar frontend para Pages
        env:
          NODE_ENV: production
          # Mirror estático deliberado: sem backend clínico, usa o PIN local.
          VITE_AUTH_MODE: local
          # Nunca embutir verificador de PIN no repositório público.
          VITE_PIN_HASH: ${{ secrets.VITE_PIN_HASH }}
        run: npm run build:client

      - name: Auditar carga inicial real do JavaScript
        run: npm run test:bundle-audit && npm run audit:bundle

      - name: Verificar output do build
        run: |
          echo "=== dist/public ==="
          ls -la dist/public/
          echo "=== deploy-check ==="
          test -f dist/public/deploy-check.json
          cat dist/public/deploy-check.json
          echo "=== assets ==="
          ls -la dist/public/assets/ | head -20

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artefato para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy-frontend:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-and-report:
    needs:
      - status-pending
      - build
      - deploy-frontend
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Verificar sentinela pública e aplicação
        id: sentinel
        if: needs.build.result == 'success' && needs.deploy-frontend.result == 'success'
        env:
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_SHA: ${{ github.sha }}
          PAGE_URL: ${{ needs.deploy-frontend.outputs.page_url }}
        run: |
          set -euo pipefail

          case "$PAGE_URL" in
            https://*) ;;
            *)
              echo "::error::URL do GitHub Pages ausente ou inválida."
              exit 1
              ;;
          esac

          base_url="${PAGE_URL%/}/"
          sentinel_url="${base_url}deploy-check.json"

          for attempt in $(seq 1 18); do
            cache_buster="run=${GITHUB_RUN_ID}&attempt=${attempt}"
            body="$(curl --fail --silent --show-error --location --max-time 15 \
              "${sentinel_url}?${cache_buster}" || true)"

            if SENTINEL_BODY="$body" node --input-type=module -e '
              const payload = JSON.parse(process.env.SENTINEL_BODY);
              const valid =
                payload.app === "NeuroPed" &&
                payload.provider === "github-pages" &&
                payload.commit === process.env.EXPECTED_SHA &&
                payload.run_id === process.env.EXPECTED_RUN_ID &&
                payload.run_attempt === process.env.EXPECTED_RUN_ATTEMPT;
              if (!valid) process.exit(1);
            ' 2>/dev/null; then
              index="$(curl --fail --silent --show-error --location --max-time 15 \
                "${base_url}?${cache_buster}" || true)"
              if INDEX_HTML="$index" node --input-type=module -e '
                const root = /<div\b[^>]*id="root"[^>]*>\s*<\/div>/i;
                if (!root.test(process.env.INDEX_HTML)) process.exit(1);
              ' 2>/dev/null; then
                if module_path="$(INDEX_HTML="$index" node --input-type=module -e '
                  const match = process.env.INDEX_HTML.match(
                    /<script[^>]*type="module"[^>]*src="([^"]+)"/,
                  );
                  if (!match) process.exit(1);
                  console.log(match[1]);
                ')" && \
                  module_url="$(BASE_URL="$base_url" MODULE_PATH="$module_path" \
                    node --input-type=module -e '
                      console.log(new URL(process.env.MODULE_PATH, process.env.BASE_URL).href);
                    ')" && \
                  curl --fail --silent --show-error --location --max-time 15 \
                    "${module_url}?${cache_buster}" >/dev/null; then
                  echo "Sentinela pública confirma o commit ${EXPECTED_SHA}."
                  echo "sentinel_url=${sentinel_url}" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
            fi

            echo "Tentativa ${attempt}/18: aguardando propagação do commit ${EXPECTED_SHA}."
            sleep 10
          done

          echo "::error::A sentinela pública não confirmou o commit ${EXPECTED_SHA}."
          exit 1

      - name: Publicar resultado verificável
        if: always()
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy-frontend.result }}
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ needs.deploy-frontend.outputs.page_url }}
          PENDING_RESULT: ${{ needs.status-pending.result }}
          SENTINEL_RESULT: ${{ steps.sentinel.outcome }}
        run: |
          set -euo pipefail
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          state="failure"

          if [ "$PENDING_RESULT" != "success" ]; then
            description="Falha ao publicar o estado inicial do deploy."
          elif [ "$BUILD_RESULT" != "success" ]; then
            description="Build ou validação técnica falhou."
          elif [ "$DEPLOY_RESULT" != "success" ]; then
            description="Publicação no GitHub Pages falhou."
          elif [ "$SENTINEL_RESULT" != "success" ]; then
            description="Deploy sem confirmação da sentinela pública."
          else
            state="success"
            description="Commit publicado e confirmado pela sentinela pública."
            target_url="${PAGE_URL%/}/"
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="NeuroPed / GitHub Pages" \
            -f description="$description" \
            -f target_url="$target_url"

          [ "$state" = "success" ]

  # NOTA: jobs deploy-vercel e deploy-railway antigos removidos — referenciavam
  # actions inexistentes e falhavam sempre.
  # Arquitetura atual: o full-stack canônico é o Cloudflare Pages
  # (frontend + Functions + D1, deploy-cloudflare.yml). GitHub Pages (acima) e
  # Vercel (deploy-vercel.yml) são mirrors ESTÁTICOS do frontend. O backend
  # Express (server/) serve apenas o `npm run dev` local — Render foi aposentado
  # (render.yaml removido).
