name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

# Evita deploys concorrentes do Pages. cancel-in-progress: true faz o commit
# mais novo cancelar um deploy anterior ainda em andamento — o último main é o
# que deve ir ao ar. Evita o erro "deployment in progress" quando pushes/merges
# chegam próximos (ex.: um PR mesclado logo antes de outro deploy).
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  assert-main:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar branch de produção
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Deploy de produção permitido somente a partir de main."
            exit 1
          fi

  status-pending:
    needs: assert-main
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publicar estado pendente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="pending" \
            -f context="NeuroPed / GitHub Pages" \
            -f description="Build e deploy do mirror em execução." \
            -f target_url="$target_url"

  build:
    needs: status-pending
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Auditar grafo completo de dependências
        run: npm audit --audit-level=high

      - name: Instalar Chromium para os testes E2E
        run: npx playwright install --with-deps chromium

      - name: Catraca técnica completa de release
        run: npm run verify

      - name: Construir redirecionador seguro e sentinela
        run: |
          set -euo pipefail
          rm -rf dist/github-pages
          mkdir -p dist/github-pages
          cp github-pages-redirect/index.html dist/github-pages/index.html
          cp github-pages-redirect/index.html dist/github-pages/404.html
          cp github-pages-redirect/redirect.js dist/github-pages/redirect.js
          cat > dist/github-pages/deploy-check.json <<EOF
          {
            "app": "NeuroPed",
            "provider": "github-pages",
            "mode": "canonical-redirect",
            "branch": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "deployed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          expected=$'404.html\ndeploy-check.json\nindex.html\nredirect.js'
          actual=$(find dist/github-pages -maxdepth 1 -type f -printf '%f\n' | sort)
          [ "$actual" = "$expected" ] || {
            echo "::error::Artefato Pages contém arquivos inesperados."
            printf 'Esperado:\n%s\nAtual:\n%s\n' "$expected" "$actual"
            exit 1
          }
          test ! -d dist/github-pages/assets
          grep -Fq 'https://neuroped.pages.dev' dist/github-pages/index.html
          grep -Fq 'const TARGET = "https://neuroped.pages.dev"' dist/github-pages/redirect.js
          if grep -Eqi 'pbkdf2\$|type="module"|id="root"' dist/github-pages/*; then
            echo "::error::O redirecionador contém bundle, gate local ou verificador."
            exit 1
          fi
          cat dist/github-pages/deploy-check.json

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artefato para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/github-pages

  deploy-frontend:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-and-report:
    needs:
      - status-pending
      - build
      - deploy-frontend
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Verificar sentinela pública e aplicação
        id: sentinel
        if: needs.build.result == 'success' && needs.deploy-frontend.result == 'success'
        env:
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_SHA: ${{ github.sha }}
          PAGE_URL: ${{ needs.deploy-frontend.outputs.page_url }}
        run: |
          set -euo pipefail

          case "$PAGE_URL" in
            https://*) ;;
            *)
              echo "::error::URL do GitHub Pages ausente ou inválida."
              exit 1
              ;;
          esac

          base_url="${PAGE_URL%/}/"
          sentinel_url="${base_url}deploy-check.json"

          for attempt in $(seq 1 18); do
            cache_buster="run=${GITHUB_RUN_ID}&attempt=${attempt}"
            body="$(curl --fail --silent --show-error --location --max-time 15 \
              "${sentinel_url}?${cache_buster}" || true)"

            if SENTINEL_BODY="$body" node --input-type=module -e '
              const payload = JSON.parse(process.env.SENTINEL_BODY);
              const valid =
                payload.app === "NeuroPed" &&
                payload.provider === "github-pages" &&
                payload.mode === "canonical-redirect" &&
                payload.commit === process.env.EXPECTED_SHA &&
                payload.run_id === process.env.EXPECTED_RUN_ID &&
                payload.run_attempt === process.env.EXPECTED_RUN_ATTEMPT;
              if (!valid) process.exit(1);
            ' 2>/dev/null; then
              index="$(curl --fail --silent --show-error --location --max-time 15 \
                "${base_url}?${cache_buster}" || true)"
              redirect="$(curl --fail --silent --show-error --location --max-time 15 \
                "${base_url}redirect.js?${cache_buster}" || true)"
              if INDEX_HTML="$index" REDIRECT_JS="$redirect" node --input-type=module -e '
                const html = process.env.INDEX_HTML || "";
                const script = process.env.REDIRECT_JS || "";
                const fixedTarget = "https://neuroped.pages.dev";
                const valid =
                  html.includes(fixedTarget) &&
                  html.includes("/neuroped/redirect.js") &&
                  !/id="root"|type="module"/i.test(html) &&
                  script.includes(`const TARGET = "${fixedTarget}"`) &&
                  script.includes("neuroped:") &&
                  script.includes("np_") &&
                  script.includes("registration.unregister()") &&
                  script.includes("neuroped-") &&
                  script.includes("neuroped-icp") &&
                  script.includes("window.location.replace(destination)");
                if (!valid) process.exit(1);
              ' 2>/dev/null; then
                echo "Redirecionador público confirma o commit ${EXPECTED_SHA}."
                echo "sentinel_url=${sentinel_url}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            echo "Tentativa ${attempt}/18: aguardando propagação do commit ${EXPECTED_SHA}."
            sleep 10
          done

          echo "::error::A sentinela/redirecionador não confirmou o commit ${EXPECTED_SHA}."
          exit 1

      - name: Publicar resultado verificável
        if: always()
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy-frontend.result }}
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ needs.deploy-frontend.outputs.page_url }}
          PENDING_RESULT: ${{ needs.status-pending.result }}
          SENTINEL_RESULT: ${{ steps.sentinel.outcome }}
        run: |
          set -euo pipefail
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          state="failure"

          if [ "$PENDING_RESULT" != "success" ]; then
            description="Falha ao publicar o estado inicial do deploy."
          elif [ "$BUILD_RESULT" != "success" ]; then
            description="Build ou validação técnica falhou."
          elif [ "$DEPLOY_RESULT" != "success" ]; then
            description="Publicação no GitHub Pages falhou."
          elif [ "$SENTINEL_RESULT" != "success" ]; then
            description="Deploy sem confirmação da sentinela pública."
          else
            state="success"
            description="Redirecionador canônico publicado e confirmado."
            target_url="${PAGE_URL%/}/"
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="NeuroPed / GitHub Pages" \
            -f description="$description" \
            -f target_url="$target_url"

          [ "$state" = "success" ]

  # NOTA: jobs deploy-vercel e deploy-railway antigos removidos — referenciavam
  # actions inexistentes e falhavam sempre.
  # Arquitetura atual: o full-stack canônico é o Cloudflare Pages
  # (frontend + Functions + D1, deploy-cloudflare.yml). O GitHub Pages publica
  # somente um redirecionador sem bundle/tokens; Vercel usa o backend canônico.
  # O backend
  # Express (server/) serve apenas o `npm run dev` local — Render foi aposentado
  # (render.yaml removido).
