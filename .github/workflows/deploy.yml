name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Necessário para o actions/deploy-pages (OIDC + publicação no Pages)
permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploys concorrentes do Pages
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: TypeScript check
        run: npm run check

      - name: Validar catálogo clínico
        run: npm run validate:catalog

      - name: Auditar política de acesso
        run: npm run audit:access

      - name: Auditar identidade institucional
        run: npm run audit:identity

      - name: Auditar rotas de navegação
        run: npm run audit:navigation

      - name: Auditar assets visuais
        run: npm run audit:assets

      - name: Testes clínicos
        run: npm run test:clinical

      - name: Criar sentinela de deploy
        run: |
          mkdir -p client/public
          cat > client/public/deploy-check.json <<EOF
          {
            "app": "NeuroPed",
            "provider": "multi-deploy",
            "branch": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "deployed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat client/public/deploy-check.json

      - name: Compilar frontend para Pages
        env:
          NODE_ENV: production
        run: npm run build:client

      - name: Verificar output do build
        run: |
          echo "=== dist/public ==="
          ls -la dist/public/
          echo "=== deploy-check ==="
          test -f dist/public/deploy-check.json
          cat dist/public/deploy-check.json
          echo "=== assets ==="
          ls -la dist/public/assets/ | head -20

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artefato para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy-frontend:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # NOTA: jobs deploy-vercel e deploy-railway removidos — referenciavam actions
  # inexistentes (vercel/action@master, railwayapp/deploy-action@v1) e falhavam
  # sempre. O backend é publicado pelo Render (render.yaml autoDeploy) e o
  # frontend pelo GitHub Pages (acima) + Cloudflare Pages (deploy-cloudflare.yml).
