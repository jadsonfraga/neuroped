name: Deploy Vercel Preview

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_PROJECT_ID: prj_8gsXbaQoOZHgbhjnqiMPR9A5jg5b
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PREVIEW_REF: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout exact preview commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PREVIEW_SHA }}

      - name: Configure Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Assert preview-only execution
        run: |
          set -euo pipefail
          test "$PREVIEW_REF" != "main"
          test -n "${VERCEL_ORG_ID:-}" || { echo "::error::VERCEL_ORG_ID ausente"; exit 1; }
          test -n "${{ secrets.VERCEL_TOKEN }}" || { echo "::error::VERCEL_TOKEN ausente"; exit 1; }

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Re-run release verification before preview
        run: npm run verify

      - name: Create immutable preview sentinel
        run: |
          set -euo pipefail
          mkdir -p client/public
          cat > client/public/deploy-check.json <<EOF
          {
            "app": "NeuroPed",
            "provider": "vercel-preview",
            "branch": "${PREVIEW_REF}",
            "commit": "${PREVIEW_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "status": "preview"
          }
          EOF

      - name: Build preview artifact
        env:
          NODE_ENV: production
          VITE_AUTH_MODE: remote
          VITE_API_URL: https://neuroped.pages.dev
          VITE_ZONE: full
          VITE_ALLOWED_HOSTS: ""
        run: VITE_PIN_HASH= npm run build:client

      - name: Audit built artifact
        run: npm run test:bundle-audit && npm run audit:bundle && npm run audit:built-pin

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@56.4.1

      - name: Deploy isolated preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          token="$VERCEL_TOKEN"
          unset VERCEL_TOKEN
          rm -rf .vercel
          vercel pull --yes --environment=preview --token="$token"
          VITE_AUTH_MODE=remote \
          VITE_API_URL=https://neuroped.pages.dev \
          VITE_PIN_HASH= \
          VITE_ZONE=full \
          VITE_ALLOWED_HOSTS= \
          VERCEL_GIT_COMMIT_SHA="$PREVIEW_SHA" \
          VERCEL_GIT_COMMIT_REF="$PREVIEW_REF" \
            vercel build --token="$token"
          npm run audit:built-pin
          url=$(vercel deploy --prebuilt --token="$token")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "Preview: $url"

      - name: Inspect and smoke-test protected preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          token="$VERCEL_TOKEN"
          unset VERCEL_TOKEN
          vercel inspect "$PREVIEW_URL" --token="$token"
          vercel curl / --deployment "$PREVIEW_URL" --token="$token" -o /tmp/preview-root.html
          test -s /tmp/preview-root.html
          vercel curl /deploy-check.json --deployment "$PREVIEW_URL" --token="$token" -o /tmp/preview-sentinel.json
          node -e '
            const fs = require("node:fs");
            const check = JSON.parse(fs.readFileSync("/tmp/preview-sentinel.json", "utf8"));
            if (check.app !== "NeuroPed" || check.provider !== "vercel-preview" || check.status !== "preview" || check.commit !== process.env.PREVIEW_SHA) {
              console.error("Sentinela de preview não corresponde ao commit atual.", check);
              process.exit(1);
            }
            console.log("Preview validado no commit", check.commit);
          '

      - name: Publish preview URL in job summary
        run: |
          {
            echo "## NeuroPed — Vercel Preview"
            echo
            echo "- Branch: \`$PREVIEW_REF\`"
            echo "- Commit: \`$PREVIEW_SHA\`"
            echo "- URL: $PREVIEW_URL"
            echo "- Production alias: **não alterado**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment validated preview on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
          PREVIEW_SHA: ${{ env.PREVIEW_SHA }}
        with:
          script: |
            const marker = '<!-- neuroped-vercel-preview -->';
            const body = `${marker}\n## NeuroPed — Preview Vercel validado\n\n- URL: ${process.env.PREVIEW_URL}\n- Commit: \`${process.env.PREVIEW_SHA}\`\n- Produção: **não alterada**\n- Gate: \`verify + build + artifact audit + vercel inspect + vercel curl + sentinel\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
