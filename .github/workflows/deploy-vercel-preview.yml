name: Deploy Vercel Preview

on:
  push:
    branches:
      - agent/mission-2026-08-25
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: vercel-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      PREVIEW_SHA: ${{ github.sha }}
      PREVIEW_REF: ${{ github.ref_name }}

    steps:
      - name: Checkout exact preview commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PREVIEW_SHA }}

      - name: Configure Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Assert preview-only execution
        run: |
          set -euo pipefail
          test "$GITHUB_REF" != "refs/heads/main"
          test "$PREVIEW_REF" != "main"
          test -n "${VERCEL_ORG_ID:-}" || { echo "::error::VERCEL_ORG_ID ausente"; exit 1; }
          test -n "${{ secrets.VERCEL_TOKEN }}" || { echo "::error::VERCEL_TOKEN ausente"; exit 1; }

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Run preview safety gates
        run: |
          set -euo pipefail
          npm run check
          npm run validate:public
          npm run audit:access
          npm run test:publish-safety

      - name: Create immutable preview sentinel
        run: |
          set -euo pipefail
          mkdir -p client/public
          cat > client/public/deploy-check.json <<EOF
          {
            "app": "NeuroPed",
            "provider": "vercel-preview",
            "branch": "${PREVIEW_REF}",
            "commit": "${PREVIEW_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "status": "preview"
          }
          EOF

      - name: Build preview artifact
        env:
          NODE_ENV: production
          VITE_AUTH_MODE: remote
          VITE_API_URL: https://neuroped.pages.dev
          VITE_ZONE: full
          VITE_ALLOWED_HOSTS: ""
        run: VITE_PIN_HASH= npm run build:client

      - name: Audit built artifact
        run: npm run test:bundle-audit && npm run audit:bundle && npm run audit:built-pin

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@56.4.1

      - name: Deploy isolated preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          token="$VERCEL_TOKEN"
          unset VERCEL_TOKEN
          export VERCEL_PROJECT_ID="prj_8gsXbaQoOZHgbhjnqiMPR9A5jg5b"
          rm -rf .vercel
          vercel pull --yes --environment=preview --token="$token"
          VITE_AUTH_MODE=remote \
          VITE_API_URL=https://neuroped.pages.dev \
          VITE_PIN_HASH= \
          VITE_ZONE=full \
          VITE_ALLOWED_HOSTS= \
          VERCEL_GIT_COMMIT_SHA="$PREVIEW_SHA" \
          VERCEL_GIT_COMMIT_REF="$PREVIEW_REF" \
            vercel build --token="$token"
          npm run audit:built-pin
          url=$(vercel deploy --prebuilt --token="$token")
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "Preview: $url"

      - name: Inspect and smoke-test protected preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          token="$VERCEL_TOKEN"
          unset VERCEL_TOKEN
          export VERCEL_PROJECT_ID="prj_8gsXbaQoOZHgbhjnqiMPR9A5jg5b"
          vercel inspect "$PREVIEW_URL" --token="$token"
          vercel curl / --deployment "$PREVIEW_URL" --token="$token" -o /tmp/preview-root.html
          test -s /tmp/preview-root.html
          vercel curl /deploy-check.json --deployment "$PREVIEW_URL" --token="$token" -o /tmp/preview-sentinel.json
          node -e '
            const fs = require("node:fs");
            const check = JSON.parse(fs.readFileSync("/tmp/preview-sentinel.json", "utf8"));
            if (check.app !== "NeuroPed" || check.provider !== "vercel-preview" || check.status !== "preview" || check.commit !== process.env.PREVIEW_SHA) {
              console.error("Sentinela de preview não corresponde ao commit atual.", check);
              process.exit(1);
            }
            console.log("Preview validado no commit", check.commit);
          '

      - name: Publish preview URL in job summary
        if: success()
        run: |
          {
            echo "## NeuroPed — Vercel Preview"
            echo
            echo "- Branch: \`$PREVIEW_REF\`"
            echo "- Commit: \`$PREVIEW_SHA\`"
            echo "- URL: $PREVIEW_URL"
            echo "- Production alias: **não alterado**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview result on matching PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$PREVIEW_REF" --base main --state open --json number --jq '.[0].number // empty')
          [ -n "$pr_number" ] || exit 0
          marker='<!-- neuroped-vercel-preview -->'
          actions_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$JOB_STATUS" = "success" ] && [ -n "${PREVIEW_URL:-}" ]; then
            body=$(cat <<EOF
          $marker
          ## NeuroPed — Preview Vercel validado

          - URL: $PREVIEW_URL
          - Commit: \`$PREVIEW_SHA\`
          - Produção: **não alterada**
          - Gate: \`check + public/access + publish-safety + build + artifact audit + vercel inspect/curl + sentinel\`
          - Execução: $actions_url
          EOF
          )
          else
            body=$(cat <<EOF
          $marker
          ## NeuroPed — Preview Vercel não liberado

          - Commit: \`$PREVIEW_SHA\`
          - Produção: **não alterada**
          - Estado do job: \`$JOB_STATUS\`
          - Execução para diagnóstico: $actions_url
          EOF
          )
          fi
          existing_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr_number/comments" --paginate --jq ".[] | select(.user.type == \"Bot\" and (.body | contains(\"$marker\"))) | .id" | head -n1)
          if [ -n "$existing_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$pr_number/comments" -f body="$body" >/dev/null
          fi
