name: Temporary IPN-TEA baseline

on:
  push:
    branches:
      - feat/ipn-tea-200-smart-filter

permissions:
  contents: write

concurrency:
  group: tmp-ipn-tea-baseline
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'remove temporary IPN workflow')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Register focused IPN regression in the filter gate
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "package.json";
          const pkg = JSON.parse(readFileSync(path, "utf8"));
          const command = "node --import tsx tests/clinical/test-ipn-tea-filter.mjs";
          if (!pkg.scripts["test:filter"].includes(command)) {
            pkg.scripts["test:filter"] += ` && ${command}`;
            writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          }
          NODE

      - name: Freeze reviewed safety classification
        run: UPDATE_SAFETY_BASELINE=1 npm run validate:safety

      - name: Focused type and clinical gates
        run: |
          npm run check
          npm run validate:catalog
          npm run test:filter
          npm run test:interactive

      - name: Commit generated baseline and permanent test hook
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json scripts/guards/safety-classification-baseline.json
          if git diff --cached --quiet; then
            echo "Nenhuma atualização gerada."
            exit 0
          fi
          git commit -m "test(escalas): congelar segurança e regressão do IPN-TEA 200"
          git push origin HEAD:feat/ipn-tea-200-smart-filter
