name: Reconcile Sonda with latest main

on:
  push:
    branches:
      - feat/sonda-dez-stimuli-daily-20260906
    paths:
      - ".github/workflows/sonda-reconcile-latest-main.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/sonda-dez-stimuli-daily-20260906
          fetch-depth: 0
      - name: Merge latest main and preserve current main Especialidades
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts=$(git diff --name-only --diff-filter=U)
            echo "Conflicts: $conflicts"
            unexpected=$(printf '%s\n' "$conflicts" | grep -v '^client/src/pages/especialidades-premium.tsx$' || true)
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts; refusing automatic resolution:"
              echo "$unexpected"
              exit 1
            fi
            git checkout --theirs client/src/pages/especialidades-premium.tsx
            git add client/src/pages/especialidades-premium.tsx
          fi
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git rm .github/workflows/sonda-reconcile-latest-main.yml
          git add -A
          git commit -m "merge: reconciliar Sonda Dez com main atual"
          git push origin HEAD:feat/sonda-dez-stimuli-daily-20260906
