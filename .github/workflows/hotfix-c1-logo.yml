name: Hotfix C1 Express logo

on:
  push:
    branches:
      - "hotfix/c1-express-logo"

permissions:
  contents: write

jobs:
  patch-c1-express:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v7
        with:
          ref: hotfix/c1-express-logo

      - name: Apply logo patch
        run: node scripts/apply-c1-express-logo-hotfix.mjs

      - name: Verify patch anchors
        run: |
          grep -F 'drJadsonMasterShieldLogo' client/src/pages/receita-c1-express.tsx
          grep -F 'logoImage.scaleToFit' client/src/pages/receita-c1-express.tsx
          grep -F 'page.drawImage(logoImage' client/src/pages/receita-c1-express.tsx

      - name: Commit patched source
        run: |
          if git diff --quiet -- client/src/pages/receita-c1-express.tsx; then
            echo 'Hotfix já aplicado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/receita-c1-express.tsx
          git commit -m 'fix(pdf): inclui escudo mestre no C1 Express de duas vias'
          git push origin HEAD:hotfix/c1-express-logo
