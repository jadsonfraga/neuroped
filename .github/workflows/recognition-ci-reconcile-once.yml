name: Reconcile superseded recognition CI runs
on:
  push:
    branches: [feat/visual-recognition-v2]
    paths: [.github/workflows/recognition-ci-reconcile-once.yml]
permissions:
  contents: read
  actions: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Cancel only superseded runs on this unmerged feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/visual-recognition-v2"
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feat/visual-recognition-v2" --jq '.object.sha')
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?branch=feat%2Fvisual-recognition-v2&per_page=100" \
            --jq '.workflow_runs[] | [.id,.head_sha,.status] | @tsv' > /tmp/recognition-runs.tsv
          while IFS=$'\t' read -r id sha status; do
            if [ "$sha" != "$current" ] && [ "$id" != "$GITHUB_RUN_ID" ] && [ "$status" != "completed" ]; then
              latest=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.status')
              if [ "$latest" != "completed" ]; then
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" \
                  || { final=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.status'); test "$final" = "completed"; }
                echo "Superseded feature run reconciled: $id ($sha)."
              fi
            fi
          done < /tmp/recognition-runs.tsv
          echo "Current head, production runs and their required checks were not cancelled."
