name: Deploy Cloudflare Pages

# Deploy do frontend (Vite) para o Cloudflare Pages, em paralelo ao GitHub Pages.
# Usa as secrets do repositório: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, VITE_PIN_HASH.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Evita deploys concorrentes para o Cloudflare
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy-cloudflare:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Compilar frontend (Vite)
        env:
          NODE_ENV: production
          VITE_PIN_HASH: ${{ secrets.VITE_PIN_HASH }}
        run: npx vite build

      - name: Verificar output do build
        run: ls -la dist/public/

      - name: Garantir projeto Cloudflare Pages (cria se não existir)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@3 pages project create neuroped --production-branch main \
            || echo "Projeto 'neuroped' já existe ou criação ignorada — seguindo para o deploy."

      - name: Deploy para Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 pages deploy dist/public --project-name neuroped --branch main
