name: Deploy Cloudflare Pages

# Deploy do frontend (Vite) para o Cloudflare Pages, em paralelo ao GitHub Pages.
# Usa as secrets do repositório: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, VITE_PIN_HASH.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy-cloudflare:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: TypeScript check
        run: npm run check

      - name: Validar catálogo clínico
        run: npm run validate:catalog

      - name: Auditar política de acesso
        run: npm run audit:access

      - name: Auditar identidade institucional
        run: npm run audit:identity

      - name: Auditar rotas de navegação
        run: npm run audit:navigation

      - name: Auditar assets visuais
        run: npm run audit:assets

      - name: Testes clínicos
        run: npm run test:clinical

      - name: Criar sentinela de deploy
        run: |
          mkdir -p client/public
          cat > client/public/deploy-check.json <<EOF
          {
            "app": "NeuroPed",
            "provider": "cloudflare-pages",
            "branch": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "deployed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat client/public/deploy-check.json

      - name: Compilar frontend para Cloudflare Pages
        env:
          NODE_ENV: production
          VITE_PIN_HASH: ${{ secrets.VITE_PIN_HASH }}
        run: npm run build:client

      - name: Verificar output do build
        run: |
          ls -la dist/public/
          test -f dist/public/deploy-check.json
          cat dist/public/deploy-check.json

      - name: Garantir projeto Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@3 pages project create neuroped --production-branch main \
            || echo "Projeto 'neuroped' já existe ou criação ignorada — seguindo para o deploy."

      - name: Deploy para Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 pages deploy dist/public --project-name neuroped --branch main

      - name: Verificar publicação pública no Cloudflare
        run: |
          echo "Aguardando propagação curta do Cloudflare Pages..."
          sleep 20
          curl -fsSL https://neuroped.pages.dev/deploy-check.json -o /tmp/cloudflare-deploy-check.json
          cat /tmp/cloudflare-deploy-check.json
          grep "${GITHUB_SHA}" /tmp/cloudflare-deploy-check.json
