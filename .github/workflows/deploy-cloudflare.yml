name: Deploy Cloudflare Pages

# Deploy do frontend (Vite) para o Cloudflare Pages, em paralelo ao GitHub Pages.
# Usa as secrets do repositório: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Este workflow publica somente o frontend estatico; dados reais exigem a API oficial autenticada.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy-cloudflare:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: TypeScript check
        run: npm run check

      - name: Validar catálogo clínico
        run: npm run validate:catalog

      - name: Validar ranking clinico
        run: npm run validate:ranking

      - name: Auditar política de acesso
        run: npm run audit:access

      - name: Auditar identidade institucional
        run: npm run audit:identity

      - name: Auditar rotas de navegação
        run: npm run audit:navigation

      - name: Auditar assets visuais
        run: npm run audit:assets

      - name: Testes clínicos
        run: npm run test:clinical

      - name: Testar podio do filtro de escalas
        run: npm run test:podium

      - name: Criar sentinela de deploy
        run: |
          mkdir -p client/public
          cat > client/public/deploy-check.json <<EOF
          {
            "app": "NeuroPed",
            "provider": "cloudflare-pages",
            "branch": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "deployed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat client/public/deploy-check.json

      - name: Compilar frontend para Cloudflare Pages
        env:
          NODE_ENV: production
          # PIN unico da trava privada (PrivateGate): defina o secret
          # VITE_PIN_HASH = SHA-256 do PIN para bloquear todo o publico.
          VITE_PIN_HASH: ${{ secrets.VITE_PIN_HASH }}
        run: npm run build:client

      - name: Verificar output do build
        run: |
          ls -la dist/public/
          test -f dist/public/deploy-check.json
          cat dist/public/deploy-check.json

      - name: Garantir projeto Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages project create neuroped --production-branch main \
            || echo "Projeto 'neuroped' já existe ou criação ignorada — seguindo para o deploy."

      - name: Migrar D1 — colunas de auth (idempotente)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Cada coluna é adicionada de forma independente; "duplicate column" é
          # esperado em re-execuções e tolerado. Robusto a aplicação parcial.
          add_col() {
            echo "ALTER users ADD $1"
            npx wrangler@4 d1 execute neuroped-db --remote --yes \
              --command "ALTER TABLE users ADD COLUMN $1;" 2>&1 | tail -2 || true
          }
          add_col "password_hash TEXT"
          add_col "must_change_password INTEGER NOT NULL DEFAULT 0"
          add_col "failed_login_attempts INTEGER NOT NULL DEFAULT 0"
          add_col "locked_until DATETIME"
          add_col "last_login_at DATETIME"
          echo "Verificando colunas de auth em users..."
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM pragma_table_info('users');" > /tmp/cols.txt 2>&1 || true
          cat /tmp/cols.txt
          for c in password_hash must_change_password failed_login_attempts locked_until last_login_at; do
            grep -q "\b$c\b" /tmp/cols.txt || { echo "::error::coluna de auth ausente: $c"; exit 1; }
          done
          echo "Colunas de auth OK."

      - name: Configurar secrets/vars de auth no Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.NEUROPED_JWT_SECRET }}
          ADMIN_PW: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
          ADMIN_MAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_NM: ${{ secrets.ADMIN_NAME }}
        run: |
          put() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | npx wrangler@4 pages secret put "$1" --project-name neuroped >/dev/null 2>&1 \
                && echo "secret $1: definido" || echo "::warning::falha ao definir $1"
            else
              echo "::notice::$1 ausente (crie o GitHub Secret) — pulando"
            fi
          }
          put NEUROPED_JWT_SECRET "$JWT_SECRET"
          put ADMIN_INITIAL_PASSWORD "$ADMIN_PW"
          put ADMIN_EMAIL "$ADMIN_MAIL"
          put ADMIN_NAME "$ADMIN_NM"

      - name: Deploy para Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy dist/public --project-name neuroped --branch main

      - name: Verificar publicação pública no Cloudflare
        run: |
          echo "Aguardando propagação curta do Cloudflare Pages..."
          sleep 20
          curl -fsSL https://neuroped.pages.dev/deploy-check.json -o /tmp/cloudflare-deploy-check.json
          cat /tmp/cloudflare-deploy-check.json
          grep "${GITHUB_SHA}" /tmp/cloudflare-deploy-check.json

      - name: Verificar login (auth e2e)
        env:
          ADMIN_MAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PW: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
        run: |
          if [ -z "$ADMIN_MAIL" ] || [ -z "$ADMIN_PW" ]; then
            echo "::notice::ADMIN_EMAIL/ADMIN_INITIAL_PASSWORD ausentes — pulando verificação de login."
            exit 0
          fi
          BASE=https://neuroped.pages.dev
          sleep 10
          # 1) senha errada → 401
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$ADMIN_MAIL\",\"password\":\"senha_errada___\"}")
          echo "login (senha errada): HTTP $code"
          [ "$code" = "401" ] || { echo "::error::esperado 401 para senha errada"; exit 1; }
          # 2) correto → 200 + accessToken (token nunca é impresso)
          resp=$(curl -s -X POST "$BASE/api/auth/login" -H "Content-Type: application/json" \
            -d "{\"email\":\"$ADMIN_MAIL\",\"password\":\"$ADMIN_PW\"}")
          tok=$(printf '%s' "$resp" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).accessToken||'')}catch{process.stdout.write('')}})")
          [ -n "$tok" ] || { echo "::error::login correto não retornou accessToken"; exit 1; }
          echo "login (correto): OK — token recebido (mascarado)"
          # 3) /me com o token → 200
          mecode=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/auth/me" -H "Authorization: Bearer $tok")
          echo "me: HTTP $mecode"
          [ "$mecode" = "200" ] || { echo "::error::/api/auth/me esperado 200"; exit 1; }
          echo "✅ AUTH E2E OK — login nominal no ar."
