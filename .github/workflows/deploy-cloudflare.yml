name: Deploy Cloudflare Pages

# Deploy do frontend (Vite) para o Cloudflare Pages, em paralelo ao GitHub Pages.
# Usa as secrets do repositório: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Publica frontend + Pages Functions. Com D1 vinculado, autenticação nominal
# configurada é requisito de release e qualquer ausência falha antes do deploy.

on:
  push:
    branches:
      - main

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  assert-main:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar branch de produção
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Deploy de produção permitido somente a partir de main."
            exit 1
          fi

  status-pending:
    needs: assert-main
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publicar estado pendente do Cloudflare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="pending" \
            -f context="NeuroPed / Cloudflare production" \
            -f description="Backend canônico em validação e publicação." \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  deploy-cloudflare:
    needs: status-pending
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Validar secrets obrigatórios antes de qualquer publicação
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.NEUROPED_JWT_SECRET }}
          BOOTSTRAP_MAIL: ${{ secrets.ADMIN_EMAIL }}
          BOOTSTRAP_PW: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
          E2E_MAIL: ${{ secrets.NEUROPED_E2E_EMAIL }}
          E2E_PW: ${{ secrets.NEUROPED_E2E_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$E2E_MAIL" ] || [ -n "$E2E_PW" ]; then
            [ -n "$E2E_MAIL" ] && [ -n "$E2E_PW" ] || {
              echo "::error::NEUROPED_E2E_EMAIL e NEUROPED_E2E_PASSWORD devem existir juntos"
              exit 1
            }
            ACTIVE_MAIL="$E2E_MAIL"
            ACTIVE_PW="$E2E_PW"
          else
            ACTIVE_MAIL="$BOOTSTRAP_MAIL"
            ACTIVE_PW="$BOOTSTRAP_PW"
          fi
          for name in CF_TOKEN CF_ACCOUNT JWT_SECRET ACTIVE_MAIL ACTIVE_PW; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::GitHub Secret obrigatório ausente: $name"
              exit 1
            fi
          done
          [ "${#JWT_SECRET}" -ge 32 ] || { echo "::error::NEUROPED_JWT_SECRET deve ter ao menos 32 caracteres"; exit 1; }
          [ "${#ACTIVE_PW}" -ge 12 ] || { echo "::error::senha da jornada E2E deve ter ao menos 12 caracteres"; exit 1; }
          case "$ACTIVE_MAIL" in *@*) ;; *) echo "::error::e-mail da jornada E2E inválido"; exit 1;; esac
          if [ -n "$BOOTSTRAP_MAIL" ] || [ -n "$BOOTSTRAP_PW" ]; then
            [ -n "$BOOTSTRAP_MAIL" ] && [ -n "$BOOTSTRAP_PW" ] || {
              echo "::error::ADMIN_EMAIL e ADMIN_INITIAL_PASSWORD devem existir juntos"
              exit 1
            }
            [ "${#BOOTSTRAP_PW}" -ge 12 ] || { echo "::error::ADMIN_INITIAL_PASSWORD deve ter ao menos 12 caracteres"; exit 1; }
            case "$BOOTSTRAP_MAIL" in *@*) ;; *) echo "::error::ADMIN_EMAIL inválido"; exit 1;; esac
          fi
          echo "Secrets obrigatórios presentes (valores não exibidos)."

      - name: Configurar Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Auditar grafo completo de dependências
        run: npm audit --audit-level=high

      - name: Catraca técnica completa de release
        run: npm run verify

      - name: Criar sentinela de deploy
        run: |
          mkdir -p client/public
          cat > client/public/deploy-check.json <<EOF
          {
            "app": "NeuroPed",
            "provider": "cloudflare-pages",
            "branch": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "deployed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat client/public/deploy-check.json

      - name: Compilar frontend para Cloudflare Pages
        env:
          NODE_ENV: production
          VITE_AUTH_MODE: remote
          VITE_API_URL: ""
          VITE_ZONE: full
          VITE_ALLOWED_HOSTS: ""
        run: VITE_PIN_HASH= npm run build:client

      - name: Auditar carga inicial real do JavaScript
        run: npm run test:bundle-audit && npm run audit:bundle && npm run audit:built-pin

      - name: Verificar output do build
        run: |
          ls -la dist/public/
          test -f dist/public/deploy-check.json
          cat dist/public/deploy-check.json

      - name: Garantir projeto Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          output_file="$(mktemp)"
          if npx wrangler@4 pages project create neuroped --production-branch main \
            2>&1 | tee "$output_file"; then
            echo "Projeto 'neuroped' criado."
          elif grep -Fq "A project with this name already exists." "$output_file" \
            && grep -Fq "[code: 8000002]" "$output_file"; then
            echo "Projeto 'neuroped' já existe — seguindo para o deploy."
          else
            echo "::error::Falha inesperada ao consultar/criar o projeto Cloudflare Pages."
            exit 1
          fi

      - name: Migrar D1 — auth, ownership e sessões (idempotente)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Cada coluna é adicionada de forma independente; "duplicate column" é
          # esperado em re-execuções e tolerado. Robusto a aplicação parcial.
          add_col() {
            echo "ALTER users ADD $1"
            npx wrangler@4 d1 execute neuroped-db --remote --yes \
              --command "ALTER TABLE users ADD COLUMN $1;" 2>&1 | tail -2 || true
          }
          add_col "password_hash TEXT"
          add_col "must_change_password INTEGER NOT NULL DEFAULT 0"
          add_col "failed_login_attempts INTEGER NOT NULL DEFAULT 0"
          add_col "locked_until DATETIME"
          add_col "last_login_at DATETIME"
          echo "Verificando colunas de auth em users..."
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM pragma_table_info('users');" > /tmp/cols.txt 2>&1 || true
          cat /tmp/cols.txt
          for c in password_hash must_change_password failed_login_attempts locked_until last_login_at; do
            grep -q "\b$c\b" /tmp/cols.txt || { echo "::error::coluna de auth ausente: $c"; exit 1; }
          done
          echo "Colunas de auth OK."

          echo "ALTER patients_demo ADD owner_user_id"
          npx wrangler@4 d1 execute neuroped-db --remote --yes \
            --command "ALTER TABLE patients_demo ADD COLUMN owner_user_id TEXT;" 2>&1 | tail -2 || true
          npx wrangler@4 d1 execute neuroped-db --remote --yes \
            --command "CREATE INDEX IF NOT EXISTS idx_patients_demo_owner ON patients_demo(owner_user_id);"
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM pragma_table_info('patients_demo');" > /tmp/patient-cols.txt 2>&1 || true
          cat /tmp/patient-cols.txt
          grep -q "\bowner_user_id\b" /tmp/patient-cols.txt || {
            echo "::error::coluna de ownership ausente: patients_demo.owner_user_id"
            exit 1
          }
          echo "Coluna de ownership OK."

          npx wrangler@4 d1 execute neuroped-db --remote --yes \
            --file=./db/migrations/0003_refresh_sessions.sql
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='auth_refresh_sessions';" \
            > /tmp/session-table.txt 2>&1
          cat /tmp/session-table.txt
          grep -q "auth_refresh_sessions" /tmp/session-table.txt || {
            echo "::error::tabela de sessões revogáveis ausente"
            exit 1
          }
          echo "Tabela de sessões revogáveis OK."

          npx wrangler@4 d1 execute neuroped-db --remote --yes \
            --file=./db/migrations/0004_consents.sql
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM pragma_table_info('consents');" \
            > /tmp/consent-cols.txt 2>&1
          cat /tmp/consent-cols.txt
          for column in batch_id user_id consent_type accepted_at; do
            grep -q "\b$column\b" /tmp/consent-cols.txt || {
              echo "::error::coluna de consentimento ausente: $column"
              exit 1
            }
          done
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='index' AND name='idx_consents_user_accepted';" \
            > /tmp/consent-index.txt 2>&1
          cat /tmp/consent-index.txt
          grep -q "idx_consents_user_accepted" /tmp/consent-index.txt || {
            echo "::error::índice de ownership dos consentimentos ausente"
            exit 1
          }
          echo "Tabela de consentimentos LGPD OK."

          npx wrangler@4 d1 execute neuroped-db --remote --yes \
            --file=./db/migrations/0011_clinical_memory.sql
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='clinical_memory_notes_demo';" \
            > /tmp/clinical-memory-table.txt 2>&1
          cat /tmp/clinical-memory-table.txt
          grep -q "clinical_memory_notes_demo" /tmp/clinical-memory-table.txt || {
            echo "::error::tabela de memória clínica ausente"
            exit 1
          }
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='index' AND name='idx_clinical_memory_patient_updated';" \
            > /tmp/clinical-memory-index.txt 2>&1
          cat /tmp/clinical-memory-index.txt
          grep -q "idx_clinical_memory_patient_updated" /tmp/clinical-memory-index.txt || {
            echo "::error::índice da memória clínica ausente"
            exit 1
          }
          echo "Tabela de memória clínica persistente OK."

          npx wrangler@4 d1 execute neuroped-db --remote --yes \
            --file=./db/migrations/0012_commercial_readiness.sql
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('billing_accounts','billing_events','clinic_invitations','commercial_trial_claims') ORDER BY name;" \
            > /tmp/commercial-tables.txt 2>&1
          cat /tmp/commercial-tables.txt
          for table in billing_accounts billing_events clinic_invitations commercial_trial_claims; do
            grep -q "$table" /tmp/commercial-tables.txt || {
              echo "::error::tabela comercial ausente: $table"
              exit 1
            }
          done
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='index' AND name IN ('ux_billing_provider_customer','ux_billing_provider_subscription','ux_billing_provider_checkout_session','idx_billing_events_clinic_time','ux_clinic_invitations_pending_email') ORDER BY name;" \
            > /tmp/commercial-indexes.txt 2>&1
          cat /tmp/commercial-indexes.txt
          for index in ux_billing_provider_customer ux_billing_provider_subscription ux_billing_provider_checkout_session idx_billing_events_clinic_time ux_clinic_invitations_pending_email; do
            grep -q "$index" /tmp/commercial-indexes.txt || {
              echo "::error::índice comercial ausente: $index"
              exit 1
            }
          done
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='trigger' AND name IN ('trg_clinic_memberships_billing_seat_insert','trg_clinic_memberships_billing_seat_reactivate','trg_clinic_invitations_billing_seat_insert') ORDER BY name;" \
            > /tmp/commercial-triggers.txt 2>&1
          cat /tmp/commercial-triggers.txt
          for trigger in trg_clinic_memberships_billing_seat_insert trg_clinic_memberships_billing_seat_reactivate trg_clinic_invitations_billing_seat_insert; do
            grep -q "$trigger" /tmp/commercial-triggers.txt || {
              echo "::error::trava física de assento ausente: $trigger"
              exit 1
            }
          done
          echo "Fundação comercial, convites, assentos e idempotência de cobrança OK."

      - name: Configurar secrets/vars de auth no Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.NEUROPED_JWT_SECRET }}
          ADMIN_PW: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
          ADMIN_MAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_NM: ${{ secrets.ADMIN_NAME }}
          STRIPE_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE: ${{ secrets.STRIPE_PRICE_ID }}
        run: |
          set -euo pipefail
          jwt_secret="$JWT_SECRET"
          admin_pw="$ADMIN_PW"
          admin_mail="$ADMIN_MAIL"
          admin_name="$ADMIN_NM"
          stripe_key="$STRIPE_KEY"
          stripe_webhook="$STRIPE_WEBHOOK"
          stripe_price="$STRIPE_PRICE"
          unset JWT_SECRET ADMIN_PW ADMIN_MAIL ADMIN_NM STRIPE_KEY STRIPE_WEBHOOK STRIPE_PRICE
          put_required() {
            [ -n "$2" ] || { echo "::error::$1 ausente"; exit 1; }
            printf '%s' "$2" | npx wrangler@4 pages secret put "$1" --project-name neuroped >/dev/null
            echo "secret $1: definido"
          }
          put_optional() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | npx wrangler@4 pages secret put "$1" --project-name neuroped >/dev/null
              echo "secret opcional $1: definido"
            fi
          }
          put_required NEUROPED_JWT_SECRET "$jwt_secret"
          put_optional ADMIN_INITIAL_PASSWORD "$admin_pw"
          put_optional ADMIN_EMAIL "$admin_mail"
          put_optional ADMIN_NAME "$admin_name"
          put_optional STRIPE_SECRET_KEY "$stripe_key"
          put_optional STRIPE_WEBHOOK_SECRET "$stripe_webhook"
          put_optional STRIPE_PRICE_ID "$stripe_price"

      - name: Deploy para Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy dist/public --project-name neuroped --branch main

      - name: Verificar publicação pública no Cloudflare
        run: |
          echo "Aguardando o Cloudflare promover o deploy para o domínio apex (poll)..."
          # O `wrangler pages deploy` já concluiu com sucesso; aqui só confirmamos
          # que o apex (neuroped.pages.dev) já serve o commit novo. A promoção do
          # apex pode levar alguns minutos — então fazemos poll em vez de um único
          # sleep. Release só fica verde quando o commit esperado estiver público.
          ok=0
          for i in $(seq 1 12); do
            sleep 15
            if curl -fsSL "https://neuroped.pages.dev/deploy-check.json?ts=$(date +%s)" \
                 -o /tmp/cloudflare-deploy-check.json 2>/dev/null \
               && grep -q "${GITHUB_SHA}" /tmp/cloudflare-deploy-check.json; then
              echo "✓ Apex já serve ${GITHUB_SHA} (tentativa $i)."
              ok=1
              break
            fi
            echo "  apex ainda não promoveu o commit novo (tentativa $i/12)…"
          done
          cat /tmp/cloudflare-deploy-check.json 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then
            echo "::error::O apex não serviu o commit esperado após ~3 min."
            exit 1
          fi

      - name: Validar health autenticado do backend publicado
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 12); do
            if curl -fsSL "https://neuroped.pages.dev/api/health?run=${GITHUB_RUN_ID}&try=$i" \
                 -o /tmp/cloudflare-health.json 2>/dev/null \
               && jq -e '.database == "ok" and .authentication.required == true and .authentication.configured == true' \
                    /tmp/cloudflare-health.json >/dev/null; then
              ok=1
              break
            fi
            sleep 10
          done
          cat /tmp/cloudflare-health.json 2>/dev/null || true
          [ "$ok" -eq 1 ] || { echo "::error::Backend publicado sem D1/auth plenamente configurados"; exit 1; }
          echo "✅ HEALTH OK — D1 e autenticação nominal configurados."

      - name: Validar CORS restrito do mirror oficial
        run: |
          set -euo pipefail
          BASE=https://neuroped.pages.dev

          header_value() {
            tr -d '\r' < "$1" | awk -F': ' -v target="$2" \
              'tolower($1) == tolower(target) { print $2 }' | tail -1
          }

          header_present() {
            tr -d '\r' < "$1" | grep -qi "^${2}:"
          }

          for origin in https://superneuroped.vercel.app; do
            cors_ok=0
            for attempt in $(seq 1 12); do
              headers=$(mktemp)
              preflight_headers=$(mktemp)
              get_ok=0
              preflight_ok=0

              if curl -fsS -D "$headers" -o /tmp/cors-health.json \
                   -H "Origin: $origin" \
                   "$BASE/api/health?cors=${GITHUB_RUN_ID}&try=$attempt" \
                && [ "$(header_value "$headers" Access-Control-Allow-Origin)" = "$origin" ] \
                && jq -e '.database == "ok" and .authentication.configured == true' \
                     /tmp/cors-health.json >/dev/null; then
                get_ok=1
              fi

              code=$(curl -sS -o /dev/null -D "$preflight_headers" -w "%{http_code}" \
                -X OPTIONS "$BASE/api/auth/login?cors=${GITHUB_RUN_ID}&try=$attempt" \
                -H "Origin: $origin" \
                -H "Access-Control-Request-Method: POST" \
                -H "Access-Control-Request-Headers: Content-Type, Authorization" || true)
              allowed_headers=$(header_value "$preflight_headers" Access-Control-Allow-Headers)
              if [ "$code" = "204" ] \
                && [ "$(header_value "$preflight_headers" Access-Control-Allow-Origin)" = "$origin" ] \
                && printf '%s' "$allowed_headers" | grep -qi 'Content-Type' \
                && printf '%s' "$allowed_headers" | grep -qi 'Authorization'; then
                preflight_ok=1
              fi

              if [ "$get_ok" -eq 1 ] && [ "$preflight_ok" -eq 1 ]; then
                cors_ok=1
                break
              fi
              echo "CORS ainda propagando para $origin (tentativa $attempt/12)."
              sleep 10
            done
            [ "$cors_ok" -eq 1 ] || {
              echo "::error::CORS/preflight não propagou para $origin."
              exit 1
            }
            echo "CORS oficial OK: $origin"
          done

          # A propagação entre edges não é atômica. A política negativa também
          # precisa convergir no commit novo antes de reprovar o release.
          denied_index=0
          for denied_origin in \
            https://neuroped.vercel.app \
            https://neuroped.vercel.app.evil.example \
            https://jadsonfraga.github.io; do
            denied_index=$((denied_index + 1))
            denied_ok=0
            for attempt in $(seq 1 12); do
              denied_headers=$(mktemp)
              denied_preflight_headers=$(mktemp)
              cache_key="cors-denied=${GITHUB_RUN_ID}&origin=${denied_index}&try=${attempt}"

              denied_get_code=$(curl -sS -o /dev/null -D "$denied_headers" \
                -w "%{http_code}" -H "Origin: $denied_origin" \
                "$BASE/api/health?$cache_key" || true)
              denied_code=$(curl -sS -o /dev/null -D "$denied_preflight_headers" \
                -w "%{http_code}" -X OPTIONS "$BASE/api/auth/login?$cache_key" \
                -H "Origin: $denied_origin" \
                -H "Access-Control-Request-Method: POST" \
                -H "Access-Control-Request-Headers: Content-Type, Authorization" || true)

              if [ "$denied_get_code" = "200" ] \
                && ! header_present "$denied_headers" Access-Control-Allow-Origin \
                && [ "$denied_code" = "204" ] \
                && ! header_present "$denied_preflight_headers" Access-Control-Allow-Origin; then
                denied_ok=1
                break
              fi
              echo "Negação CORS ainda propagando para $denied_origin (tentativa $attempt/12)."
              sleep 10
            done
            [ "$denied_ok" -eq 1 ] || {
              echo "::error::Origem não autorizada ainda recebeu CORS ou resposta inválida: $denied_origin"
              exit 1
            }
          done
          echo "✅ CORS exato do mirror comprovado; origem externa e lookalikes rejeitados."

      - name: Verificar login (auth e2e)
        env:
          E2E_MAIL: ${{ secrets.NEUROPED_E2E_EMAIL }}
          E2E_PW: ${{ secrets.NEUROPED_E2E_PASSWORD }}
          FALLBACK_MAIL: ${{ secrets.ADMIN_EMAIL }}
          FALLBACK_PW: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
        run: |
          set -euo pipefail
          BASE=https://neuroped.pages.dev
          if [ -n "$E2E_MAIL" ] || [ -n "$E2E_PW" ]; then
            [ -n "$E2E_MAIL" ] && [ -n "$E2E_PW" ] || exit 1
            admin_mail="$E2E_MAIL"
            admin_pw="$E2E_PW"
          else
            admin_mail="$FALLBACK_MAIL"
            admin_pw="$FALLBACK_PW"
          fi
          unset E2E_MAIL E2E_PW FALLBACK_MAIL FALLBACK_PW
          sleep 10
          # 1) senha errada → 401
          wrong_payload=$(jq -nc --arg email "ci-negative-${GITHUB_RUN_ID}@invalid.example" \
            --arg password "senha_errada___" '{email:$email,password:$password}')
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/api/auth/login" \
            -H "Content-Type: application/json" \
            --data "$wrong_payload")
          echo "login (senha errada): HTTP $code"
          [ "$code" = "401" ] || { echo "::error::esperado 401 para senha errada"; exit 1; }
          # 2) correto → 200 + accessToken (token nunca é impresso)
          login_payload=$(jq -nc --arg email "$admin_mail" --arg password "$admin_pw" '{email:$email,password:$password}')
          resp=$(curl -s -X POST "$BASE/api/auth/login" -H "Content-Type: application/json" \
            --data "$login_payload")
          tok=$(printf '%s' "$resp" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).accessToken||'')}catch{process.stdout.write('')}})")
          refresh=$(printf '%s' "$resp" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).refreshToken||'')}catch{process.stdout.write('')}})")
          [ -n "$tok" ] && [ -n "$refresh" ] || { echo "::error::login correto não retornou o par de tokens"; exit 1; }
          echo "login (correto): OK — tokens recebidos (mascarados)"
          # 3) /me com o token → 200
          mecode=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/auth/me" -H "Authorization: Bearer $tok")
          echo "me: HTTP $mecode"
          [ "$mecode" = "200" ] || { echo "::error::/api/auth/me esperado 200"; exit 1; }
          # 4) logout revoga a família da sessão e invalida o access token
          logout_payload=$(jq -nc --arg refreshToken "$refresh" '{refreshToken:$refreshToken}')
          logoutcode=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/api/auth/logout" \
            -H "Content-Type: application/json" --data "$logout_payload")
          [ "$logoutcode" = "200" ] || { echo "::error::logout esperado 200"; exit 1; }
          revokedcode=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/auth/me" \
            -H "Authorization: Bearer $tok")
          [ "$revokedcode" = "401" ] || { echo "::error::sessão de teste não foi revogada"; exit 1; }
          echo "✅ AUTH E2E OK — login nominal e logout revogável no ar."

  report-cloudflare-status:
    needs:
      - status-pending
      - deploy-cloudflare
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publicar resultado verificável do Cloudflare
        env:
          DEPLOY_RESULT: ${{ needs.deploy-cloudflare.result }}
          GH_TOKEN: ${{ github.token }}
          PENDING_RESULT: ${{ needs.status-pending.result }}
        run: |
          set -euo pipefail
          state="failure"
          description="Deploy Cloudflare falhou; consulte o workflow."
          if [ "$PENDING_RESULT" != "success" ]; then
            description="Falha ao publicar o estado inicial do Cloudflare."
          elif [ "$DEPLOY_RESULT" = "success" ]; then
            state="success"
            description="Backend canônico, D1, CORS e autenticação confirmados."
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="NeuroPed / Cloudflare production" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          [ "$state" = "success" ]
