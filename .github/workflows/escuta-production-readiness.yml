name: Escuta production readiness metadata
on:
  push:
    branches: [feat/escuta-clinica-integrada-20260905]
    paths: ['.github/workflows/escuta-production-readiness.yml']
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect canonical schema and configuration presence without reading patient content
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {mkdirSync,writeFileSync} from 'node:fs';
          const report={scope:'read-only schema and aggregate counts; no identifiers or clinical content',status:'running',mutations:false};
          const account=process.env.CF_ACCOUNT?.trim(),token=process.env.CF_TOKEN?.trim();
          async function cf(path,body){const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}${path}`,{method:body?'POST':'GET',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(30000)});const data=await response.json();if(!response.ok||!data.success)throw new Error(`CF_HTTP_${response.status}`);return data.result;}
          try{
            const p=await cf('/pages/projects/neuroped');assert.equal(p.name,'neuroped');
            const c=p.deployment_configs?.production||{},v=c.env_vars||{};
            report.configuration={};
            for(const key of ['NEUROPED_JWT_SECRET','CLINICAL_DATA_KEY','CLINICAL_INDEX_KEY','CLINICAL_DATA_KEY_PREVIOUS','OPERATIONAL_DATA_KEY'])report.configuration[key]={present:Object.hasOwn(v,key),type:v[key]?.type||null};
            for(const key of ['CLINICAL_LIVE_ENABLED','ESCUTA_ENABLED'])report.configuration[key]={enabled:v[key]?.value==='true'};
            const id=c.d1_databases?.DB?.id;assert.equal(id,'9b0919e5-93af-4b4f-851b-fc77dc1e5bae','Canonical D1 identity mismatch');
            report.nativeAIConfigured=Boolean(c.ai_bindings&&Object.keys(c.ai_bindings).length);
            async function sql(statement){assert(/^SELECT\s/i.test(statement),'Only SELECT permitted');const r=await cf(`/d1/database/${id}/query`,{sql:statement});assert(r.every(x=>x.success));return r[0].results;}
            const tables=await sql("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' ORDER BY name;");
            report.tables=tables.map(t=>t.name);
            report.schema={};report.clinicalCounts={};
            const selected=['users','clinics','clinic_memberships','billing_customers','billing_subscriptions','live_patients','live_clinical_documents','live_document_versions','live_assessments','saas_audit_events','d1_migrations'];
            for(const name of selected){if(!report.tables.includes(name))continue;report.schema[name]=await sql(`SELECT name,type FROM pragma_table_info('${name}');`);if(name.startsWith('live_'))report.clinicalCounts[name]=(await sql(`SELECT COUNT(*) AS total FROM ${name};`))[0].total;}
            if(report.tables.includes('d1_migrations'))report.migrationNames=await sql('SELECT name FROM d1_migrations ORDER BY id;');
            const vr=await fetch('https://api.vercel.com/v9/projects/prj_8gsXbaQoOZHgbhjnqiMPR9A5jg5b',{headers:{Authorization:`Bearer ${process.env.VERCEL_TOKEN?.trim()}`},signal:AbortSignal.timeout(20000)});assert(vr.ok);const vp=await vr.json();assert.equal(vp.id,'prj_8gsXbaQoOZHgbhjnqiMPR9A5jg5b');
            report.vercel={id:vp.id,name:vp.name,accountFieldPresent:typeof vp.accountId==='string',accountMatchesConfigured:vp.accountId===process.env.VERCEL_ORG_ID?.trim(),ownerFieldPresent:typeof vp.ownerId==='string',teamFieldPresent:typeof vp.teamId==='string',keys:Object.keys(vp).filter(k=>/^(account|owner|team)/i.test(k))};
            report.status='passed';
          }catch(e){report.status='blocked';report.reason=e.message;process.exitCode=1;}
          mkdirSync('artifacts',{recursive:true});writeFileSync('artifacts/production-readiness.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: escuta-production-readiness-${{ github.run_id }}
          path: artifacts/production-readiness.json
          retention-days: 7
