name: Cloudflare read-only mission closeout

on:
  push:
    branches: [ops/cloudflare-readonly-audit-20260914]
    paths: ['.github/workflows/escuta-production-readiness.yml']

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect production bindings and schema without PHI
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Read Cloudflare project configuration and D1 schema only
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdirSync, writeFileSync } from 'node:fs';
          const report = {
            scope: 'read-only Pages bindings + D1 schema metadata; no identifiers, rows, clinical content or secret values',
            mutations: false,
            status: 'running',
          };
          const account = process.env.CF_ACCOUNT?.trim();
          const token = process.env.CF_TOKEN?.trim();
          if (!account || !token) throw new Error('CLOUDFLARE_CREDENTIALS_UNAVAILABLE');
          async function cf(path, init = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}${path}`, {
              ...init,
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', ...(init.headers || {}) },
              signal: AbortSignal.timeout(30000),
            });
            const data = await response.json();
            if (!response.ok || !data.success) throw new Error(`CF_HTTP_${response.status}`);
            return data.result;
          }
          try {
            const project = await cf('/pages/projects/neuroped');
            assert.equal(project.name, 'neuroped');
            const production = project.deployment_configs?.production || {};
            const envVars = production.env_vars || {};
            const secretNames = [
              'NEUROPED_JWT_SECRET',
              'CLINICAL_DATA_KEY',
              'CLINICAL_DATA_KEY_ID',
              'CLINICAL_INDEX_KEY',
              'CLINICAL_DATA_KEY_PREVIOUS',
              'CLINICAL_DATA_KEY_PREVIOUS_ID',
              'OPERATIONAL_DATA_KEY',
            ];
            report.pages = {
              project: project.name,
              secrets: Object.fromEntries(secretNames.map((key) => [key, {
                present: Object.hasOwn(envVars, key),
                type: envVars[key]?.type || null,
              }])),
              flags: Object.fromEntries(['CLINICAL_LIVE_ENABLED', 'ESCUTA_ENABLED'].map((key) => [key, envVars[key]?.value ?? null])),
              d1Bindings: Object.keys(production.d1_databases || {}).sort(),
              r2Bindings: Object.keys(production.r2_buckets || {}).sort(),
              analyticsBindings: Object.keys(production.analytics_engine_datasets || {}).sort(),
              aiBindings: Object.keys(production.ai_bindings || {}).sort(),
            };
            const d1 = production.d1_databases?.DB?.id;
            assert.equal(d1, '9b0919e5-93af-4b4f-851b-fc77dc1e5bae', 'CANONICAL_D1_MISMATCH');
            async function sql(statement) {
              assert(/^SELECT\s/i.test(statement), 'READ_ONLY_SQL_REQUIRED');
              const result = await cf(`/d1/database/${d1}/query`, {
                method: 'POST',
                body: JSON.stringify({ sql: statement }),
              });
              assert(result.every((entry) => entry.success));
              return result[0].results;
            }
            const requiredTables = [
              'clinics','clinic_memberships','live_patients','live_clinical_events',
              'billing_customers','billing_subscriptions','tenant_lifecycle',
              'live_export_requests','live_lgpd_worker_jobs','saas_audit_log',
            ];
            const rows = await sql(`SELECT name FROM sqlite_master WHERE type='table' AND name IN (${requiredTables.map((name) => `'${name}'`).join(',')}) ORDER BY name;`);
            const presentTables = rows.map((row) => row.name);
            const columns = {};
            for (const table of ['live_export_requests','live_lgpd_worker_jobs']) {
              columns[table] = (await sql(`SELECT name FROM pragma_table_info('${table}') ORDER BY cid;`)).map((row) => row.name);
            }
            report.d1 = {
              requiredTablesPresent: requiredTables.filter((name) => presentTables.includes(name)),
              requiredTablesMissing: requiredTables.filter((name) => !presentTables.includes(name)),
              columns,
            };
            try {
              const r2 = await cf('/r2/buckets');
              const buckets = Array.isArray(r2?.buckets) ? r2.buckets : Array.isArray(r2) ? r2 : [];
              report.r2InventoryReadable = true;
              report.r2BucketNames = buckets.map((bucket) => bucket.name).filter(Boolean).sort();
            } catch (error) {
              report.r2InventoryReadable = false;
              report.r2InventoryReason = String(error?.message || error);
            }
            report.status = 'passed';
          } catch (error) {
            report.status = 'blocked';
            report.reason = String(error?.message || error);
            process.exitCode = 1;
          }
          mkdirSync('artifacts', { recursive: true });
          writeFileSync('artifacts/cloudflare-readonly-closeout.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-readonly-closeout-${{ github.run_id }}
          path: artifacts/cloudflare-readonly-closeout.json
          retention-days: 7
          if-no-files-found: error
