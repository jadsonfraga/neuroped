name: Release candidate hardening

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Compatibility / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7

      - name: Configure Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: TypeScript
        run: npm run check

      - name: ESLint
        run: npm run lint

      - name: Release hardening regressions
        run: npm run test:hardening-regressions

      - name: Memory ownership regression
        run: node --import tsx tests/unit/memory-search-ownership.test.ts

  verify-release:
    name: Full release verification
    runs-on: ubuntu-latest
    needs: compatibility
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7

      - name: Configure Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_ignore_scripts: false

      - name: Full dependency audit
        run: npm audit --audit-level=high

      - name: Verify release candidate
        run: npm run verify

      - name: Build fullstack artifact
        run: npm run build

      - name: Confirm production deploys remain main-only
        run: |
          set -euo pipefail
          for workflow in \
            .github/workflows/deploy-cloudflare.yml \
            .github/workflows/deploy-vercel.yml \
            .github/workflows/deploy-github-pages.yml; do
            grep -q -- '- main' "$workflow"
            ! grep -Eq 'pull_request:[[:space:]]*$' "$workflow"
          done
          echo "Release candidate verified without external publication."
