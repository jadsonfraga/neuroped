name: NeuroPed SaaS Phase 1 D1 migration

on:
  push:
    branches:
      - main
    paths:
      - "db/migrations/0009_saas_phase1_foundation.sql"
      - "functions/api/tenant/**"
      - "functions/api/tenants/**"
      - "functions/api/live/**"
      - "tests/unit/saas-phase1-foundation.test.ts"
      - ".github/workflows/saas-phase1-d1-migration.yml"

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-saas-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Confirmar branch de produção
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "::error::Migração SaaS permitida somente a partir de main."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Validar contrato da Fase 1
        run: |
          set -euo pipefail
          node --import tsx tests/unit/saas-phase1-foundation.test.ts
          npm run check

      - name: Validar credenciais Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID ausente"; exit 1; }

      - name: Aplicar somente schema SaaS da Fase 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote --yes \
            --file=./db/migrations/0009_saas_phase1_foundation.sql

      - name: Verificar isolamento físico do schema LIVE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('clinics','clinic_memberships','live_patients','live_clinical_events','saas_audit_log') ORDER BY name;" \
            > /tmp/saas-tables.txt 2>&1
          cat /tmp/saas-tables.txt
          for table in clinics clinic_memberships live_patients live_clinical_events saas_audit_log; do
            grep -q "$table" /tmp/saas-tables.txt || {
              echo "::error::Tabela SaaS ausente: $table"
              exit 1
            }
          done

          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='live_patients';" \
            > /tmp/live-patients-schema.txt 2>&1
          cat /tmp/live-patients-schema.txt
          grep -q "clinic_id TEXT NOT NULL" /tmp/live-patients-schema.txt
          grep -q "profile_encrypted TEXT NOT NULL" /tmp/live-patients-schema.txt
          if grep -Eq "(^|[,([:space:]])name[[:space:]]+TEXT|guardian_(name|phone)" /tmp/live-patients-schema.txt; then
            echo "::error::PII em plaintext reapareceu no schema live_patients"
            exit 1
          fi

          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='live_clinical_events';" \
            > /tmp/live-events-schema.txt 2>&1
          cat /tmp/live-events-schema.txt
          grep -q "clinic_id TEXT NOT NULL" /tmp/live-events-schema.txt
          grep -q "payload_encrypted TEXT NOT NULL" /tmp/live-events-schema.txt

          echo "✅ Fundação SaaS criada. Clinical LIVE NÃO foi habilitado por este workflow."
