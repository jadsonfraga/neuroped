name: Password recovery D1

on:
  pull_request:
    branches:
      - main
    paths:
      - "db/migrations/0020_password_recovery.sql"
      - "functions/api/auth/forgot-password.ts"
      - "functions/api/auth/reset-password.ts"
      - "functions/api/auth/_passwordResetDelivery.ts"
      - "tests/unit/password-recovery.test.ts"
      - ".github/workflows/password-recovery-d1.yml"
  push:
    branches:
      - main
    paths:
      - "db/migrations/0020_password_recovery.sql"
      - "functions/api/auth/forgot-password.ts"
      - "functions/api/auth/reset-password.ts"
      - "functions/api/auth/_passwordResetDelivery.ts"
      - "tests/unit/password-recovery.test.ts"
      - ".github/workflows/password-recovery-d1.yml"
  workflow_dispatch:

permissions:
  contents: read

# Grupo próprio: as migrações D1 são idempotentes e não podem ser canceladas
# pela corrida do grupo compartilhado cloudflare-pages (uma vaga pendente por
# grupo — o deploy e ~8 workflows disputando já engoliu runs nesta main).
concurrency:
  group: d1-password-recovery
  cancel-in-progress: false

jobs:
  validate-password-recovery:
    name: Validate password recovery flow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Adversarial recovery flow regression
        run: node --import tsx tests/unit/password-recovery.test.ts

      - name: TypeScript
        run: npm run check

  migrate-password-recovery:
    name: Apply password recovery schema to D1
    needs: validate-password-recovery
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID ausente"; exit 1; }

      - name: Apply migration 0020
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote --yes \
            --file=./db/migrations/0020_password_recovery.sql

      - name: Verify tables without exposing data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('auth_password_reset_tokens','auth_password_reset_rate_limits') ORDER BY name;" \
            > /tmp/recovery-tables.txt 2>&1
          cat /tmp/recovery-tables.txt
          grep -q "auth_password_reset_tokens" /tmp/recovery-tables.txt
          grep -q "auth_password_reset_rate_limits" /tmp/recovery-tables.txt

          echo "✅ Schema de recuperação de senha instalado sem consultar conteúdo de tokens."
