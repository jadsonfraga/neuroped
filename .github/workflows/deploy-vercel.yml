name: Deploy Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  # Pré-checagem: o deploy do Vercel só roda se os secrets existirem. Sem eles,
  # este job termina VERDE e o deploy é pulado (o site é publicado por Cloudflare
  # Pages + GitHub Pages). Evita o "vermelho" em todo push quando o Vercel não
  # está configurado.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VITE_PIN_HASH: ${{ secrets.VITE_PIN_HASH }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VITE_PIN_HASH" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Secrets do Vercel e verificador local presentes — deploy habilitado."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Configuração segura do Vercel incompleta — deploy IGNORADO. O site é publicado por Cloudflare Pages + GitHub Pages. Configure VERCEL_TOKEN, VERCEL_ORG_ID e VITE_PIN_HASH para habilitar."
          fi

  deploy-vercel:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Run hard release verification gate
        run: npm run verify

      - name: Validate production PIN verifier
        env:
          REQUIRE_LOCAL_PIN: "1"
          VITE_PIN_HASH: ${{ secrets.VITE_PIN_HASH }}
        run: node scripts/verify-local-pin-env.mjs

      - name: Create deploy sentinel
        run: |
          mkdir -p client/public
          cat > client/public/deploy-check.json <<EOF
          {
            "app": "NeuroPed",
            "provider": "vercel",
            "branch": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "deployed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat client/public/deploy-check.json

      - name: Build client
        env:
          NODE_ENV: production
          # Nunca embutir verificador de PIN no repositório público.
          VITE_PIN_HASH: ${{ secrets.VITE_PIN_HASH }}
        run: npm run build:client

      - name: Audit real initial JavaScript payload
        run: npm run test:bundle-audit && npm run audit:bundle

      - name: Verify build output
        run: |
          test -d dist/public
          test -f dist/public/index.html
          test -f dist/public/deploy-check.json
          cat dist/public/deploy-check.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Sync verifier and deploy both Vercel projects
        id: vercel-deploy
        env:
          VITE_PIN_HASH: ${{ secrets.VITE_PIN_HASH }}
        run: |
          set -euo pipefail

          projects=(
            "neuroped:prj_8gsXbaQoOZHgbhjnqiMPR9A5jg5b"
            "superneuroped:prj_4gm4R9pG7oJqqtBL9QFMjhNakzxC"
          )

          for entry in "${projects[@]}"; do
            name="${entry%%:*}"
            export VERCEL_PROJECT_ID="${entry#*:}"
            echo "Configurando e publicando projeto: $name"

            rm -rf .vercel
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

            # O valor vem do GitHub Secret e segue por stdin; nunca é impresso.
            printf '%s' "$VITE_PIN_HASH" \
              | vercel env add VITE_PIN_HASH production --sensitive --force \
                  --token="$VERCEL_TOKEN"

            # Recarrega a configuração após a sincronização para o build local.
            rm -rf .vercel
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            VITE_PIN_HASH="$VITE_PIN_HASH" vercel build --prod --token="$VERCEL_TOKEN"

            url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
            echo "$name deployment: $url"

            ok=0
            for i in $(seq 1 12); do
              if curl -fsSL "$url/deploy-check.json?try=$i" \
                   -o "/tmp/vercel-${name}-deploy-check.json" \
                && grep -q "${GITHUB_SHA}" "/tmp/vercel-${name}-deploy-check.json"; then
                ok=1
                break
              fi
              sleep 10
            done
            cat "/tmp/vercel-${name}-deploy-check.json" 2>/dev/null || true
            [ "$ok" -eq 1 ] || {
              echo "::error::$name não publicou o commit ${GITHUB_SHA}."
              exit 1
            }
          done

      - name: Publish consolidated Vercel production status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description="Deploy Vercel falhou; consulte o workflow."
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description="neuroped e superneuroped publicados e verificados."
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="NeuroPed / Vercel production" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
