name: Deploy Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  # Pré-checagem: o deploy do Vercel só roda se os secrets existirem. Sem eles,
  # este job termina VERDE e o deploy é pulado (o site é publicado por Cloudflare
  # Pages + GitHub Pages). Evita o "vermelho" em todo push quando o Vercel não
  # está configurado.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_PIN_HASH: ${{ secrets.VITE_PIN_HASH }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ] && [ -n "$VITE_PIN_HASH" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Secrets do Vercel e verificador local presentes — deploy habilitado."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Configuração segura do Vercel incompleta — deploy IGNORADO. O site é publicado por Cloudflare Pages + GitHub Pages. Configure VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID e VITE_PIN_HASH para habilitar."
          fi

  deploy-vercel:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Run hard release verification gate
        run: npm run verify

      - name: Validate production PIN verifier
        env:
          REQUIRE_LOCAL_PIN: "1"
          VITE_PIN_HASH: ${{ secrets.VITE_PIN_HASH }}
        run: node scripts/verify-local-pin-env.mjs

      - name: Create deploy sentinel
        run: |
          mkdir -p client/public
          cat > client/public/deploy-check.json <<EOF
          {
            "app": "NeuroPed",
            "provider": "vercel",
            "branch": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "deployed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat client/public/deploy-check.json

      - name: Build client
        env:
          NODE_ENV: production
          # Nunca embutir verificador de PIN no repositório público.
          VITE_PIN_HASH: ${{ secrets.VITE_PIN_HASH }}
        run: npm run build:client

      - name: Audit real initial JavaScript payload
        run: npm run test:bundle-audit && npm run audit:bundle

      - name: Verify build output
        run: |
          test -d dist/public
          test -f dist/public/index.html
          test -f dist/public/deploy-check.json
          cat dist/public/deploy-check.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build with Vercel
        env:
          VITE_PIN_HASH: ${{ secrets.VITE_PIN_HASH }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel production
        id: vercel-deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"
          echo "Vercel deployment: $url"

      - name: Verify public Vercel deploy sentinel
        run: |
          url="${{ steps.vercel-deploy.outputs.deployment_url }}"
          echo "Checking $url/deploy-check.json"
          curl -fsSL "$url/deploy-check.json" -o /tmp/vercel-deploy-check.json
          cat /tmp/vercel-deploy-check.json
          grep "${GITHUB_SHA}" /tmp/vercel-deploy-check.json
