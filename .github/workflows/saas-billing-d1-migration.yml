name: NeuroPed SaaS Billing D1 migration

on:
  push:
    branches:
      - main
    paths:
      - "db/migrations/0012_saas_billing_onboarding.sql"
      - "db/migrations/0013_saas_billing_provider.sql"
      - "db/migrations/0015_saas_billing_trial_seats_hardening.sql"
      - "db/migrations/0016_saas_hub.sql"
      - "shared/billing.ts"
      - "server/lib/billingEntitlement.ts"
      - "functions/api/billing/**"
      - "functions/api/live/**"
      - "functions/api/tenants/**"
      - "functions/api/saas/**"
      - "functions/api/onboarding/**"
      - "functions/api/partners/**"
      - "functions/api/communication/**"
      - "functions/api/feedback/**"
      - "tests/unit/saas-billing*.test.ts"
      - ".github/workflows/saas-billing-d1-migration.yml"

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-billing:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Confirmar branch de produção
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "::error::Migração de billing permitida somente a partir de main."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Catraca de billing antes do D1 remoto
        run: |
          set -euo pipefail
          npm run check
          npm run lint
          node --import tsx tests/unit/saas-billing-contract.test.ts
          node --import tsx tests/unit/saas-billing-provider.test.ts
          node --import tsx tests/unit/saas-billing-adversarial.test.ts
          node tests/unit/saas-billing-production-wiring.test.mjs

      - name: Validar credenciais Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID ausente"; exit 1; }

      - name: Garantir fundação SaaS e schema de billing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote --yes --file=./db/migrations/0009_saas_phase1_foundation.sql
          npx wrangler@4 d1 execute neuroped-db --remote --yes --file=./db/migrations/0010_saas_phase1_hardening.sql
          npx wrangler@4 d1 execute neuroped-db --remote --yes --file=./db/migrations/0012_saas_billing_onboarding.sql

      - name: Aplicar hardening 0013 de forma reexecutável
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          column_exists() {
            table="$1"
            column="$2"
            npx wrangler@4 d1 execute neuroped-db --remote \
              --command "SELECT name FROM pragma_table_info('$table') WHERE name='$column';" \
              2>&1 | grep -q "$column"
          }

          add_column() {
            table="$1"
            column="$2"
            definition="$3"
            if column_exists "$table" "$column"; then
              echo "✓ $table.$column já existe"
            else
              npx wrangler@4 d1 execute neuroped-db --remote --yes \
                --command "ALTER TABLE $table ADD COLUMN $column $definition;"
            fi
            column_exists "$table" "$column" || {
              echo "::error::Falha ao garantir $table.$column"
              exit 1
            }
          }

          add_column billing_customers canceled_at "DATETIME"
          add_column billing_customers grace_ends_at "DATETIME"
          add_column billing_customers last_provider_event_at "DATETIME"
          add_column billing_customers provider_checkout_id "TEXT"
          add_column billing_subscriptions last_provider_event_at "DATETIME"
          add_column billing_subscriptions provider_checkout_id "TEXT"
          add_column clinic_invitations resend_count "INTEGER NOT NULL DEFAULT 0"
          add_column billing_invoice_events raw_status "TEXT"
          add_column billing_invoice_events occurred_at "DATETIME"
          add_column billing_invoice_events metadata_json "TEXT"

          awk 'BEGIN {emit=0} /^CREATE TABLE IF NOT EXISTS billing_provider_checkouts/ {emit=1} emit {print}' \
            db/migrations/0013_saas_billing_provider.sql > /tmp/0013-post-alter.sql
          test -s /tmp/0013-post-alter.sql
          npx wrangler@4 d1 execute neuroped-db --remote --yes --file=/tmp/0013-post-alter.sql

      - name: Aplicar hardening 0015 de trial e assentos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # 0015 é reexecutável: ele apenas eleva trials para a capacidade mínima
          # segura e recria o trigger canônico de bootstrap com 2 assentos.
          npx wrangler@4 d1 execute neuroped-db --remote --yes \
            --file=./db/migrations/0015_saas_billing_trial_seats_hardening.sql

      - name: Aplicar Hub SaaS 0016
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote --yes --file=./db/migrations/0016_saas_hub.sql

      - name: Verificar contrato físico de billing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('billing_plans','billing_customers','billing_subscriptions','billing_invoice_events','billing_entitlements','clinic_invitations','billing_provider_checkouts') ORDER BY name;" \
            > /tmp/billing-tables.txt 2>&1
          cat /tmp/billing-tables.txt
          for table in billing_plans billing_customers billing_subscriptions billing_invoice_events billing_entitlements clinic_invitations billing_provider_checkouts; do
            grep -q "$table" /tmp/billing-tables.txt || {
              echo "::error::Tabela de billing ausente: $table"
              exit 1
            }
          done

          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='trigger' AND name IN ('trg_billing_customer_cancel_terminal','trg_billing_subscription_cancel_terminal','trg_clinic_create_billing_trial','trg_membership_insert_seat_limit','trg_public_appointment_billing_guard') ORDER BY name;" \
            > /tmp/billing-triggers.txt 2>&1
          cat /tmp/billing-triggers.txt
          for trigger in trg_billing_customer_cancel_terminal trg_billing_subscription_cancel_terminal trg_clinic_create_billing_trial trg_membership_insert_seat_limit trg_public_appointment_billing_guard; do
            grep -q "$trigger" /tmp/billing-triggers.txt || {
              echo "::error::Trigger de billing ausente: $trigger"
              exit 1
            }
          done

          # Prova física de 0015 sem imprimir clinic_id, usuários ou qualquer PHI.
          # Todos os trials devem ter no mínimo 2 assentos e capacidade estritamente
          # maior que o total de memberships ativas no instante da reconciliação.
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT CASE WHEN COUNT(*) = 0 THEN 'TRIAL_SEAT_POLICY_OK' ELSE 'TRIAL_SEAT_POLICY_VIOLATION' END AS status FROM billing_subscriptions bs JOIN billing_customers bc ON bc.id = bs.customer_id WHERE bs.status = 'trial' AND (COALESCE(bs.seats,0) < 2 OR COALESCE(bs.seats,0) <= (SELECT COUNT(*) FROM clinic_memberships cm WHERE cm.clinic_id = bc.clinic_id AND cm.active = 1));" \
            > /tmp/billing-0015-policy.txt 2>&1
          grep -q "TRIAL_SEAT_POLICY_OK" /tmp/billing-0015-policy.txt || {
            echo "::error::Contrato físico da migration 0015 não foi comprovado."
            exit 1
          }
          echo "✓ migration 0015 comprovada por invariantes metadata-only"

          echo "✅ Billing e Hub SaaS reconciliados no D1 remoto (0012 + 0013 + 0015 + 0016)."
