name: Sonda concurrent integration verification
on:
  push:
    branches: [fix/sonda-dez-quality-20260922]
    paths: ['.github/workflows/sonda-integration-review.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'jadsonfraga/neuroped' && github.ref == 'refs/heads/fix/sonda-dez-quality-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Merge exact concurrent main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git hash-object .github/workflows/sonda-dez-digital.yml)" = 0aba5d88f6e19e196689f295acf09336768eefb3
          git config merge.conflictStyle diff3
          git merge --no-commit --no-ff 20c14db0f8a123d64b9f3982cd3e80f6b1511b48 || test $? = 1
      - name: Reuse exact hash-verified resolver whose application passed full browser run 35751588910
        shell: python
        run: |
          import subprocess
          revision = '50e06403dc81708dc4ffb9ff68c1985678fa8d09'
          path = '.github/workflows/sonda-integration-review.yml'
          lines = subprocess.check_output(['git','show',revision+':'+path],text=True).splitlines()
          start = lines.index('      - name: Resolve reviewed conflicts and verify complete integrated outputs')
          start = lines.index('        run: |', start) + 1
          indent = len(lines[start]) - len(lines[start].lstrip())
          assert indent >= 10
          script = []
          for line in lines[start:]:
              if line and not line.startswith(' ' * indent): break
              script.append(line[indent:] if line else '')
          assert script and 'expected = ' in '\n'.join(script)
          exec(compile('\n'.join(script), 'reviewed-resolver-50e06403.py', 'exec'))
          assert not subprocess.check_output(['git','diff','--name-only','--diff-filter=U'])
          assert not subprocess.check_output(['git','diff','--cached','--name-only','--','.github/workflows']), 'This bot cannot modify workflows'
      - run: npm ci
      - run: npm run test:sonda
      - run: npm run check
      - run: npm run lint
      - name: Commit exact verified application integration, never workflows or main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/sonda-dez-quality-20260922
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git commit -m 'merge(sonda): preserve concurrent event integrity and reviewed clinical usability'
          git push origin HEAD:refs/heads/fix/sonda-dez-quality-20260922
