name: Recognition visual curation consolidation
on:
  push:
    branches: [feat/visual-recognition-v2]
    paths: [.github/workflows/recognition-curation-once.yml]
permissions:
  contents: write
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact interface and source-description refinements
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const path='client/src/features/visual-recognition/Workspace.tsx';
          let source=readFileSync(path,'utf8');
          const labels=['Modalidade','Alternativas por tela','Tamanho da sessão','Outras figuras na tela'];
          for(const label of labels){
            const before=`<label>${label}<select `;
            const after=`<label>${label}<select aria-label="${label}" `;
            if(source.includes(after))continue;
            if(source.split(before).length!==2)throw new Error(`Unexpected form control: ${label}`);
            source=source.replace(before,after);
          }
          source=source.replace('com títulos, metadados e inscrições em texto removidos; demais formas preservadas.','com títulos, metadados e inscrições em texto removidos; prato e garrafa com recorte do objeto principal; demais formas preservadas.');
          writeFileSync(path,source);
          const docs='docs/features/visual-recognition-v2.md';
          let text=readFileSync(docs,'utf8');
          text+='\n## Refinamentos após inspeção visual de todos os estímulos\n\nA ilustração de frango preparado foi rejeitada no pré-release e substituída por um galo vivo, com nome correto e origem EN/cockerel.svg. Prato e garrafa foram recortados para remover figuras secundárias (talheres/prato menor e uma vaca). Nenhum item preparado como alimento é apresentado como ave viva. O manifesto registra recorte e novo hash; a licença CC BY-SA 4.0 é preservada. Esses controles são inspeção técnica/visual, não estudo de reconhecibilidade com crianças.\n';
          writeFileSync(docs,text);
          JS
      - name: Regenerate reviewed pinned images and checksums
        run: node scripts/vendor-visual-recognition.mjs
      - name: Commit only the scoped curation to this branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/visual-recognition-v2"
          git config user.name 'NeuroPed visual curation'
          git config user.email 'noreply@neuroped.invalid'
          git add client/public/recognition-v2 client/src/features/visual-recognition/Workspace.tsx docs/features/visual-recognition-v2.md
          if ! git diff --cached --quiet; then
            git commit -m 'fix: curate recognizable images and label operator controls explicitly'
            git pull --rebase origin feat/visual-recognition-v2
            git push origin HEAD:feat/visual-recognition-v2
          fi
