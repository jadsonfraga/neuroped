name: Agent dispatch daily inventory recovery v2

on:
  push:
    branches:
      - agent/dispatch-daily-inventory-recovery-v2
    paths:
      - ".github/workflows/agent-dispatch-daily-inventory-recovery-v2.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch corrected workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-authorial-inventory.yml/dispatches" \
            -f ref=main \
            -f "inputs[date]=2026-08-15" \
            -f "inputs[reasoning_effort]=max" \
            -f "inputs[force]=false"
          echo "Inventário diário despachado sobre main para prova final de recuperação."
