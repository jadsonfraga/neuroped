name: Agent apply visual remediation

on:
  push:
    branches:
      - agent/visual-floor-9-9
    paths:
      - ".github/workflows/agent-source-export.yml"

permissions:
  contents: write

concurrency:
  group: agent-visual-floor-apply
  cancel-in-progress: false

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/visual-floor-9-9
          fetch-depth: 0
      - name: Assemble and apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent/visual-floor-9-9.patch.part00 \
              .github/agent/visual-floor-9-9.patch.part01 \
              .github/agent/visual-floor-9-9.patch.part02 \
              .github/agent/visual-floor-9-9.patch.part03 \
              > /tmp/visual-floor-9-9.patch
          git apply --check --exclude=.github/workflows/visual-reset.yml /tmp/visual-floor-9-9.patch
          git apply --exclude=.github/workflows/visual-reset.yml /tmp/visual-floor-9-9.patch
          rm -f .github/agent/visual-floor-9-9.patch.part00 \
                .github/agent/visual-floor-9-9.patch.part01 \
                .github/agent/visual-floor-9-9.patch.part02 \
                .github/agent/visual-floor-9-9.patch.part03
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: raise real visual floor across mobile tablet and desktop"
          git push origin HEAD:agent/visual-floor-9-9
