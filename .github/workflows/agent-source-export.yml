name: Agent source export

on:
  push:
    branches:
      - agent/visual-floor-9-9
    paths:
      - ".github/workflows/agent-source-export.yml"

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Publish source snapshot for visual remediation
        uses: actions/upload-artifact@v4
        with:
          name: agent-source-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: |
            client/src
            scripts
            tests/unit
            .github/workflows
            package.json
            vite.config.ts
            tailwind.config.ts
