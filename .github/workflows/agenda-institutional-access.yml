name: Institutional agenda access

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/agenda-institutional-access.yml'
      - 'scripts/operations/provision-institutional-agenda.mjs'
      - 'tests/unit/institutional-agenda-setup.test.mjs'
      - 'docs/audits/AGENDA_INSTITUTIONAL_ACCESS_2026-09-28.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/agenda-institutional-access.yml'
      - 'scripts/operations/provision-institutional-agenda.mjs'
      - 'tests/unit/institutional-agenda-setup.test.mjs'
      - 'docs/audits/AGENDA_INSTITUTIONAL_ACCESS_2026-09-28.md'

permissions:
  contents: read

concurrency:
  group: institutional-agenda-access-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Institutional agenda - real SQLite and access invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate script syntax
        run: node --check scripts/operations/provision-institutional-agenda.mjs
      - name: Prove atomicity, exact identity, internal entitlement and no E2E elevation
        run: node --experimental-strip-types --experimental-sqlite tests/unit/institutional-agenda-setup.test.mjs

  provision:
    name: Provision audited institutional owner context
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply exact owner setup and verify persisted effect
        run: node scripts/operations/provision-institutional-agenda.mjs --apply
        env:
          INSTITUTIONAL_OWNER_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          NEUROPED_E2E_EMAIL: ${{ secrets.NEUROPED_E2E_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Preserve metadata-only provisioning receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: institutional-agenda-setup-${{ github.run_id }}
          path: artifacts/agenda-setup/result.json
          retention-days: 30
          if-no-files-found: error
