name: Visual recognition contracts and tablet proof
on:
  pull_request:
    paths:
      - client/src/features/visual-recognition/**
      - client/src/pages/teste-reconhecimento-visual.tsx
      - client/public/recognition-v2/**
      - tests/unit/visual-recognition.test.ts
      - tests/e2e/visual-recognition.mjs
      - .github/workflows/visual-recognition.yml
  push:
    branches: [main, feat/visual-recognition-v2]
    paths:
      - client/src/features/visual-recognition/**
      - client/src/pages/teste-reconhecimento-visual.tsx
      - client/public/recognition-v2/**
      - tests/unit/visual-recognition.test.ts
      - tests/e2e/visual-recognition.mjs
      - .github/workflows/visual-recognition.yml
permissions:
  contents: read
concurrency:
  group: recognition-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recognition-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Exact ages, manifests, recognition events and descriptive ledger
        run: node --import tsx --test tests/unit/visual-recognition.test.ts
      - name: TypeScript and lint without bypasses
        run: |
          npm run check
          npm run lint
      - name: Preserve navigation and clinical access policy
        run: |
          npm run audit:navigation
          node --import tsx tests/unit/route-guard-policy.test.ts
      - name: Build real application without open-access bypass
        run: npm run build:client
      - run: npx playwright install --with-deps chromium
      - name: Synthetic journey through the production route
        run: node tests/e2e/visual-recognition.mjs
      - name: Preserve only synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-recognition-proof
          path: /tmp/visual-recognition
          if-no-files-found: ignore
          retention-days: 7
