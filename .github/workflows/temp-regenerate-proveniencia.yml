name: TEMP regenerate clinical provenance
on:
  push:
    branches:
      - feat/channel-authorial-scales-filter-20260907
permissions:
  contents: write
jobs:
  regenerate:
    if: "!contains(github.event.head_commit.message, '[generated-provenance]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/channel-authorial-scales-filter-20260907
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run validate:catalog
      - name: Commit generated provenance
        run: |
          if git diff --quiet -- docs/PROVENIENCIA_CLINICA.md; then
            echo 'No provenance diff.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROVENIENCIA_CLINICA.md
          git commit -m 'chore: regenerate clinical provenance [generated-provenance]'
          git push origin HEAD:feat/channel-authorial-scales-filter-20260907
