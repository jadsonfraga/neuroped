name: Test, Lint & Build
# BLOCO 2: CI Pipeline for Quality Assurance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Code Quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Step 0: Install deps (sem isto, eslint/prettier não existem → "eslint: not found")
      - name: Install Dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # Step 1: Lint — GATE DURO (lint zerado; mantém limpo daqui pra frente)
      - name: Lint Code
        run: npm run lint
        continue-on-error: false

      # Step 2: Type Check — GATE DURO (precisa passar)
      - name: TypeScript Type Check
        run: npm run check
        continue-on-error: false

      # Step 3: Format Check — ADVISORY (não bloqueia)
      - name: Check Code Format
        run: npx prettier --check "**/*.{ts,tsx,js,jsx,json,md,css}"
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    name: Build & Test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Build client
      - name: Build Client
        run: npm run build:client
        continue-on-error: false

      # Clinical audit (existing)
      - name: Clinical Scales Audit
        run: npm run audit:scales:clinical
        continue-on-error: false

      # Blocking rules unit tests
      - name: Run Unit Tests
        run: npx tsx tests/unit/blockingRules.test.ts 2>&1 || echo "Tests ran with exit code $?"
        continue-on-error: true

      # Type check
      - name: Full Type Check
        run: npm run check
        continue-on-error: false

      # Health check
      - name: Verify Catalog
        run: npm run validate:catalog
        continue-on-error: true

  production-readiness:
    runs-on: ubuntu-latest
    name: Production Readiness
    needs: [quality, build]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Full Verification Suite
        run: npm run verify
        continue-on-error: true

  # Block merge if critical jobs failed
  require-checks:
    runs-on: ubuntu-latest
    needs: [quality, build]
    if: always()
    steps:
      - name: Check CI Status
        run: |
          if [ "${{ needs.quality.result }}" = "failure" ] || [ "${{ needs.build.result }}" = "failure" ]; then
            echo "❌ CI Pipeline failed. Fix issues before merge."
            exit 1
          fi
          echo "✅ CI Pipeline passed"
