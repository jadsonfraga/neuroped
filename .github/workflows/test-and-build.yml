name: Test, Lint & Build
# BLOCO 2: CI Pipeline for Quality Assurance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Code Quality

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Step 0: Install deps (sem isto, eslint/prettier não existem → "eslint: not found")
      - name: Install Dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # Step 1: Lint — GATE DURO (lint zerado; mantém limpo daqui pra frente)
      - name: Lint Code
        run: npm run lint
        continue-on-error: false

      # Step 2: Type Check — GATE DURO (precisa passar)
      - name: TypeScript Type Check
        run: npm run check
        continue-on-error: false

      # Step 3: Format Check — ADVISORY (não bloqueia)
      - name: Check Code Format
        run: npx prettier --check "**/*.{ts,tsx,js,jsx,json,md,css}"
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    name: Build & Test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Build client
      - name: Build Client
        run: npm run build:client
        continue-on-error: false

      - name: Validate Critical Security and Recovery Improvements
        run: npm run test:quick-wins

      - name: Audit Initial JavaScript Payload
        run: npm run test:bundle-audit && npm run audit:bundle

      # Clinical audit (existing)
      - name: Clinical Scales Audit
        run: npm run audit:scales:clinical
        continue-on-error: false

      # A família responde sem supervisão: o descritor remoto não pode nomear
      # um instrumento que o app não aplica por inteiro.
      - name: Remote Scale Clinical Truth
        run: npm run audit:remote-scale-truth
        continue-on-error: false

      # prebuild regenera este arquivo antes de cada build, mas os testes
      # importam a versão versionada: se as duas divergirem, o CI passa
      # contra um conjunto de escalas que não é o que a produção serve.
      - name: Interactive scale ids match their source
        run: npm run guard:interactive-scale-ids
        continue-on-error: false

      # O documento de proveniência declara fonte e status de validação de cada
      # instrumento. Desatualizado, ele SUBDECLARA quantos aguardam validação
      # psicométrica — incerteza clínica a menos do que a real.
      - name: Derived clinical artifacts match the catalog
        run: npm run guard:clinical-artifacts
        continue-on-error: false

      # Ownership isolation unit tests
      - name: Test Patient And Result Ownership
        run: npm run test:ownership
        continue-on-error: false

      # Type check
      - name: Full Type Check
        run: npm run check
        continue-on-error: false

      # Health check
      - name: Verify Catalog
        run: npm run validate:catalog
        continue-on-error: false

  production-readiness:
    runs-on: ubuntu-latest
    name: Production Readiness
    needs: [quality, build]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Chromium for release E2E gates
        run: npx playwright install --with-deps chromium

      - name: Audit Full Dependency Graph
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Hard Release Verification Suite
        run: npm run verify
        continue-on-error: false

  # Block merge if critical jobs failed
  require-checks:
    runs-on: ubuntu-latest
    needs: [quality, build, production-readiness]
    if: always()
    steps:
      - name: Check CI Status
        run: |
          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.production-readiness.result }}" != "success" ]; then
            echo "❌ CI Pipeline failed. Fix issues before merge."
            exit 1
          fi
          echo "✅ CI Pipeline passed"
