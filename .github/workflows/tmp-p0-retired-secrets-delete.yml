name: Temporary retired ICP secret deletion

on:
  push:
    branches:
      - fix/p0-clinical-crypto-20260811
    paths:
      - ".github/workflows/tmp-p0-retired-secrets-delete.yml"

permissions:
  contents: read
  actions: write

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete retired repository secrets without reading them
        run: |
          set -euo pipefail
          failed=0
          for name in CERT_P12_B64 CERT_P12_PASSWORD; do
            if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/secrets/${name}" >/dev/null 2>/tmp/${name}.err; then
              echo "$name=DELETED_OR_ALREADY_ABSENT"
            else
              code=$?
              echo "$name=DELETE_NOT_AUTHORIZED"
              sed -E 's/[A-Za-z0-9+\/=_.-]{24,}/[redacted]/g' /tmp/${name}.err | head -3
              failed=$code
            fi
          done
          exit "$failed"
