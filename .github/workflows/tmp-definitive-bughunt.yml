name: Temporary definitive bug hunt

on:
  push:
    branches:
      - fix/final-definitive-bughunt-20260810
    paths:
      - ".github/workflows/tmp-definitive-bughunt.yml"
      - "scripts/tmp_definitive_bughunt.py"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/final-definitive-bughunt-20260810
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Apply round 1 fixes
        run: |
          python3 scripts/tmp_definitive_fix_round1.py
          python3 scripts/tmp_fix_refresh_fake.py
      - name: Targeted regressions
        run: |
          node --import tsx tests/unit/auth-hardening-regressions.test.ts
          node tests/unit/clinical-core-supersession-regression.test.mjs
          node --import tsx tests/unit/cloudflare-auth-middleware.test.ts
      - name: Release gate
        run: npm run verify:release
      - name: Scanner after fixes
        run: python3 scripts/tmp_definitive_bughunt.py | tee /tmp/bughunt.txt
      - name: Commit validated fixes
        run: |
          git config user.name "jadsonfraga"
          git config user.email "jadsonfraga@hotmail.com"
          git add \
            functions/api/_middleware.ts \
            functions/api/auth/_crypto.ts \
            functions/api/auth/_shared.ts \
            functions/api/auth/login.ts \
            functions/api/auth/_sessions.ts \
            functions/api/clinical-core/index.ts \
            server/lib/password.ts \
            server/auth/routes.ts \
            server/routes/clinical-core.ts \
            tests/unit/auth-hardening-regressions.test.ts \
            tests/unit/clinical-core-supersession-regression.test.mjs \
            tests/unit/cloudflare-auth-middleware.test.ts \
            tests/unit/refresh-sessions.test.ts \
            package.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nenhuma correção nova para commitar."
            exit 0
          fi
          git commit -m "fix(security): fechar enumeração de login e corridas clínicas"
          git push origin HEAD:fix/final-definitive-bughunt-20260810
