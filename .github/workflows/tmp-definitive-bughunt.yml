name: Temporary definitive bug hunt

on:
  push:
    branches:
      - fix/final-definitive-bughunt-20260810
    paths:
      - ".github/workflows/tmp-definitive-bughunt.yml"
      - "scripts/tmp_definitive_final_scan.py"

permissions:
  contents: read

jobs:
  saturation:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/final-definitive-bughunt-20260810
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Independent saturation scanner
        run: python3 scripts/tmp_definitive_final_scan.py
      - name: Permanent release gate
        run: npm run verify:release
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full accessibility browser audit
        run: npm run audit:a11y:full
      - name: Real scales E2E
        run: npm run test:e2e:scales
      - name: Screen audit
        run: npm run audit:screens
      - name: Integral build
        run: npm run build
