name: Temporary definitive bug hunt

on:
  push:
    branches:
      - fix/final-definitive-bughunt-20260810
    paths:
      - ".github/workflows/tmp-definitive-bughunt.yml"
      - "scripts/tmp_definitive_fix_round2.py"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/final-definitive-bughunt-20260810
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Apply round 2 fixes
        run: python3 scripts/tmp_definitive_fix_round2.py
      - name: Targeted regressions
        run: |
          node --import tsx tests/unit/runtime-config.test.ts
          node tests/unit/file-storage-race-regression.test.mjs
          node tests/unit/express-auth-race-regression.test.mjs
          node --import tsx tests/unit/auth-hardening-regressions.test.ts
          node tests/unit/clinical-core-supersession-regression.test.mjs
          node --import tsx tests/unit/cloudflare-auth-middleware.test.ts
      - name: Release gate
        run: npm run verify:release
      - name: Commit validated fixes
        run: |
          git config user.name "jadsonfraga"
          git config user.email "jadsonfraga@hotmail.com"
          git add \
            server/lib/runtimeConfig.ts \
            server/index.ts \
            server/lib/db.ts \
            server/lib/db-enhanced.ts \
            server/lib/email.ts \
            server/lib/cloudStorage.ts \
            server/routes/files.ts \
            server/auth/routes.ts \
            tests/unit/runtime-config.test.ts \
            tests/unit/file-storage-race-regression.test.mjs \
            tests/unit/express-auth-race-regression.test.mjs \
            package.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nenhuma correção nova para commitar."
            exit 0
          fi
          git commit -m "fix(reliability): eliminar TOCTOU de arquivos e config inválida"
          git push origin HEAD:fix/final-definitive-bughunt-20260810
