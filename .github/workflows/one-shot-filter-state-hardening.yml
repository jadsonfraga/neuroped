name: One-shot filter state hardening

on:
  push:
    branches:
      - fix/filter-state-privacy-20260812
    paths:
      - ".github/workflows/one-shot-filter-state-hardening.yml"

permissions:
  contents: write

jobs:
  patch-filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/filter-state-privacy-20260812
          fetch-depth: 0

      - name: Migrar filtro para secureStorage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("client/src/pages/filtro.tsx")
          text = path.read_text()

          def line_start(source: str, index: int) -> int:
              return source.rfind("\n", 0, index) + 1

          def block(lines: list[str], indent: str = "") -> str:
              return "\n".join(indent + line for line in lines) + "\n"

          import_anchor = 'import { buildFilterCsv, buildFilterPdf, downloadBlob, type FilterExportRow, type FilterExportMeta } from "@/lib/filterExport";\n'
          import_line = 'import { loadProtectedFilterState, saveProtectedFilterState } from "@/lib/filterStateStorage";\n'
          assert import_anchor in text, "import anchor ausente"
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          persisted_start = text.index("// Persistência das seleções do filtro")
          component_start = text.index("export default function FiltroPage()", persisted_start)
          persisted_block = text[persisted_start:component_start]
          assert 'const FILTER_STATE_KEY = "np_filtro_state_v1";' in persisted_block
          assert "function loadFilterState()" in persisted_block
          new_persisted = block([
              "// Estado clínico do filtro permanece apenas no cofre cifrado da sessão.",
              "// A antiga chave em localStorage é migrada uma única vez pelo helper.",
              "interface PersistedFilter {",
              "  search?: string;",
              "  queixas?: string[];",
              "  age?: string | null;",
              '  respondente?: ScaleEntry["respondente"][number] | null;',
              '  communication?: "verbal" | "nonverbal" | null;',
              '  literacy?: "literate" | "preliterate" | null;',
              '  assessment?: "diagnostic" | "monitoring" | null;',
              "  signals?: string[];",
              "  availability?: AvailabilityMode;",
              "}",
              "",
          ])
          text = text[:persisted_start] + new_persisted + text[component_start:]

          flash_index = text.index("const flashMode = isFlashRoute();")
          state_start = line_start(text, flash_index)
          copied_index = text.index("const [copiedRec, setCopiedRec]", flash_index)
          state_end = line_start(text, copied_index)
          old_state = text[state_start:state_end]
          assert "loadFilterState" in old_state
          assert "availabilityMode" in old_state
          indent = text[state_start:flash_index]
          new_state = block([
              "const flashMode = isFlashRoute();",
              "const [filterStateReady, setFilterStateReady] = useState(flashMode);",
              'const [search, setSearch] = useState<string>("");',
              "const [selectedQueixas, setSelectedQueixas] = useState<string[]>([]);",
              "const [selectedAge, setSelectedAge] = useState<string | null>(null);",
              'const [selectedRespondente, setSelectedRespondente] = useState<ScaleEntry["respondente"][number] | null>(null);',
              'const [selectedCommunication, setSelectedCommunication] = useState<"verbal" | "nonverbal" | null>(null);',
              'const [selectedLiteracy, setSelectedLiteracy] = useState<"literate" | "preliterate" | null>(null);',
              'const [selectedAssessmentType, setSelectedAssessmentType] = useState<"diagnostic" | "monitoring" | null>(null);',
              "const [selectedSignalIds, setSelectedSignalIds] = useState<string[]>([]);",
              'const [availabilityMode, setAvailabilityMode] = useState<AvailabilityMode>("complete");',
          ], indent)
          text = text[:state_start] + new_state + text[state_end:]

          marker_index = text.index("sessionStorage.removeItem(FLASH_STORAGE_KEY)", state_start)
          effect_index = text.rfind("useEffect(() => {", state_start, marker_index)
          assert effect_index > state_start, "flash cleanup effect ausente"
          effect_start = line_start(text, effect_index)
          effect_indent = text[effect_start:effect_index]
          hydrate = block([
              "useEffect(() => {",
              "  if (flashMode) return;",
              "  let active = true;",
              "  void (async () => {",
              "    const saved = await loadProtectedFilterState<PersistedFilter>();",
              "    if (!active) return;",
              "    if (saved) {",
              '      if (typeof saved.search === "string") setSearch(saved.search);',
              '      if (Array.isArray(saved.queixas)) setSelectedQueixas(saved.queixas.filter((item): item is string => typeof item === "string"));',
              '      if (typeof saved.age === "string" || saved.age === null) setSelectedAge(saved.age ?? null);',
              '      if (typeof saved.respondente === "string" || saved.respondente === null) {',
              '        setSelectedRespondente((saved.respondente ?? null) as ScaleEntry["respondente"][number] | null);',
              "      }",
              '      if (saved.communication === "verbal" || saved.communication === "nonverbal" || saved.communication === null) {',
              "        setSelectedCommunication(saved.communication ?? null);",
              "      }",
              '      if (saved.literacy === "literate" || saved.literacy === "preliterate" || saved.literacy === null) {',
              "        setSelectedLiteracy(saved.literacy ?? null);",
              "      }",
              '      if (saved.assessment === "diagnostic" || saved.assessment === "monitoring" || saved.assessment === null) {',
              "        setSelectedAssessmentType(saved.assessment ?? null);",
              "      }",
              '      if (Array.isArray(saved.signals)) setSelectedSignalIds(saved.signals.filter((item): item is string => typeof item === "string"));',
              '      if (saved.availability === "all" || saved.availability === "complete") setAvailabilityMode(saved.availability);',
              "    }",
              "    setFilterStateReady(true);",
              "  })();",
              "  return () => { active = false; };",
              "}, [flashMode]);",
              "",
          ], effect_indent)
          text = text[:effect_start] + hydrate + text[effect_start:]

          save_comment_index = text.index("// Persiste as seleções sempre que mudam (best-effort).", effect_start)
          save_start = line_start(text, save_comment_index)
          alive_index = text.index("let alive = true", save_start)
          next_effect_index = text.rfind("useEffect(() => {", save_start, alive_index)
          assert next_effect_index > save_start, "efeito de registry ausente"
          save_end = line_start(text, next_effect_index)
          save_block = text[save_start:save_end]
          assert "localStorage.setItem(FILTER_STATE_KEY" in save_block
          save_indent = text[save_start:save_comment_index]
          new_save = block([
              "// Persiste somente no cofre AES-GCM da sessão. Nunca volta a escrever",
              "// contexto clínico em localStorage; o helper apaga a cópia legada após migração.",
              "useEffect(() => {",
              "  if (flashMode || !filterStateReady) return;",
              "  void saveProtectedFilterState({",
              "    search, queixas: selectedQueixas, age: selectedAge, respondente: selectedRespondente,",
              "    communication: selectedCommunication, literacy: selectedLiteracy,",
              "    assessment: selectedAssessmentType, signals: selectedSignalIds,",
              "    availability: availabilityMode,",
              "  } satisfies PersistedFilter);",
              "}, [flashMode, filterStateReady, search, selectedQueixas, selectedAge, selectedRespondente, selectedCommunication, selectedLiteracy, selectedAssessmentType, selectedSignalIds, availabilityMode]);",
              "",
          ], save_indent)
          text = text[:save_start] + new_save + text[save_end:]

          assert 'localStorage.setItem(FILTER_STATE_KEY' not in text
          assert 'localStorage.getItem(FILTER_STATE_KEY' not in text
          assert 'const FILTER_STATE_KEY = "np_filtro_state_v1"' not in text
          assert text.count("loadProtectedFilterState<PersistedFilter>") == 1
          assert text.count("saveProtectedFilterState({") == 1
          path.write_text(text)
          PY

      - name: Validar TypeScript e lint
        run: |
          npm ci
          npm run check
          npm run lint
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Publicar arquivo validado pela Contents API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --check -- client/src/pages/filtro.tsx
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/client/src/pages/filtro.tsx?ref=fix/filter-state-privacy-20260812" --jq .sha)"
          encoded="$(base64 -w 0 client/src/pages/filtro.tsx)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/client/src/pages/filtro.tsx" \
            -f message="fix(privacy): cifrar estado clínico do filtro" \
            -f content="$encoded" \
            -f branch="fix/filter-state-privacy-20260812" \
            -f sha="$current_sha" >/dev/null
