name: Public submission audit D1

on:
  pull_request:
    branches:
      - main
    paths:
      - "db/migrations/0023_public_submission_audit.sql"
      - "functions/api/public-scale.ts"
      - "functions/api/public-intake.ts"
      - "functions/api/auth/forgot-password.ts"
      - "tests/unit/remote-scale-response.test.ts"
      - "tests/unit/saas-remote-intake-static.test.mjs"
      - "tests/unit/password-recovery.test.ts"
      - ".github/workflows/public-submission-audit-d1.yml"
  push:
    branches:
      - main
    paths:
      - "db/migrations/0023_public_submission_audit.sql"
      - "functions/api/public-scale.ts"
      - "functions/api/public-intake.ts"
      - "functions/api/auth/forgot-password.ts"
      - "tests/unit/remote-scale-response.test.ts"
      - "tests/unit/saas-remote-intake-static.test.mjs"
      - "tests/unit/password-recovery.test.ts"
      - ".github/workflows/public-submission-audit-d1.yml"
  workflow_dispatch:

permissions:
  contents: read

# Grupo próprio: a migração não pode ser cancelada pela corrida do grupo
# compartilhado cloudflare-pages.
concurrency:
  group: d1-public-submission-audit
  cancel-in-progress: false

jobs:
  validate-public-submission-audit:
    name: Validate public submission audit and reset rate limit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Public scale submission audit regression
        run: node --import tsx tests/unit/remote-scale-response.test.ts

      - name: Public intake submission audit regression
        run: node tests/unit/saas-remote-intake-static.test.mjs

      - name: Password reset rate limit regression
        run: node --import tsx tests/unit/password-recovery.test.ts

      - name: TypeScript
        run: npm run check

  migrate-public-submission-audit:
    name: Apply public submission audit schema to D1
    needs: validate-public-submission-audit
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID ausente"; exit 1; }

      - name: Apply migration 0023
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote --yes \
            --file=./db/migrations/0023_public_submission_audit.sql

      - name: Verify table without reading the trail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='public_submission_audit_log';" \
            > /tmp/audit-table.txt 2>&1
          cat /tmp/audit-table.txt
          grep -q "public_submission_audit_log" /tmp/audit-table.txt

          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='index' AND name='idx_public_submission_audit_invitation';" \
            > /tmp/audit-index.txt 2>&1
          cat /tmp/audit-index.txt
          grep -q "idx_public_submission_audit_invitation" /tmp/audit-index.txt

          echo "✅ Trilha de auditoria dos envios públicos instalada sem consultar seu conteúdo."
