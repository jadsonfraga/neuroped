name: clinical-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install runtime deps
        run: |
          npm install --no-save puppeteer@^22 http-server@^14
      - name: Run NeuroPedTests
        env:
          HEADLESS: 'true'
          TIMEOUT_MS: '45000'
        run: |
          node tests/run-clinical-tests.mjs

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: integrity
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Lighthouse CI
        run: npm install --no-save @lhci/cli@0.13
      - name: Start static server
        run: |
          npx --yes http-server . -p 8080 -c -1 &
          sleep 3
      - name: Audit
        run: |
          npx lhci autorun \
            --collect.url=http://localhost:8080/index.html \
            --collect.url=http://localhost:8080/testes-diretos.html \
            --collect.url=http://localhost:8080/escalas-questionarios.html \
            --collect.url=http://localhost:8080/diarios-clinicos.html \
            --assert.preset=lighthouse:no-pwa \
            --assert.assertions.categories:performance=warn \
            --assert.assertions.categories:accessibility=error \
            --upload.target=temporary-public-storage || true
