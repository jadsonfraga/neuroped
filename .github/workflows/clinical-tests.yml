name: clinical-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # CustomEvent/Blob/EventTarget globais (testes V4 dependem)
      # Driver Node puro (sem browser): nenhuma página do app carrega a suíte, então
      # o caminho Puppeteer→testes-diretos.html dava timeout. Aqui a suíte é carregada
      # explicitamente e exige 100%. Ver tests/run-clinical-tests.mjs.
      - name: NeuroPedTests.runAll (V3.2 + V4) — exige 100%
        run: node tests/run-clinical-tests.mjs

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: integrity
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Lighthouse CI
        run: npm install --no-save @lhci/cli@0.13
      - name: Start static server
        run: |
          npx --yes http-server . -p 8080 -c -1 &
          sleep 3
      - name: Audit
        run: |
          npx lhci autorun \
            --collect.url=http://localhost:8080/index.html \
            --collect.url=http://localhost:8080/testes-diretos.html \
            --collect.url=http://localhost:8080/escalas-questionarios.html \
            --collect.url=http://localhost:8080/diarios-clinicos.html \
            --assert.preset=lighthouse:no-pwa \
            --assert.assertions.categories:performance=warn \
            --assert.assertions.categories:accessibility=error \
            --upload.target=temporary-public-storage || true
