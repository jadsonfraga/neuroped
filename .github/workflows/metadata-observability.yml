name: Metadata observability
on:
  pull_request:
    paths:
      - "functions/api/_middleware.ts"
      - "functions/api/_observability.ts"
      - "functions/api/tenants/**"
      - "client/src/components/TenantMetricsPanel.tsx"
      - "client/src/pages/configuracoes.tsx"
      - "shared/tenantMetrics.ts"
      - "tests/unit/*metrics*"
      - "tests/unit/metadata-observability.test.ts"
      - "tests/e2e/tenant-metrics.mjs"
      - "wrangler.toml"
      - ".github/workflows/metadata-observability.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metrics:
    name: Metadata-only metrics and tenant boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node --import tsx --test tests/unit/metadata-observability.test.ts tests/unit/tenant-metrics-ui.test.tsx
      - run: npm run test:quick-wins
      - run: npm run audit:access
      - run: npx playwright install --with-deps chromium
      - run: npm run build:client
      - run: node tests/e2e/tenant-metrics.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-tenant-metrics
          path: artifacts/tenant-metrics/
          if-no-files-found: error
