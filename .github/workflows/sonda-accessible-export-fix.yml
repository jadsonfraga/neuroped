name: Sonda responsive verification
on:
  push:
    branches: [fix/sonda-dez-quality-20260922]
    paths: ['.github/workflows/sonda-accessible-export-fix.yml']
permissions:
  contents: write
jobs:
  verified-correction:
    if: github.repository == 'jadsonfraga/neuroped' && github.ref == 'refs/heads/fix/sonda-dez-quality-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Strengthen responsive checks without changing application state
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p = Path('tests/e2e/sonda-dez-digital.mjs')
          assert subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip() == '08a597487fd0a68878b64c2b5b9389df97c8f0be'
          text = p.read_text()
          assert text.count('await page.setViewportSize(') == 11
          text = text.replace('await page.setViewportSize(', 'await resizeViewport(')
          needle = 'async function noOverflow() {'
          helper = '''async function resizeViewport(viewport) {
            await page.setViewportSize(viewport);
            // The controlled task clock can freeze CSS transitions midway through resize.
            // Finish animations through Playwright, then verify usable width, not just overflow.
            await page.screenshot({ animations: "disabled" });
            const main = await page.locator("#main-content").boundingBox();
            assert.ok(main && main.width >= viewport.width - (viewport.width < 1024 ? 2 : 258), "Main workspace must use the available viewport");
            if (viewport.width < 1024) {
              assert.equal(await page.locator(".np-app-sidebar").getAttribute("aria-hidden"), "true", "Mobile navigation starts closed");
            }
          }
          '''
          assert text.count(needle) == 1
          p.write_text(text.replace(needle, helper + needle))
      - run: node --check tests/e2e/sonda-dez-digital.mjs
      - name: Commit only the verified test correction to the feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/sonda-dez-quality-20260922
          git add -- tests/e2e/sonda-dez-digital.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(sonda): assert usable mobile width with settled CSS transitions'
          git push origin HEAD:refs/heads/fix/sonda-dez-quality-20260922
      - run: npm ci
      - run: npm run test:sonda
      - run: npx playwright install --with-deps chromium
      - run: npm run build:client
      - run: npm run test:e2e:sonda
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonda-responsive-${{ github.sha }}
          path: /tmp/sonda-e2e/
          retention-days: 7
          if-no-files-found: warn
