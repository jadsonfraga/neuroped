name: Value Autonomous SaaS Contracts
on:
  pull_request:
    branches: [main]
    paths:
      - 'shared/onboarding-progress.ts'
      - 'shared/permissions.ts'
      - 'functions/api/tenant/_onboardingProgress.ts'
      - 'functions/api/tenants/**'
      - 'client/src/components/TenantMetricsPanel.tsx'
      - 'client/src/components/TenantOnboardingPanel.tsx'
      - 'tests/unit/value-onboarding.test.mjs'
      - 'tests/integration/value-onboarding-sql.test.py'
      - '.github/workflows/value-autonomous-saas.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: value-saas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  saas-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - name: Persisted-fact progress and truthfulness contracts
        run: node --experimental-strip-types --test tests/unit/value-onboarding.test.mjs
      - name: Actual SQLite query isolation on synthetic schema projections
        run: python3 tests/integration/value-onboarding-sql.test.py
