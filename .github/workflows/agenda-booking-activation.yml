name: Institutional booking activation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/agenda-booking-activation.yml'
      - 'scripts/operations/activate-institutional-booking.mjs'
      - 'scripts/operations/institutional-booking.config.json'
      - 'tests/unit/institutional-booking-activation.test.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/agenda-booking-activation.yml'
      - 'scripts/operations/activate-institutional-booking.mjs'
      - 'scripts/operations/institutional-booking.config.json'
      - 'tests/unit/institutional-booking-activation.test.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: institutional-booking-activation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Booking activation - real schema, consent lock and public directory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Validate script syntax
        run: node --check scripts/operations/activate-institutional-booking.mjs
      - name: Prove consent lock, atomicity, no overwrite and real public slots
        run: node --import tsx tests/unit/institutional-booking-activation.test.ts

  activate:
    name: Read state and activate only with owner confirmation
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # Sem confirmedByOwner=true no arquivo de configuração, o script só lê.
      - name: Read production state; apply only if confirmedByOwner
        run: node scripts/operations/activate-institutional-booking.mjs --apply
        env:
          INSTITUTIONAL_OWNER_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          NEUROPED_E2E_EMAIL: ${{ secrets.NEUROPED_E2E_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Preserve metadata-only receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: institutional-booking-activation-${{ github.run_id }}
          path: artifacts/booking-activation/result.json
          retention-days: 30
          if-no-files-found: error
