name: SaaS billing contract

on:
  pull_request:
    paths:
      - "shared/billing.ts"
      - "server/lib/billingEntitlement.ts"
      - "functions/api/billing/**"
      - "functions/api/live/**"
      - "functions/api/patients/**"
      - "functions/api/operations/**"
      - "functions/api/tenants/**"
      - "db/migrations/0012_saas_billing_onboarding.sql"
      - "db/migrations/0013_saas_billing_provider.sql"
      - "tests/unit/saas-billing*.test.ts"
      - "tests/unit/billing-log-safety.test.mjs"
      - "tests/unit/saas-billing-production-wiring.test.mjs"
      - ".github/workflows/saas-billing-contract.yml"
      - ".github/workflows/saas-billing-d1-migration.yml"
  push:
    branches:
      - feat/saas-billing-onboarding

jobs:
  billing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npx tsx tests/unit/saas-billing-contract.test.ts
      - run: npx tsx tests/unit/saas-billing-provider.test.ts
      - run: node tests/unit/billing-log-safety.test.mjs
      - run: node tests/unit/saas-billing-production-wiring.test.mjs
      - run: git diff --check
