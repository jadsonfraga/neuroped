name: SaaS billing contract

on:
  pull_request:
    paths:
      - "shared/billing.ts"
      - "server/lib/billingEntitlement.ts"
      - "functions/api/billing/**"
      - "functions/api/tenants/**"
      - "db/migrations/0012_saas_billing_onboarding.sql"
      - "db/migrations/0013_saas_billing_provider.sql"
      - "tests/unit/saas-billing*.test.ts"
      - ".github/workflows/saas-billing-contract.yml"
  push:
    branches:
      - feat/saas-billing-onboarding
    paths:
      - "shared/billing.ts"
      - "server/lib/billingEntitlement.ts"
      - "functions/api/billing/**"
      - "functions/api/tenants/**"
      - "db/migrations/0012_saas_billing_onboarding.sql"
      - "db/migrations/0013_saas_billing_provider.sql"
      - "tests/unit/saas-billing*.test.ts"

jobs:
  billing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --if-present
      - run: npx tsx tests/unit/saas-billing-contract.test.ts
      - run: npx tsx tests/unit/saas-billing-provider.test.ts
      - run: git diff --check
