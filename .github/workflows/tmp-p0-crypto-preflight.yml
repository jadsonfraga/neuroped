name: Temporary P0 crypto preflight

on:
  push:
    branches:
      - fix/p0-clinical-crypto-20260811
    paths:
      - ".github/workflows/tmp-p0-crypto-preflight.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN absent"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID absent"; exit 1; }
      - name: Inspect safe metadata only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "=== D1 INFO ==="
          npx --yes wrangler@4 d1 info neuroped-db || true
          echo "=== TIME TRAVEL BOOKMARK ==="
          npx --yes wrangler@4 d1 time-travel info neuroped-db || true
          echo "=== PAGES SECRET NAMES ==="
          npx --yes wrangler@4 pages secret list --project-name neuroped | sed -E 's/(: ).*/: [redacted]/' || true
          echo "=== CLINICAL TABLE COUNTS ==="
          npx --yes wrangler@4 d1 execute neuroped-db --remote --command "SELECT 'patients_demo' AS table_name, COUNT(*) AS rows FROM patients_demo UNION ALL SELECT 'consultations_demo', COUNT(*) FROM consultations_demo UNION ALL SELECT 'scale_results_demo', COUNT(*) FROM scale_results_demo UNION ALL SELECT 'documents_demo', COUNT(*) FROM documents_demo UNION ALL SELECT 'memory_notes', COUNT(*) FROM memory_notes UNION ALL SELECT 'clinical_events_demo', COUNT(*) FROM clinical_events_demo UNION ALL SELECT 'conecta_events_demo', COUNT(*) FROM conecta_events_demo UNION ALL SELECT 'appointments', COUNT(*) FROM appointments UNION ALL SELECT 'waitlist_entries', COUNT(*) FROM waitlist_entries UNION ALL SELECT 'appointment_reviews', COUNT(*) FROM appointment_reviews UNION ALL SELECT 'notification_outbox', COUNT(*) FROM notification_outbox;"
