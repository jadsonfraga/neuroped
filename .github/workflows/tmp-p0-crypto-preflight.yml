name: Temporary P0 crypto preflight

on:
  push:
    branches:
      - fix/p0-clinical-crypto-20260811
    paths:
      - ".github/workflows/tmp-p0-crypto-preflight.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN absent"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID absent"; exit 1; }
      - name: Inspect safe metadata only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "=== D1 INFO ==="
          npx --yes wrangler@4 d1 info neuroped-db || true
          echo "=== TIME TRAVEL BOOKMARK ==="
          npx --yes wrangler@4 d1 time-travel info neuroped-db || true
          echo "=== PAGES SECRET NAMES ==="
          npx --yes wrangler@4 pages secret list --project-name neuroped | sed -E 's/(: ).*/: [redacted]/' || true
          echo "=== CLINICAL TABLE COUNTS ==="
          for table in patients_demo consultations_demo scale_results_demo documents_demo memory_notes clinical_events_demo conecta_events_demo appointments waitlist_entries appointment_reviews notification_outbox; do
            echo "-- $table"
            npx --yes wrangler@4 d1 execute neuroped-db --remote --command "SELECT COUNT(*) AS rows FROM $table;"
          done
