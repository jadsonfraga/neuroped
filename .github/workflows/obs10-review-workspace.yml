name: OBS-10 isolated review workspace
on:
  push:
    branches: [feat/obs10-assistente-visual-v11]
    paths: ['.github/workflows/obs10-review-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package public source and locked dependencies only
        run: |
          mkdir -p /tmp/obs10-review
          git archive HEAD -o /tmp/obs10-review/source.tar
          tar -cf /tmp/obs10-review/dependencies.tar node_modules
          git rev-parse HEAD > /tmp/obs10-review/source-sha.txt
          find . -name AGENTS.md -not -path './node_modules/*' -not -path './.git/*' > /tmp/obs10-review/instructions.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: obs10-isolated-workspace
          path: /tmp/obs10-review
          retention-days: 1
