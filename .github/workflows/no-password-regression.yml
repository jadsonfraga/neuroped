name: No password regression

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: no-password-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-password-ui:
    name: App opens without access password
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Assert passwordless application access
        run: npm run guard:open-access

      - name: Type-check changed access surfaces
        run: npm run check
