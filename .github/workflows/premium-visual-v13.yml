name: NeuroPED Premium Visual v13

on:
  pull_request:
    paths:
      - "client/src/pages/home.tsx"
      - "client/src/main.tsx"
      - "client/src/lib/workspaceSurface.ts"
      - "client/src/styles/premium-visual-v13.css"
      - "client/src/styles/premium-visual-v13-mobile.css"
      - "client/src/styles/premium-visual-v13-a11y.css"
      - "client/src/styles/premium-native-app-v14.css"
      - "client/src/styles/premium-native-app-v14-responsive.css"
      - "client/src/styles/premium-internal-app-v15.css"
      - "tests/unit/premium-visual-v13-contract.test.mjs"
      - "tests/unit/premium-native-app-v14-contract.test.mjs"
      - "tests/unit/premium-internal-app-v15-contract.test.mjs"
      - "tests/e2e/premium-visual-proof.mjs"
      - "tests/e2e/premium-native-geometry.mjs"
      - "tests/e2e/premium-coarse-touch.mjs"
      - "tests/e2e/premium-internal-workspace.mjs"
      - "tests/e2e/responsive-shell-smoke.mjs"
      - ".github/workflows/premium-visual-v13.yml"
  push:
    branches:
      - main
    paths:
      - "client/src/pages/home.tsx"
      - "client/src/main.tsx"
      - "client/src/lib/workspaceSurface.ts"
      - "client/src/styles/premium-visual-v13.css"
      - "client/src/styles/premium-visual-v13-mobile.css"
      - "client/src/styles/premium-visual-v13-a11y.css"
      - "client/src/styles/premium-native-app-v14.css"
      - "client/src/styles/premium-native-app-v14-responsive.css"
      - "client/src/styles/premium-internal-app-v15.css"
      - "tests/unit/premium-visual-v13-contract.test.mjs"
      - "tests/unit/premium-native-app-v14-contract.test.mjs"
      - "tests/unit/premium-internal-app-v15-contract.test.mjs"
      - "tests/e2e/premium-visual-proof.mjs"
      - "tests/e2e/premium-native-geometry.mjs"
      - "tests/e2e/premium-coarse-touch.mjs"
      - "tests/e2e/premium-internal-workspace.mjs"
      - "tests/e2e/responsive-shell-smoke.mjs"
      - ".github/workflows/premium-visual-v13.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premium-visual-v13-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-antiregression:
    name: Trava visual e funcional
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Dependências
        run: npm ci

      - name: Chromium para auditoria
        run: npx playwright install --with-deps chromium

      - name: Contratos estáticos da experiência premium
        run: |
          node tests/unit/premium-visual-v13-contract.test.mjs
          node tests/unit/premium-native-app-v14-contract.test.mjs
          node tests/unit/premium-internal-app-v15-contract.test.mjs

      - name: Qualidade TypeScript e ESLint
        run: |
          npm run lint
          npm run check

      - name: Contratos de cor e design
        run: |
          npm run audit:color
          npm run audit:design

      # Mantido como continue-on-error somente para que o relatório JSON e as
      # capturas sobrevivam a uma falha e possam ser auditados. A etapa final
      # converte qualquer violação em bloqueio obrigatório do job.
      - name: Acessibilidade WCAG em navegador real
        id: a11y
        continue-on-error: true
        run: npm run audit:a11y

      # O runtime de auditoria é o responsável pelo build. Ele injeta
      # VITE_AUTH_MODE=auto, VITE_API_URL vazio e VITE_ZONE=full para que o
      # Chromium exercite o workspace clínico completo, não uma variante
      # pública/produção deixada previamente em dist/public.
      - name: Shell responsivo existente
        run: node tests/e2e/responsive-shell-smoke.mjs

      - name: Geometria native-app em iPhone e iPad
        run: node tests/e2e/premium-native-geometry.mjs

      - name: Cascade touch/coarse real
        run: node tests/e2e/premium-coarse-touch.mjs

      - name: Superfícies internas em navegador real
        env:
          PREMIUM_INTERNAL_DIR: artifacts/premium-v15
        run: node tests/e2e/premium-internal-workspace.mjs

      - name: Prova visual multitelas
        env:
          PREMIUM_PROOF_DIR: artifacts/premium-v13
        run: node tests/e2e/premium-visual-proof.mjs

      - name: Publicar capturas, manifestos e relatório WCAG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neuroped-premium-v15-evidence
          path: |
            artifacts/premium-v13
            artifacts/premium-v15
            scripts/guards/a11y-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Bloquear integração se a acessibilidade falhar
        if: always() && steps.a11y.outcome != 'success'
        run: |
          echo "A auditoria WCAG encontrou violação. Consulte scripts/guards/a11y-report.json no artefato."
          exit 1
