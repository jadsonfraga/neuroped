name: Runtime readiness contract
on:
  pull_request:
    paths:
      - "functions/api/health.ts"
      - "functions/api/auth/_sessions.ts"
      - "functions/api/tenant/_core.ts"
      - "functions/api/tenant/_crypto.ts"
      - "functions/api/tenant/_exportPayload.ts"
      - "functions/api/live/governance/_artifactStore.ts"
      - "functions/api/live/governance/_worker-core.ts"
      - "db/migrations/0003_refresh_sessions.sql"
      - "db/migrations/0009_saas_phase1_foundation.sql"
      - "db/migrations/0012_saas_billing_onboarding.sql"
      - "db/migrations/0013_saas_billing_provider.sql"
      - "db/migrations/0014_saas_tenant_lifecycle.sql"
      - "db/migrations/0017_lgpd_operational_worker_foundation.sql"
      - "package.json"
      - "package-lock.json"
      - "tests/unit/runtime-readiness.test.ts"
      - ".github/workflows/runtime-readiness.yml"
  push:
    branches: [main]
    paths:
      - "functions/api/health.ts"
      - "functions/api/auth/_sessions.ts"
      - "functions/api/tenant/_core.ts"
      - "functions/api/tenant/_crypto.ts"
      - "functions/api/tenant/_exportPayload.ts"
      - "functions/api/live/governance/_artifactStore.ts"
      - "functions/api/live/governance/_worker-core.ts"
      - "db/migrations/0003_refresh_sessions.sql"
      - "db/migrations/0009_saas_phase1_foundation.sql"
      - "db/migrations/0012_saas_billing_onboarding.sql"
      - "db/migrations/0013_saas_billing_provider.sql"
      - "db/migrations/0014_saas_tenant_lifecycle.sql"
      - "db/migrations/0017_lgpd_operational_worker_foundation.sql"
      - "package.json"
      - "package-lock.json"
      - "tests/unit/runtime-readiness.test.ts"
      - ".github/workflows/runtime-readiness.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    name: Runtime readiness and LGPD binding
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node --import tsx --test tests/unit/runtime-readiness.test.ts
      - run: node --import tsx tests/unit/cloudflare-auth-middleware.test.ts
      - run: node --import tsx tests/unit/lgpd-run-export-endpoint.test.ts
      - run: node --import tsx tests/unit/lgpd-run-deletion-endpoint.test.ts
