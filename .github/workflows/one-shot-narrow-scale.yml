name: One-shot narrow generic scale

on:
  push:
    branches:
      - agent/scales-lovable-quality-deep
    paths:
      - .github/workflows/one-shot-narrow-scale.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v7
        with:
          ref: agent/scales-lovable-quality-deep
          fetch-depth: 0

      - name: Narrow scale inside async clipboard action
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("client/src/pages/generic-scale.tsx")
          source = path.read_text(encoding="utf-8")
          old = '  async function copyDescription() {\n    setCopyStatus("idle");'
          new = '  async function copyDescription() {\n    if (!scale) return;\n    setCopyStatus("idle");'

          if old in source:
              path.write_text(source.replace(old, new, 1), encoding="utf-8")
          elif new not in source:
              raise SystemExit("bloco alvo não encontrado")
          PY

      - name: Commit correction
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/generic-scale.tsx
          git commit -m "fix(escalas): estreitar escala no callback assíncrono"
          git push origin HEAD:agent/scales-lovable-quality-deep
