name: SaaS identity settings D1

on:
  pull_request:
    branches:
      - main
    paths:
      - "db/migrations/0019_saas_identity_settings.sql"
      - "functions/api/tenant/_settings.ts"
      - "functions/api/me/profile.ts"
      - "functions/api/tenants/[id]/index.ts"
      - ".github/workflows/saas-identity-settings-d1.yml"
  push:
    branches:
      - main
    paths:
      - "db/migrations/0019_saas_identity_settings.sql"
      - "functions/api/tenant/_settings.ts"
      - "functions/api/me/profile.ts"
      - "functions/api/tenants/[id]/index.ts"
      - ".github/workflows/saas-identity-settings-d1.yml"
  workflow_dispatch:

permissions:
  contents: read

# Grupo próprio: migrações D1 idempotentes não disputam a vaga única do grupo
# compartilhado cloudflare-pages (que já cancelou deploys nesta main).
concurrency:
  group: d1-identity-settings
  cancel-in-progress: false

jobs:
  validate-identity-settings:
    name: Validate identity settings migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: TypeScript
        run: npm run check

  migrate-identity-settings:
    name: Apply identity settings schema to D1
    needs: validate-identity-settings
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID ausente"; exit 1; }

      - name: Apply migration 0019
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote --yes \
            --file=./db/migrations/0019_saas_identity_settings.sql

      - name: Verify tables without exposing data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('user_profiles','clinic_settings') ORDER BY name;" \
            > /tmp/identity-tables.txt 2>&1
          cat /tmp/identity-tables.txt
          grep -q "user_profiles" /tmp/identity-tables.txt
          grep -q "clinic_settings" /tmp/identity-tables.txt
          echo "✅ Schema de identidade por tenant instalado sem consultar dados."
