name: PANT Python Intake
on:
  push:
    branches: [feat/pant-intake-python-20260905]
    paths:
      - 'tools/pant_intake/**'
      - '.github/workflows/pant-intake-python.yml'
  pull_request:
    paths:
      - 'tools/pant_intake/**'
      - '.github/workflows/pant-intake-python.yml'
permissions:
  contents: read
jobs:
  intake:
    name: PANT Python Intake
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilacao
        run: python -m compileall -q tools/pant_intake
      - name: Autoridade única V12 — anti-legado
        working-directory: tools/pant_intake
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = (
              "MOTOR_PANT_" + "HELENA_ESTHER.py",
              "00_LEI_PANT_VIGENTE_" + "v5.md",
              "CURRENT_DRIVE_" + "V5_SHA256",
              "runtime_pant_" + "v5",
          )
          for name in ("pant_adapter.py", "README.md"):
              text = Path(name).read_text(encoding="utf-8")
              found = [marker for marker in forbidden if marker in text]
              if found:
                  raise SystemExit(f"{name}: autoridade legada detectada: {found}")
          PY
      - name: Testes obrigatorios
        working-directory: tools/pant_intake
        run: |
          test -f tests/test_core.py
          test -f tests/test_gate_cli.py
          test -f tests/test_pant_adapter.py
          python -m unittest discover -s tests -v
      - name: Pacote de codigo sem dados clinicos
        uses: actions/upload-artifact@v4
        with:
          name: neuroped-pant-intake-source
          path: tools/pant_intake
          include-hidden-files: false
          retention-days: 7
          if-no-files-found: error
