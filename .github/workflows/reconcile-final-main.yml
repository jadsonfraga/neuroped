name: Reconcile final reliability branch

on:
  push:
    branches:
      - fix/final-definitive-bughunt-20260810
    paths:
      - ".github/workflows/reconcile-final-main.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/final-definitive-bughunt-20260810
      - name: Merge main preserving newest main on conflicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "neuroped-reconcile-bot"
          git config user.email "noreply@neuroped.local"
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            while IFS= read -r -d '' file; do
              echo "Resolving conflict with current main: $file"
              git checkout --theirs -- "$file"
              git add -- "$file"
            done < <(git diff --name-only --diff-filter=U -z)
          fi
          git rm .github/workflows/reconcile-final-main.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to reconcile."
            exit 0
          fi
          git commit -m "merge: reconcile final reliability branch with current main"
          git push origin HEAD:fix/final-definitive-bughunt-20260810
