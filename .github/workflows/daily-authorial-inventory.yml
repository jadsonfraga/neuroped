name: Inventário autoral diário NeuroPed

on:
  schedule:
    - cron: "40 22 * * *" # 19h40 em America/Recife (UTC-3) — execução primária
    - cron: "20 23 * * *" # 20h20 em America/Recife (UTC-3) — redundância
    - cron: "15 0 * * *" # 21h15 em America/Recife (UTC-3) — promoção/recuperação final
  workflow_dispatch:
    inputs:
      date:
        description: "Data de geração em AAAA-MM-DD; vazio usa a data de Recife"
        required: false
        type: string
      topic_id:
        description: "ID de tema para execução manual; vazio usa a rotação clínica"
        required: false
        type: string
      reasoning_effort:
        description: "Esforço de raciocínio"
        required: false
        default: high
        type: choice
        options:
          - high
          - max
      force:
        description: "Substituir bloqueios de data/tema em execução manual"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: neuroped-daily-authorial-inventory
  cancel-in-progress: false

jobs:
  generate-and-publish:
    name: Gerar, auditar, preparar revisão e rastrear
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout da branch principal
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.NEUROPED_AUTOMATION_TOKEN || github.token }}
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências com retentativas
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Tentativa ${attempt}/3 de instalação das dependências."
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::npm ci falhou após três tentativas."
              exit 1
            fi
            sleep $((attempt * 30))
          done
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Normalizar parâmetros da execução
        env:
          DATE_INPUT: ${{ inputs.date }}
          TOPIC_INPUT: ${{ inputs.topic_id }}
          EFFORT_INPUT: ${{ inputs.reasoning_effort }}
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -n "${DATE_INPUT:-}" ]; then
            GENERATION_DATE="$DATE_INPUT"
          else
            GENERATION_DATE="$(TZ=America/Recife date +%F)"
          fi
          GENERATION_DATE="$GENERATION_DATE" node <<'NODE'
          const date = process.env.GENERATION_DATE ?? "";
          const parsed = new Date(`${date}T00:00:00Z`);
          if (
            !/^\d{4}-\d{2}-\d{2}$/.test(date) ||
            Number.isNaN(parsed.getTime()) ||
            parsed.toISOString().slice(0, 10) !== date
          ) {
            console.error(`Data inexistente ou fora do formato AAAA-MM-DD: ${date}`);
            process.exit(1);
          }
          NODE
          FORCE_VALUE="${FORCE_INPUT:-false}"
          case "$FORCE_VALUE" in
            true|false) ;;
            *) echo "::error::Valor force inválido: $FORCE_VALUE"; exit 1 ;;
          esac
          echo "NEUROPED_GENERATION_DATE=$GENERATION_DATE" >> "$GITHUB_ENV"
          echo "NEUROPED_DAILY_TOPIC_ID=${TOPIC_INPUT:-}" >> "$GITHUB_ENV"
          echo "NEUROPED_DAILY_REASONING_EFFORT=${EFFORT_INPUT:-high}" >> "$GITHUB_ENV"
          echo "NEUROPED_DAILY_FORCE=$FORCE_VALUE" >> "$GITHUB_ENV"

      - name: Detectar disponibilidade da OpenAI
        id: openai
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Credencial da OpenAI disponível; GPT-5.6 será priorizado."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENAI_API_KEY ausente; o gerador determinístico de contingência manterá a continuidade diária."
          fi

      - name: Inspecionar o registro da data
        id: current
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const date = process.env.NEUROPED_GENERATION_DATE;
          const dir = "client/src/data/daily-authorial";
          const matches = fs.existsSync(dir)
            ? fs.readdirSync(dir)
                .filter((file) => file.endsWith(".json"))
                .map((file) => ({
                  file: path.join(dir, file),
                  record: JSON.parse(fs.readFileSync(path.join(dir, file), "utf8")),
                }))
                .filter(({ record }) => record.generatedOn === date)
            : [];
          if (matches.length > 1) {
            console.error(`Mais de um inventário encontrado para ${date}.`);
            process.exit(1);
          }
          const output = process.env.GITHUB_OUTPUT;
          const current = matches[0];
          const force = process.env.NEUROPED_DAILY_FORCE === "true";
          const locked = Boolean(
            current &&
              ["revisado_clinicamente", "arquivado"].includes(current.record.status),
          );
          fs.appendFileSync(output, `exists=${current ? "true" : "false"}\n`);
          fs.appendFileSync(output, `file=${current?.file ?? ""}\n`);
          fs.appendFileSync(output, `force=${force ? "true" : "false"}\n`);
          fs.appendFileSync(output, `locked=${locked ? "true" : "false"}\n`);
          const contingency = Boolean(
            current &&
              (current.record.contingency === true ||
                String(current.record.generation?.model ?? "").startsWith("fallback-")),
          );
          fs.appendFileSync(output, `contingency=${contingency ? "true" : "false"}\n`);
          fs.appendFileSync(
            output,
            `model=${current?.record.generation?.model ?? "ausente"}\n`,
          );
          console.log(
            current
              ? `Registro existente: ${current.file} (${current.record.generation?.model ?? "modelo desconhecido"}).`
              : `Nenhum registro encontrado para ${date}.`,
          );
          NODE

      - name: Bloquear substituição de registro revisado ou arquivado
        if: steps.current.outputs.force == 'true' && steps.current.outputs.locked == 'true'
        run: |
          echo "::error::Force não pode substituir inventário revisado clinicamente ou arquivado."
          exit 1

      - name: Gerar instrumento com GPT-5.6 Pro
        id: gpt
        if: steps.current.outputs.locked != 'true' && steps.openai.outputs.available == 'true' && (steps.current.outputs.exists != 'true' || steps.current.outputs.contingency == 'true' || steps.current.outputs.force == 'true')
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEUROPED_DAILY_INVENTORY_MODEL: gpt-5.6
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Tentativa ${attempt}/3 com GPT-5.6 para ${NEUROPED_GENERATION_DATE}."
            if node --import tsx scripts/generate-daily-authorial-inventory.mts; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 45))
            fi
          done
          echo "::warning::GPT-5.6 permaneceu indisponível; a contingência será acionada."
          exit 1

      - name: Gerar continuidade determinística de contingência
        if: always() && steps.current.outputs.locked != 'true' && (steps.current.outputs.exists != 'true' || steps.current.outputs.contingency == 'true' || steps.current.outputs.force == 'true') && steps.gpt.outcome != 'success'
        run: node --import tsx scripts/generate-daily-authorial-fallback.mts

      - name: Bloquear force não concretizado
        if: steps.current.outputs.force == 'true' && steps.current.outputs.exists == 'true' && steps.gpt.outcome != 'success'
        run: |
          echo "::error::A substituição forçada falhou; o inventário anterior foi preservado."
          exit 1

      - name: Auditar catálogo autoral completo
        run: node --import tsx scripts/generate-daily-authorial-inventory.mts --validate-only

      - name: Confirmar unicidade e rastreabilidade do inventário diário
        id: verify
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const date = process.env.NEUROPED_GENERATION_DATE;
          const dir = "client/src/data/daily-authorial";
          const matches = fs.readdirSync(dir)
            .filter((file) => file.endsWith(".json"))
            .map((file) => ({
              file: path.join(dir, file),
              record: JSON.parse(fs.readFileSync(path.join(dir, file), "utf8")),
            }))
            .filter(({ record }) => record.generatedOn === date);
          if (matches.length !== 1) {
            console.error(`Esperado exatamente um inventário para ${date}; encontrados ${matches.length}.`);
            process.exit(1);
          }
          const [{ file, record }] = matches;
          const contingency = Boolean(
            record.contingency === true ||
              String(record.generation?.model ?? "").startsWith("fallback-"),
          );
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `file=${file}\n`);
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `model=${record.generation?.model ?? "desconhecido"}\n`,
          );
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `contingency=${contingency ? "true" : "false"}\n`,
          );
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `title=${record.title}\n`);
          if (contingency) {
            console.log(`::warning::Registro diário preservado por contingência: ${file}`);
          } else {
            console.log(`Registro diário GPT confirmado: ${file}`);
          }
          NODE

      - name: Executar catraca técnica completa antes de preparar a revisão
        run: npm run verify

      - name: Preservar artefato auditável da execução
        uses: actions/upload-artifact@v4
        with:
          name: inventario-autoral-${{ env.NEUROPED_GENERATION_DATE }}-${{ github.run_attempt }}
          path: ${{ steps.verify.outputs.file }}
          if-no-files-found: error
          retention-days: 90

      - name: Publicar branch de revisão e abrir PR draft
        id: publish
        env:
          AUTOMATION_TOKEN: ${{ secrets.NEUROPED_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${AUTOMATION_TOKEN:-}" ] || {
            echo "::error::NEUROPED_AUTOMATION_TOKEN é obrigatório para versionar o rascunho em PR sem bypass da main."
            exit 1
          }
          export GH_TOKEN="$AUTOMATION_TOKEN"
          branch="automation/daily-authorial-${NEUROPED_GENERATION_DATE}"

          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            remote_sha="$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit=${remote_sha:-$(git rev-parse HEAD)}" >> "$GITHUB_OUTPUT"
            echo "pr=$existing_pr" >> "$GITHUB_OUTPUT"
            echo "PR #$existing_pr já representa o inventário da data; nenhuma mutação automática será feita sobre revisão humana em andamento."
            exit 0
          fi

          git add client/src/data/daily-authorial
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "pr=" >> "$GITHUB_OUTPUT"
            echo "Inventário já está na main; execução idempotente concluída."
            exit 0
          fi

          git config user.name "NeuroPed Daily Bot"
          git config user.email "neuroped-daily-bot@users.noreply.github.com"
          git commit -m "feat(escalas): preparar inventário autoral diário ${NEUROPED_GENERATION_DATE}"
          git push origin "HEAD:refs/heads/$branch"

          cat > /tmp/daily-pr-body.md <<EOF
          ## Inventário autoral diário — ${NEUROPED_GENERATION_DATE}

          Artefato gerado e validado automaticamente, preservado como rascunho para revisão humana.

          - Modelo: ${{ steps.verify.outputs.model }}
          - Contingência: ${{ steps.verify.outputs.contingency }}
          - Arquivo: ${{ steps.verify.outputs.file }}
          - Status esperado: rascunho_revisao

          Não promover para uso clínico operacional sem revisar redação, segurança, utilidade, originalidade e coerência com o restante do catálogo. A publicação no aplicativo exige status revisado_clinicamente.
          EOF

          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --draft \
            --title "chore(clinical): revisar inventário autoral ${NEUROPED_GENERATION_DATE}" \
            --body-file /tmp/daily-pr-body.md)"
          pr_number="$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json number --jq .number)"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pr=$pr_number" >> "$GITHUB_OUTPUT"
          echo "Rascunho encaminhado ao PR #$pr_number; main permaneceu inalterada."

      - name: Resumo operacional
        if: always()
        run: |
          {
            echo "## Inventário autoral diário"
            echo ""
            echo "- **Data clínica:** ${NEUROPED_GENERATION_DATE}"
            echo "- **Arquivo:** ${{ steps.verify.outputs.file || 'não confirmado' }}"
            echo "- **Modelo:** ${{ steps.verify.outputs.model || steps.current.outputs.model || 'não confirmado' }}"
            echo "- **Contingência:** ${{ steps.verify.outputs.contingency || steps.current.outputs.contingency || 'não confirmado' }}"
            echo "- **Commit de revisão:** ${{ steps.publish.outputs.commit || github.sha }}"
            echo "- **PR de revisão:** ${{ steps.publish.outputs.pr || 'não criado' }}"
            echo "- **Execução:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

  close-recovered-incident:
    name: Encerrar incidente recuperado
    needs: generate-and-publish
    if: needs.generate-and-publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Fechar alerta persistente anterior, quando houver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="[automação] Inventário autoral diário — falha persistente"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" \
              --body "Autorrecuperação concluída na execução ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. O incidente foi encerrado automaticamente."
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason completed
          fi

  report-persistent-failure:
    name: Registrar falha persistente
    needs: generate-and-publish
    if: always() && needs.generate-and-publish.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Criar ou atualizar incidente técnico interno
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="[automação] Inventário autoral diário — falha persistente"
          body="A geração, contingência, auditoria ou preparação da revisão diária não foi concluída. Execução: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Manter este incidente aberto até recuperação automática."
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
