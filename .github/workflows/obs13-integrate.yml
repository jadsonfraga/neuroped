name: OBS13 scoped integration and proof
on:
  push:
    branches: [feat/obs10-evidencia-piloto-v13]
    paths: [.github/workflows/obs13-integrate.yml]
permissions:
  contents: read
jobs:
  integrate-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/obs10-evidencia-piloto-v13
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply checksum-verified source-only patch
        run: |
          python3 - <<'PY'
          import base64, bz2, hashlib, pathlib, re
          parts = sorted(pathlib.Path('.github/obs13-transfer').glob('*.b64'))
          assert [p.name for p in parts] == [f'{i:03}.b64' for i in range(4)]
          patch = bz2.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'ebd18d6f63ccf1a719fe7dc0c022924fbbb243b38876bf0baf5f28d90d891340'
          allowed = {
            'client/src/features/obs10/AudioPreflight.tsx',
            'client/src/features/obs10/EvidencePanel.tsx',
            'client/src/features/obs10/PilotPanel.tsx',
            'client/src/features/obs10/evidence.ts',
            'client/src/features/obs10/importRecord.ts',
            'client/src/features/obs10/obs10.css',
            'client/src/features/obs10/pilot.ts',
            'client/src/features/obs10/protocol.ts',
            'client/src/features/obs10/session.ts',
            'client/src/features/obs10/useWorkClock.ts',
            'client/src/pages/pre-consulta-obs10.tsx',
            'docs/audits/obs10-v13-pilot.md',
            'docs/features/obs10.md',
            'tests/e2e/obs10-evidence.mjs',
            'tests/e2e/obs10-practical.mjs',
            'tests/e2e/obs10-review.mjs',
            'tests/unit/obs10-evidence.test.ts',
            'tests/unit/obs10-practical.test.ts',
          }
          paths = re.findall(r'^diff --git a/(\S+) b/(\S+)$', patch.decode(), re.M)
          assert len(paths) == len(allowed) and all(a == b and a in allowed for a,b in paths)
          pathlib.Path('/tmp/obs13.patch').write_bytes(patch)
          print('18 source paths and exact checksum verified; no backend or workflow mutations in source patch.')
          PY
          git apply --check /tmp/obs13.patch
          git apply /tmp/obs13.patch
          git diff --check
          git add client/src/features/obs10 client/src/pages/pre-consulta-obs10.tsx docs/features/obs10.md docs/audits/obs10-v13-pilot.md tests/e2e/obs10-evidence.mjs tests/e2e/obs10-practical.mjs tests/e2e/obs10-review.mjs tests/unit/obs10-evidence.test.ts tests/unit/obs10-practical.test.ts
          git rm -r .github/obs13-transfer
          git -c user.name='NeuroPed Automation' -c user.email='actions@users.noreply.github.com' commit -m 'feat(obs10): link local evidence, professional review and measurable workflow'
          git push origin HEAD:feat/obs10-evidencia-piloto-v13
          git rev-parse HEAD
      - run: npm ci
      - name: Types, lint, original and new contracts
        run: |
          npm run check
          npx eslint client/src/features/obs10/*.{ts,tsx} client/src/pages/pre-consulta-obs10.tsx tests/unit/obs10*.test.ts --max-warnings=0
          node --import tsx tests/unit/obs10.test.ts
          node --import tsx tests/unit/obs10-practical.test.ts
          node --import tsx tests/unit/obs10-review.test.ts
          node --import tsx tests/unit/obs10-evidence.test.ts
          node tests/unit/browser-audit-chromium-resolution.test.mjs
          npm run audit:design
      - name: Production build without access bypass
        env:
          VITE_OPEN_ACCESS: 'false'
        run: npm run build:client
      - run: npx playwright install --with-deps chromium
      - name: Original browser journey
        env:
          OBS10_ARTIFACT_DIR: /tmp/obs10-proof
        run: node tests/e2e/obs10.mjs
      - name: Practical assistant and all age-card journey
        env:
          OBS10_PRACTICAL_ARTIFACT_DIR: /tmp/obs10-practical
        run: node tests/e2e/obs10-practical.mjs
      - name: Review and local JSON continuity
        env:
          OBS10_REVIEW_ARTIFACT_DIR: /tmp/obs10-review
        run: node tests/e2e/obs10-review.mjs
      - name: Local video, professional review and operational metrics
        env:
          OBS10_EVIDENCE_ARTIFACT_DIR: /tmp/obs10-evidence
        run: node tests/e2e/obs10-evidence.mjs
      - name: Preserve synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: obs13-proof
          path: |
            /tmp/obs10-proof
            /tmp/obs10-practical
            /tmp/obs10-review
            /tmp/obs10-evidence
          if-no-files-found: ignore
          retention-days: 7
