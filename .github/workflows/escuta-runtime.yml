name: Escuta runtime authorization
on:
  push:
    branches: [main, feat/escuta-clinica-integrada-20260905]
    paths: ['functions/api/live/escuta/**', 'shared/escuta/**', 'tests/unit/escuta*', '.github/workflows/escuta-runtime.yml']
  pull_request:
    paths: ['functions/api/live/escuta/**', 'shared/escuta/**', 'tests/unit/escuta*', '.github/workflows/escuta-runtime.yml']
permissions:
  contents: read
jobs:
  actual-handler-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --import tsx tests/unit/escuta-handler.test.ts
      - run: node --import tsx tests/unit/escuta-core.test.ts
      - run: node --import tsx tests/unit/escuta-patients.test.ts
      - run: node tests/unit/escuta-worklet.test.mjs
      - run: npx wrangler@4.129.0 pages functions build --outdir=/tmp/escuta-runtime
