name: Account workspace + certificate vault D1 (0041–0042)
# Aplica as migrations aditivas 0041 (workspace cifrado por clínica e conta, com
# versão para concorrência otimista) e 0042 (cofre do envelope cifrado do
# certificado A1). Só cria tabelas, índice e gatilhos com IF NOT EXISTS; não lê
# nem altera dado existente. Mesmo padrão dos demais workflows de migration:
# valida no PR, aplica só no main, entra na fila de escritas D1, faz preflight
# (aplicada / ausente / forma divergente) e verifica a forma sem ler dados.
on:
  pull_request:
    branches: [main]
    paths:
      - "db/migrations/0041_account_workspace_items.sql"
      - "db/migrations/0042_certificate_vault.sql"
      - "functions/api/me/workspace.ts"
      - "functions/api/certificate-vault.ts"
      - "client/src/lib/accountWorkspace.ts"
      - "client/src/lib/workspaceSync.ts"
      - "client/src/lib/workspaceMerge.ts"
      - "tests/unit/account-workspace*.test.*"
      - ".github/workflows/account-workspace-d1.yml"
  push:
    branches: [main]
    paths:
      - "db/migrations/0041_account_workspace_items.sql"
      - "db/migrations/0042_certificate_vault.sql"
      - ".github/workflows/account-workspace-d1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: d1-account-workspace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-account-workspace:
    name: Validate account workspace schema and contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false
      - name: Bootstrap do schema com todas as migrações
        run: node tests/unit/schema-bootstrap-contract.test.mjs
      - name: Contrato do workspace e do cofre
        run: |
          set -euo pipefail
          node tests/unit/account-workspace-persistence-static.test.mjs
          node --import tsx tests/unit/account-workspace-sync.test.ts
          node tests/unit/certificate-vault-static.test.mjs
      - name: TypeScript
        run: npm run check

  migrate-account-workspace:
    name: Apply account workspace (0041–0042) to D1
    needs: validate-account-workspace
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60 # inclui até 45 min de espera na fila D1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID ausente"; exit 1; }
      # Fila das escritas D1 sem pending slot: ver scripts/ci/wait-d1-writers.mjs.
      - name: Aguardar fila de escritas D1 (migration)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: migration
        run: node scripts/ci/wait-d1-writers.mjs

      - name: Pré-requisitos — tabelas referenciadas existem
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT COUNT(*) AS tabelas FROM sqlite_master WHERE type = 'table' AND name IN ('clinics', 'users', 'clinic_memberships', 'saas_audit_log');" \
            > /tmp/workspace-prereq.txt 2>&1
          cat /tmp/workspace-prereq.txt
          if ! grep -qE '(tabelas[^0-9]*4[^0-9]|"tabelas":\s*4)' /tmp/workspace-prereq.txt; then
            echo "::error::clinics, users, clinic_memberships e saas_audit_log precisam existir antes da 0041."
            exit 1
          fi

      - name: Aplicar 0041 (preflight pela forma)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type = 'table' AND name = 'account_workspace_items') AS tabela, (SELECT COUNT(*) FROM pragma_table_info('account_workspace_items') WHERE name = 'version') AS versao;" \
            > /tmp/workspace-0041-preflight.txt 2>&1
          cat /tmp/workspace-0041-preflight.txt
          if grep -qE '(tabela[^0-9]*1[^0-9]|"tabela":\s*1)' /tmp/workspace-0041-preflight.txt; then
            if ! grep -qE '(versao[^0-9]*1[^0-9]|"versao":\s*1)' /tmp/workspace-0041-preflight.txt; then
              echo "::error::account_workspace_items existe sem a coluna version; intervenção manual necessária."
              exit 1
            fi
            echo "0041: tabela presente; reaplicando de forma idempotente para garantir índice e gatilhos."
            npx wrangler@4 d1 execute neuroped-db --remote --yes --file="./db/migrations/0041_account_workspace_items.sql"
          elif grep -qE '(tabela[^0-9]*0[^0-9]|"tabela":\s*0)' /tmp/workspace-0041-preflight.txt; then
            echo "0041: aplicando."
            npx wrangler@4 d1 execute neuroped-db --remote --yes --file="./db/migrations/0041_account_workspace_items.sql"
          else
            echo "::error::0041 com preflight ilegível; intervenção manual necessária."
            exit 1
          fi

      - name: Aplicar 0042 (preflight pela forma)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type = 'table' AND name = 'certificate_vault') AS tabela, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'table' AND name = 'certificate_vault' AND sql LIKE '%BETWEEN 600000 AND 5000000%') AS forma;" \
            > /tmp/workspace-0042-preflight.txt 2>&1
          cat /tmp/workspace-0042-preflight.txt
          if grep -qE '(tabela[^0-9]*1[^0-9]|"tabela":\s*1)' /tmp/workspace-0042-preflight.txt; then
            if ! grep -qE '(forma[^0-9]*1[^0-9]|"forma":\s*1)' /tmp/workspace-0042-preflight.txt; then
              echo "::error::certificate_vault existe com faixa de KDF divergente; intervenção manual necessária."
              exit 1
            fi
            echo "0042: já aplicada."
          elif grep -qE '(tabela[^0-9]*0[^0-9]|"tabela":\s*0)' /tmp/workspace-0042-preflight.txt; then
            echo "0042: aplicando."
            npx wrangler@4 d1 execute neuroped-db --remote --yes --file="./db/migrations/0042_certificate_vault.sql"
          else
            echo "::error::0042 com preflight ilegível; intervenção manual necessária."
            exit 1
          fi

      - name: Verificar forma sem ler dados de clínicas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type = 'table' AND name IN ('account_workspace_items', 'certificate_vault')) AS tabelas, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'trigger' AND name IN ('trg_account_workspace_active_membership', 'trg_account_workspace_active_membership_update')) AS gatilhos, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'index' AND name = 'idx_account_workspace_items_expiry') AS indices, (SELECT COUNT(*) FROM pragma_table_info('account_workspace_items') WHERE name = 'version' AND \"notnull\" = 1) AS versao;" \
            > /tmp/workspace-verify.txt 2>&1
          cat /tmp/workspace-verify.txt
          if ! grep -qE '(tabelas[^0-9]*2[^0-9]|"tabelas":\s*2)' /tmp/workspace-verify.txt; then
            echo "::error::account_workspace_items e certificate_vault precisam existir após 0041–0042."
            exit 1
          fi
          if ! grep -qE '(gatilhos[^0-9]*2[^0-9]|"gatilhos":\s*2)' /tmp/workspace-verify.txt; then
            echo "::error::esperados 2 gatilhos de membership da 0041."
            exit 1
          fi
          if ! grep -qE '(indices[^0-9]*1[^0-9]|"indices":\s*1)' /tmp/workspace-verify.txt; then
            echo "::error::índice de expiração da 0041 ausente."
            exit 1
          fi
          if ! grep -qE '(versao[^0-9]*1[^0-9]|"versao":\s*1)' /tmp/workspace-verify.txt; then
            echo "::error::coluna version NOT NULL ausente em account_workspace_items."
            exit 1
          fi
          echo "0041–0042 verificadas: 2 tabelas, 2 gatilhos, 1 índice e versão obrigatória."
