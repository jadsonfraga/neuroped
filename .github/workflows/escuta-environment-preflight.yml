name: Escuta environment access preflight
on:
  push:
    branches: [feat/escuta-clinica-integrada-20260905]
    paths: ['.github/workflows/escuta-environment-preflight.yml']
permissions:
  contents: read
jobs:
  metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read canonical project metadata only; no deploy or environment mutation
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          node --input-type=module <<'NODE'
          import {mkdirSync,writeFileSync} from 'node:fs';
          const report={scope:'read-only canonical project metadata; no secret values, no configuration/deployment change',date:new Date().toISOString()};
          try{
            if(!process.env.CF_TOKEN?.trim()||!process.env.CF_ACCOUNT?.trim())throw new Error('CLOUDFLARE_CREDENTIAL_NOT_PRESENT');
            const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(process.env.CF_ACCOUNT.trim())}/pages/projects/neuroped`,{headers:{Authorization:`Bearer ${process.env.CF_TOKEN.trim()}`},signal:AbortSignal.timeout(20000)});
            report.cloudflare={httpStatus:response.status};
            if(response.ok){const body=await response.json();const p=body.result||{};report.cloudflare.name=p.name;report.cloudflare.subdomain=p.subdomain;report.cloudflare.config={};for(const [name,config] of Object.entries(p.deployment_configs||{})){report.cloudflare.config[name]={aiBindingPresent:Boolean(config.ai_bindings&&Object.keys(config.ai_bindings).length),escutaEnabled:config.env_vars?.ESCUTA_ENABLED?.value==='true',clinicalLiveEnabled:config.env_vars?.CLINICAL_LIVE_ENABLED?.value==='true'};}}
            else process.exitCode=2;
          }catch(error){report.cloudflare={error:error.name==='TimeoutError'?'TIMEOUT':error.message};process.exitCode=2;}
          try{
            if(!process.env.VERCEL_TOKEN?.trim()||!process.env.VERCEL_ORG_ID?.trim())throw new Error('VERCEL_CREDENTIAL_NOT_PRESENT');
            const response=await fetch(`https://api.vercel.com/v9/projects/prj_8gsXbaQoOZHgbhjnqiMPR9A5jg5b?teamId=${encodeURIComponent(process.env.VERCEL_ORG_ID.trim())}`,{headers:{Authorization:`Bearer ${process.env.VERCEL_TOKEN.trim()}`},signal:AbortSignal.timeout(20000)});
            report.vercel={httpStatus:response.status};
            if(response.ok){const p=await response.json();report.vercel.id=p.id;report.vercel.name=p.name;report.vercel.productionDeployment=p.targets?.production?{id:p.targets.production.id,readyState:p.targets.production.readyState}:null;}
            else process.exitCode=2;
          }catch(error){report.vercel={error:error.name==='TimeoutError'?'TIMEOUT':error.message};process.exitCode=2;}
          mkdirSync('artifacts',{recursive:true});writeFileSync('artifacts/environment-preflight.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: escuta-environment-${{ github.run_id }}
          path: artifacts/environment-preflight.json
          retention-days: 7
