name: DR backup and restore rehearsal (D1)

# Fase 9 (backup e recuperação) — ensaio controlado descrito em
# docs/D1_DISASTER_RECOVERY_RUNBOOK.md. Usa schema real, dois D1 temporários e
# dados 100% sintéticos. Produção não é lida nem escrita.
#
# O ensaio separa três estados que não podem ser confundidos:
#   1. mecanismo disponível: D1 export e Time Travel respondem;
#   2. backup executado: um SQL efêmero é exportado do D1 sintético de origem;
#   3. restauração exercitada: o SQL é importado em outro D1 e o Time Travel
#      reverte uma mutação destrutiva, com fingerprints reconciliados.
#
# Ele NÃO mede o RTO de um restore de produção. O volume é sintético e nenhum
# dado de produção é copiado sem a aprovação de governança prevista no runbook.
#
# SEGURANÇA — travas fail-closed:
#   1. somente workflow_dispatch com confirmação digitada;
#   2. origem e destino são criados pelo job e contêm `dr-rehearsal`;
#   3. nenhum comando de banco nomeia produção;
#   4. o backup fica em /tmp, chmod 600, nunca vira artifact e é removido no
#      cleanup incondicional;
#   5. fingerprints contêm somente contagens/invariantes, nunca PHI.

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite ENSAIAR para confirmar a criação e destruição de dois D1 temporários'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: dr-mechanism-rehearsal
  cancel-in-progress: false

env:
  # Nome de produção, usado apenas para os guards recusarem explicitamente
  # qualquer colisão. Nenhum comando wrangler recebe este valor.
  PRODUCTION_D1: neuroped-db
  BACKUP: /tmp/neuroped-dr-rehearsal-${{ github.run_id }}.sql

jobs:
  rehearsal:
    name: Backup, restore e Time Travel em D1 isolado
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Confirmação explícita
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirmar }}" != "ENSAIAR" ]; then
            echo "::error::Confirmação ausente. Rode novamente digitando ENSAIAR."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID ausente"; exit 1; }

      - name: Resolver e travar os alvos isolados
        id: target
        run: |
          set -euo pipefail
          SOURCE="neuroped-dr-rehearsal-source-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          RESTORE="neuroped-dr-rehearsal-restore-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          for TARGET in "$SOURCE" "$RESTORE"; do
            case "$TARGET" in
              *dr-rehearsal*) ;;
              *) echo "::error::Alvo sem marca dr-rehearsal: $TARGET"; exit 1 ;;
            esac
            if [ "$TARGET" = "$PRODUCTION_D1" ]; then
              echo "::error::Alvo coincide com produção. Abortado."
              exit 1
            fi
          done
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "restore=$RESTORE" >> "$GITHUB_OUTPUT"
          echo "Origem e destino isolados definidos; produção não será tocada."

      - name: Etapa B — criar dois D1 temporários
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SOURCE="${{ steps.target.outputs.source }}"
          RESTORE="${{ steps.target.outputs.restore }}"
          npx wrangler@4 d1 create "$SOURCE"
          npx wrangler@4 d1 create "$RESTORE"

      - name: Etapa C — schema real e fixtures sintéticos na origem
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SOURCE="${{ steps.target.outputs.source }}"
          npx wrangler@4 d1 execute "$SOURCE" --remote --yes --file=./db/schema.d1.sql

          for migration in db/migrations/*.sql; do
            echo "Aplicando $(basename "$migration")"
            if npx wrangler@4 d1 execute "$SOURCE" --remote --yes \
                 --file="$migration" > /tmp/migration.log 2>&1; then
              continue
            fi
            if grep -qi "duplicate column name" /tmp/migration.log; then
              echo "Coluna já provida pelo schema-base; seguindo."
              continue
            fi
            echo "::error::Migração falhou por motivo não permitido: $(basename "$migration")"
            cat /tmp/migration.log
            exit 1
          done

          npx wrangler@4 d1 execute "$SOURCE" --remote --yes \
            --file=./scripts/dr/synthetic-fixture.sql

      - name: Etapa D — fingerprint e backup executado
        id: backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SOURCE="${{ steps.target.outputs.source }}"
          umask 077
          : > "$BACKUP"
          chmod 600 "$BACKUP"

          npx wrangler@4 d1 execute "$SOURCE" --remote \
            --file=./scripts/dr/metadata-fingerprint.sql --json \
            | node ./scripts/dr/fingerprint-d1-json.mjs > /tmp/source.sha256
          test "$(wc -c < /tmp/source.sha256)" -eq 65

          START=$(date +%s)
          npx wrangler@4 d1 export "$SOURCE" --remote --output="$BACKUP" \
            > /tmp/dr-export.log 2>&1
          END=$(date +%s)
          test -s "$BACKUP"
          test "$(stat -c '%a' "$BACKUP")" = "600"

          BACKUP_SHA=$(sha256sum "$BACKUP" | cut -d' ' -f1)
          echo "duration_s=$((END-START))" >> "$GITHUB_OUTPUT"
          echo "bytes=$(wc -c < "$BACKUP")" >> "$GITHUB_OUTPUT"
          echo "sha256=$BACKUP_SHA" >> "$GITHUB_OUTPUT"
          echo "source_fingerprint=$(cat /tmp/source.sha256)" >> "$GITHUB_OUTPUT"
          echo "Backup SQL executado em arquivo efêmero; conteúdo não foi impresso."

      - name: Etapa E — restaurar backup em alvo distinto
        id: import
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          RESTORE="${{ steps.target.outputs.restore }}"
          START=$(date +%s)
          npx wrangler@4 d1 execute "$RESTORE" --remote --yes --file="$BACKUP" \
            > /tmp/dr-import.log 2>&1
          END=$(date +%s)

          npx wrangler@4 d1 execute "$RESTORE" --remote \
            --file=./scripts/dr/metadata-fingerprint.sql --json \
            | node ./scripts/dr/fingerprint-d1-json.mjs > /tmp/restored.sha256
          if ! cmp -s /tmp/source.sha256 /tmp/restored.sha256; then
            echo "::error::Fingerprint após import diverge da origem."
            exit 1
          fi
          echo "duration_s=$((END-START))" >> "$GITHUB_OUTPUT"
          echo "restore_fingerprint=$(cat /tmp/restored.sha256)" >> "$GITHUB_OUTPUT"
          echo "Backup restaurado em D1 distinto com fingerprint idêntico."

      - name: Etapa F — mutação destrutiva e bookmark
        id: damage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          RESTORE="${{ steps.target.outputs.restore }}"
          npx wrangler@4 d1 time-travel info "$RESTORE" > /tmp/b1.txt 2>&1
          cat /tmp/b1.txt
          BOOKMARK=$(sed -n "s/.*current bookmark is '\([0-9a-f][0-9a-f-]*\)'.*/\1/p" /tmp/b1.txt | head -1 || true)
          [ -n "$BOOKMARK" ] || { echo "::error::Não consegui ler o bookmark do Time Travel"; exit 1; }
          echo "bookmark=$BOOKMARK" >> "$GITHUB_OUTPUT"

          npx wrangler@4 d1 execute "$RESTORE" --remote --yes --command \
            "DELETE FROM live_patients WHERE id = 'dr-rehearsal-patient-alpha';"
          npx wrangler@4 d1 execute "$RESTORE" --remote \
            --file=./scripts/dr/metadata-fingerprint.sql --json \
            | node ./scripts/dr/fingerprint-d1-json.mjs > /tmp/damaged.sha256
          if cmp -s /tmp/source.sha256 /tmp/damaged.sha256; then
            echo "::error::A mutação destrutiva não alterou o fingerprint."
            exit 1
          fi
          echo "damaged_fingerprint=$(cat /tmp/damaged.sha256)" >> "$GITHUB_OUTPUT"
          echo "Mutação destrutiva sintética confirmada por fingerprint divergente."

      - name: Etapa G — Time Travel e reconciliação pós-restore
        id: time_travel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          RESTORE="${{ steps.target.outputs.restore }}"
          START=$(date +%s)
          npx wrangler@4 d1 time-travel restore "$RESTORE" \
            --bookmark="${{ steps.damage.outputs.bookmark }}" \
            > /tmp/dr-time-travel.log 2>&1
          END=$(date +%s)
          cat /tmp/dr-time-travel.log
          PREVIOUS_BOOKMARK=$(sed -n 's/.*previous bookmark: \([0-9a-f][0-9a-f-]*\).*/\1/p' /tmp/dr-time-travel.log | head -1 || true)
          [ -n "$PREVIOUS_BOOKMARK" ] || { echo "::error::Restore não retornou previous bookmark:"; exit 1; }
          echo "previous_bookmark=$PREVIOUS_BOOKMARK" >> "$GITHUB_OUTPUT"
          echo "duration_s=$((END-START))" >> "$GITHUB_OUTPUT"

          npx wrangler@4 d1 execute "$RESTORE" --remote \
            --file=./scripts/dr/metadata-fingerprint.sql --json \
            | node ./scripts/dr/fingerprint-d1-json.mjs > /tmp/post-time-travel.sha256
          if ! cmp -s /tmp/source.sha256 /tmp/post-time-travel.sha256; then
            echo "::error::Fingerprint após Time Travel diverge do backup válido."
            exit 1
          fi
          echo "post_fingerprint=$(cat /tmp/post-time-travel.sha256)" >> "$GITHUB_OUTPUT"
          echo "Time Travel reconciliou todas as invariantes metadata-only."

      - name: Etapa H — provar undo do próprio restore
        id: undo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          RESTORE="${{ steps.target.outputs.restore }}"
          PREVIOUS_BOOKMARK="${{ steps.time_travel.outputs.previous_bookmark }}"
          npx wrangler@4 d1 time-travel restore "$RESTORE" --bookmark="$PREVIOUS_BOOKMARK" \
            > /tmp/dr-undo.log 2>&1
          cat /tmp/dr-undo.log

          npx wrangler@4 d1 execute "$RESTORE" --remote \
            --file=./scripts/dr/metadata-fingerprint.sql --json \
            | node ./scripts/dr/fingerprint-d1-json.mjs > /tmp/post-undo.sha256
          if ! cmp -s /tmp/damaged.sha256 /tmp/post-undo.sha256; then
            echo "::error::Undo não retornou ao estado imediatamente anterior ao restore."
            exit 1
          fi
          echo "undo_fingerprint=$(cat /tmp/post-undo.sha256)" >> "$GITHUB_OUTPUT"
          echo "Undo do restore comprovado; alvo voltou ao estado danificado esperado."

      - name: Etapa I — destruir alvos e apagar backup
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          SOURCE="${{ steps.target.outputs.source }}"
          RESTORE="${{ steps.target.outputs.restore }}"
          STATUS=0

          cleanup_database() {
            TARGET="$1"
            [ -n "$TARGET" ] || return 0
            case "$TARGET" in
              *dr-rehearsal*) ;;
              *) echo "::error::Recusando destruir alvo sem marca dr-rehearsal: $TARGET"; return 1 ;;
            esac
            if [ "$TARGET" = "$PRODUCTION_D1" ]; then
              echo "::error::Recusando destruir produção."
              return 1
            fi
            npx wrangler@4 d1 delete "$TARGET" --skip-confirmation || return 1
          }

          cleanup_database "$SOURCE" || STATUS=1
          cleanup_database "$RESTORE" || STATUS=1
          rm -f "$BACKUP" /tmp/source.sha256 /tmp/restored.sha256 \
            /tmp/damaged.sha256 /tmp/post-time-travel.sha256 /tmp/post-undo.sha256 \
            /tmp/dr-export.log /tmp/dr-import.log /tmp/dr-time-travel.log \
            /tmp/dr-undo.log /tmp/b1.txt /tmp/migration.log
          exit "$STATUS"

      - name: Relatório metadata-only
        if: always()
        run: |
          {
            echo "## DR backup and restore rehearsal"
            echo ""
            echo "- Produção (\`$PRODUCTION_D1\`): **não lida, não escrita**"
            echo "- Backup executado: \`${{ steps.backup.outputs.bytes }}\` bytes; SHA-256 \`${{ steps.backup.outputs.sha256 }}\`"
            echo "- Export do backup: \`${{ steps.backup.outputs.duration_s }}\`s"
            echo "- Import em alvo distinto: \`${{ steps.import.outputs.duration_s }}\`s"
            echo "- Time Travel: \`${{ steps.time_travel.outputs.duration_s }}\`s"
            echo "- Fingerprint origem/import/Time Travel: \`${{ steps.backup.outputs.source_fingerprint }}\`"
            echo "- Fingerprint após dano e após undo: \`${{ steps.damage.outputs.damaged_fingerprint }}\`"
            echo ""
            echo "Escopo: backup exportado e restaurado, seguido de Time Travel e undo,"
            echo "com dados sintéticos. NÃO mede o RTO de um restore de produção nem"
            echo "autoriza copiar PHI para ambiente temporário."
          } >> "$GITHUB_STEP_SUMMARY"
