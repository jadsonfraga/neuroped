name: Temporary apply final saturation fix

on:
  push:
    branches:
      - fix/final-definitive-bughunt-integration-20260812
    paths:
      - "scripts/tmp_apply_final_saturation_fix.py"
      - ".github/workflows/tmp-apply-final-saturation-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/final-definitive-bughunt-integration-20260812
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Apply idempotent patch
        run: python3 scripts/tmp_apply_final_saturation_fix.py
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Focused regression plus release gate
        run: |
          node tests/unit/quick-wins-static.test.mjs
          npm run verify:release
      - name: Commit permanent fix
        run: |
          set -euo pipefail
          git config user.name "neuroped-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/middleware/security.ts tests/unit/quick-wins-static.test.mjs
          if git diff --cached --quiet; then
            echo "Patch já aplicado."
            exit 0
          fi
          git commit -m "fix(security): fail-closed CORS wildcard em produção"
          git push origin HEAD:fix/final-definitive-bughunt-integration-20260812
