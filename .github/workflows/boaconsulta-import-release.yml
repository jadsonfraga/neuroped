name: NeuroPed BoaConsulta Bridge release

on:
  push:
    branches:
      - main
    paths:
      - "db/migrations/0008_boaconsulta_import_bridge.sql"
      - "functions/api/integrations/boaconsulta/**"
      - "functions/api/integrations/_middleware.ts"
      - "functions/api/billing/_guard.ts"
      - "shared/boaconsulta-import.ts"
      - "client/public/integracoes/boaconsulta/**"
      - "tests/unit/boaconsulta-import-contract.test.ts"
      - "tests/unit/integrations-tenant-gate.test.ts"
      - "wrangler.toml"
      - ".github/workflows/boaconsulta-import-release.yml"

# Grupo próprio por ref: fora da única vaga pendente de `cloudflare-pages`, onde
# um segundo push rápido cancelava este release ou o deploy canônico. Escritas
# D1 e a publicação do Pages são serializadas por scripts/ci/wait-d1-writers.mjs
# (MODE=deploy: espera migrações e publicações do Pages mais antigas).
concurrency:
  group: pages-publisher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  provision-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar branch de produção
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "::error::BoaConsulta Bridge só pode provisionar produção a partir de main."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Instalar Chromium para os testes E2E
        run: npx playwright install --with-deps chromium

      - name: Auditar dependências
        run: node scripts/guards/npm-audit-gate.mjs

      - name: Testar contrato de importação
        run: node --import tsx tests/unit/boaconsulta-import-contract.test.ts

      - name: Testar gate de tenant/billing do bridge (AUTHZ-P1-09)
        run: node --import tsx tests/unit/integrations-tenant-gate.test.ts

      - name: Executar catraca geral antes de mexer em produção
        run: npm run verify

      - name: Validar credenciais Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID ausente"; exit 1; }

      # Fila das escritas D1 sem pending slot: ver scripts/ci/wait-d1-writers.mjs.
      - name: Aguardar fila de escritas D1 (deploy)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: deploy
          # Migrações (até 45 min cada na fila) + publicações do Pages mais antigas.
          TIMEOUT_MINUTES: "90"
        run: node scripts/ci/wait-d1-writers.mjs

      - name: Aplicar cofre e staging D1 do bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote --yes \
            --file=./db/migrations/0008_boaconsulta_import_bridge.sql
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('external_import_batches','external_import_file_chunks','external_import_records') ORDER BY name;" \
            > /tmp/bridge-schema.txt 2>&1
          cat /tmp/bridge-schema.txt
          grep -q "external_import_batches" /tmp/bridge-schema.txt
          grep -q "external_import_file_chunks" /tmp/bridge-schema.txt
          grep -q "external_import_records" /tmp/bridge-schema.txt

      - name: Garantir chave dedicada de criptografia sem expor o valor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 pages secret list --project-name neuroped > /tmp/pages-secrets.txt
          if grep -Fq "NEUROPED_IMPORT_ENCRYPTION_KEY" /tmp/pages-secrets.txt; then
            echo "Chave dedicada já existe; preservando-a sem rotação."
          else
            key="$(openssl rand -base64 32 | tr -d '\n')"
            printf '%s' "$key" | npx wrangler@4 pages secret put \
              NEUROPED_IMPORT_ENCRYPTION_KEY --project-name neuroped >/dev/null
            unset key
            npx wrangler@4 pages secret list --project-name neuroped > /tmp/pages-secrets-after.txt
            grep -Fq "NEUROPED_IMPORT_ENCRYPTION_KEY" /tmp/pages-secrets-after.txt || {
              echo "::error::Chave de importação não foi criada."
              exit 1
            }
            echo "Chave dedicada criada no Cloudflare; valor nunca foi registrado em log."
          fi

      # Este release republica o Pages de produção: sem a sentinela, o
      # deploy-check.json commitado ("pending-deploy-workflow") substituía o do
      # deploy canônico. Mesmo script e campos do deploy-cloudflare.yml.
      - name: Criar sentinela de deploy
        run: node scripts/ci/write-deploy-check.mjs

      - name: Compilar frontend
        env:
          NODE_ENV: production
          VITE_AUTH_MODE: remote
          VITE_API_URL: ""
          VITE_ZONE: full
          VITE_ALLOWED_HOSTS: ""
        run: VITE_PIN_HASH= npm run build:client

      - name: Confirmar console BoaConsulta no artefato
        run: |
          test -f dist/public/integracoes/boaconsulta/index.html
          grep -Fq "\"commit\": \"${GITHUB_SHA}\"" dist/public/deploy-check.json
          grep -Fq "Bridge BoaConsulta" dist/public/integracoes/boaconsulta/index.html

      - name: Publicar Pages com cofre D1 e secret já provisionados
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy dist/public --project-name neuroped --branch main

      # O Cloudflare leva alguns segundos para trocar a versão servida; o
      # console já existia no deploy anterior, então só o commit no
      # deploy-check.json prova que esta publicação está no ar.
      - name: Verificar console publicado
        run: |
          set -euo pipefail
          base=https://neuroped.pages.dev
          for attempt in $(seq 1 18); do
            cache_buster="run=${GITHUB_RUN_ID}&attempt=$attempt"
            if curl -fsSL "$base/deploy-check.json?$cache_buster" -o /tmp/boaconsulta-deploy-check.json \
               && jq -e --arg sha "$GITHUB_SHA" '.commit == $sha' /tmp/boaconsulta-deploy-check.json >/dev/null \
               && curl -fsSL "$base/integracoes/boaconsulta/?$cache_buster" -o /tmp/boaconsulta-console.html \
               && grep -Fq "Bridge BoaConsulta" /tmp/boaconsulta-console.html; then
              cat /tmp/boaconsulta-deploy-check.json
              echo "✅ BoaConsulta Bridge publicado em ${GITHUB_SHA} com cofre D1 cifrado, staging e chave dedicada."
              exit 0
            fi
            echo "Aguardando Pages servir ${GITHUB_SHA} ($attempt/18)."
            sleep 10
          done
          cat /tmp/boaconsulta-deploy-check.json 2>/dev/null || true
          if grep -q "pending-deploy-workflow" /tmp/boaconsulta-deploy-check.json 2>/dev/null; then
            echo "::error::deploy-check.json público voltou ao sentinela sem commit."
          else
            echo "::error::Pages não confirmou ${GITHUB_SHA} nem o console BoaConsulta em 3 minutos."
          fi
          exit 1
