name: OBS-10 v1.1 scoped integration and proof
on:
  push:
    branches: [feat/obs10-assistente-visual-v11]
    paths: ['.github/workflows/obs10-v11-integrate.yml']
permissions:
  contents: read
jobs:
  integrate-and-prove:
    if: github.ref == 'refs/heads/feat/obs10-assistente-visual-v11'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/obs10-assistente-visual-v11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Verify exact source patch and integrate only this feature branch
        run: |
          python3 - <<'PY'
          import base64, bz2, hashlib, pathlib, re
          parts = sorted(pathlib.Path('.github/obs10-transfer').glob('*.b64'))
          assert [p.name for p in parts] == [f'{i:03}.b64' for i in range(9)]
          patch = bz2.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '5d8317774c3f0d49794c44d44c1d83040e84b0049c48fb31b5108804cbc82ec4'
          allowed = {
            '.github/workflows/obs10.yml',
            'client/src/features/obs10/PracticalGuide.tsx',
            'client/src/features/obs10/PracticalVisuals.tsx',
            'client/src/features/obs10/obs10.css',
            'client/src/features/obs10/practical.ts',
            'client/src/features/obs10/protocol.ts',
            'client/src/features/obs10/safety.ts',
            'client/src/features/obs10/session.ts',
            'client/src/features/obs10/useExitGuard.ts',
            'client/src/features/obs10/useLocalRecorder.ts',
            'client/src/pages/pre-consulta-obs10.tsx',
            'docs/features/obs10.md',
            'tests/e2e/obs10-practical.mjs',
            'tests/e2e/obs10.mjs',
            'tests/unit/obs10-practical.test.ts',
          }
          paths = re.findall(r'^diff --git a/(\S+) b/(\S+)$', patch.decode(), re.M)
          assert len(paths) == len(allowed) and all(a == b and a in allowed for a,b in paths)
          assert {a for a,b in paths} == allowed
          pathlib.Path('/tmp/obs11.patch').write_bytes(patch)
          print('Patch checksum and exact scope verified. Workflow updates remain outside this job.')
          PY
          git apply --exclude=.github/workflows/obs10.yml --check /tmp/obs11.patch
          git apply --exclude=.github/workflows/obs10.yml /tmp/obs11.patch
          git diff --check
          git add client/src/features/obs10 client/src/pages/pre-consulta-obs10.tsx docs/features/obs10.md tests/e2e/obs10.mjs tests/e2e/obs10-practical.mjs tests/unit/obs10-practical.test.ts
          git rm -r .github/obs10-transfer
          git -c user.name='NeuroPed Automation' -c user.email='actions@users.noreply.github.com' commit -m 'feat(obs10): consolidate illustrated age kits, task cards and safe assistant workflow'
          git push origin HEAD:feat/obs10-assistente-visual-v11
          git rev-parse HEAD
      - run: npm ci
      - name: Types, lint, content and lifecycle contracts
        run: |
          npm run check
          npx eslint client/src/features/obs10/*.{ts,tsx} client/src/pages/pre-consulta-obs10.tsx tests/unit/obs10*.test.ts --max-warnings=0
          node --import tsx tests/unit/obs10.test.ts
          node --import tsx tests/unit/obs10-practical.test.ts
          node tests/unit/browser-audit-chromium-resolution.test.mjs
          npm run audit:design
          npm run test:sonda
          npm run audit:navigation
          npm run test:operations
      - name: Production build without open-access bypass
        env:
          VITE_OPEN_ACCESS: 'false'
        run: npm run build:client
      - run: npx playwright install --with-deps chromium
      - name: Preserve original OBS-10 browser journey
        env:
          OBS10_ARTIFACT_DIR: /tmp/obs10-proof
        run: node tests/e2e/obs10.mjs
      - name: Verify illustrated assistant flow and actual recorder lifecycle
        env:
          OBS10_PRACTICAL_ARTIFACT_DIR: /tmp/obs10-practical
        run: node tests/e2e/obs10-practical.mjs
      - name: Preserve synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: obs10-v11-proof
          path: |
            /tmp/obs10-proof
            /tmp/obs10-practical
          if-no-files-found: ignore
          retention-days: 7
