name: Biblioteca Clínica — QA de conteúdo e rota

on:
  pull_request:
    branches: [main]
    paths:
      - "client/src/data/clinicalLibrary.ts"
      - "client/src/pages/biblioteca-clinica.tsx"
      - "client/src/App.tsx"
      - "client/src/data/navigation.ts"
      - "client/src/security/knownRoutes.ts"
      - "tests/unit/clinical-library-static.test.mjs"
      - ".github/workflows/biblioteca-clinica-*.yml"
      - "docs/biblioteca-clinica/**"

permissions:
  contents: read

jobs:
  quality:
    name: Verificar Biblioteca Clínica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Verificar capítulo, índice, bibliografia, aceite e pauta
        run: node tests/unit/clinical-library-static.test.mjs
      - name: Verificar sincronismo de rotas protegidas
        run: node tests/unit/known-routes-sync.test.mjs
