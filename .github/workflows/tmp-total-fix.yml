name: Temporary total NeuroPed hardening

on:
  push:
    branches:
      - fix/total-audit-hardening-20260810
    paths:
      - ".github/workflows/tmp-total-fix.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/total-audit-hardening-20260810
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Apply audited fixes
        run: |
          set -euo pipefail
          python3 scripts/tmp_total_fix.py
          python3 scripts/tmp_total_fix_adjust.py
          python3 scripts/tmp_total_fix_adjust_v2.py

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run targeted anti-regression tests
        run: |
          set -euo pipefail
          npm run test:no-fake-clinical-write
          npm run test:loose-ends

      - name: Run hard release gate
        run: npm run verify:release

      - name: Run browser and screen gates
        run: |
          set -euo pipefail
          npm run audit:a11y:full
          npm run test:e2e:scales
          npm run audit:screens
          npm run build

      - name: Commit only approved product changes
        run: |
          set -euo pipefail
          git config user.name "NeuroPed Audit Bot"
          git config user.email "neuroped-audit@users.noreply.github.com"
          git add \
            functions/api/patients/index.ts \
            functions/api/consultations/index.ts \
            functions/api/documents/index.ts \
            functions/api/scales/results.ts \
            functions/api/results.ts \
            tests/unit/no-fake-clinical-write.test.ts \
            tests/unit/loose-ends-regression.test.mjs \
            package.json \
            WHATS_LEFT.md
          git commit -m "fix(audit): eliminar falsos sucessos e travar pontas soltas"
          git push origin HEAD:fix/total-audit-hardening-20260810
