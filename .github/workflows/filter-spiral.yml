name: Filter and scales spiral audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filter-spiral-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter-spiral:
    name: Filter, scales, PDF and lifecycle contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Install Chromium for real browser gates
        run: npx playwright install --with-deps chromium

      - name: Prove scale result and PDF fidelity contracts
        run: node --import tsx tests/unit/scale-pdf-fidelity.test.mjs

      - name: Build client for real scale and PDF journeys
        run: npm run build:client
        env:
          NODE_ENV: production
          VITE_AUTH_MODE: remote
          VITE_API_URL: ""

      - name: Execute scales and validate real PDF downloads
        run: npm run test:e2e:scales

      - name: Prove filter roundtrip and InteractiveScaleRunner PDF
        run: node tests/e2e/filter-interactive-pdf-roundtrip.mjs

      # Os gates históricos de shell/scroll/filtro abaixo validam o modo local/offline.
      # O bloco de PDF acima usa deliberadamente build remote/LIVE; portanto é
      # obrigatório reconstruir o cliente antes de reutilizar dist/public, evitando
      # que um RouteGuard remoto sem sessão transforme o smoke de layout em falso negativo.
      - name: Rebuild client for local/offline shell gates
        run: npm run build:client
        env:
          NODE_ENV: production
          VITE_AUTH_MODE: local
          VITE_API_URL: ""

      - name: Validate tablet shell breakpoints and print isolation
        run: node tests/e2e/responsive-shell-smoke.mjs

      - name: Prove scroll continuity with real touch and wheel
        run: node tests/e2e/scroll-continuity.mjs

      - name: Audit every navigable route with axe
        run: npm run audit:a11y:full

      - name: Enforce Lighthouse route and critical-audit contracts
        run: npm run audit:lighthouse

      - name: Audit fillability, routes and visual contracts
        run: npm run audit:filter-fillable

      - name: Audit symptom lifecycle and last-complaint cleanup
        run: node --import tsx scripts/guards/audit-filter-lifecycle.mjs

      - name: Audit full age-band compatibility
        run: node --import tsx tests/clinical/test-auxiliary-age-band.mjs

      - name: Type-check filter and scale surfaces
        run: npm run check
