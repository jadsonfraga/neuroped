name: Filter and scales spiral audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filter-spiral-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter-spiral:
    name: Filter, scales, aesthetics and lifecycle contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Audit fillability, routes and visual contracts
        run: npm run audit:filter-fillable

      - name: Audit symptom lifecycle and last-complaint cleanup
        run: node --import tsx scripts/guards/audit-filter-lifecycle.mjs

      - name: Audit full age-band compatibility
        run: node --import tsx tests/clinical/test-auxiliary-age-band.mjs

      - name: Audit canonical scale experience and caregiver curation
        run: node --import tsx scripts/guards/audit-scale-experience.mjs

      - name: Type-check filter and scale surfaces
        run: npm run check
