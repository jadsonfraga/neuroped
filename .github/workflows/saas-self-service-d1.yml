name: SaaS self-service D1

on:
  pull_request:
    branches:
      - main
    paths:
      - "db/migrations/0019_saas_self_service_onboarding.sql"
      - "functions/api/auth/register.ts"
      - "functions/api/auth/forgot-password.ts"
      - "functions/api/auth/reset-password.ts"
      - "functions/api/auth/_passwordResetDelivery.ts"
      - "functions/api/tenants/index.ts"
      - "functions/api/tenants/[id]/settings.ts"
      - "functions/api/billing/me.ts"
      - "client/src/pages/login.tsx"
      - "client/src/components/SaaSOrganizationSettings.tsx"
      - "tests/unit/saas-self-service-onboarding.test.mjs"
      - ".github/workflows/saas-self-service-d1.yml"
  push:
    branches:
      - main
    paths:
      - "db/migrations/0019_saas_self_service_onboarding.sql"
      - ".github/workflows/saas-self-service-d1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-saas-self-service
  cancel-in-progress: false

jobs:
  validate-self-service-migration:
    name: Validate self-service SaaS migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Self-service and tenant security regression
        run: node tests/unit/saas-self-service-onboarding.test.mjs

      - name: TypeScript
        run: npm run check

      - name: Ensure migration remains additive
        run: |
          set -euo pipefail
          if grep -Eiq '\bDROP[[:space:]]+(TABLE|COLUMN|INDEX)\b' db/migrations/0019_saas_self_service_onboarding.sql; then
            echo "::error::Migration 0019 contém operação destrutiva"
            exit 1
          fi

  migrate-self-service:
    name: Apply self-service SaaS schema to D1
    needs: validate-self-service-migration
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID ausente"; exit 1; }

      - name: Apply migration 0019
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote --yes \
            --file=./db/migrations/0019_saas_self_service_onboarding.sql

      - name: Verify schema without exposing account or clinical data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('auth_registration_rate_limits','auth_password_reset_rate_limits','auth_password_reset_tokens','clinic_settings') ORDER BY name;" \
            > /tmp/self-service-tables.txt 2>&1
          cat /tmp/self-service-tables.txt
          grep -q "auth_registration_rate_limits" /tmp/self-service-tables.txt
          grep -q "auth_password_reset_rate_limits" /tmp/self-service-tables.txt
          grep -q "auth_password_reset_tokens" /tmp/self-service-tables.txt
          grep -q "clinic_settings" /tmp/self-service-tables.txt

          npx wrangler@4 d1 execute neuroped-db --remote \
            --command "SELECT name FROM sqlite_master WHERE type='trigger' AND name='trg_clinic_create_settings';" \
            > /tmp/self-service-trigger.txt 2>&1
          cat /tmp/self-service-trigger.txt
          grep -q "trg_clinic_create_settings" /tmp/self-service-trigger.txt

          echo "✅ Schema self-service instalado sem consultar dados de usuário ou conteúdo clínico."