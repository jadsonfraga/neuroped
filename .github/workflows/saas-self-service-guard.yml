  push:
    branches: [main]
    paths:
      - "functions/api/auth/signup.ts"
      - "functions/api/auth/_shared.ts"
      - "functions/api/_middleware.ts"
      - "functions/api/me/**"
      - "functions/api/tenants/**"
      - "functions/api/tenant/_settings.ts"
      - "functions/api/billing/**"
      - "shared/entitlements.ts"
      - "shared/billing.ts"
      - "shared/onboarding.ts"
      - "client/src/components/OnboardingProgressCard.tsx"
      - "client/src/pages/home.tsx"
      - "db/migrations/**"
      - "tests/unit/saas-self-service.test.ts"
      - "tests/unit/saas-acceptance-journey.test.ts"
      - "tests/unit/cliente-zero-journey.test.ts"
      - "tests/unit/tenant-members-billing-gate.test.ts"
      - "tests/unit/tenant-audit-trail.test.ts"
      - "tests/unit/saas-membership-owner-regression.test.mjs"
      - "tests/unit/tenant-management-authorization.test.ts"
      - "tests/unit/saas-onboarding-progress.test.ts"
      - "tests/unit/onboarding-progress-ui.test.tsx"
      - "tests/unit/migration-prefix-guard.test.mjs"
      - "tests/unit/saas-loop-artifacts-static.test.mjs"
      - "tests/unit/asaas-operational-contract.test.ts"
      - "scripts/ops/asaas-operational-contract.ts"
      - "docs/ASAAS_OPERATIONAL_CONTRACT.md"
      - "tests/unit/resend-operational-contract.test.ts"
      - "tests/unit/email-verification.test.ts"
      - "scripts/ops/resend-operational-contract.ts"
      - "docs/RESEND_OPERATIONAL_CONTRACT.md"
      - "tests/unit/cliente-zero-published-smoke.test.ts"
      - "scripts/ops/cliente-zero-published-smoke.ts"
      - "docs/SMOKE_CLIENTE_ZERO.md"
      - "functions/api/auth/_mailTransport.ts"
      - "ROADMAP.md"
      - "client/src/components/ui/VisualStates.tsx"
      - "client/src/lib/connectivityProbe.ts"
      - "client/src/pages/sobre.tsx"
      - "tests/unit/connectivity-probe.test.ts"
      - "tests/unit/institutional-contact-ui.test.mjs"
      - "scripts/ops/saas-release-gate.ts"
      - "tests/unit/saas-release-gate.test.ts"
      - "DECISIONS.md"
      - "METRICS.md"
      - ".github/workflows/saas-self-service-guard.yml"

permissions:
  contents: read

concurrency:
  group: saas-self-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-service-contract:
    name: SaaS self-service and acceptance journey
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          npm_config_ignore_scripts: false

      - name: Migration prefix collision lock
        run: node tests/unit/migration-prefix-guard.test.mjs && node tests/unit/saas-loop-artifacts-static.test.mjs

      - name: Self-service regressions (signup, settings, RBAC, anti-IDOR)
        run: node --import tsx tests/unit/saas-self-service.test.ts

      - name: Owner role mutation remains authorized in final SQL predicate
        run: node tests/unit/saas-membership-owner-regression.test.mjs

      - name: Owner race behavior and tenant management authorization
        run: node --import tsx --test tests/unit/tenant-management-authorization.test.ts

      - name: Verify commercial release is fail-closed
        run: node --import tsx tests/unit/saas-release-gate.test.ts

      - name: Browser connectivity and public identity contracts
        run: node --import tsx tests/unit/connectivity-probe.test.ts && node tests/unit/institutional-contact-ui.test.mjs

      - name: Persistent zero-to-value onboarding projection
        run: node --import tsx tests/unit/saas-onboarding-progress.test.ts

      - name: Server-backed onboarding UI contract
        run: node --import tsx --test tests/unit/onboarding-progress-ui.test.tsx

      - name: Acceptance journey + adversarial multitenant (real migrations)
        run: node --import tsx tests/unit/saas-acceptance-journey.test.ts

      - name: Cliente Zero — funil externo ponta a ponta (duas clínicas)
        run: node --import tsx tests/unit/cliente-zero-journey.test.ts

      - name: Gate de billing de /members não bloqueia GET/DELETE (LTB-15)
        run: node --import tsx tests/unit/tenant-members-billing-gate.test.ts

      - name: Trilha de auditoria da própria clínica (AUTHZ-P1-10)
        run: node --import tsx tests/unit/tenant-audit-trail.test.ts

      - name: Contrato operacional Asaas fail-closed
        run: node --import tsx tests/unit/asaas-operational-contract.test.ts

      - name: Contrato operacional Resend fail-closed
        run: node --import tsx tests/unit/resend-operational-contract.test.ts

      - name: Smoke cliente-zero publicado (sondas sem efeito, onboarding do servidor)
        run: node --import tsx tests/unit/cliente-zero-published-smoke.test.ts

      - name: TypeScript
        run: npm run check
