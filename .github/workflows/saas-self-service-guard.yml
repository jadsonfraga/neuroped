      - "tests/unit/onboarding-progress-ui.test.tsx"
      - "tests/unit/migration-prefix-guard.test.mjs"
      - "tests/unit/saas-loop-artifacts-static.test.mjs"
      - "tests/unit/asaas-operational-contract.test.ts"
      - "scripts/ops/asaas-operational-contract.ts"
      - "docs/ASAAS_OPERATIONAL_CONTRACT.md"
      - "tests/unit/resend-operational-contract.test.ts"
      - "tests/unit/email-verification.test.ts"
      - "scripts/ops/resend-operational-contract.ts"
      - "docs/RESEND_OPERATIONAL_CONTRACT.md"
      - "tests/unit/cliente-zero-published-smoke.test.ts"
      - "scripts/ops/cliente-zero-published-smoke.ts"
      - "docs/SMOKE_CLIENTE_ZERO.md"
      - "functions/api/auth/_mailTransport.ts"
      - "ROADMAP.md"
      - "client/src/components/ui/VisualStates.tsx"
      - "client/src/lib/connectivityProbe.ts"
      - "client/src/pages/sobre.tsx"
      - "tests/unit/connectivity-probe.test.ts"
      - "tests/unit/institutional-contact-ui.test.mjs"
      - "scripts/ops/saas-release-gate.ts"
      - "tests/unit/saas-release-gate.test.ts"
      - "DECISIONS.md"
