name: Watchdog do inventário autoral diário

on:
  workflow_run:
    workflows:
      - Inventário autoral diário NeuroPed
    types:
      - completed
  schedule:
    - cron: "35 0 * * *" # 21h35 em America/Recife — verificação noturna
    - cron: "30 11 * * *" # 08h30 em America/Recife — catch-up da manhã
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: neuroped-daily-authorial-watchdog
  cancel-in-progress: false

jobs:
  inspect-and-recover:
    name: Verificar, recuperar e confirmar produção
    runs-on: ubuntu-latest
    # Com concurrency, a recuperação pode aguardar até um gerador de 60 min e
    # depois consumir seus próprios 60 min; os mirrors usam até mais 15 min.
    timeout-minutes: 150

    steps:
      - name: Checkout do main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolver data efetiva da execução observada
        id: date
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event || '' }}
          TRIGGER_CREATED_AT: ${{ github.event.workflow_run.created_at || '' }}
        run: |
          set -euo pipefail
          today="$(TZ=America/Recife date +%F)"
          effective_date="$today"
          date_source="recife-clock"
          skip=false

          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            [ -n "${TRIGGER_RUN_ID:-}" ] || {
              echo "::error::workflow_run sem identificador da execução de origem."
              exit 1
            }
            artifacts_json="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${TRIGGER_RUN_ID}/artifacts?per_page=100")"
            mapfile -t artifact_dates < <(
              jq -r '
                [.artifacts[]
                  | select(.expired == false)
                  | .name
                  | try capture("^inventario-autoral-(?<date>[0-9]{4}-[0-9]{2}-[0-9]{2})-[0-9]+$").date catch empty]
                | unique[]
              ' <<<"$artifacts_json"
            )

            if [ "${#artifact_dates[@]}" -eq 1 ]; then
              effective_date="${artifact_dates[0]}"
              date_source="workflow-run-artifact"
            elif [ "${#artifact_dates[@]}" -gt 1 ]; then
              echo "::error::A execução $TRIGGER_RUN_ID publicou artefatos para mais de uma data clínica."
              exit 1
            elif [ "${TRIGGER_EVENT:-}" = "schedule" ] && [ -n "${TRIGGER_CREATED_AT:-}" ]; then
              effective_date="$(TZ=America/Recife date --date="$TRIGGER_CREATED_AT" +%F)"
              date_source="scheduled-run-created-at"
            else
              # O GitHub não expõe os inputs de workflow_dispatch na API da run.
              # Sem artefato não há como atribuir com segurança uma data manual;
              # a própria geração registra a falha e o watchdog diário permanece
              # responsável pelo dia corrente, sem criar incidente falso de backfill.
              skip=true
              date_source="unattributed-workflow-run"
              echo "::notice::Execução $TRIGGER_RUN_ID sem artefato/data atribuível; workflow_run ignorado."
            fi
          fi

          if [ "$skip" != "true" ]; then
            EFFECTIVE_DATE="$effective_date" node <<'NODE'
          const date = process.env.EFFECTIVE_DATE ?? "";
          const parsed = new Date(`${date}T00:00:00Z`);
          if (
            !/^\d{4}-\d{2}-\d{2}$/.test(date) ||
            Number.isNaN(parsed.getTime()) ||
            parsed.toISOString().slice(0, 10) !== date
          ) {
            console.error(`Data efetiva inválida: ${date}`);
            process.exit(1);
          }
          NODE
          fi

          current=false
          if [ "$skip" != "true" ] && [ "$effective_date" = "$today" ]; then
            current=true
          fi
          echo "NEUROPED_GENERATION_DATE=$effective_date" >> "$GITHUB_ENV"
          echo "NEUROPED_TODAY=$today" >> "$GITHUB_ENV"
          echo "effective=$effective_date" >> "$GITHUB_OUTPUT"
          echo "today=$today" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "source=$date_source" >> "$GITHUB_OUTPUT"
          echo "Data efetiva=$effective_date · hoje=$today · fonte=$date_source · ignorar=$skip"

      - name: Criar verificador local do catálogo
        run: |
          cat > /tmp/check-daily-inventory.mjs <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const date = process.env.NEUROPED_GENERATION_DATE;
          const root = process.argv[2] || "client/src/data/daily-authorial";
          const jsonFiles = [];
          const visit = (entry) => {
            if (!fs.existsSync(entry)) return;
            for (const child of fs.readdirSync(entry, { withFileTypes: true })) {
              const candidate = path.join(entry, child.name);
              if (child.isDirectory()) visit(candidate);
              else if (child.isFile() && child.name.endsWith(".json")) jsonFiles.push(candidate);
            }
          };
          visit(root);
          const matches = jsonFiles
            .flatMap((file) => {
              try {
                return [{ file, record: JSON.parse(fs.readFileSync(file, "utf8")) }];
              } catch {
                return [];
              }
            })
            .filter(({ record }) => record.generatedOn === date);

          const current = matches[0];
          const contingency = Boolean(
            current &&
              (current.record.contingency === true ||
                String(current.record.generation?.model ?? "").startsWith("fallback-")),
          );
          const structurallyValid = Boolean(
            current &&
              current.record.schemaVersion === "1.0.0" &&
              current.record.sourceType === "autoral_diario" &&
              current.record.validationStatus === "nao_validado_psicometricamente" &&
              current.record.scoring?.totalScoreEnabled === false &&
              Array.isArray(current.record.domains) &&
              current.record.domains.length >= 3 &&
              Array.isArray(current.record.items) &&
              current.record.items.length >= 12,
          );

          console.log(
            JSON.stringify({
              date,
              count: matches.length,
              exists: matches.length === 1,
              structurallyValid,
              contingency,
              file: current?.file ?? null,
              model: current?.record.generation?.model ?? null,
              title: current?.record.title ?? null,
            }),
          );
          NODE

      - name: Ler estado inicial
        id: initial
        if: steps.date.outputs.skip != 'true'
        run: |
          node /tmp/check-daily-inventory.mjs | tee /tmp/inventory-state.json
          echo "exists=$(jq -r '.exists' /tmp/inventory-state.json)" >> "$GITHUB_OUTPUT"
          echo "valid=$(jq -r '.structurallyValid' /tmp/inventory-state.json)" >> "$GITHUB_OUTPUT"
          echo "contingency=$(jq -r '.contingency' /tmp/inventory-state.json)" >> "$GITHUB_OUTPUT"

      - name: Disparar recuperação quando o inventário estiver ausente ou inválido
        id: dispatch
        if: steps.date.outputs.skip != 'true' && (steps.initial.outputs.exists != 'true' || steps.initial.outputs.valid != 'true') && github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "dispatched_at=$dispatched_at" >> "$GITHUB_OUTPUT"
          echo "Inventário ausente ou inválido; disparando geração em esforço máximo."
          gh workflow run daily-authorial-inventory.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f date="$NEUROPED_GENERATION_DATE" \
            -f reasoning_effort=max \
            -f force=false

      - name: Tentar promoção quando houver apenas contingência
        if: steps.date.outputs.skip != 'true' && steps.initial.outputs.exists == 'true' && steps.initial.outputs.valid == 'true' && steps.initial.outputs.contingency == 'true' && github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Contingência válida detectada; solicitando promoção para GPT-5.6."
          gh workflow run daily-authorial-inventory.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f date="$NEUROPED_GENERATION_DATE" \
            -f reasoning_effort=max \
            -f force=false

      - name: Localizar e aguardar a execução de recuperação
        id: recovery
        if: steps.date.outputs.skip != 'true' && (steps.initial.outputs.exists != 'true' || steps.initial.outputs.valid != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          DISPATCHED_AT: ${{ steps.dispatch.outputs.dispatched_at || '' }}
        run: |
          set -euo pipefail
          run_id="${TRIGGER_RUN_ID:-}"
          if [ -z "$run_id" ]; then
            [ -n "${DISPATCHED_AT:-}" ] || {
              echo "::error::A recuperação não possui execução disparada nem workflow_run de origem."
              exit 1
            }
            for attempt in $(seq 1 30); do
              runs_json="$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow daily-authorial-inventory.yml \
                --event workflow_dispatch \
                --branch main \
                --limit 30 \
                --json databaseId,createdAt)"
              run_id="$(jq -r --arg marker "$DISPATCHED_AT" \
                '[.[] | select(.createdAt >= $marker)] | sort_by(.createdAt) | last | .databaseId // empty' \
                <<<"$runs_json")"
              [ -n "$run_id" ] && break
              sleep 5
            done
          fi
          [ -n "$run_id" ] || {
            echo "::error::Não foi possível localizar a execução de recuperação disparada."
            exit 1
          }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Execução de recuperação localizada: $run_id"

          for attempt in $(seq 1 360); do
            run_json="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" \
              --json status,conclusion,url)"
            status="$(jq -r '.status' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            echo "Tentativa $attempt/360: status=$status conclusion=${conclusion:-pendente}"
            if [ "$status" = "completed" ]; then
              echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
              echo "url=$(jq -r '.url' <<<"$run_json")" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 20
          done
          [ "${status:-}" = "completed" ] || {
            echo "::error::A execução de recuperação não terminou dentro da janela do watchdog."
            exit 1
          }

      - name: Classificar catálogo publicado ou pacote aguardando revisão
        id: catalog
        if: steps.date.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ steps.recovery.outputs.run_id || '' }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          node /tmp/check-daily-inventory.mjs | tee /tmp/inventory-final.json
          exists="$(jq -r '.exists' /tmp/inventory-final.json)"
          valid="$(jq -r '.structurallyValid' /tmp/inventory-final.json)"
          contingency="$(jq -r '.contingency' /tmp/inventory-final.json)"
          model="$(jq -r '.model // "desconhecido"' /tmp/inventory-final.json)"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
          echo "contingency=$contingency" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          if [ "$exists" = "true" ] && [ "$valid" = "true" ]; then
            echo "state=production" >> "$GITHUB_OUTPUT"
            echo "Inventário válido já está na main; a produção será verificada."
            exit 0
          fi

          [ -n "${RECOVERY_RUN_ID:-}" ] || {
            echo "::error::Main inválida e nenhuma execução de recuperação foi localizada."
            exit 1
          }

          artifacts_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_RUN_ID}/artifacts?per_page=100")"
          artifact_name="$(jq -r --arg prefix "inventario-autoral-${NEUROPED_GENERATION_DATE}-" \
            '[.artifacts[] | select(.expired == false and (.name | startswith($prefix)))] | sort_by(.created_at) | last | .name // empty' \
            <<<"$artifacts_json")"
          [ -n "$artifact_name" ] || {
            echo "::error::A execução $RECOVERY_RUN_ID não preservou artefato válido para ${NEUROPED_GENERATION_DATE}."
            exit 1
          }
          rm -rf /tmp/daily-review-artifact /tmp/daily-review-branch
          mkdir -p /tmp/daily-review-artifact /tmp/daily-review-branch
          gh run download "$RECOVERY_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" --dir /tmp/daily-review-artifact
          node /tmp/check-daily-inventory.mjs /tmp/daily-review-artifact \
            | tee /tmp/inventory-artifact.json
          artifact_exists="$(jq -r '.exists' /tmp/inventory-artifact.json)"
          artifact_valid="$(jq -r '.structurallyValid' /tmp/inventory-artifact.json)"
          [ "$artifact_exists" = "true" ] && [ "$artifact_valid" = "true" ] || {
            echo "::error::O artefato da recuperação não contém exatamente um inventário estruturalmente válido."
            exit 1
          }

          branch="automation/daily-authorial-${NEUROPED_GENERATION_DATE}"
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" || {
            echo "::error::O artefato foi gerado, mas a branch de revisão $branch não foi publicada."
            exit 1
          }
          review_branch_commit="$(git rev-parse "refs/remotes/origin/$branch")"
          git archive "refs/remotes/origin/$branch" client/src/data/daily-authorial \
            | tar -x -C /tmp/daily-review-branch
          node /tmp/check-daily-inventory.mjs \
            /tmp/daily-review-branch/client/src/data/daily-authorial \
            | tee /tmp/inventory-branch.json
          branch_exists="$(jq -r '.exists' /tmp/inventory-branch.json)"
          branch_valid="$(jq -r '.structurallyValid' /tmp/inventory-branch.json)"
          [ "$branch_exists" = "true" ] && [ "$branch_valid" = "true" ] || {
            echo "::error::A branch de revisão não contém exatamente um inventário válido para a data."
            exit 1
          }

          artifact_file="$(jq -r '.file' /tmp/inventory-artifact.json)"
          branch_file="$(jq -r '.file' /tmp/inventory-branch.json)"
          artifact_sha="$(sha256sum "$artifact_file" | awk '{print $1}')"
          branch_file_sha="$(sha256sum "$branch_file" | awk '{print $1}')"
          [ "$artifact_sha" = "$branch_file_sha" ] || {
            echo "::error::Branch e artefato da recuperação não representam o mesmo inventário."
            exit 1
          }

          prs_json="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open \
            -f base=main \
            -f head="${GITHUB_REPOSITORY_OWNER}:${branch}" \
            -F per_page=100)"
          pr_matches="$(jq -c \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$branch" '
              [.[] | select(
                .base.ref == "main" and
                .base.repo.full_name == $repo and
                .head.ref == $branch and
                .head.repo.full_name == $repo
              )]
            ' <<<"$prs_json")"
          pr_count="$(jq -r 'length' <<<"$pr_matches")"
          if [ "$pr_count" -eq 0 ]; then
            # O gerador considera sucesso também quando a política do GitHub
            # bloqueia PRs criados pelo token padrão: branch + artefato + issue
            # preservam a revisão humana sem promover conteúdo para a main.
            review_title="[revisão] Inventário autoral diário — ${NEUROPED_GENERATION_DATE}"
            issues_json="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/issues" \
              -f state=open \
              -F per_page=100)"
            issue_matches="$(jq -c \
              --arg title "$review_title" \
              --arg branch "$branch" \
              --arg commit "$review_branch_commit" '
                [.[] | select(
                  (.pull_request == null) and
                  .title == $title and
                  ((.body // "") | contains("Branch de revisão: " + $branch)) and
                  ((.body // "") | contains("Commit preservado: " + $commit))
                )]
              ' <<<"$issues_json")"
            issue_count="$(jq -r 'length' <<<"$issue_matches")"
            [ "$issue_count" -eq 1 ] || {
              echo "::error::Sem PR, esperado exatamente uma issue same-repo de revisão para $branch e commit $review_branch_commit; encontradas $issue_count."
              exit 1
            }
            issue_json="$(jq -c '.[0]' <<<"$issue_matches")"
            echo "state=review_pending" >> "$GITHUB_OUTPUT"
            echo "review_valid=true" >> "$GITHUB_OUTPUT"
            echo "artifact=$artifact_name" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            echo "branch_commit=$review_branch_commit" >> "$GITHUB_OUTPUT"
            echo "pr=" >> "$GITHUB_OUTPUT"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            echo "pr_draft=none" >> "$GITHUB_OUTPUT"
            echo "review_issue=$(jq -r '.number' <<<"$issue_json")" >> "$GITHUB_OUTPUT"
            echo "review_issue_url=$(jq -r '.html_url' <<<"$issue_json")" >> "$GITHUB_OUTPUT"
            echo "model=$(jq -r '.model // "desconhecido"' /tmp/inventory-branch.json)" >> "$GITHUB_OUTPUT"
            echo "contingency=$(jq -r '.contingency' /tmp/inventory-branch.json)" >> "$GITHUB_OUTPUT"
            echo "Pacote validado; inventário aguardando revisão humana na issue #$(jq -r '.number' <<<"$issue_json")."
            exit 0
          fi
          [ "$pr_count" -eq 1 ] || {
            echo "::error::Esperado exatamente um PR same-repo para $branch; encontrados $pr_count."
            exit 1
          }
          pr_json="$(jq -c '.[0]' <<<"$pr_matches")"
          head_repository="$(jq -r '.head.repo.full_name // empty' <<<"$pr_json")"
          base_repository="$(jq -r '.base.repo.full_name // empty' <<<"$pr_json")"
          head_ref_oid="$(jq -r '.head.sha // empty' <<<"$pr_json")"
          [ "$head_repository" = "$GITHUB_REPOSITORY" ] \
            && [ "$base_repository" = "$GITHUB_REPOSITORY" ] || {
              echo "::error::O PR diário não é same-repo no repositório esperado."
              exit 1
            }
          [ "$head_ref_oid" = "$review_branch_commit" ] || {
            echo "::error::O headRefOid do PR não corresponde ao SHA da branch validada."
            exit 1
          }
          pr_draft="$(jq -r 'if (.draft | type) == "boolean" then .draft else empty end' <<<"$pr_json")"
          [ -n "$pr_draft" ] || {
            echo "::error::Não foi possível validar o estado de revisão do PR diário."
            exit 1
          }
          if [ "$pr_draft" = "false" ]; then
            echo "::notice::O PR já foi marcado como pronto, mas continua aguardando revisão/merge humano."
          fi

          echo "state=review_pending" >> "$GITHUB_OUTPUT"
          echo "review_valid=true" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "branch_commit=$review_branch_commit" >> "$GITHUB_OUTPUT"
          echo "pr=$(jq -r '.number' <<<"$pr_json")" >> "$GITHUB_OUTPUT"
          echo "pr_url=$(jq -r '.html_url' <<<"$pr_json")" >> "$GITHUB_OUTPUT"
          echo "pr_draft=$pr_draft" >> "$GITHUB_OUTPUT"
          echo "review_issue=" >> "$GITHUB_OUTPUT"
          echo "review_issue_url=" >> "$GITHUB_OUTPUT"
          echo "model=$(jq -r '.model // "desconhecido"' /tmp/inventory-branch.json)" >> "$GITHUB_OUTPUT"
          echo "contingency=$(jq -r '.contingency' /tmp/inventory-branch.json)" >> "$GITHUB_OUTPUT"
          echo "Pacote validado; inventário aguardando revisão humana no PR $(jq -r '.number' <<<"$pr_json")."

      - name: Verificar revisão publicada em Cloudflare e Vercel
        id: production
        if: steps.date.outputs.current == 'true' && steps.catalog.outputs.state == 'production'
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          cloudflare=false
          vercel=false

          if curl -fsSL "https://neuroped.pages.dev/deploy-check.json?watchdog=${GITHUB_RUN_ID}" \
              -o /tmp/cloudflare-watchdog.json \
            && jq -e --arg sha "$sha" '.provider == "cloudflare-pages" and .commit == $sha' \
              /tmp/cloudflare-watchdog.json >/dev/null; then
            cloudflare=true
          fi

          if curl -fsSL "https://superneuroped.vercel.app/deploy-check.json?watchdog=${GITHUB_RUN_ID}" \
              -o /tmp/vercel-watchdog.json \
            && jq -e --arg sha "$sha" '.provider == "vercel" and (.commit == $sha or .commit == ($sha[0:12]))' \
              /tmp/vercel-watchdog.json >/dev/null; then
            vercel=true
          fi

          echo "cloudflare=$cloudflare" >> "$GITHUB_OUTPUT"
          echo "vercel=$vercel" >> "$GITHUB_OUTPUT"
          echo "Cloudflare=$cloudflare · Vercel=$vercel · main=$sha"

      - name: Disparar sincronização independente quando a produção estiver atrasada
        if: steps.date.outputs.current == 'true' && steps.catalog.outputs.state == 'production' && (steps.production.outputs.cloudflare != 'true' || steps.production.outputs.vercel != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run daily-authorial-static-sync.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f expected_commit="${{ steps.production.outputs.sha }}"
          echo "Sincronização estática independente disparada."

      - name: Aguardar confirmação da produção
        if: steps.date.outputs.current == 'true' && steps.catalog.outputs.state == 'production' && (steps.production.outputs.cloudflare != 'true' || steps.production.outputs.vercel != 'true')
        run: |
          set -euo pipefail
          sha="${{ steps.production.outputs.sha }}"
          for attempt in $(seq 1 45); do
            sleep 20
            cloudflare=false
            vercel=false
            if curl -fsSL "https://neuroped.pages.dev/deploy-check.json?run=${GITHUB_RUN_ID}&attempt=$attempt" \
                -o /tmp/cloudflare-watchdog.json \
              && jq -e --arg sha "$sha" '.provider == "cloudflare-pages" and .commit == $sha' \
                /tmp/cloudflare-watchdog.json >/dev/null; then
              cloudflare=true
            fi
            if curl -fsSL "https://superneuroped.vercel.app/deploy-check.json?run=${GITHUB_RUN_ID}&attempt=$attempt" \
                -o /tmp/vercel-watchdog.json \
              && jq -e --arg sha "$sha" '.provider == "vercel" and (.commit == $sha or .commit == ($sha[0:12]))' \
                /tmp/vercel-watchdog.json >/dev/null; then
              vercel=true
            fi
            echo "Tentativa $attempt/45: Cloudflare=$cloudflare · Vercel=$vercel"
            if [ "$cloudflare" = "true" ] && [ "$vercel" = "true" ]; then
              exit 0
            fi
          done
          echo "::error::Produção não confirmou o commit atual após a autorrecuperação."
          exit 1

      - name: Resumo do watchdog
        if: always()
        run: |
          {
            echo "## Watchdog NeuroPed"
            echo ""
            echo "- **Data efetiva:** ${{ steps.date.outputs.effective || 'não confirmada' }}"
            echo "- **Data corrente em Recife:** ${{ steps.date.outputs.today || 'não confirmada' }}"
            echo "- **Fonte da data:** ${{ steps.date.outputs.source || 'não confirmada' }}"
            echo "- **Data pertence ao dia corrente:** ${{ steps.date.outputs.current || 'false' }}"
            echo "- **Workflow ignorado:** ${{ steps.date.outputs.skip || 'false' }}"
            echo "- **Estado:** ${{ steps.catalog.outputs.state || 'não confirmado' }}"
            echo "- **Inventário válido na main:** ${{ steps.catalog.outputs.valid || 'não confirmado' }}"
            echo "- **Pacote de revisão íntegro:** ${{ steps.catalog.outputs.review_valid || 'não necessário' }}"
            echo "- **Modelo:** ${{ steps.catalog.outputs.model || 'não confirmado' }}"
            echo "- **Contingência:** ${{ steps.catalog.outputs.contingency || 'não confirmado' }}"
            echo "- **Execução de recuperação:** ${{ steps.recovery.outputs.url || 'não necessária' }}"
            echo "- **Artefato auditado:** ${{ steps.catalog.outputs.artifact || 'não necessário' }}"
            echo "- **Branch de revisão:** ${{ steps.catalog.outputs.branch || 'não necessária' }}"
            echo "- **Commit da branch:** ${{ steps.catalog.outputs.branch_commit || 'não necessário' }}"
            echo "- **PR de revisão:** ${{ steps.catalog.outputs.pr_url || 'não necessário' }}"
            echo "- **Issue de revisão:** ${{ steps.catalog.outputs.review_issue_url || 'não necessária' }}"
            echo "- **Commit main:** ${{ steps.production.outputs.sha || github.sha }}"
            echo "- **Cloudflare inicial:** ${{ steps.production.outputs.cloudflare || 'não confirmado' }}"
            echo "- **Vercel inicial:** ${{ steps.production.outputs.vercel || 'não confirmado' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fechar incidente anterior em caso de recuperação
        if: success() && steps.date.outputs.skip != 'true' && steps.date.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="[automação] Watchdog diário NeuroPed — recuperação incompleta"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            if [ "${{ steps.catalog.outputs.state }}" = "review_pending" ]; then
              if [ -n "${{ steps.catalog.outputs.pr }}" ]; then
                body="A recuperação gerou e validou artefato, branch e PR; o inventário está aguardando revisão humana no PR #${{ steps.catalog.outputs.pr }}. Execução: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
              else
                body="A recuperação gerou e validou artefato, branch e issue rastreável; o inventário está aguardando revisão humana na issue #${{ steps.catalog.outputs.review_issue }}. Execução: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
              fi
            else
              body="Catálogo e produção foram confirmados na execução ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            fi
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" \
              --body "$body Incidente encerrado automaticamente."
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason completed
          fi

      - name: Registrar recuperação incompleta
        if: failure() && (github.event_name != 'workflow_run' || steps.date.outputs.current == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="[automação] Watchdog diário NeuroPed — recuperação incompleta"
          body="O watchdog não confirmou inventário válido na main nem um pacote de revisão íntegro (execução + artefato + branch + PR ou issue rastreável). Execução: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
