<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1a6b65"><title>Verificar NeuroPed</title><style>body{margin:0;background:#faf8f4;color:#2d2926;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:880px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #eadcc7;border-radius:28px;padding:24px;box-shadow:0 16px 40px rgba(45,41,38,.10)}h1{font:700 clamp(32px,5vw,54px)/1.04 Georgia,serif;color:#8b2e3b;margin:0 0 8px}.muted{color:#6f6963;line-height:1.6}.btn{border:0;border-radius:14px;background:#1a6b65;color:#fff;font-weight:900;padding:13px 16px;margin:6px;cursor:pointer;text-decoration:none;display:inline-block}.gold{background:#b8963e}pre{background:#2d2926;color:#faf8f4;border-radius:16px;padding:14px;white-space:pre-wrap}</style></head><body><main class="wrap"><section class="card"><h1>Verificar app</h1><p class="muted">Confere rotas críticas, camada visual premium final e recarga suave, sem apagar dados locais.</p><button class="btn" onclick="check()">Verificar versão</button><button class="btn gold" onclick="location.replace('./?fresh='+Date.now())">Recarregar app</button><a class="btn" href="./central-atalhos.html">Central de atalhos</a><a class="btn" href="./qa-smoke-test.html">Smoke test</a><pre id="log">Aguardando verificação.</pre></section></main><script>async function ok(path){try{return await fetch(path+'?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok)}catch(e){return false}}async function txt(path){try{return await fetch(path+'?ts='+Date.now(),{cache:'no-store'}).then(r=>r.text())}catch(e){return ''}}async function check(){const out=[];function log(x){out.push(x);document.getElementById('log').textContent=out.join('\n')}const sw=await txt('./sw.js');log(sw.includes('neuroped-v27-premium-final')?'OK: cache v27 premium final encontrado':sw.includes('neuroped-v26-premium-polish')?'Atenção: ainda em v26':'Atenção: versão do cache não identificada');const routes=['./central-atalhos.html','./portal-familia-livre.html','./area-filho.html','./politica-acesso-familiar.html','./consulta.html','./comunicacao-alternativa.html','./diario-escola-terapias-v2.html','./filtro-escalas.html','./mapa-escalas.html','./manifest.json','./design-system-premium.css','./premium-experience.js','./premium-polish-overrides.css','./premium-polish.js','./AUDITORIA_VISUAL_PREMIUM.md'];for(const r of routes){log((await ok(r)?'OK: ':'FALHA: ')+r)}const css=await txt('./premium-polish-overrides.css');log(css.includes('Premium Polish Overrides')?'OK: acabamento final carregado':'Atenção: acabamento final ausente');const js=await txt('./premium-polish.js');log(js.includes('cuidado, clareza e organização')?'OK: microcopy premium carregada':'Atenção: microcopy premium ausente');const mf=await txt('./manifest.json');log(mf.includes('Central de Atalhos')?'OK: atalhos PWA atualizados':'Atenção: manifest sem Central de Atalhos')}</script></body></html>
