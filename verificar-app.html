<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1a6b65"><title>Verificar NeuroPed</title><style>body{margin:0;background:#faf8f4;color:#2d2926;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:820px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #eadcc7;border-radius:28px;padding:24px;box-shadow:0 16px 40px rgba(45,41,38,.10)}h1{font:700 clamp(32px,5vw,54px)/1.04 Georgia,serif;color:#8b2e3b;margin:0 0 8px}.muted{color:#6f6963;line-height:1.6}.btn{border:0;border-radius:14px;background:#1a6b65;color:#fff;font-weight:900;padding:13px 16px;margin:6px;cursor:pointer;text-decoration:none;display:inline-block}.gold{background:#b8963e}pre{background:#2d2926;color:#faf8f4;border-radius:16px;padding:14px;white-space:pre-wrap}</style></head><body><main class="wrap"><section class="card"><h1>Verificar app</h1><p class="muted">Confere a versão publicada e força uma recarga suave, sem apagar dados locais da família ou do médico.</p><button class="btn" onclick="check()">Verificar versão</button><button class="btn gold" onclick="location.replace('./?fresh='+Date.now())">Recarregar app</button><a class="btn" href="./qa-smoke-test.html">Abrir smoke test</a><pre id="log">Aguardando verificação.</pre></section></main><script>async function check(){const out=[];function log(x){out.push(x);document.getElementById('log').textContent=out.join('\n')}try{const sw=await fetch('./sw.js?ts='+Date.now()).then(r=>r.text());log(sw.includes('neuroped-v22-area-filho')?'OK: cache v22 encontrado':'Atenção: cache v22 não encontrado');const p=await fetch('./portal-familia-livre.html?ts='+Date.now()).then(r=>r.ok);log(p?'OK: Portal da Família livre publicado':'Falha: Portal da Família não respondeu');const a=await fetch('./area-filho.html?ts='+Date.now()).then(r=>r.ok);log(a?'OK: Área do Filho publicada':'Falha: Área do Filho não respondeu');const c=await fetch('./consulta.html?ts='+Date.now()).then(r=>r.ok);log(c?'OK: Consulta publicada':'Falha: Consulta não respondeu')}catch(e){log('Erro: '+(e.message||e))}}</script></body></html>
