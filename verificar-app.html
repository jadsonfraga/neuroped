<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e0e22"><title>Verificar NeuroPed</title><style>body{margin:0;background:#0a0a16;color:#ECEAFF;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:880px;margin:auto;padding:24px}.card{background:rgba(124,118,210,.08);border:1px solid rgba(169,164,255,.16);border-radius:28px;padding:24px;box-shadow:0 16px 40px rgba(4,3,18,.6)}h1{font:700 clamp(32px,5vw,54px)/1.04 Georgia,serif;color:#f2dca6;margin:0 0 8px}.muted{color:#b6b2e6;line-height:1.6}.btn{border:0;border-radius:14px;background:#6d6af5;color:#fff;font-weight:900;padding:13px 16px;margin:6px;cursor:pointer;text-decoration:none;display:inline-block}.gold{background:#b8963e}pre{background:#ECEAFF;color:#0a0a16;border-radius:16px;padding:14px;white-space:pre-wrap}</style><link rel="stylesheet" href="./app-polish-mobile.css">
</head><body><main class="wrap"><section class="card"><h1>Verificar app</h1><p class="muted">Confere rotas críticas, Consulta, Portal da Família, passe familiar de 4 meses e recarga suave.</p><button class="btn" onclick="check()">Verificar versão</button><button class="btn gold" onclick="location.replace('./?fresh='+Date.now())">Recarregar app</button><a class="btn" href="./central-atalhos.html">Central</a><a class="btn" href="./consulta.html">Consulta</a><a class="btn" href="./ativar-passe-familiar.html">Ativar passe</a><pre id="log">Aguardando verificação.</pre></section></main><script>async function ok(path){try{return await fetch(path+'?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok)}catch(e){return false}}async function txt(path){try{return await fetch(path+'?ts='+Date.now(),{cache:'no-store'}).then(r=>r.text())}catch(e){return ''}}async function check(){const out=[];function log(x){out.push(x);document.getElementById('log').textContent=out.join('\n')}const VERSAO='6.28.0';const CACHE_ESPERADO='neuroped-edj-v'+VERSAO;log('Versão canônica esperada: '+VERSAO);const pkg=await txt('./package.json');let pkgV='';try{pkgV=(JSON.parse(pkg||'{}').version)||''}catch(e){}log(pkgV?('OK: package.json em '+pkgV+(pkgV===VERSAO?' (alinhado)':' — Atenção: diverge de '+VERSAO)):'Atenção: versão do package.json não identificada');const sw=await txt('./sw.js');const m=sw.match(/neuroped-edj-v[0-9][^'\"]*/);log(m?(m[0]===CACHE_ESPERADO?'OK: cache do service worker em '+m[0]+' (alinhado)':'Atenção: cache '+m[0]+' diverge de '+CACHE_ESPERADO):'Atenção: cache do service worker não identificado');const routes=['./neuroped-master-vitrine.html','./neuroped-master-biblioteca.html','./central-atalhos.html','./portal-familia-livre.html','./area-filho.html','./politica-acesso-familiar.html','./consulta.html','./ativar-passe-familiar.html','./family-pass.js','./family-pass-generator.js','./family-pass-portal.js','./family-voucher.js','./family-voucher-ui.js','./comunicacao-alternativa.html','./diario-escola-terapias-v2.html','./filtro-escalas.html','./mapa-escalas.html','./manifest.json','./editorial-impact.css'];for(const r of routes){log((await ok(r)?'OK: ':'FALHA: ')+r)}const consulta=await txt('./consulta.html');log(consulta.includes('PIN master obrigatório')&&consulta.includes('Painel de consulta operacional')?'OK: Consulta exige PIN e tem painel operacional':'FALHA: Consulta não parece operacional');const gen=await txt('./family-pass-generator.js');log(gen.includes('Passe Familiar de 4 meses')&&gen.includes('setInterval')?'OK: gerador de passe robusto após PIN':'FALHA: gerador de passe não robusto');const pass=await txt('./family-pass.js');log(pass.includes('DAYS=120')||pass.includes('const DAYS=120')?'OK: passe familiar com validade de 120 dias':'FALHA: validade do passe não encontrada');const ativa=await txt('./ativar-passe-familiar.html');log(ativa.includes('Ativar acesso da família')?'OK: tela de ativação do passe existe':'FALHA: ativação de passe ausente');}</script><script src="./app-polish-mobile.js" defer></script>
</body></html>
