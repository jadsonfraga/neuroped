<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0e22">
<title>Instrumento validado — NeuroPed</title>
<style>
:root{--bg:#0a0a16;--bg-2:#0e0e22;--ink:#ECEAFF;--muted:#b6b2e6;--soft:#928ec6;--line:rgba(169,164,255,.16);
  --indigo:#6d6af5;--indigo-d:#4f46e5;--indigo-l:#a9a4ff;--gold:#e7c98b;--paper:rgba(124,118,210,.07)}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;line-height:1.55;
  background:radial-gradient(1100px 620px at 8% -8%,hsl(243 85% 56% / .26),transparent 60%),radial-gradient(1000px 640px at 102% 2%,hsl(266 80% 56% / .22),transparent 56%),linear-gradient(160deg,var(--bg),var(--bg-2) 60%,var(--bg));background-attachment:fixed}
.app{max-width:880px;margin:auto;padding:16px 14px 90px}
.top{position:sticky;top:0;z-index:9;display:flex;gap:8px;flex-wrap:wrap;margin:-16px -14px 14px;padding:12px 14px;background:rgba(14,14,34,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.btn{border:0;border-radius:13px;background:linear-gradient(180deg,var(--indigo),var(--indigo-d));color:#fff;padding:11px 14px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--indigo-l);border:1px solid var(--line)}
.btn.gold{background:linear-gradient(180deg,var(--gold),#caa56a);color:#211a08}
.hero,.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 18px 48px -24px rgba(4,3,18,.7);backdrop-filter:blur(6px)}
.hero{background:linear-gradient(155deg,#15143a,#221c52 55%,#15143a);margin-bottom:14px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:11px;border:1px solid rgba(231,201,139,.3);border-radius:14px;pointer-events:none}
.hero>*{position:relative;z-index:1}
.badge{display:inline-flex;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;margin:3px 4px 0 0}
.b-val{background:rgba(231,201,139,.16);color:#f2dca6;border:1px solid rgba(231,201,139,.3)}
.b-dom{background:rgba(109,106,245,.16);color:var(--indigo-l);border:1px solid rgba(169,164,255,.26)}
h1{font:700 clamp(24px,5vw,38px)/1.05 Georgia,serif;color:#fbf6ea;margin:8px 0 6px}
.cite{font-size:12px;color:var(--soft);margin-top:8px}
.instr{border-left:4px solid var(--gold);background:rgba(231,201,139,.1);border-radius:10px;padding:10px 12px;color:#e8dcc2;font-size:13.5px;margin-top:12px}
.item{border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.03);padding:13px;margin:10px 0}
.item h3{margin:0 0 9px;font:700 16px system-ui;color:#ece9ff}
.item .n{color:var(--indigo-l);font-weight:800;margin-right:6px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{flex:1 1 auto;min-width:72px;background:rgba(20,18,46,.6);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:9px 8px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
.opts button.on{background:linear-gradient(180deg,var(--indigo),var(--indigo-d));color:#fff;border-color:transparent}
.result{position:sticky;bottom:0;margin:14px -14px -90px;padding:14px;background:rgba(14,14,34,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.scorebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.scorebox .big{font:800 30px Georgia,serif;color:#f2dca6}
.band{flex:1;min-width:180px;border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
.band.ok{background:rgba(34,160,120,.16);color:#9be7c4;border:1px solid rgba(34,160,120,.3)}
.band.warn{background:rgba(231,201,139,.14);color:#f2dca6;border:1px solid rgba(231,201,139,.3)}
.band.risk{background:rgba(220,80,110,.16);color:#ffb3c6;border:1px solid rgba(220,80,110,.35)}
.band small{display:block;font-weight:500;color:var(--muted);margin-top:3px;font-size:12px}
.safety{margin-top:10px;border-radius:12px;padding:10px 12px;background:rgba(220,80,110,.16);color:#ffc0cf;border:1px solid rgba(220,80,110,.4);font-size:13px;font-weight:700;display:none}
.disc{font-size:12px;color:var(--soft);margin-top:10px}
.miss{font-size:12px;color:var(--soft);margin-top:6px}
</style>
<link rel="stylesheet" href="./app-polish-mobile.css">
</head>
<body>
<main class="app">
  <header class="top">
    <a class="btn ghost" href="./filtro-escalas.html">← Filtro</a>
    <a class="btn ghost" href="./mapa-escalas.html">Mapa</a>
    <button class="btn gold" id="copyBtn" type="button">Copiar resumo</button>
  </header>
  <section class="hero" id="hero"><div class="miss">Carregando instrumento…</div></section>
  <section id="items"></section>
  <div class="result" id="result"><div class="scorebox"><div class="big" id="score">—</div><div class="band warn" id="band">Responda os itens para ver o resultado.</div></div><div class="safety" id="safety"></div><div class="disc" id="disc"></div></div>
</main>
<script src="./scales-editorial.js"></script>
<script src="./scales-validados.js"></script>
<script>
(function(){
  "use strict";
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
  var list = (window.NEUROPED_VALIDATED||[]).concat((window.NEUROPED_EDITORIAL_SCALES||[]).filter(function(s){return s&&s.validated}));
  var id = (new URLSearchParams(location.search).get('id')) || location.hash.replace('#','');
  var inst = list.find(function(s){return s.id===id||s.anchor===id}) || list[0];
  var ans = {};

  if(!inst){ document.getElementById('hero').innerHTML='<div class="miss">Instrumento não encontrado.</div>'; return; }
  document.title = inst.short_title + ' — NeuroPed';
  document.getElementById('hero').innerHTML =
    '<span class="badge b-val">Instrumento validado</span><span class="badge b-dom">'+esc(inst.domain)+'</span><span class="badge b-dom">'+esc(inst.age_band)+'</span>'
    +'<h1>'+esc(inst.title)+'</h1>'
    +'<div class="cite">📚 '+esc(inst.citation||'')+'</div>'
    +(inst.instructions?'<div class="instr">'+esc(inst.instructions)+'</div>':'');

  var itemsEl = document.getElementById('items');
  itemsEl.innerHTML = inst.items.map(function(it,i){
    var q = it.q || it;
    return '<div class="item"><h3><span class="n">'+(i+1)+'.</span>'+esc(q)+'</h3><div class="opts" data-i="'+i+'">'
      + inst.options.map(function(o){ return '<button type="button" data-v="'+o.value+'">'+esc(o.label)+'</button>'; }).join('')
      + '</div></div>';
  }).join('');

  itemsEl.querySelectorAll('.opts').forEach(function(row){
    row.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        var i = row.dataset.i;
        ans[i] = Number(b.dataset.v);
        row.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
        b.classList.add('on');
        calc();
      });
    });
  });

  function answeredCount(){ return Object.keys(ans).length; }

  function calc(){
    var n = answeredCount(), total = inst.items.length;
    var scoreEl = document.getElementById('score'), bandEl = document.getElementById('band'), safe = document.getElementById('safety');
    var raw = 0, bandTxt = '', note = '', cls = 'warn';

    if (inst.score_kind === 'risk_match'){
      inst.items.forEach(function(it,i){ if (ans[i] != null && ans[i] === it.risk) raw++; });
      scoreEl.textContent = raw;
      var c = pickCut(raw); bandTxt = c.label; note = c.note; cls = c.cls;
    } else if (inst.score_kind === 'count_threshold'){
      var parts = [], anyPos = false, totalPos = 0;
      Object.keys(inst.subs).forEach(function(name){
        var sub = inst.subs[name], cnt = 0;
        for (var i = sub.from; i <= sub.to; i++){ if (ans[i] != null && ans[i] >= 2) cnt++; }
        totalPos += cnt;
        var pos = cnt >= sub.min; if (pos) anyPos = true;
        parts.push(name + ': ' + cnt + ' sintoma(s) ' + (pos ? '✓ atinge o corte (≥' + sub.min + ')' : '(corte ≥' + sub.min + ')'));
      });
      scoreEl.textContent = totalPos;
      bandTxt = anyPos ? 'Triagem positiva' : 'Abaixo do corte';
      cls = anyPos ? 'risk' : 'ok';
      note = parts.join('  ·  ') + '. Confirme com avaliação clínica e informações da escola.';
    } else { // sum
      Object.keys(ans).forEach(function(k){ raw += ans[k]; });
      scoreEl.textContent = raw;
      var cc = pickCut(raw); bandTxt = cc.label; note = cc.note; cls = cc.cls;
    }

    bandEl.className = 'band ' + cls;
    bandEl.innerHTML = '<b>' + esc(bandTxt) + '</b>' + (n < total ? ' (faltam ' + (total - n) + ' itens)' : '') + '<small>' + esc(note) + '</small>';

    // alerta de segurança (PHQ item 9)
    if (inst.safety_item != null && ans[inst.safety_item] != null && ans[inst.safety_item] >= 1){
      safe.style.display = 'block';
      safe.textContent = '⚠ Resposta positiva em item de risco (ideação/autolesão). Avalie segurança AGORA e acione protocolo clínico/rede de apoio.';
    } else safe.style.display = 'none';

    document.getElementById('disc').textContent = inst.not_normative_disclaimer || '';
  }
  function pickCut(raw){
    var cuts = inst.cutoffs || [];
    for (var i = 0; i < cuts.length; i++){ if (raw <= cuts[i].max) return cuts[i]; }
    return cuts[cuts.length-1] || { label:'—', note:'', cls:'warn' };
  }

  document.getElementById('copyBtn').addEventListener('click', function(){
    var lines = ['NeuroPed EDJ — ' + inst.title, 'Referência: ' + (inst.citation||'—'), 'Data: ' + new Date().toLocaleString('pt-BR'), ''];
    inst.items.forEach(function(it,i){ var q = it.q||it; var v = ans[i]; var lbl = '—'; (inst.options||[]).forEach(function(o){ if(o.value===v) lbl=o.label; }); lines.push((i+1)+'. '+q+' → '+lbl); });
    lines.push('', 'Resultado: ' + document.getElementById('band').textContent.replace(/\s+/g,' ').trim());
    lines.push('', 'Triagem validada; não substitui avaliação clínica. Diagnóstico é do médico responsável.');
    var txt = lines.join('\n');
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){ window.npToast ? npToast('Resumo copiado.') : alert('Resumo copiado.'); });
  });

  calc();
})();
</script>
<script src="./app-polish-mobile.js" defer></script>
</body>
</html>
