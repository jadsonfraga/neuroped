<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="./np-embed-guard.js"></script>
<meta name="theme-color" content="#0e0e22">
<meta name="robots" content="noindex">
<title>Trajetória Clínica · NeuroPed</title>
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./components.css">
<link rel="stylesheet" href="./app-skin.css">
<link rel="stylesheet" href="./ds-bridge.css">
<style>
  body{margin:0;background:var(--bg,#08080f);color:var(--text,#E5E7EB);font-family:var(--font-sans,system-ui,sans-serif)}
  .wrap{max-width:920px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
  h1{font:800 clamp(20px,4.6vw,28px)/1.1 "Fraunces",Georgia,serif;margin:6px 0 4px;background:linear-gradient(120deg,#fff,#9b7bff 70%,#7c79ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .gate{border:1px solid #f59e0b;background:rgba(245,158,11,.10);color:#fcd9a0;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:13px;line-height:1.5}
  .gate.ok{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.08);color:#a7f3d0}
  .card{border:1px solid var(--border,rgba(255,255,255,.08));border-radius:14px;padding:14px 16px;margin:12px 0;background:rgba(124,118,210,.05)}
  .card h2{font:800 14px var(--font-sans);color:#c9c4f0;margin:0 0 10px}
  .row{display:flex;align-items:center;gap:10px;margin:6px 0}
  .row .lb{width:160px;font-size:12.5px;color:var(--text-muted,#94A3B8);text-transform:capitalize}
  .bar{flex:1;height:10px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#7C3AED,#f43f5e)}
  .row .v{width:46px;text-align:right;font:700 12px system-ui;color:#c9c4f0}
  .tag{display:inline-block;font:700 11px system-ui;border-radius:999px;padding:3px 9px;margin:2px 4px 2px 0}
  .t-ok{background:rgba(16,185,129,.16);color:#6ee7b7} .t-warn{background:rgba(245,158,11,.16);color:#fcd9a0} .t-risk{background:rgba(244,63,94,.16);color:#fda4af} .t-muted{background:rgba(148,163,184,.16);color:#cbd5e1}
  .insight{border-left:3px solid #7C3AED;padding:8px 12px;margin:8px 0;background:rgba(124,58,237,.06);border-radius:0 10px 10px 0;font-size:13px}
  .insight .ev{font-size:11px;color:var(--text-muted,#94A3B8);margin-top:4px}
  .empty{color:var(--text-muted,#94A3B8);padding:18px;text-align:center}
  a.back{color:#A78BFA;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="./perfil-crianca.html">‹ Perfil</a>
  <h1>Trajetória Clínica</h1>
  <div id="gate"></div>
  <div id="out"><div class="empty">Carregando…</div></div>
</main>

<script src="./np-store.js"></script>
<script src="./scales-bundle.js"></script>
<script src="./clinical-explainability.js"></script>
<script src="./clinical-normalization.js"></script>
<script src="./clinical-timeline-engine.js"></script>
<script src="./phenotype-engine.js"></script>
<script src="./response-engine.js"></script>
<script src="./contradiction-engine.js"></script>
<script src="./clinical-decision-support.js"></script>
<script src="./clinical-visual-schema.js"></script>
<script src="./clinical-config-adapter.js"></script>
<script src="./clinical-trajectory-explain.js"></script>
<!-- carrega a config validada se existir; senão cai no rascunho de exemplo -->
<script>window.__npCfgFallback='./clinical-config.example.js';</script>
<script src="./clinical-config.js" onerror="(function(){var s=document.createElement('script');s.src=window.__npCfgFallback;document.head.appendChild(s);})()"></script>
<script>
(function(){
  'use strict';
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
  function clsOf(st){return st==='improving'?'t-ok':(st==='regressing'?'t-risk':(st==='unstable'?'t-warn':'t-muted'));}
  function pct(v){return Math.round((v||0)*100);}

  // GATE DE VALIDAÇÃO: sem config validada pelo médico, a interpretação clínica
  // (severidade/melhora/piora/fenótipo) fica DESLIGADA — só estrutura + sinal bruto.
  function gateConfig(raw){
    var validated = raw && raw._status === 'VALIDADO';
    if(validated) return { validated:true, cfg:raw };
    // strip: remove o que produz juízo clínico (polaridade, fenótipos, regras)
    return { validated:false, cfg:{ thresholds: (raw&&raw.thresholds)||undefined, cds:(raw&&raw.cds)||undefined } };
  }

  function run(){
    var C = window.NeuroPedCIL || {};
    var rawCfg = window.CLINICAL_CONFIG || window.NeuroPedClinicalConfig || {};
    var g = gateConfig(C.adaptConfig ? C.adaptConfig(rawCfg) : rawCfg);
    var out = document.getElementById('out'), gate = document.getElementById('gate');
    gate.className = g.validated ? 'gate ok' : 'gate';
    gate.innerHTML = g.validated
      ? '✅ <strong>Config clínica validada.</strong> Interpretação ligada (apoio explicável — não substitui avaliação médica).'
      : '⚠️ <strong>Interpretação clínica DESLIGADA.</strong> Aguardando <code>clinical-config.js</code> com <code>_status:"VALIDADO"</code> definido pelo médico. Exibindo apenas estrutura e sinal bruto do próprio instrumento — sem rótulo de melhora/piora nem fenótipo.';
    if(!C.Timeline){ out.innerHTML='<div class="empty">Engines clínicas não carregaram.</div>'; return; }
    var S = window.NPStore, child = S && S.active && S.active();
    var tl = C.Timeline.buildForActiveChild(g.cfg);
    var html = '';
    html += '<div class="card"><h2>Resumo</h2>'+
      '<div class="row"><span class="lb">Criança</span><b>'+esc(child&&child.name||'—')+'</b></div>'+
      '<div class="row"><span class="lb">Aplicações</span><b>'+tl.n_applications+'</b></div>'+
      '<div class="row"><span class="lb">Domínios medidos</span><b>'+(tl.domains_covered.length)+'</b></div></div>';
    if(!tl.n_applications){
      out.innerHTML = html + '<div class="card"><div class="empty">Sem aplicações salvas para esta criança. Responda escalas para a trajetória aparecer.</div></div>';
      return;
    }
    // EXPLAINABILITY — justificativa clínica legível ("por quê?")
    if(C.Explainability){
      var ex = C.Explainability.timeline(tl);
      html += '<div class="card"><h2>Leitura clínica — por quê?</h2>'+
        '<p style="font-size:14px;line-height:1.5;color:var(--text,#E5E7EB);margin:0 0 8px">'+esc(ex.summary)+'</p>';
      (ex.narratives||[]).forEach(function(it){ html += insightHTML(it); });
      html += '</div>';
    }
    var radar = C.VisualSchema.functionalRadar(tl);
    html += '<div class="card"><h2>Perfil funcional</h2>';
    radar.axes.sort(function(a,b){return (b.value||0)-(a.value||0);}).forEach(function(ax){
      html += '<div class="row"><span class="lb">'+esc(ax.domain)+'</span><span class="bar"><i style="width:'+pct(ax.value)+'%"></i></span><span class="v">'+pct(ax.value)+'%'+(ax.normalized?'':'*')+'</span></div>';
    });
    html += '<div class="ev" style="font-size:11px;color:#94A3B8;margin-top:6px">'+(g.validated?'Severidade normalizada por config.':'* sinal bruto do próprio instrumento (interpretação desligada).')+'</div></div>';
    html += '<div class="card"><h2>Trajetória por domínio</h2>';
    Object.keys(tl.domains).forEach(function(d){
      var tr = tl.domains[d].trajectory; if(!tr) return;
      var label = tr.status==='regressing'?'piora':(tr.status==='improving'?'melhora':(tr.status==='unstable'?'instável':(tr.status==='plateau'?'estável':'variação (sentido bruto)')));
      html += '<div class="row"><span class="lb">'+esc(d)+'</span><span class="tag '+clsOf(tr.status)+'">'+label+'</span><span class="v" style="width:auto;color:#94A3B8;font-weight:600">'+tr.n+' apl.</span></div>';
    });
    html += '</div>';
    var ph = C.Phenotype.detectPhenotypes(tl.signals, g.cfg);
    html += '<div class="card"><h2>Convergência de perfil</h2>';
    if(ph.meta && ph.meta.status){ html += '<div class="empty">'+esc(ph.meta.explanation||'Fenotipagem requer config validada.')+'</div>'; }
    else if(!ph.phenotypes || !ph.phenotypes.length){ html += '<div class="empty">Sem sinais normalizados suficientes.</div>'; }
    else { ph.phenotypes.slice(0,4).forEach(function(p){ html += '<div class="row"><span class="lb">'+esc(p.label)+'</span><span class="bar"><i style="width:'+pct(p.score)+'%"></i></span><span class="v">'+pct(p.score)+'%</span></div>'; }); (ph.insights||[]).forEach(function(it){ html += insightHTML(it); }); }
    html += '</div>';
    var con = C.Contradiction.detect(tl.signals, g.cfg);
    var cds = C.DecisionSupport.suggest({ timeline: tl }, g.cfg);
    var alerts = (con.contradictions||[]).concat(cds.suggestions||[]);
    html += '<div class="card"><h2>Sinais e sugestões (explicáveis)</h2>';
    if(!alerts.length) html += '<div class="empty">Nada a sinalizar com os dados/config atuais.</div>';
    alerts.forEach(function(it){ html += insightHTML(it); });
    html += '</div>';
    out.innerHTML = html;
  }
  function insightHTML(it){
    if(!it || !it.insight) return '';
    var ev = (it.evidence||[]).map(function(e){return esc((e.source||'?'))+(e.domain?(' · '+esc(e.domain)):'')+(e.signal!=null?(' ('+Math.round(e.signal*100)/100+')'):'');}).join(' | ');
    return '<div class="insight">'+esc(it.insight)+'<div class="ev">evidência: '+(ev||'—')+' · confiança '+(it.confidence_label||'—')+'</div></div>';
  }
  function ready(){ return window.NeuroPedCIL && window.NeuroPedCIL.Timeline; }
  if(ready()) run(); else { var n=0, iv=setInterval(function(){ if(ready()||n++>100){ clearInterval(iv); run(); } }, 50); }
})();
</script>
<script src="./app-frame.js" defer></script>
</body>
</html>
