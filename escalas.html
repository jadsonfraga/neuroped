  /* Redirect page. Consome apenas tokens.css. */
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    text-align: center;
    padding: var(--space-6);
  }
  .escalas-redirect-card { max-width: 420px; }
  .escalas-redirect-sp {

    animation: escalasSpin var(--motion-slow) linear infinite;
  }
  @keyframes escalasSpin { to { transform: rotate(360deg); } }
  .escalas-redirect-title {
    font: var(--weight-semibold) var(--t-h1-size)/var(--t-h1-lh) var(--font-sans);

    margin: 0 0 var(--space-1);
  }
  .escalas-redirect-body {
    color: var(--text);
    font: var(--weight-regular) var(--t-body-size)/var(--t-body-lh) var(--font-sans);
    margin: var(--space-2) 0;
  }
  .escalas-redirect-link { color: var(--primary); font-weight: var(--weight-semibold); }
  .escalas-redirect-muted {
    font: var(--weight-regular) var(--t-label-size)/var(--t-label-lh) var(--font-sans);
    color: var(--text-muted);
    margin-top: var(--space-4);
  }
  @media (prefers-reduced-motion: reduce) { .escalas-redirect-sp { animation: none; } }
</style>
