services:
  - type: web
    name: neuroped-api
    runtime: node
    region: oregon

    # O script de build unificado jÃ¡ compila frontend + backend via tsx script/build.ts
    # No Render, compilamos apenas o servidor (frontend vai para GitHub Pages)
    buildCommand: npm install && npm run build
    startCommand: node dist/index.cjs

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000


      # NEUROPED_JWT_SECRET: string aleatoria longa (minimo 64 chars)
      # Gere com: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - key: NEUROPED_JWT_SECRET
        sync: false

      # DATABASE_URL: string de conexÃ£o PostgreSQL (Neon, Supabase, etc.)
      # Exemplo: postgresql://user:pass@host/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false

      # FRONTEND_URL: URL do GitHub Pages para configurar CORS
      - key: FRONTEND_URL
        value: https://jadsonfraga.github.io

    healthCheckPath: /api/health

    # Plano gratuito â€” pode ter cold start de ~30s apÃ³s inatividade
    plan: free

    # Auto-deploy a cada push para main
    autoDeploy: yes
