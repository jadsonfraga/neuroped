<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Clinical Intelligence Engine · NeuroPed</title>
    <link rel="stylesheet" href="./tokens.css">
    <link rel="stylesheet" href="./ds-tokens.css">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./np-cards.css">
    <style>
        body {
            background: var(--aurora-base);
            color: var(--text);
            min-height: 100vh;
        }

        .engine-header {
            padding: var(--space-8) 0 var(--space-6);
            text-align: center;
        }

        .engine-title {
            font-size: clamp(24px, 5vw, 32px);
            margin-bottom: var(--space-2);
            background: linear-gradient(135deg, var(--text-strong), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-container {
            max-width: 720px;
            margin: 0 auto var(--space-8);
            position: sticky;
            top: var(--space-4);
            z-index: var(--z-sticky);
        }

        .search-box {
            background: var(--surface-glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: var(--space-2);
            display: flex;
            align-items: center;
            gap: var(--space-3);
            box-shadow: var(--shadow-drama);
            transition: all var(--motion-base) var(--motion-ease);
        }

        .search-box:focus-within {
            border-color: var(--primary);
            box-shadow: var(--shadow-card-hover);
            transform: translateY(-2px);
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: var(--space-3) var(--space-4);
            color: var(--text-strong);
            font-size: 17px;
            outline: none;
        }

        .search-input::placeholder {
            color: var(--text-soft);
        }

        .context-chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: var(--space-4);
        }

        .chip {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--motion-fast) var(--motion-ease);
        }

        .chip.active {
            background: var(--primary);
            color: #fff;
            border-color: transparent;
            box-shadow: var(--shadow-glow-violet);
        }

        .results-grid {
            padding-bottom: var(--space-10);
        }

        .section-label {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--primary);
            margin-bottom: var(--space-4);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border), transparent);
        }

        /* Skeleton Animation */
        .skeleton-card {
            height: 200px;
            background: var(--surface-glass);
            border-radius: var(--radius-lg);
            position: relative;
            overflow: hidden;
        }

        .skeleton-card::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>
    <div class="main-content">
        <header class="engine-header">
            <h1 class="engine-title">Clinical Intelligence Engine</h1>
            <p class="text-muted">Busca semântica e triagem clínica inteligente para neuropediatria.</p>
        </header>

        <div class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Ex: criança agitada, dificuldade na fala, TDAH..." autocomplete="off">
            </div>
            <div class="context-chips" id="contextChips">
                <!-- Chips gerados dinamicamente -->
            </div>
        </div>

        <section id="recommendedSection" style="display: none;">
            <div class="section-label">Sugestões Preditivas</div>
            <div class="results-grid np-cards-grid" id="recommendedResults"></div>
        </section>

        <section id="allSection">
            <div class="section-label">Instrumentos Clínicos</div>
            <div class="results-grid np-cards-grid" id="allResults">
                <!-- Cards de escalas -->
            </div>
        </section>
    </div>

    <script src="./scales-taxonomy.js"></script>
    <script>
        const SEARCH_DATA = [
            { id: 'mchat', title: 'M-CHAT-R/F', sub: 'TEA / Rastreio (16-30m)', c1: '#7c79ff', c2: '#4f46e5', tags: ['tea', 'fala', 'social'], age: '16-30m' },
            { id: 'snap', title: 'SNAP-IV', sub: 'TDAH / Comportamento', c1: '#f59e0b', c2: '#d97706', tags: ['tdah', 'escola', 'atencao'], age: '6-18a' },
            { id: 'sdq', title: 'SDQ-25', sub: 'Saúde Mental Geral', c1: '#10b981', c2: '#059669', tags: ['comportamento', 'emocional'], age: '3-16a' },
            { id: 'cars', title: 'CARS-2', sub: 'TEA / Gravidade', c1: '#8b5cf6', c2: '#7c3aed', tags: ['tea', 'gravidade'], age: '2a+' }
        ];

        function createCard(item) {
            return `
                <a href="./escala.html?id=${item.id}" class="np-card">
                    <div class="np-card-head">
                        <div class="np-sigla" style="--c1: ${item.c1}; --c2: ${item.c2}">${item.id.toUpperCase().slice(0,2)}</div>
                        <div class="np-card-tt">
                            <h3>${item.title}</h3>
                            <span class="np-card-sub">${item.sub}</span>
                        </div>
                    </div>
                    <div class="np-badges">
                        <span class="np-badge age">${item.age}</span>
                        ${item.tags.map(t => `<span class="np-badge">${t}</span>`).join('')}
                    </div>
                </a>
            `;
        }

        function render() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const results = SEARCH_DATA.filter(item => 
                item.title.toLowerCase().includes(query) || 
                item.sub.toLowerCase().includes(query) ||
                item.tags.some(t => t.includes(query))
            );

            document.getElementById('allResults').innerHTML = results.map(createCard).join('');
            
            // Simular lógica preditiva
            const recommended = document.getElementById('recommendedSection');
            if (query.length > 3) {
                recommended.style.display = 'block';
                document.getElementById('recommendedResults').innerHTML = results.slice(0, 2).map(createCard).join('');
            } else {
                recommended.style.display = 'none';
            }
        }

        document.getElementById('searchInput').addEventListener('input', render);
        
        // Initial render
        render();
    </script>
    <script src="./premium-motion.js"></script>
</body>
</html>
