<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#0e0e22">
<meta name="description" content="NeuroPed EDJ â€” aplicativo Ãºnico do Dr. Jadson Fraga. Casca dinÃ¢mica: cabeÃ§alho e abas fixos, conteÃºdo fluido.">
<title>NeuroPed EDJ</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --bg:#0a0a16;--bg-2:#0e0e22;--ink:#ECEAFF;--muted:#b6b2e6;--soft:#928ec6;
  --line:rgba(169,164,255,.16);--indigo:#6d6af5;--indigo-d:#4f46e5;--indigo-l:#a9a4ff;--gold:#e7c98b;
  --top:54px;--tabs:calc(62px + env(safe-area-inset-bottom,0px));
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
  color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#sh{display:flex;flex-direction:column;height:100dvh;height:100vh}

/* top bar persistente */
.sh-top{flex:0 0 auto;height:var(--top);display:flex;align-items:center;gap:10px;padding:0 16px;
  padding-top:env(safe-area-inset-top,0px);height:calc(var(--top) + env(safe-area-inset-top,0px));
  background:linear-gradient(180deg,#15143a,#0e0e22);border-bottom:1px solid var(--line);
  box-shadow:0 6px 22px -14px rgba(0,0,0,.7);z-index:5}
.sh-top .seal{width:30px;height:30px;border-radius:9px;border:1.5px solid rgba(231,201,139,.8);display:grid;place-items:center;font:700 14px Georgia,serif;color:var(--gold);flex:0 0 auto}
.sh-top .wm{font:700 16px Georgia,serif;color:#fbf6ea;letter-spacing:.01em}
.sh-top .sec{margin-left:auto;font:800 11px system-ui;text-transform:uppercase;letter-spacing:.1em;color:var(--indigo-l);
  background:rgba(109,106,245,.14);border:1px solid rgba(169,164,255,.24);border-radius:999px;padding:5px 11px}

/* palco / conteÃºdo */
.sh-stage{position:relative;flex:1 1 auto;overflow:hidden;background:var(--bg)}
#sh-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);
  opacity:1;transform:none;transition:opacity .28s ease,transform .28s cubic-bezier(.22,.8,.2,1)}
#sh.loading #sh-frame{opacity:.2;transform:translateY(10px) scale(.992)}
/* splash de entrada da casca */
#sh-splash{position:fixed;inset:0;z-index:60;display:grid;place-items:center;align-content:center;gap:16px;
  background:radial-gradient(700px 380px at 50% 32%,hsl(243 85% 56% / .28),transparent 60%),linear-gradient(160deg,#0a0a16,#15143a 60%,#0a0a16);
  transition:opacity .55s ease,visibility .55s}
#sh-splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#sh-splash .seal{width:86px;height:86px;border-radius:22px;border:2px solid rgba(231,201,139,.85);display:grid;place-items:center;
  font:700 36px Georgia,serif;color:#f2dca6;box-shadow:0 0 0 1px rgba(231,201,139,.25),0 18px 50px -12px rgba(0,0,0,.6);animation:shpop .7s cubic-bezier(.16,1,.3,1) both}
#sh-splash .wm{font:700 24px Georgia,serif;color:#fbf6ea;animation:shrise .8s .12s both}
#sh-splash .sub{font:600 11px system-ui;letter-spacing:.22em;text-transform:uppercase;color:#cdbf9a;margin-top:-8px;animation:shrise .8s .2s both}
#sh-splash .bar{width:120px;height:4px;border-radius:9px;background:rgba(169,164,255,.18);overflow:hidden;margin-top:4px}
#sh-splash .bar i{display:block;height:100%;width:42%;border-radius:9px;background:linear-gradient(90deg,transparent,#a9a4ff,transparent);animation:shbar 1.1s ease-in-out infinite}
@keyframes shpop{from{opacity:0;transform:scale(.7) rotate(-6deg)}to{opacity:1;transform:none}}
@keyframes shrise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shbar{0%{transform:translateX(-120%)}100%{transform:translateX(360%)}}
@media(prefers-reduced-motion:reduce){#sh-splash .seal,#sh-splash .wm,#sh-splash .sub,#sh-splash .bar i{animation:none}}
.sh-load{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(700px 380px at 50% 30%,rgba(109,106,245,.18),transparent 60%),var(--bg);z-index:2}
#sh.loading .sh-load{display:flex}
.sh-spin{width:42px;height:42px;border-radius:50%;border:3px solid rgba(169,164,255,.25);border-top-color:var(--indigo-l);animation:shspin .8s linear infinite}
@keyframes shspin{to{transform:rotate(360deg)}}
.sh-load .lb{font:700 13px system-ui;color:var(--soft);letter-spacing:.04em}

/* barra de abas persistente */
.sh-tabs{flex:0 0 auto;display:flex;align-items:stretch;height:var(--tabs);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:linear-gradient(0deg,#0a0a16,#12122a);border-top:1px solid var(--line);
  box-shadow:0 -8px 24px -16px rgba(0,0,0,.8);z-index:5}
.sh-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:0;cursor:pointer;color:var(--soft);font:800 10.5px system-ui;letter-spacing:.02em;
  position:relative;transition:color .2s;-webkit-tap-highlight-color:transparent}
.sh-tab svg{width:23px;height:23px;transition:transform .22s}
.sh-tab.on{color:var(--indigo-l)}
.sh-tab.on svg{transform:translateY(-1px)}
.sh-tab.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--indigo),var(--indigo-l))}
.sh-tab:active{color:#fff}
@media(prefers-reduced-motion:reduce){#sh-frame,.sh-spin,.sh-tab svg{transition:none;animation:none}}
/* marca oficial na casca (topo + splash) */
.sh-top .seal,#sh-splash .seal{overflow:hidden;padding:0}
.sh-top .seal img,#sh-splash .seal img{width:100%;height:100%;object-fit:cover;display:block}
</style>
    <link rel="stylesheet" href="./neuroped-unified.css">
    <link rel="stylesheet" href="./neuroped-polish.css">
    <script src="./neuroped-unified.js" defer></script>
</head>
<body>
<div id="sh-splash"><div class="seal"><img src="./logo-jadson.jpg" alt="" width="86" height="86" decoding="async"></div><div class="wm">NeuroPed EDJ</div><div class="sub">Neuropediatria de precisÃ£o</div><div class="bar"><i></i></div></div>
<div id="sh">
  <header class="sh-top">
    <span class="seal"><img src="./logo-jadson.jpg" alt="" width="30" height="30" decoding="async"></span>
    <span class="wm">NeuroPed EDJ</span>
    <span class="sec" id="sh-sec">InÃ­cio</span>
  </header>
  <div class="sh-stage">
    <iframe id="sh-frame" title="ConteÃºdo do aplicativo" src="about:blank"></iframe>
    <div class="sh-load"><div class="sh-spin"></div><div class="lb" id="sh-loadlb">Carregandoâ€¦</div></div>
  </div>
  <nav class="sh-tabs" id="sh-tabs" aria-label="NavegaÃ§Ã£o principal"></nav>
</div>

<script>
(function(){
  "use strict";
  var ICON = {
    inicio:'<path d="m3 11 9-8 9 8"/><path d="M5 9v11h14V9"/>',
    consulta:'<path d="M6 3v6a6 6 0 0 0 12 0V3"/><path d="M6 3H4M18 3h2"/><circle cx="18" cy="16" r="3"/><path d="M18 11v2"/>',
    escalas:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/>',
    biblioteca:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
    caa:'<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4L3 21l1.1-3.3A8.4 8.4 0 1 1 21 11.5Z"/>',
    familia:'<path d="M11 20A7 7 0 0 1 4 13c0-5 4-9 7-9s7 4 7 9a7 7 0 0 1-7 7Z"/><path d="M11 20v-7"/>'
  };
  var ROUTES = {
    inicio:    { url:'./central-atalhos.html',            label:'InÃ­cio' },
    escalas:   { url:'./filtro-escalas.html',             label:'Escalas' },
    biblioteca:{ url:'./neuroped-master-biblioteca.html', label:'Biblioteca' },
    caa:       { url:'./comunicacao-alternativa.html',    label:'CAA' },
    familia:   { url:'./portal-familia-livre.html',       label:'FamÃ­lia' }
  };
  var ORDER = ['inicio','escalas','biblioteca','caa','familia'];
  // mapa arquivo -> rota (sincroniza a aba quando navega dentro do quadro)
  var FILE2KEY = {
    'central-atalhos.html':'inicio','index.html':'inicio','':'inicio',
    'filtro-escalas.html':'escalas','mapa-escalas.html':'escalas','escalas.html':'escalas',
    'neuroped-master-biblioteca.html':'biblioteca','neuroped-master-vitrine.html':'biblioteca',
    'solicitar-neuroped-master.html':'biblioteca','gerador-cards.html':'biblioteca',
    'comunicacao-alternativa.html':'caa',
    'portal-familia-livre.html':'familia','area-filho.html':'familia'
  };

  var sh = document.getElementById('sh');
  var frame = document.getElementById('sh-frame');
  var tabsEl = document.getElementById('sh-tabs');
  var secEl = document.getElementById('sh-sec');
  var loadlb = document.getElementById('sh-loadlb');
  var curKey = null;

  // monta as abas
  ORDER.forEach(function(k){
    var b = document.createElement('button');
    b.className = 'sh-tab'; b.type = 'button'; b.dataset.key = k;
    b.setAttribute('aria-label', ROUTES[k].label);
    b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICON[k]+'</svg><span>'+ROUTES[k].label+'</span>';
    b.addEventListener('click', function(){ go(k, true); });
    tabsEl.appendChild(b);
  });

  function setActive(k){
    curKey = k;
    Array.prototype.forEach.call(tabsEl.children, function(b){
      var on = b.dataset.key === k; b.classList.toggle('on', on);
      if (on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
    });
    if (ROUTES[k]) secEl.textContent = ROUTES[k].label;
  }
  function showLoader(label){ if(loadlb) loadlb.textContent = label || 'Carregandoâ€¦'; sh.classList.add('loading'); }
  function hideLoader(){ sh.classList.remove('loading'); }

  function go(k, push){
    if (!ROUTES[k]) k = 'inicio';
    setActive(k);
    showLoader(ROUTES[k].label);
    var target = ROUTES[k].url;
    // sÃ³ recarrega o quadro se for outra ferramenta
    var cur = '';
    try { cur = frame.contentWindow.location.pathname.split('/').pop().toLowerCase(); } catch(e){}
    var want = target.split('/').pop().toLowerCase();
    if (cur !== want) frame.src = target; else hideLoader();
    if (push && location.hash.slice(1) !== k) { try{ history.pushState(null,'','#'+k); }catch(e){ location.hash = k; } }
  }

  // sincroniza a aba quando o usuÃ¡rio navega DENTRO do quadro (mesma origem)
  function hideSplash(){ var sp=document.getElementById('sh-splash'); if(sp) sp.classList.add('hide'); }
  frame.addEventListener('load', function(){
    hideLoader(); hideSplash();
    try {
      var file = frame.contentWindow.location.pathname.split('/').pop().toLowerCase();
      var k = FILE2KEY[file];
      if (k){ setActive(k); if (location.hash.slice(1) !== k) { try{ history.replaceState(null,'','#'+k); }catch(e){} } }
      // tÃ­tulo da seÃ§Ã£o a partir do documento
      var t = (frame.contentWindow.document && frame.contentWindow.document.title) || '';
      if (t && !k) secEl.textContent = t.split('â€”')[0].split('Â·')[0].trim().slice(0,22);
    } catch(e){}
  });
  // seguranÃ§a: esconde loader se demorar
  frame.addEventListener('error', hideLoader);

  window.addEventListener('hashchange', function(){ var k = location.hash.slice(1); if (ROUTES[k] && k !== curKey) go(k, false); });

  var initial = location.hash.slice(1);
  go(ROUTES[initial] ? initial : 'inicio', false);
  setTimeout(hideSplash, 2600); // seguranÃ§a: nunca trava no splash

  // registra o service worker (mesma origem) + forÃ§a checagem de atualizaÃ§Ã£o
  if ('serviceWorker' in navigator) {
    try {
      navigator.serviceWorker.register('./sw.js').then(function(reg){
        reg.update();
        setInterval(function(){ reg.update(); }, 60000);
      });
      var swReloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if (swReloaded) return; swReloaded = true;
        window.location.reload();
      });
    } catch(e){}
  }
})();
</script>
</body>
</html>
