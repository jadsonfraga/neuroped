<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NeuroPed — Offline</title>
  <style>
    body{font-family:Inter,system-ui,sans-serif;min-height:100vh;margin:0;display:grid;place-items:center;background:#f8fafc;color:#0f172a}.card{max-width:460px;margin:1rem;padding:2rem;border:1px solid #cbd5e1;border-radius:24px;background:white;box-shadow:0 20px 50px rgba(15,23,42,.08)}h1{margin:0 0 .5rem;color:#0f766e}.badge{display:inline-block;border-radius:999px;background:#ccfbf1;color:#115e59;padding:.25rem .65rem;font-size:.75rem;font-weight:800}p{line-height:1.6;color:#475569}button{border:0;border-radius:12px;background:#0f766e;color:white;font-weight:800;padding:.8rem 1rem;cursor:pointer}.note{font-size:.8rem;color:#64748b}
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Modo offline</span>
    <h1>NeuroPed está sem conexão</h1>
    <p>A tela essencial do aplicativo pode abrir pelo cache. APIs clínicas, pacientes e documentos não são cacheados para reduzir risco LGPD.</p>
    <p class="note">Se uma escala já estiver no app shell/cache, ela pode continuar acessível; dados sensíveis exigem reconexão.</p>
    <button onclick="location.reload()">Verificar conexão</button>
  </main>
</body>
</html>
