# ============================================================
# NeuroPed — Configuração Cloudflare Workers/Pages + D1
# ============================================================

name = "neuroped"
compatibility_date = "2024-11-01"

# Diretório de output do frontend (usado pelo Cloudflare Pages)
pages_build_output_dir = "dist/public"

# ── Variáveis de ambiente (não-secretas) ──────────────────
[vars]
ENVIRONMENT = "production"
APP_NAME = "NeuroPed"

# ── Banco de dados D1 (SQLite edge — plano gratuito) ──────
# PASSO 1: Crie o banco executando:
#   npx wrangler d1 create neuroped-db
# PASSO 2: Substitua o database_id abaixo pelo ID gerado
[[d1_databases]]
binding = "DB"
database_name = "neuroped-db"
database_id = "SUBSTITUIR_APOS_npx_wrangler_d1_create_neuroped-db"

# ── Ambiente de produção ───────────────────────────────────
[env.production]
name = "neuroped-production"

[env.production.vars]
ENVIRONMENT = "production"

# ── Ambiente de preview (PRs e branches) ──────────────────
[env.preview]
name = "neuroped-preview"

[env.preview.vars]
ENVIRONMENT = "preview"
