name = "neuroped"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist/public"

[vars]
ENVIRONMENT = "production"
APP_NAME = "NeuroPed"
CLINICAL_LIVE_ENABLED = "true"
ESCUTA_ENABLED = "true"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "neuroped-db"
database_id = "9b0919e5-93af-4b4f-851b-fc77dc1e5bae"

# Metadata-only API metrics; no clinical content, token, path or user identifier.
# Desativado em 22/09/2026: publicar Functions com este binding falha enquanto o
# Analytics Engine não estiver habilitado na conta Cloudflare (ver
# docs/audits/BLOCKED_EXTERNAL_CLOUDFLARE_ANALYTICS_ENGINE_2026-09-22.md).
# Sem o binding, writeApiMetric é no-op e a API reporta binding ausente.
# [[analytics_engine_datasets]]
# binding = "API_METRICS"
# dataset = "neuroped_api_metrics"
