# ============================================================
# NeuroPed — Configuração Cloudflare Workers/Pages + D1
# ============================================================

name = "neuroped"
compatibility_date = "2024-11-01"

# Diretório de output do frontend (usado pelo Cloudflare Pages)
pages_build_output_dir = "dist/public"

# ── Variáveis de ambiente (não-secretas) ──────────────────
[vars]
ENVIRONMENT = "production"
APP_NAME = "NeuroPed"
CANONICAL_APP_URL = "https://neuroped.pages.dev"

# ── Backend: binding Cloudflare D1 ───────────────────────────────────────
# IMPORTANTE: o workflow Cloudflare sincroniza os bindings deste arquivo. Se o
# bloco for removido, a publicação pode apagar o binding D1 do projeto.
# Mantenha-o e publique somente pelo workflow oficial.
# O id é o do D1 "neuroped-db" criado pelo workflow "Provision D1 backend".
[[d1_databases]]
binding = "DB"
database_name = "neuroped-db"
database_id = "9b0919e5-93af-4b4f-851b-fc77dc1e5bae"
