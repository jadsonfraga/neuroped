# ============================================================
# NeuroPed — Configuração Cloudflare Workers/Pages + D1
# ============================================================

name = "neuroped"
compatibility_date = "2024-11-01"

# Diretório de output do frontend (usado pelo Cloudflare Pages)
pages_build_output_dir = "dist/public"

# ── Variáveis de ambiente (não-secretas) ──────────────────
[vars]
ENVIRONMENT = "production"
APP_NAME = "NeuroPed"

# ── Backend (Cloudflare Pages) ───────────────────────────────────────────
# Os bindings de runtime do Pages (D1 `DB`, KV `RATE_LIMIT_KV`) e variáveis
# (CORS_ORIGINS) NÃO vêm deste wrang.toml — o `wrangler pages deploy` não os
# aplica. Eles são configurados no PROJETO Pages (deployment_configs) pelo
# workflow ".github/workflows/provision-d1.yml" via API da Cloudflare.
# Banco provisionado: D1 "neuroped-db".
