# ============================================================
# NeuroPed — Configuração Cloudflare Workers/Pages + D1
# ============================================================

name = "neuroped"
compatibility_date = "2024-11-01"

# Diretório de output do frontend (usado pelo Cloudflare Pages)
pages_build_output_dir = "dist/public"

# ── Variáveis de ambiente (não-secretas) ──────────────────
[vars]
ENVIRONMENT = "production"
APP_NAME = "NeuroPed"
# Origens permitidas para a API (CORS). As chamadas same-origin (pages.dev) já
# passam; adicione aqui domínios customizados/extra que consumirem /api.
CORS_ORIGINS = "https://neuroped.pages.dev"

# ── Backend: bindings Cloudflare D1 (banco) + KV (rate limit) ─────────────
# Estes blocos são preenchidos automaticamente pelo workflow
# ".github/workflows/provision-d1.yml" (cria o D1/KV na sua conta e grava os IDs).
# NÃO edite os IDs à mão — rode o workflow "Provision D1 backend" em Actions.
# >>> D1_BINDING_PLACEHOLDER <<<

#── Ambiente de produção ───────────────────────────────────
[env.production]
name = "neuroped-production"

[env.production.vars]
ENVIRONMENT = "production"

# ── Ambiente de preview (PRs e branches) ──────────────────
[env.preview]
name = "neuroped-preview"

[env.preview.vars]
ENVIRONMENT = "preview"
