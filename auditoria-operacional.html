<meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e0e22"><title>Auditoria Operacional â€” NeuroPed EDJ</title><style>:root{--cream:#0a0a16;--paper:#14132a;--teal:#6d6af5;--gold:#b8963e;--wine:#f2dca6;--dark:#ECEAFF;--muted:#b6b2e6;--line:rgba(169,164,255,.16)}body{margin:0;background:radial-gradient(circle at 10% 0%,rgba(184,150,62,.16),transparent 30%),linear-gradient(135deg,#0a0a16,#14132a 58%,rgba(124,118,210,.08));color:var(--dark);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#14132a,rgba(124,118,210,.08) 75%,#0e0e22);border:1px solid var(--line);border-radius:32px;padding:24px;box-shadow:0 22px 70px rgba(4,3,18,.6)}h1{font:760 clamp(34px,6vw,64px)/.96 Georgia,serif;color:var(--wine);letter-spacing:-.045em;margin:6px 0}.muted{color:var(--muted);line-height:1.6}.btn{border:0;border-radius:15px;background:var(--teal);color:#fff;font-weight:950;padding:12px 14px;margin:5px;cursor:pointer;text-decoration:none;display:inline-flex}.gold{background:var(--gold)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-top:16px}.test{background:#14132a;border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 10px 30px rgba(45,41,38,.07)}.ok{border-color:#bbf7d0;background:rgba(124,118,210,.08)}.fail{border-color:rgba(124,118,210,.08);background:rgba(124,118,210,.08)}.warn{border-color:rgba(124,118,210,.08);background:rgba(124,118,210,.08)}.test h3{margin:0 0 5px;font:760 19px Georgia,serif;color:var(--teal)}.fail h3{color:#991b1b}.warn h3{color:#9a3412}.small{font-size:12px;color:var(--muted);white-space:pre-wrap}pre{background:#ECEAFF;color:#0a0a16;border-radius:18px;padding:14px;white-space:pre-wrap;overflow:auto}.score{font:900 22px system-ui;color:var(--teal)}</style><link rel="stylesheet" href="./app-polish-mobile.css">

</head><body><main class="wrap"><section class="hero"><span class="score" id="score">Auditoria pronta</span><h1>Auditoria Operacional</h1><p class="muted">Verifica os pontos essenciais do NeuroPed EDJ: rotas, Consulta, passe familiar, CAA, DiÃ¡rio, Filtro, Mapa, PWA/cache e camada visual.</p><button class="btn" onclick="runAudit()">Rodar auditoria completa</button><button class="btn gold" onclick="copyResults()">Copiar resultado</button><a class="btn" href="./central-atalhos.html">Central</a><a class="btn" href="./verificar-app.html">Verificador</a><a class="btn" href="./consulta.html">Consulta</a></section><section id="results" class="grid"></section><pre id="log">Aguardando execuÃ§Ã£o.</pre></main><script>const tests=[];let lines=[];async function txt(path){try{return await fetch(path+'?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'')}catch(e){return ''}}async function ok(path){try{return await fetch(path+'?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok)}catch(e){return false}}function add(name,status,detail){tests.push({name,status,detail});const card=document.createElement('div');card.className='test '+status;card.innerHTML='<h3>'+name+'</h3><div class="small">'+String(detail).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</div>';document.getElementById('results').appendChild(card);lines.push((status==='ok'?'OK':status==='warn'?'ATENÃ‡ÃƒO':'FALHA')+' â€” '+name+'\n'+detail)}function percent(){const okn=tests.filter(t=>t.status==='ok').length;const total=tests.length||1;return Math.round(100*okn/total)}async function runAudit(){tests.length=0;lines=[];document.getElementById('results').innerHTML='';document.getElementById('log').textContent='Executando...';const files=['./index.html','./central-atalhos.html','./portal-familia-livre.html','./area-filho.html','./politica-acesso-familiar.html','./consulta.html','./ativar-passe-familiar.html','./comunicacao-alternativa.html','./diario-escola-terapias-v2.html','./filtro-escalas.html','./mapa-escalas.html','./manifest.json','./sw.js'];for(const f of files){const r=await ok(f);add('Rota '+f,r?'ok':'fail',r?'HTTP OK':'NÃ£o respondeu com sucesso')}const sw=await txt('./sw.js');add('Service Worker',sw.includes('neuroped-edj-v6.35.0')?'ok':'fail',sw.match(/neuroped-v[0-9a-z\-]+/)?.[0]||'versÃ£o nÃ£o identificada');add('Cache inclui auditoria',sw.includes('auditoria-operacional.html')?'ok':'fail','auditoria-operacional.html no precache');add('Cache inclui passe familiar',sw.includes('family-pass.js')&&sw.includes('family-pass-generator.js')&&sw.includes('ativar-passe-familiar.html')?'ok':'fail','family-pass, generator e ativaÃ§Ã£o no precache');add('Cache inclui visual premium',sw.includes('design-system-premium.css')&&sw.includes('editorial-impact.css')?'ok':'fail','design system e camada editorial');const consulta=await txt('./consulta.html');add('Consulta exige PIN',consulta.includes('PIN master obrigatÃ³rio')&&consulta.includes('MASTER_HASH')?'ok':'fail','Tela de PIN e hash master presentes');add('Consulta abre se master jÃ¡ ativo',consulta.includes('if(masterActive()){openApp()')||consulta.includes('if(masterActive()){openApp();')?'ok':'fail','Evita sensaÃ§Ã£o de aba morta quando PIN jÃ¡ estÃ¡ ativo');add('Consulta tem scripts de passe diretos',consulta.includes('family-pass.js')&&consulta.includes('family-pass-generator.js')?'ok':'fail','Gerador nÃ£o depende exclusivamente do service worker');add('Consulta tem painel operacional',consulta.includes('Painel de consulta operacional')&&consulta.includes('copySummary')&&consulta.includes('window.print')?'ok':'fail','Resumo, copiar e imprimir presentes');const gen=await txt('./family-pass-generator.js');add('Gerador de passe apÃ³s PIN',gen.includes('setInterval')&&gen.includes('Gerar passe familiar')?'ok':'fail','Gerador robusto e reativo Ã  ativaÃ§Ã£o do PIN');const pass=await txt('./family-pass.js');add('Passe familiar 120 dias',pass.includes('DAYS=120')||pass.includes('const DAYS=120')?'ok':'fail','Validade operacional de 4 meses');const ativa=await txt('./ativar-passe-familiar.html');add('Tela ativar passe',ativa.includes('Ativar acesso da famÃ­lia')||ativa.includes('Ativar passe')?'ok':'fail','FamÃ­lia tem rota direta para ativaÃ§Ã£o');const portal=await txt('./portal-familia-livre.html');add('Portal com cara de app',portal.includes('Cuidado familiar com clareza')&&portal.includes('Ferramentas principais')?'ok':'fail','Hero, ferramentas principais e layout familiar');const cAA=await txt('./comunicacao-alternativa.html');add('CAA preservada',cAA.includes('speechSynthesis')||cAA.includes('Falar frase')||cAA.includes('comunicaÃ§Ã£o alternativa')?'ok':'warn','Busca por voz/frase/CAA');const diario=await txt('./diario-escola-terapias-v2.html');add('DiÃ¡rio preservado',diario.includes('Novo registro')||diario.includes('DiÃ¡rio de escola e terapias')?'ok':'warn','Cadastro/registro/diÃ¡rio encontrados');const filtro=await txt('./filtro-escalas.html');add('Filtro de escalas',filtro.includes('scales-index.json')||filtro.includes('perguntas fÃ¡ceis')?'ok':'warn','Uso de Ã­ndice ou humanizaÃ§Ã£o detectado');const mapa=await txt('./mapa-escalas.html');add('Mapa de instrumentos',mapa.includes('Mapa de Instrumentos')||mapa.includes('scales-index.json')?'ok':'warn','Mapa e Ã­ndice detectados');const manifest=await txt('./manifest.json');add('Manifest sem CAA Premium',!manifest.includes('CAA Premium')&&manifest.includes('CAA Gratuita')?'ok':'fail','RÃ³tulo correto no PWA');const css=await txt('./editorial-impact.css');add('Visual editorial',css.includes('Editorial Impact Layer')?'ok':'warn','Camada editorial presente');document.getElementById('score').textContent='PontuaÃ§Ã£o operacional: '+percent()+'%';document.getElementById('log').textContent=lines.join('\n\n')}function copyResults(){navigator.clipboard.writeText(document.getElementById('score').textContent+'\n\n'+lines.join('\n\n')).then(()=>alert('Resultado copiado.'))}</script><script src="./app-polish-mobile.js" defer>
