<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1a6b65"><title>Secretaria — NeuroPed</title><style>body{margin:0;background:#faf8f4;color:#2d2926;font-family:system-ui}.wrap{max-width:1180px;margin:auto;padding:20px}.hero,.card{background:#fffdf9;border:1px solid #eadcc7;border-radius:28px;padding:18px;box-shadow:0 16px 44px rgba(45,41,38,.1)}h1{font:780 clamp(34px,6vw,64px)/.94 Georgia,serif;color:#8b2e3b;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:14px}.btn{border:0;border-radius:14px;background:#1a6b65;color:white;font-weight:950;padding:12px 14px;margin:4px;cursor:pointer}.gold{background:#b8963e}.ghost{background:white;color:#1a6b65;border:1px solid #eadcc7}input,select,textarea{width:100%;border:1px solid #eadcc7;border-radius:14px;padding:11px;background:#fff;font:15px system-ui}label{font-size:11px;font-weight:950;color:#6f6963;text-transform:uppercase}.item{background:white;border:1px solid #eadcc7;border-radius:18px;padding:12px;margin:8px 0}.muted{color:#6f6963}.metric{font:950 30px system-ui;color:#1a6b65}</style><link rel="stylesheet" href="./app-polish-mobile.css">
</head><body><main class="wrap"><section class="hero"><h1>Secretaria</h1><p class="muted">Agenda local, pendências, mensagens e passe familiar. Área protegida por PIN master/interface. Não usar dados reais em produção sem backend seguro.</p><button class="btn" onclick="add()">Novo atendimento</button><button class="btn gold" onclick="copyDay()">Copiar lista</button><button class="btn ghost" onclick="window.print()">Imprimir</button><button class="btn ghost" onclick="exportJson()">Exportar JSON</button><input type="file" id="importFile" style="display:none" onchange="importJson(event)"><button class="btn ghost" onclick="document.getElementById('importFile').click()">Importar JSON</button></section><section class="grid"><div class="card"><div class="metric" id="total">0</div><div class="muted">agendados</div></div><div class="card"><div class="metric" id="confirmados">0</div><div class="muted">confirmados</div></div><div class="card"><div class="metric" id="pendentes">0</div><div class="muted">com pendências</div></div></section><section class="grid"><div class="card"><h2>Novo / editar</h2><label>Nome ou código</label><input id="nome"><label>Telefone</label><input id="fone"><label>Data</label><input id="data" type="date"><label>Horário</label><input id="hora" type="time"><label>Status</label><select id="status"><option>agendado</option><option>confirmado</option><option>aguardando</option><option>em atendimento</option><option>finalizado</option><option>faltou</option></select><label>Pendências</label><textarea id="pend" placeholder="guia, pagamento, documento, relatório, retorno, passe familiar"></textarea><label>Observação</label><textarea id="obs"></textarea><button class="btn" onclick="save()">Salvar atendimento</button></div><div class="card"><h2>Mensagens copiáveis</h2><button class="btn ghost" onclick="msg('confirmacao')">Confirmação</button><button class="btn ghost" onclick="msg('lembrete')">Lembrete</button><button class="btn ghost" onclick="msg('documentos')">Documentos</button><button class="btn ghost" onclick="msg('retorno')">Retorno</button><textarea id="mensagem" style="min-height:180px"></textarea><button class="btn gold" onclick="copyMsg()">Copiar mensagem</button><h2>Passe familiar</h2><button class="btn" onclick="gerarPasse()">Gerar orientação de passe 4 meses</button></div></section><section class="card"><h2>Lista do dia</h2><input id="busca" placeholder="Buscar por nome, data ou status" oninput="render()"><div id="lista"></div></section></main><script src="./premium-experience.js"></script><script>const K='np_secretaria_v1';let editing=null;function arr(){try{return JSON.parse(localStorage.getItem(K)||'[]')}catch(e){return[]}}function put(a){localStorage.setItem(K,JSON.stringify(a));render()}function vals(){return{nome:nome.value,fone:fone.value,data:data.value,hora:hora.value,status:status.value,pend:pend.value,obs:obs.value,id:editing||Date.now()}}function fill(x){editing=x.id;nome.value=x.nome||'';fone.value=x.fone||'';data.value=x.data||'';hora.value=x.hora||'';status.value=x.status||'agendado';pend.value=x.pend||'';obs.value=x.obs||''}function add(){editing=null;['nome','fone','data','hora','pend','obs'].forEach(id=>document.getElementById(id).value='');data.value=new Date().toISOString().slice(0,10)}function save(){let a=arr();let x=vals();a=a.filter(i=>i.id!==x.id);a.unshift(x);put(a);add()}function del(id){if(confirm('Apagar atendimento?'))put(arr().filter(x=>x.id!==id))}function render(){let a=arr();let q=(busca.value||'').toLowerCase();if(q)a=a.filter(x=>JSON.stringify(x).toLowerCase().includes(q));total.textContent=a.length;confirmados.textContent=a.filter(x=>x.status==='confirmado').length;pendentes.textContent=a.filter(x=>x.pend).length;lista.innerHTML=a.map(x=>'<div class="item"><b>'+esc(x.nome||'Sem nome')+'</b><br>'+esc(x.data||'')+' '+esc(x.hora||'')+' · '+esc(x.status||'')+'<br><span class="muted">'+esc(x.pend||'Sem pendências')+'</span><br><button class="btn ghost" onclick="fillById('+x.id+')">Editar</button><button class="btn ghost" onclick="del('+x.id+')">Apagar</button></div>').join('')||'<p class="muted">Sem atendimentos.</p>'}function fillById(id){let x=arr().find(i=>i.id===id);if(x)fill(x)}function esc(s){return String(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function copyDay(){navigator.clipboard.writeText(arr().map(x=>[x.data,x.hora,x.nome,x.status,x.pend].join(' · ')).join('\n'))}function msg(t){const m={confirmacao:'Olá! Confirmamos sua consulta. Por favor, chegue com antecedência e traga documentos/relatórios recentes.',lembrete:'Lembrete da consulta NeuroPed. Caso não possa comparecer, avise a secretaria.',documentos:'Para a consulta, pedimos trazer documentos, relatórios escolares/terapêuticos, exames e lista de medicações em uso.',retorno:'Olá! Vamos organizar o retorno e acompanhar a evolução conforme orientação médica.'};mensagem.value=m[t]||''}function copyMsg(){navigator.clipboard.writeText(mensagem.value)}function gerarPasse(){mensagem.value='Passe familiar educativo válido por 4 meses para conteúdos não sensíveis do NeuroPed. Não libera prontuário, laudos, prescrições ou documentos médicos.'}function exportJson(){const blob=new Blob([JSON.stringify(arr(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='secretaria-neuroped.json';a.click()}function importJson(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(Array.isArray(d))put(d);else alert('JSON inválido')}catch(err){alert('JSON inválido')}};r.readAsText(f)}add();render();</script><script src="./app-polish-mobile.js" defer></script>
</body></html>
