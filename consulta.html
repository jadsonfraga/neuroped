<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1a6b65"><title>Consulta NeuroPed</title><style>:root{--cream:#faf8f4;--paper:#fffdf9;--teal:#1a6b65;--gold:#b8963e;--wine:#8b2e3b;--dark:#2d2926;--muted:#6f6963;--line:#eadcc7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,var(--cream),#fffaf1);color:var(--dark);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1040px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#fffdf9,#f4ead5);border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:0 18px 46px rgba(45,41,38,.12)}h1{font:700 clamp(32px,5vw,54px)/1.04 Georgia,serif;color:var(--wine);margin:0 0 8px}.muted{color:var(--muted);line-height:1.55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:14px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 8px 24px rgba(45,41,38,.06)}label{display:block;font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:10px 0 6px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font:500 15px system-ui;background:#fffdf9;color:var(--dark)}textarea{min-height:92px;resize:vertical}.btn{border:0;border-radius:14px;background:var(--teal);color:#fff;font-weight:900;padding:12px 14px;margin:5px;cursor:pointer}.gold{background:var(--gold)}.wine{background:var(--wine)}.ghost{background:#fff;color:var(--teal);border:1px solid var(--line)}pre{white-space:pre-wrap;background:#2d2926;color:#faf8f4;border-radius:18px;padding:14px;overflow:auto}.locked{max-width:520px}@media print{.no-print{display:none!important}body{background:white}.wrap{max-width:none;padding:18px}.hero,.card{box-shadow:none}pre{background:white;color:#111;border:1px solid #ccc}}</style></head><body><main class="wrap"><section class="hero"><h1>Consulta</h1><p class="muted">Área médica protegida por PIN master. Use para organizar a consulta, copiar resumo e imprimir.</p></section><section id="lock" class="card locked no-print"><label>PIN master</label><input id="pin" type="password" inputmode="numeric"><button class="btn" onclick="unlock()">Abrir consulta</button><p class="muted">Conteúdo familiar educativo permanece livre. Esta tela é para organização médica.</p></section><section id="app" style="display:none"><div class="grid"><div class="card"><label>Identificação</label><input id="nome" placeholder="Nome ou iniciais"><label>Data</label><input id="data" type="date"><label>Tipo</label><select id="tipo"><option>Primeira consulta</option><option>Retorno</option><option>Reavaliação</option><option>Encaixe</option></select></div><div class="card"><label>Resumo da demanda</label><textarea id="queixa"></textarea><label>Pontos de atenção</label><textarea id="pontos"></textarea></div><div class="card"><label>Instrumentos / escalas</label><textarea id="instrumentos"></textarea><button class="btn ghost" onclick="add('TEA / comunicação')">TEA</button><button class="btn ghost" onclick="add('Atenção / comportamento')">Atenção</button><button class="btn ghost" onclick="add('Fala / linguagem')">Fala</button><button class="btn ghost" onclick="add('Sono / rotina')">Sono</button><br><a class="btn gold" href="./filtro-escalas.html">Abrir filtro</a></div><div class="card"><label>Plano da consulta</label><textarea id="plano"></textarea><label>Documentos</label><textarea id="docs"></textarea></div></div><section class="card" style="margin-top:14px"><button class="btn" onclick="save()">Salvar local</button><button class="btn gold" onclick="copy()">Copiar resumo</button><button class="btn ghost" onclick="window.print()">Imprimir</button><button class="btn wine" onclick="clearAll()">Limpar</button><pre id="out"></pre></section></section></main><script>const KEY='np_consulta_html_v1';function h(s){let v=new TextEncoder().encode(String(s||'').replace(/\D/g,''));return crypto.subtle.digest('SHA-256',v).then(b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''))}function unlocked(){try{return JSON.parse(localStorage.getItem('neuroped_master_access_v1')||'{}').ok}catch(e){return false}}function show(){document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';load();render()}function unlock(){h(document.getElementById('pin').value).then(x=>{if(x==='6f0960c4849c531799b84b6755bf2211ec6c9b0f14c9a992a346ac04407c7579'){localStorage.setItem('neuroped_master_access_v1',JSON.stringify({ok:true,ts:Date.now()}));show()}else alert('PIN não conferiu.')})}function ids(){return ['nome','data','tipo','queixa','pontos','instrumentos','plano','docs']}function data(){let o={};ids().forEach(id=>o[id]=document.getElementById(id).value);return o}function text(){let d=data();return ['CONSULTA NEUROPED','Paciente: '+d.nome,'Data: '+d.data,'Tipo: '+d.tipo,'','Resumo:',d.queixa,'','Pontos de atenção:',d.pontos,'','Instrumentos:',d.instrumentos,'','Plano:',d.plano,'','Documentos:',d.docs].join('\n')}function render(){document.getElementById('out').textContent=text()}function save(){localStorage.setItem(KEY,JSON.stringify(data()));render();alert('Consulta salva localmente.')}function load(){try{let d=JSON.parse(localStorage.getItem(KEY)||'{}');ids().forEach(id=>{if(d[id])document.getElementById(id).value=d[id]})}catch(e){}}function copy(){navigator.clipboard&&navigator.clipboard.writeText(text()).then(()=>alert('Resumo copiado.'))}function clearAll(){if(confirm('Limpar consulta?')){localStorage.removeItem(KEY);ids().forEach(id=>document.getElementById(id).value='');render()}}function add(v){let e=document.getElementById('instrumentos');e.value+=(e.value?'\n':'')+'• '+v;render()}document.addEventListener('input',render);if(unlocked())show();</script></body></html>
