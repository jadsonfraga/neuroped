<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="theme-color" content="#0e0e22"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checklist Manual NeuroPed</title><style>body{margin:0;background:linear-gradient(135deg,#0a0a16,#0e0e22);color:#ECEAFF;font-family:system-ui}.wrap{max-width:980px;margin:auto;padding:22px}.hero,.card{background:#fffdf9;border:1px solid #eadcc7;border-radius:28px;padding:18px}h1{font:780 44px Georgia,serif;color:#8b2e3b;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:14px}.btn{border:0;border-radius:14px;background:#1a6b65;color:#fff;font-weight:950;padding:11px 12px;margin:4px;text-decoration:none;display:inline-flex}.ok{background:#f0fdf4}.fail{background:#fff1f2}.pending{background:#fff7ed}.muted{color:#6f6963}textarea{width:100%;min-height:160px;border:1px solid #eadcc7;border-radius:14px;padding:12px}</style></head><body><main class="wrap"><section class="hero"><h1>Checklist Manual NeuroPed</h1><p class="muted">Abra cada rota, execute o fluxo indicado e marque o resultado.</p><button class="btn" onclick="copyReport()">Copiar relatório</button><a class="btn" href="./qualidade-neuroped.html">Qualidade</a></section><section id="list" class="grid"></section><section class="card" style="margin-top:14px"><h2>Relatório</h2><textarea id="report"></textarea></section></main><script src="./app-shell.js"></script><script>const tests=[['Consulta','Abrir, validar acesso, usar editor livre, copiar e imprimir.','./consulta.html'],['Secretaria','Criar atendimento, editar status, copiar mensagem e imprimir.','./secretaria.html'],['Família','Abrir cards, navegar por conteúdo livre e verificar bloqueios.','./portal-familia-livre.html'],['CAA','Abrir, tocar cartão, montar frase e testar ações principais.','./comunicacao-alternativa.html'],['Diário','Criar registro, gerar relatório e exportar.','./diario-escola-terapias-v2.html'],['Filtro','Pesquisar queixa e verificar resultados específicos.','./filtro-escalas.html'],['Mapa','Filtrar por idade, sintoma e respondente.','./mapa-escalas.html'],['PWA','Atualizar app, recarregar e verificar cache.','./verificar-app.html']];let status=JSON.parse(localStorage.getItem('np_manual_check')||'{}');function set(i,s){status[i]=s;localStorage.setItem('np_manual_check',JSON.stringify(status));render()}function render(){list.innerHTML=tests.map((t,i)=>'<div class="card '+(status[i]||'pending')+'"><h2>'+t[0]+'</h2><p class="muted">'+t[1]+'</p><a class="btn" href="'+t[2]+'" target="_blank">Abrir</a><button class="btn" onclick="set('+i+',\'ok\')">Aprovado</button><button class="btn" onclick="set('+i+',\'fail\')">Falhou</button><button class="btn" onclick="set('+i+',\'pending\')">Pendente</button></div>').join('');report.value=tests.map((t,i)=>(status[i]||'pending').toUpperCase()+' — '+t[0]+': '+t[1]).join('\n')}function copyReport(){navigator.clipboard.writeText(report.value).then(()=>alert('Relatório copiado.'))}render();</script></body></html>
