<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e0e22"><title>Teste de Ouro do PIN — NeuroPed</title><style>body{margin:0;background:#0a0a16;color:#ECEAFF;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:980px;margin:auto;padding:22px}.hero,.card{background:#14132a;border:1px solid rgba(169,164,255,.16);border-radius:28px;padding:22px;box-shadow:0 16px 42px rgba(4,3,18,.6)}h1{font:760 clamp(34px,6vw,60px)/.96 Georgia,serif;color:#f2dca6;margin:0 0 8px}.muted{color:#b6b2e6;line-height:1.6}.btn{border:0;border-radius:14px;background:#6d6af5;color:#fff;font-weight:950;padding:12px 14px;margin:4px;cursor:pointer}.gold{background:#b8963e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:14px}.ok{border-color:#bbf7d0;background:rgba(124,118,210,.08)}.fail{border-color:rgba(124,118,210,.08);background:rgba(124,118,210,.08)}.warn{border-color:rgba(124,118,210,.08);background:rgba(124,118,210,.08)}.card h3{font:760 20px Georgia,serif;color:#6d6af5;margin:0 0 6px}pre{white-space:pre-wrap;background:#ECEAFF;color:#0a0a16;border-radius:18px;padding:14px}</style><link rel="stylesheet" href="./app-polish-mobile.css">
<link rel="stylesheet" href="./tokens.css"><link rel="stylesheet" href="./components.css"></head><body><main class="wrap"><section class="hero"><h1>Teste de Ouro do PIN</h1><p class="muted">Auditoria navegável do fluxo obrigatório: toda área sensível primeiro oferece PIN; só após erro aparece voltar; PIN aceita letras e números; acerto retorna à área solicitada.</p><button class="btn" onclick="run()">Rodar teste</button><button class="btn gold" onclick="copy()">Copiar resultado</button><a class="btn" href="./consulta.html">Abrir Consulta</a><a class="btn" href="./auditoria-operacional.html">Auditoria</a></section><section id="cards" class="grid"></section><pre id="log">Aguardando teste.</pre></main><script>let lines=[];async function txt(p){try{return await fetch(p+'?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'')}catch(e){return''}}function add(name,status,detail){const c=document.createElement('div');c.className='card '+status;c.innerHTML='<h3>'+name+'</h3><div class="muted">'+String(detail).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</div>';document.getElementById('cards').appendChild(c);lines.push((status==='ok'?'OK':status==='warn'?'ATENÇÃO':'FALHA')+' — '+name+'\n'+detail)}async function run(){lines=[];document.getElementById('cards').innerHTML='';const safe=await txt('./safe-public-layer.js');const consulta=await txt('./consulta.html');const exit=await txt('./consulta-safe-exit.js');const pin=await txt('./consulta-pin-fix.js');const next=await txt('./consulta-next-redirect.js');add('Área sensível vai primeiro ao PIN',safe.includes('consulta.html?next=')?'ok':'fail','safe-public-layer deve redirecionar para consulta.html?next=...');add('Não há bloqueio direto',!safe.includes('acesso-restrito')&&!safe.includes('bloqueado')?'ok':'warn','Não deve mandar direto para página bloqueada.');add('Voltar só após erro',exit.includes('after-fail')&&exit.includes('Senha não conferiu')?'ok':'fail','consulta-safe-exit só exibe retorno após falha do PIN.');add('PIN alfanumérico',pin.includes('inputmode')&&pin.includes('text')&&pin.includes('toLowerCase')?'ok':'fail','PIN precisa aceitar letras e números.');add('Consulta tem campo de PIN',consulta.includes('PIN master obrigatório')&&consulta.includes('id="pin"')?'ok':'fail','Consulta oferece campo de PIN antes do painel.');add('Acerto abre área solicitada',next.includes('nextPath')&&next.includes('index.html#')?'ok':'fail','consulta-next-redirect volta para a rota pedida após PIN correto.');const protectedRoutes=['secretaria','prontuario','prescricoes','laudos','portal-documentos','portal-chat','portal-acompanhamento'];add('Rotas sensíveis mapeadas',protectedRoutes.every(x=>safe.includes(x))?'ok':'warn','Rotas esperadas: '+protectedRoutes.join(', '));document.getElementById('log').textContent=lines.join('\n\n')}function copy(){navigator.clipboard.writeText(lines.join('\n\n')).then(()=>alert('Resultado copiado.'))}</script><script src="./app-polish-mobile.js" defer></script>
</body></html>
