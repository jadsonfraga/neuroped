<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1a6b65"><title>Qualidade NeuroPed</title><style>:root{--cream:#faf8f4;--paper:#fffdf9;--teal:#1a6b65;--gold:#b8963e;--wine:#8b2e3b;--dark:#2d2926;--muted:#6f6963;--line:#eadcc7}body{margin:0;background:radial-gradient(circle at 10% 0%,rgba(184,150,62,.16),transparent 30%),linear-gradient(135deg,#faf8f4,#fffdf9 58%,#f5ead6);color:var(--dark);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1120px;margin:auto;padding:22px}.hero,.card{background:#fffdf9;border:1px solid var(--line);border-radius:30px;padding:22px;box-shadow:0 18px 54px rgba(45,41,38,.11)}h1{font:760 clamp(36px,6vw,66px)/.94 Georgia,serif;color:var(--wine);letter-spacing:-.045em;margin:0 0 8px}.muted{color:var(--muted);line-height:1.6}.btn{display:inline-flex;text-decoration:none;border:0;border-radius:14px;background:var(--teal);color:#fff;font-weight:950;padding:12px 14px;margin:4px;cursor:pointer}.gold{background:var(--gold)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px;margin-top:16px}.card.ok{border-color:#bbf7d0;background:#f0fdf4}.card.fail{border-color:#fecaca;background:#fff1f2}.card.warn{border-color:#fed7aa;background:#fff7ed}.card h3{font:760 21px Georgia,serif;color:var(--teal);margin:0 0 5px}.score{font:950 30px system-ui;color:var(--teal)}</style></head><body><main class="wrap"><section class="hero"><div class="score" id="score">Painel de qualidade</div><h1>Qualidade NeuroPed</h1><p class="muted">Status rápido de versão, rotas, PIN, PWA, Consulta, Portal, CAA, Diário, Filtro, Mapa e riscos estruturais.</p><button class="btn" onclick="run()">Atualizar status</button><button class="btn gold" onclick="copy()">Copiar status</button><a class="btn" href="./teste-ouro-pin.html">Teste de Ouro do PIN</a><a class="btn" href="./auditoria-operacional.html">Auditoria Operacional</a></section><section id="cards" class="grid"></section></main><script src="./routes.config.js"></script><script src="./storage-policy.js"></script><script>let lines=[];async function ok(p){try{return await fetch(p+'?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok)}catch(e){return false}}async function txt(p){try{return await fetch(p+'?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'')}catch(e){return''}}function add(name,status,detail){const c=document.createElement('div');c.className='card '+status;c.innerHTML='<h3>'+name+'</h3><div class="muted">'+String(detail).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</div>';document.getElementById('cards').appendChild(c);lines.push((status==='ok'?'OK':status==='warn'?'ATENÇÃO':'FALHA')+' — '+name+'\n'+detail)}function pct(){const total=lines.length||1;const oks=lines.filter(x=>x.startsWith('OK')).length;return Math.round(oks*100/total)}async function run(){lines=[];document.getElementById('cards').innerHTML='';const sw=await txt('./sw.js');const manifest=await txt('./manifest.json');const routes=window.NEUROPED_ROUTES||[];add('Versão/cache',sw.includes('neuroped-v37-quality-foundation')?'ok':sw.includes('neuroped-v36-pin-first')?'warn':'fail',sw.match(/neuroped-v[0-9a-z\-]+/)?.[0]||'não encontrado');add('Manifest PWA',manifest.includes('NeuroPed EDJ')&&manifest.includes('CAA Gratuita')?'ok':'fail','Manifest publicado e sem CAA Premium.');add('Roteador central',routes.length>=10?'ok':'fail',routes.length+' rotas registradas.');add('Rotas protegidas marcadas',routes.filter(r=>r.requiresPin).length>=5?'ok':'warn',routes.filter(r=>r.requiresPin).map(r=>r.label).join(', '));const required=['./consulta.html','./portal-familia-livre.html','./comunicacao-alternativa.html','./diario-escola-terapias-v2.html','./filtro-escalas.html','./mapa-escalas.html','./teste-ouro-pin.html','./auditoria-operacional.html'];for(const r of required)add('Rota '+r,await ok(r)?'ok':'fail',await ok(r)?'HTTP OK':'falhou');const pin=await txt('./consulta-pin-fix.js');const exit=await txt('./consulta-safe-exit.js');add('PIN alfanumérico',pin.includes('inputmode')&&pin.includes('text')?'ok':'fail','Teclado completo para letras e números.');add('Voltar só após erro',exit.includes('after-fail')?'ok':'fail','Opção de voltar aparece apenas após falha do PIN.');const policy=window.NeuroPedStoragePolicy&&window.NeuroPedStoragePolicy.status();add('Política de storage',policy&&policy.categories.sensitiveStorage.allowed===false?'ok':'fail','SensitiveStorage desabilitado para dados reais.');add('Modo do app',window.NEUROPED_APP_MODE?'ok':'warn','Modo será exibido quando app-mode.js carregar globalmente.');document.getElementById('score').textContent='Qualidade operacional: '+pct()+'%'}function copy(){navigator.clipboard.writeText(document.getElementById('score').textContent+'\n\n'+lines.join('\n\n')).then(()=>alert('Status copiado.'))}run();</script></body></html>
